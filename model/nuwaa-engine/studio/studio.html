<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نواة Studio</title>
<style>
  :root{--bg:#1e1e1e;--panel:#252526;--line:#3c3c3c;--text:#d4d4d4;--accent:#4ec9b0;--err:#f14c4c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:10px;align-items:center}
  header b{color:var(--accent)}
  .pin{margin-inline-start:auto;font-size:13px;opacity:.8}
  main{flex:1;display:flex;min-height:0}
  aside{width:200px;background:var(--panel);border-inline-end:1px solid var(--line);overflow:auto;padding:8px}
  aside div.file{padding:6px 8px;cursor:pointer;border-radius:4px;font-size:13px}
  aside div.file:hover{background:#2d2d2d}
  section{flex:1;display:flex;flex-direction:column;min-width:0}
  #chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:80%;padding:8px 12px;border-radius:8px;white-space:pre-wrap;font-size:14px}
  .me{align-self:flex-end;background:#2b5278}
  .bot{align-self:flex-start;background:#2d2d2d}
  .toolbar{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line);background:var(--panel)}
  .toolbar input[type=text]{flex:1;background:#3c3c3c;border:1px solid var(--line);color:var(--text);padding:8px;border-radius:4px}
  button{background:#0e639c;color:#fff;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;font-size:13px}
  button:hover{background:#1177bb}
  button.secondary{background:#3c3c3c}
  #preview-pane{height:40%;border-top:1px solid var(--line);display:flex;flex-direction:column}
  #preview-head{padding:6px 10px;background:var(--panel);font-size:12px;display:flex;justify-content:space-between}
  #preview-body{flex:1;background:#fff;overflow:auto}
  #preview-body iframe{width:100%;height:100%;border:0}
  #preview-text{white-space:pre-wrap;padding:10px;font-family:monospace;font-size:12px;color:#111}
  .err{color:var(--err)!important;background:#2a1414}
</style>
</head>
<body>
<header>
  <b>نواة Studio</b>
  <button id="btn-new-file" class="secondary">📄 إنشاء ملف</button>
  <button id="btn-preview" class="secondary">▶ معاينة</button>
  <button id="btn-run" class="secondary">🧠 شغّل وشاهد تفكيره</button>
  <span class="pin" id="pin-label">افتح هذي الصفحة من جوالك، وفعّل Cast من إعدادات أندرويد لعرضها على التلفزيون — لا شيء يتحمّل على التلفزيون.</span>
</header>
<main>
  <aside id="file-list"></aside>
  <section>
    <div id="chat"></div>
    <div id="think-pane" style="display:none;border-top:1px solid var(--line);background:#141414">
      <div id="preview-head"><span>🧠 شغّال الحين... (تصحيح ذاتي حقيقي: يكتب كود، يشغّله فعليًا، يصلّح لو طلع خطأ)</span>
        <button class="secondary" id="btn-stop-think">إغلاق ✕</button></div>
      <div id="think-log" style="max-height:220px;overflow:auto;padding:10px;font-family:monospace;font-size:12px"></div>
    </div>
    <div id="preview-pane" style="display:none">
      <div id="preview-head"><span id="preview-title">معاينة</span><button class="secondary" id="btn-close-preview">إغلاق ✕</button></div>
      <div id="preview-body"></div>
    </div>
    <div class="toolbar">
      <input id="input-text" type="text" placeholder="اكتب رسالتك...">
      <button id="btn-send">إرسال</button>
    </div>
  </section>
</main>
<script>
const API = location.origin;
let currentFile = null;   // {name, content}

function addMsg(text, who){
  const el = document.createElement('div');
  el.className = 'msg ' + (who === 'me' ? 'me' : 'bot');
  el.textContent = text;
  document.getElementById('chat').appendChild(el);
  el.scrollIntoView({behavior:'smooth'});
  return el;
}

async function sendChat(text){
  if(!text.trim()) return;
  addMsg(text, 'me');
  const r = await fetch(API + '/api/chat', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text})});
  const data = await r.json();
  addMsg(data.reply, 'bot');
  return data.reply;
}

document.getElementById('btn-send').onclick = () => {
  const inp = document.getElementById('input-text');
  const text = inp.value; inp.value = '';
  sendChat(text);
};
document.getElementById('input-text').addEventListener('keydown', e => {
  if(e.key === 'Enter') document.getElementById('btn-send').click();
});

// ---- create file: asks the filename FIRST, like you asked ----
document.getElementById('btn-new-file').onclick = async () => {
  const name = prompt('اسم الملف؟ (مثلا car.py أو page.html)');
  if(!name) return;
  const lastReply = document.querySelectorAll('#chat .bot');
  const lastText = lastReply.length ? lastReply[lastReply.length-1].textContent : '';
  const content = extractCode(lastText) || '# اكتب محتوى الملف هنا\n';
  const r = await fetch(API + '/api/create_file', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({filename:name, content})});
  const data = await r.json();
  if(data.error){ alert(data.error); return; }
  currentFile = {name, content};
  refreshFiles();
  addMsg('تم إنشاء ' + name, 'bot');
};

function extractCode(text){
  if(!text) return '';
  const m = text.match(/```[a-zA-Z]*\n([\s\S]*?)```/);
  return m ? m[1] : text;
}

async function refreshFiles(){
  const r = await fetch(API + '/api/list_files');
  const data = await r.json();
  const list = document.getElementById('file-list');
  list.innerHTML = '';
  (data.files || []).forEach(name => {
    const d = document.createElement('div');
    d.className = 'file'; d.textContent = name;
    d.onclick = async () => {
      const rr = await fetch(API + '/api/file/' + encodeURIComponent(name));
      const dd = await rr.json();
      currentFile = dd;
      addMsg('فتحت ' + name, 'bot');
    };
    list.appendChild(d);
  });
}
refreshFiles();

// ---- preview: real Python execution, or live iframe render for browser code ----
document.getElementById('btn-preview').onclick = async () => {
  if(!currentFile){ alert('افتح أو أنشئ ملف أولا'); return; }
  const pane = document.getElementById('preview-pane');
  const body = document.getElementById('preview-body');
  pane.style.display = 'flex'; body.innerHTML = '';
  const ext = currentFile.name.split('.').pop().toLowerCase();

  if(ext === 'py'){
    document.getElementById('preview-title').textContent = 'تشغيل بايثون فعلي...';
    const r = await fetch(API + '/api/run_python', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({code: currentFile.content})});
    const data = await r.json();
    document.getElementById('preview-title').textContent = data.ok ? '✅ نجح' : '❌ فشل — خطأ حقيقي من التشغيل';
    const pre = document.createElement('div');
    pre.id = 'preview-text';
    pre.className = data.ok ? '' : 'err';
    pre.textContent = (data.stdout || '') + (data.stderr ? '\n--- stderr ---\n' + data.stderr : '');
    body.appendChild(pre);
  } else if(['html','htm','js','css'].includes(ext)){
    document.getElementById('preview-title').textContent = 'معاينة متصفح حية (تعمل محليا داخل الصفحة، بدون خادم)';
    let doc = currentFile.content;
    if(ext === 'js') doc = `<script>${currentFile.content}<\/script>`;
    if(ext === 'css') doc = `<style>${currentFile.content}</style><body>معاينة التنسيق</body>`;
    // catch real JS errors from inside the iframe and show them, instead of pretending nothing went wrong
    const errCatcher = `<script>window.onerror=function(m,s,l,c,e){parent.postMessage({nuwaaPreviewError:m+' @ line '+l},'*');}<\/script>`;
    const iframe = document.createElement('iframe');
    iframe.srcdoc = errCatcher + doc;
    body.appendChild(iframe);
  } else {
    body.innerHTML = '<div id="preview-text">نوع ملف غير مدعوم للمعاينة بعد: .' + ext + '</div>';
  }
};
window.addEventListener('message', (e) => {
  if(e.data && e.data.nuwaaPreviewError){
    document.getElementById('preview-title').textContent = '❌ خطأ جافاسكربت حقيقي';
    const pre = document.createElement('div');
    pre.id = 'preview-text'; pre.className = 'err';
    pre.textContent = e.data.nuwaaPreviewError;
    document.getElementById('preview-body').appendChild(pre);
  }
});
document.getElementById('btn-close-preview').onclick = () => {
  document.getElementById('preview-pane').style.display = 'none';
};

// ---- "شغّل وشاهد تفكيره": real, live progress — not a fake animation. Every line here came from an
// actual subprocess run of code the engine wrote (see nuwaa/core/self_correct.py). ----
let pollTimer = null;
document.getElementById('btn-run').onclick = async () => {
  const inp = document.getElementById('input-text');
  const prompt = inp.value.trim() || (document.querySelectorAll('#chat .me').length
    ? document.querySelectorAll('#chat .me')[document.querySelectorAll('#chat .me').length-1].textContent
    : '');
  if(!prompt){ alert('اكتب طلبك أول (مثلا: اكتب سكربت بايثون يسوي...)'); return; }
  inp.value = '';
  const pane = document.getElementById('think-pane');
  const log = document.getElementById('think-log');
  pane.style.display = 'block'; log.innerHTML = '';
  const r = await fetch(API + '/api/self_correct/start', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({prompt, max_retries: 3, max_new: 4000})});
  const data = await r.json();
  if(data.error){ log.textContent = data.error; return; }
  let since = 0;
  pollTimer = setInterval(async () => {
    const rr = await fetch(API + '/api/self_correct/log?job_id=' + data.job_id + '&since=' + since);
    const dd = await rr.json();
    since = dd.next;
    dd.lines.forEach(l => { const d = document.createElement('div'); d.textContent = l.line; log.appendChild(d); });
    if(dd.lines.length) log.scrollTop = log.scrollHeight;
    if(dd.done){
      clearInterval(pollTimer);
      if(dd.result){
        currentFile = {name: 'result.py', content: dd.result.code};
        addMsg(dd.result.ok ? '✅ خلص ونجح بعد ' + dd.result.attempts + ' محاولة' : '❌ ما نجح بعد ' + dd.result.attempts + ' محاولات', 'bot');
      }
    }
  }, 1000);
};
document.getElementById('btn-stop-think').onclick = () => {
  if(pollTimer) clearInterval(pollTimer);
  document.getElementById('think-pane').style.display = 'none';
};

</script>
</body>
</html>
