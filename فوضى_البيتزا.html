<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}

#app{position:fixed;inset:0;direction:ltr}

.lab{position:absolute;left:0;top:0;transform-origin:50% 100%;pointer-events:none;white-space:nowrap;direction:rtl;font-weight:700;text-shadow:0 1px 3px #000}
.lab.tag{font-size:12px;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:9px}

.stick{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 4vmin);width:30vmin;height:30vmin;border-radius:50%;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.35)}
.stick .knob{position:absolute;left:50%;top:50%;width:13vmin;height:13vmin;margin:-6.5vmin 0 0 -6.5vmin;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none}
#stickL{left:4vmin}#stickR{right:4vmin}#stickR .knob{background:rgba(255,200,90,.7)}
#stickR::after{content:"✋";position:absolute;left:50%;top:-4.5vmin;transform:translateX(-50%);font-size:5vmin;opacity:.8}
#stickL::after{content:"🚶";position:absolute;left:50%;top:-4.5vmin;transform:translateX(-50%);font-size:5vmin;opacity:.8}

<body>
<div id="root">
<div id="role" class="card"><p>هذي اللعبة جزء من لوبي «ليالي الرياض» — افتحها من هناك حتى تتوصل تلقائيًا.</p></div>
</div>
<script>
/* ===================== EMB BRIDGE (لا تغيّر هذا الجزء) ===================== */
let EMB=null; const embHostConns={};
window.addEventListener('message', e=>{
  const m=e&&e.data; if(!m||!m.__emb) return;
  if(m.init){ EMB={role:m.role,code:m.code,name:m.name}; return embStart(); }
  if(!EMB) return;
  if(EMB.role==='tv'){
    if(m.event==='data'){
      let c=embHostConns[m.id];
      if(!c)c=embHostConns[m.id]={id:m.id,send:obj=>{try{parent.postMessage({__emb:1,to:m.id,data:obj},'*')}catch(e){}}};
      try{onHostMsg(c,m.data)}catch(e){}
    } else if(m.event==='disconnect'){
      try{onPlayerLeave(m.id)}catch(e){}
      delete embHostConns[m.id];
    }
  } else if(EMB.role==='ph'){
    if(m.data!==undefined){try{onCtlMsg(m.data)}catch(e){}}
  }
});
function embReveal(){try{document.documentElement.classList.remove('emb-pending')}catch(e){}}
function embStart(){
  embReveal();
  if(EMB.role==='tv'){ startTv(); } else { startPhone(); }
}
setTimeout(()=>{ if(!EMB) embReveal(); }, 2500);

/* ===================== من هنا تبدأ لعبتك ===================== */
/* ===== اللعبة: العالم + المحاكاة + الرسم (ملف واحد) ===== */
const PHONE_HTML = "<div id=\"app\">\n  <canvas id=\"gl\"></canvas>\n  <div id=\"labels\"></div>\n  <div id=\"rolePanel\" hidden><p>غيّر وظيفتك بأي وقت — اضغط على الوظيفة وتروح لها</p><div id=\"roleList\"></div></div>\n  <div id=\"hud\">\n    <div id=\"topL\"><button id=\"roleBtn\">🔄</button></div>\n    <div id=\"timer\">5:00</div>\n    <div id=\"topR\"><span id=\"score\">⭐ 0</span><button id=\"gear\">⚙</button></div>\n    <div id=\"tickets\"></div>\n    <div id=\"cash\" hidden><div id=\"cashPizzas\"></div><button id=\"cashPn\">🥤</button><button id=\"cashOk\">✔</button></div>\n    <div id=\"cashHint\" hidden>ارجع لمكان الكاشير 💰</div>\n    <div id=\"toast\"></div>\n    <div id=\"cur\"></div><div id=\"curLbl\"></div>\n    <div id=\"holdChip\" hidden></div>\n    <div id=\"stickL\" class=\"stick\"><div class=\"knob\"></div></div>\n    <div id=\"stickR\" class=\"stick\"><div class=\"knob\"></div></div>\n    <button id=\"act\">امسك<br>/ استخدم</button>\n  </div>\n  <div id=\"dizzy\" hidden>😵‍💫</div>\n  <div id=\"lobby\" class=\"modal\">\n    <h1>🍕 فوضى البيتزا</h1>\n    <p>مطعم واحد وفريق واحد: <b>كاشير</b> يستقبل الطلب، <b>طباخ</b> يسوّي البيتزا ويخبزها، <b>مغلّف</b> يحطها في كرتون، و<b>توصيل</b> يركض بها للزبون الصح. انتبهوا من الأرض الزلقة والركض!</p>\n    <div id=\"roles\"></div>\n    <div id=\"plist\"></div>\n    <button id=\"startBtn\" class=\"big\">ابدأ الوردية</button>\n    <button id=\"lobbyGear\" class=\"chip\">⚙ الإعدادات</button>\n    <p style=\"font-size:13px\">تقدر تغيّر وظيفتك بأي وقت بزر الوظيفة فوق — بدون ما تطلع من اللعبة.</p>\n  </div>\n  <div id=\"settings\" class=\"modal\" hidden>\n    <h1>⚙ الإعدادات</h1>\n    <label class=\"row\"><input type=\"checkbox\" id=\"setSwap\"> عكس أماكن العصاتين (للأعسر)</label>\n    <label class=\"row\"><input type=\"checkbox\" id=\"setInv\"> عكس اتجاه الكاميرا</label>\n    <label class=\"row\">حساسية الكاميرا <input type=\"range\" id=\"setSens\" min=\"0.4\" max=\"2.5\" step=\"0.1\"></label>\n    <label class=\"row\">الطيحان 🤪 <select id=\"setClumsy\"><option value=\"0\">بدون</option><option value=\"1\">عادي</option><option value=\"2\">مجنون</option></select></label>\n    <label class=\"row\">الصعوبة <select id=\"setMode\"><option value=\"auto\">تلقائي</option><option value=\"solo\">فردي / سهل</option><option value=\"team\">فريق / سريع</option></select></label>\n    <button id=\"setClose\" class=\"big\">تم</button>\n  </div>\n  <div id=\"over\" class=\"modal\" hidden>\n    <h1>انتهت الوردية!</h1><div id=\"overStars\" style=\"font-size:44px\"></div><p id=\"overTxt\"></p>\n    <button id=\"againBtn\" class=\"big\">لعبة جديدة</button>\n  </div>\n    <div id=\"rot\">📱↔️ قلّب الجوال بالعرض</div>\n  <div id=\"nogl\" hidden>المتصفح ما يدعم WebGL</div>\n</div>";
/* world.js — static world data shared by simulation (host) and renderer (phone/TV).
   No DOM, no GL. Units: metres. x = east, z = south (towards the customer hall), y = up. */
(function (G) {
'use strict';
const PG = G.PG = G.PG || {};

/* camera basis for yaw/pitch. yaw 0 looks towards +z. right = (-cos(yaw),0,sin(yaw)) */
PG.basis = function (yaw, pitch) {
  const cp = Math.cos(pitch), sp = Math.sin(pitch), sy = Math.sin(yaw), cy = Math.cos(yaw);
  const f = [cp * sy, sp, cp * cy];
  let rx = -f[2], rz = f[0]; const l = Math.hypot(rx, rz) || 1; rx /= l; rz /= l;
  const r = [rx, 0, rz];
  const u = [-rz * f[1], rz * f[0] - rx * f[2], rx * f[1]];
  return { f: f, r: r, u: u };
};
PG.eyeH = function (p) {
  let f = 0;
  if (p.fall > 0) f = p.fall > 0.5 ? Math.min(1, (1.9 - p.fall) / 0.25) : p.fall / 0.5;
  return 1.55 - 1.15 * f;
};

PG.RECIPES = [
  { n: 'مارغريتا', tp: ['sauce', 'cheese'] },
  { n: 'ببروني', tp: ['sauce', 'cheese', 'pepperoni'] },
  { n: 'خضار', tp: ['sauce', 'cheese', 'mushroom', 'olive'] },
  { n: 'دجاج وذرة', tp: ['sauce', 'cheese', 'chicken', 'corn'] }
];
PG.TOPS = {
  base: { n: 'عجينة', c: [0.93, 0.82, 0.6] },
  sauce: { n: 'صلصة', c: [0.85, 0.15, 0.1] },
  cheese: { n: 'جبن', c: [0.98, 0.85, 0.35] },
  pepperoni: { n: 'ببروني', c: [0.65, 0.12, 0.1] },
  chicken: { n: 'دجاج', c: [0.85, 0.68, 0.45] },
  corn: { n: 'ذرة', c: [0.96, 0.82, 0.15] },
  mushroom: { n: 'مشروم', c: [0.85, 0.8, 0.7] },
  olive: { n: 'زيتون', c: [0.12, 0.12, 0.12] }
};
PG.BAKE = { ok: 5, burn: 15 };
PG.ROLES = ['cashier', 'cook', 'packer', 'delivery'];
PG.ROLE_INFO = {
  cashier: { n: 'كاشير', e: '💰', c: [0.2, 0.72, 0.42] },
  cook: { n: 'طباخ', e: '👨‍🍳', c: [0.96, 0.96, 0.96] },
  packer: { n: 'تغليف', e: '📦', c: [0.3, 0.5, 0.92] },
  delivery: { n: 'توصيل', e: '🛵', c: [0.95, 0.35, 0.3] }
};

PG.World = {
  build: function () {
    const boxes = [], slots = [], disps = [];
    const WH = 3, WT = 0.25;
    const B = (x1, y1, z1, x2, y2, z2, c, s) => { boxes.push({ x1: x1, y1: y1, z1: z1, x2: x2, y2: y2, z2: z2, c: c, s: s === false ? 0 : 1 }); };
    const D = (x1, y1, z1, x2, y2, z2, c) => B(x1, y1, z1, x2, y2, z2, c, false);
    const WALL = [0.93, 0.92, 0.88];
    function wallX(x, za, zb, ops) {
      let z = za; (ops || []).forEach(o => {
        if (o.a > z) B(x - WT / 2, 0, z, x + WT / 2, WH, o.a, WALL);
        if (o.y0 > 0) B(x - WT / 2, 0, o.a, x + WT / 2, o.y0, o.b, WALL);
        if (o.y1 < WH) B(x - WT / 2, o.y1, o.a, x + WT / 2, WH, o.b, WALL);
        z = o.b;
      });
      if (z < zb) B(x - WT / 2, 0, z, x + WT / 2, WH, zb, WALL);
    }
    function wallZ(z, xa, xb, ops) {
      let x = xa; (ops || []).forEach(o => {
        if (o.a > x) B(x, 0, z - WT / 2, o.a, WH, z + WT / 2, WALL);
        if (o.y0 > 0) B(o.a, 0, z - WT / 2, o.b, o.y0, z + WT / 2, WALL);
        if (o.y1 < WH) B(o.a, o.y1, z - WT / 2, o.b, WH, z + WT / 2, WALL);
        x = o.b;
      });
      if (x < xb) B(x, 0, z - WT / 2, xb, WH, z + WT / 2, WALL);
    }
    /* floors */
    D(0, -0.05, 0, 7, 0, 7, [0.55, 0.82, 0.62]);
    D(7, -0.05, 0, 14, 0, 7, [0.86, 0.86, 0.9]);
    D(14, -0.05, 0, 21, 0, 7, [0.62, 0.72, 0.95]);
    D(21, -0.05, 0, 28, 0, 7, [0.96, 0.7, 0.62]);
    D(0, -0.05, 7, 28, 0, 20, [0.78, 0.62, 0.42]);
    /* walls */
    wallZ(0, 0, 28, []);
    wallX(0, 0, 20, []);
    wallX(28, 0, 20, []);
    wallZ(20, 0, 28, []);
    const door = { a: 4.6, b: 6.2, y0: 0, y1: 2.4 };
    const hatch = { a: 1.4, b: 2.8, y0: 0.9, y1: 1.6 };
    wallX(7, 0, 7, [door]);
    wallX(14, 0, 7, [hatch, door]);
    wallX(21, 0, 7, [hatch, door]);
    wallZ(7, 0, 28, [{ a: 1.3, b: 5.7, y0: 0.95, y1: 2.2 }, { a: 23.2, b: 25.2, y0: 0, y1: 2.4 }]);
    /* colored bands near the ceiling so rooms are recognisable */
    [[0, [0.2, 0.72, 0.42]], [7, [0.55, 0.55, 0.62]], [14, [0.3, 0.5, 0.92]], [21, [0.95, 0.4, 0.3]]].forEach(r => {
      D(r[0] + 0.13, 2.55, 0.13, r[0] + 6.87, 2.8, 0.2, r[1]);
    });

    /* ---------- cashier room ---------- */
    B(1.3, 0, 6.1, 5.7, 0.95, 6.875, [0.55, 0.38, 0.25]);
    D(3.1, 0.95, 6.3, 3.9, 1.05, 6.7, [0.2, 0.2, 0.22]);
    D(3.2, 1.05, 6.5, 3.8, 1.45, 6.56, [0.08, 0.08, 0.12]);
    D(3.25, 1.1, 6.46, 3.75, 1.4, 6.5, [0.3, 0.85, 0.5]);
    D(1.5, 1.4, 0.14, 5.5, 2.4, 0.2, [0.15, 0.2, 0.18]);
    [[1.7, [0.98, 0.85, 0.35]], [2.9, [0.65, 0.12, 0.1]], [4.1, [0.45, 0.7, 0.3]], [5.1, [0.85, 0.68, 0.45]]].forEach(m => {
      D(m[0], 1.6, 0.11, m[0] + 0.5, 2.1, 0.14, m[1]);
    });
    D(0.4, 0, 0.4, 0.9, 0.5, 0.9, [0.55, 0.35, 0.25]); D(0.45, 0.5, 0.45, 0.85, 1.3, 0.85, [0.2, 0.55, 0.25]);
    B(5.9, 0, 0.4, 6.8, 0.45, 1.6, [0.4, 0.5, 0.45]);

    /* ---------- kitchen ---------- */
    B(7.4, 0, 0.125, 13.7, 0.9, 1.05, [0.75, 0.75, 0.78]);
    const binOrder = ['base', 'sauce', 'cheese', 'pepperoni', 'chicken', 'corn', 'mushroom', 'olive'];

}
function tvUI() {
  const e = document.getElementById('tvstat'); if (!e) return;
  const S = TVS.sim, t = Math.ceil(S.timeLeft);
  e.textContent = S.state === 'lobby' ? 'بانتظار اللاعبين… اضغطوا «ابدأ» من الجوال' : S.state === 'play' ? 'الوردية شغالة ⏱ ' + Math.floor(t / 60) + ':' + ('0' + t % 60).slice(-2) + '   ⭐ ' + S.score : 'انتهت الوردية ⭐ ' + S.score;
  document.getElementById('tvplayers').textContent = S.players.map(p => PG.ROLE_INFO[p.role].e + ' ' + p.name).join('    ');
  document.getElementById('tvinfo').textContent = S.state === 'play' ? 'زبائن: ' + S.bots.length + '   طلبات: ' + S.tickets.length : '';
}
function tvPickRole() {
  let best = PG.ROLES[0], bn = 99; PG.ROLES.forEach(r => { const n = TVS.sim.players.filter(p => p.role === r).length; if (n < bn) { bn = n; best = r; } }); return best;
}
function tvStart() {
  const S = TVS.sim; if (S.state !== 'lobby') return;
  S.mode = TVS.cfg.mode === 'auto' ? (S.players.length <= 2 ? 'solo' : 'team') : TVS.cfg.mode; S.clumsy = TVS.cfg.clumsy; S.start();
}
function onHostMsg(c, d) {
  if (!d || !TVS.sim) return;
  let pid = TVS.pid[c.id];
  if (d.t === 'join') {
    if (!pid) { pid = TVS.next++; TVS.pid[c.id] = pid; TVS.sim.addPlayer(pid, tvPickRole(), String(d.name || (EMB && EMB.name) || 'لاعب').slice(0, 14)); }
    c.send({ t: 'welcome', pid: pid }); return;
  }
  if (!pid) return;
  const S = TVS.sim;
  switch (d.t) {
    case 'in': S.setInput(pid, d); break;
    case 'act': S.act(pid); break;
    case 'order': S.order(pid, d.tp, d.pn); break;
    case 'role': S.setRole(pid, d.role); break;
    case 'start': tvStart(); break;
    case 'again': if (S.state === 'over') { tvNewSim(true); tvStart(); } break;
    case 'cfg':
      TVS.cfg.clumsy = Math.max(0, Math.min(2, +d.clumsy || 0)); if (['auto', 'solo', 'team'].indexOf(d.mode) >= 0) TVS.cfg.mode = d.mode; S.clumsy = TVS.cfg.clumsy; break;
  }
}
function onPlayerLeave(id) {
  const pid = TVS.pid[id]; if (pid && TVS.sim) { TVS.sim.removePlayer(pid); delete TVS.pid[id]; }
}

/* ---------------- جهة الجوال: يعرض آخر حالة ويرسل أوامر فقط ---------------- */
function RemoteLink() { this.S = null; this.pid = 0; this.evq = []; this.at = performance.now(); }
RemoteLink.prototype = {
  send: function (m) { ctlSend(m); },
  state: function () { return this.S; },
  age: function () { return (performance.now() - this.at) / 1000; },
  drainEv: function () { const e = this.evq; this.evq = []; return e; },
  onSnap: function (sn) {
    const old = this.S, om = {};
    if (old) { old.players.forEach(p => om['p' + p.id] = p); old.bots.forEach(b => om['b' + b.id] = b); old.items.forEach(i => om['i' + i.id] = i); }
    const fix = (e, k, vel) => {
      const o = om[k + e.id]; e.y = e.y || 0; e.tx = e.x; e.ty = e.y; e.tz = e.z;
      if (vel) { e.tx += e.vx * 0.07; e.tz += e.vz * 0.07; }
      if (e.hand) e.th = { x: e.hand.x, y: e.hand.y, z: e.hand.z };
      if (o) { e.x = o.x; e.y = o.y; e.z = o.z; if (e.hand && o.hand) { e.hand.x = o.hand.x; e.hand.y = o.hand.y; e.hand.z = o.hand.z; } }
    };
    sn.players.forEach(p => fix(p, 'p', 1)); sn.bots.forEach(b => fix(b, 'b', 0)); sn.items.forEach(i => fix(i, 'i', 0));
    (sn.ev || []).forEach(e => this.evq.push(e));
    this.S = sn; this.at = performance.now();
  },
  tick: function (dt, pid) {
    const S = this.S; if (!S) return; const k = Math.min(1, 14 * dt);
    const sm = e => {
      e.x += (e.tx - e.x) * k; e.y += (e.ty - e.y) * k; e.z += (e.tz - e.z) * k;
      if (e.th && e.hand) { e.hand.x += (e.th.x - e.hand.x) * k; e.hand.y += (e.th.y - e.hand.y) * k; e.hand.z += (e.th.z - e.hand.z) * k; }
    };
    S.players.forEach(p => { if (p.id !== pid) sm(p); }); S.bots.forEach(sm); S.items.forEach(sm);
  }
};
let PHN = null;
function startPhone() {
  document.getElementById('root').innerHTML = PHONE_HTML;
  const link = new RemoteLink();
  const phone = new PG.Phone(link, { swap: false, invert: false, sens: 1, clumsy: 1, mode: 'auto' });
  PHN = { link: link, phone: phone };
  const join = () => { if (!link.pid) ctlSend({ t: 'join', name: (EMB && EMB.name) || 'لاعب' }); };
  join(); const jt = setInterval(() => { if (link.pid) clearInterval(jt); else join(); }, 800);
  let last = performance.now();
  (function raf(t) { const dt = Math.min(0.05, (t - last) / 1000 || 0.016); last = t; try { phone.frame(dt); } catch (e) { if (window.console) console.error(e); } requestAnimationFrame(raf); })(last);
}
function onCtlMsg(d) {
  if (!d || !PHN) return;
  if (d.t === 'welcome') { PHN.link.pid = d.pid; PHN.phone.setPid(d.pid); }
  else if (d.t === 'snap') PHN.link.onSnap(d.s);
}
/* يرسل من الجوال للتلفزيون (وبوضع التجربة المباشرة يوصل لنفس الصفحة) */
const DEV_CONN = { id: 'dev', send: function (o) { setTimeout(() => onCtlMsg(o), 0); } };
function ctlSend(obj) {
  if (EMB && EMB.role === 'dev') { try { onHostMsg(DEV_CONN, obj); } catch (e) { if (window.console) console.error(e); } return; }
  try { parent.postMessage({ __emb: 1, data: obj }, '*'); } catch (e) { }
}
/* لو افتحت الملف مباشرة (مو من اللوبي) يشتغل تجربة كاملة: تلفزيون + جوال بنفس الصفحة */
function devBoot() {
  if (EMB || !DEV_MODE) return;
  EMB = { role: 'dev', code: '0000', name: 'لاعب' }; embReveal(); embHostConns.dev = DEV_CONN; startTv(); startPhone();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', devBoot); else devBoot();
