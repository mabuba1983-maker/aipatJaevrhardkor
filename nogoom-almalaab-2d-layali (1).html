/* ===================== EMB BRIDGE (لا تغيّر هذا الجزء) ===================== */
let EMB=null; const embHostConns={};
window.addEventListener('message', e=>{
  const m=e&&e.data; if(!m||!m.__emb) return;
  if(m.init){ EMB={role:m.role,code:m.code,name:m.name}; return embStart(); }
  if(!EMB) return;
  if(EMB.role==='tv'){
    if(m.event==='data'){
      let c=embHostConns[m.id];
      if(!c)c=embHostConns[m.id]={id:m.id,send:obj=>{try{parent.postMessage({__emb:1,to:m.id,data:obj},'*')}catch(e){}}};
      try{onHostMsg(c,m.data)}catch(e){}
    } else if(m.event==='disconnect'){
      try{onPlayerLeave(m.id)}catch(e){}
      delete embHostConns[m.id];
    }
  } else if(EMB.role==='ph'){
    if(m.data!==undefined){try{onCtlMsg(m.data)}catch(e){}}
  }
});
function embReveal(){try{document.documentElement.classList.remove('emb-pending')}catch(e){}}
function embStart(){
  embReveal();
  if(EMB.role==='tv'){ startTv(); } else { startPhone(); }
}
setTimeout(()=>{ if(!EMB) embReveal(); }, 2500);

let actx=null,muted=false;
function sfx(freq,dur,type,vol,endF){
  if(muted)return;
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
    if(endF)o.frequency.exponentialRampToValueAtTime(endF,t+dur);
    g.gain.setValueAtTime(vol||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}

function setupPenalty(){

function doPass(p,b,ax,ay,humanId){
  const tms=G.players.filter(x=>x.team===p.team&&x.id!==p.id&&x.knock<=0);
  const hasAim=Math.hypot(ax,ay)>0.25;
  const ang=hasAim?Math.atan2(ay,ax):p.facing;
  let best=null,bestS=-999;
  tms.forEach(tm=>{
    const d=dist(p.x,p.y,tm.x,tm.y);
    const diff=Math.abs(Math.atan2(Math.sin(Math.atan2(tm.y-p.y,tm.x-p.x)-ang),Math.cos(Math.atan2(tm.y-p.y,tm.x-p.x)-ang)));
    const sc=Math.cos(diff)*2.2+(1-clamp(d/600,0,0.8));
    if(sc>bestS){bestS=sc;best=tm;}
  });
  p.hasBall=false;p.kcd=0.34;b.owner=null;b.fire=false;b.passTeam=p.team;b.passFromHuman=humanId;b.passTarget=best?best.id:null;
  G.stats.pa[p.team]++;
  if(best){
    const d=dist(p.x,p.y,best.x,best.y);
    const spd=clamp(220+d*0.45+(p.pass-70)*1.3,235,410);
    const a=Math.atan2(best.y-b.y,best.x-b.x);
    b.vx=Math.cos(a)*spd;b.vy=Math.sin(a)*spd;b.vz=clamp(d*0.09,10,42);
  } else {
    b.vx=Math.cos(ang)*290;b.vy=Math.sin(ang)*290;
  }
  puff(b.x,b.y,4,'#e2e8f0',70,0.22,2.2);
  sfx(340,0.06,'sine',0.08,190);
}

function doShot(p,b,pwr,ax,ay,isSup){
  const gx=p.team===0?PW+6:-6;
  const ty=clamp(300+ay*46+(Math.random()-0.5)*22,GT+8,GB-8);
  const ang=Math.atan2(ty-b.y,gx-b.x);
  const fire=Boolean(isSup||p.fire);p.fire=false;
  const spd=fire?670:clamp(330+(pwr||0.7)*220+(p.shot-70)*1.4,340,560);
  p.hasBall=false;p.kcd=0.42;p.chg=0;b.owner=null;b.fire=fire;b.passTeam=null;b.passFromHuman=null;b.passTarget=null;
  b.vx=Math.cos(ang)*spd;b.vy=Math.sin(ang)*spd;b.vz=fire?60:(45+(pwr||0.7)*115);
  b.spin=(Math.random()-0.5)*14;
  G.stats.sh[p.team]++;
  if(fire){G.hitstop=0.04;G.shake=0.55;G.comm='🔥 '+p.name+' يطلق تسديدة التنين الخارقة!!';G.commT=2.5;puff(b.x,b.y,18,'#fb7185',200,0.45,3.8);sfx(520,0.22,'sawtooth',0.16,140);}
  else{puff(b.x,b.y,7,'#ffffff',120,0.28,2.6);sfx(145,0.09,'triangle',0.15,65);}
}

function doPunch(att){
  if(att.pcd>0||att.knock>0||att.frz>0)return;
  att.pcd=0.65;att.panim=0.22;G.stats.pn[att.team]++;
  let vic=null,bd=38;

  if(!vic){sfx(210,0.05,'sine',0.06,120);return;}
  const ka=Math.atan2(vic.y-att.y,vic.x-att.x)+(Math.random()-0.5)*1.75;
  const ks=145+Math.random()*140;
  vic.vx=Math.cos(ka)*ks;vic.vy=Math.sin(ka)*ks;
  vic.knock=1.2+Math.random()*0.95;
  vic.spin=(Math.random()>0.5?1:-1)*(7+Math.random()*12);
  vic.fric=0.05+Math.random()*0.14;
  G.hitstop=0.04;G.shake=0.45;G.crowd=Math.min(1,G.crowd+0.25);
  G.balls.forEach(b=>{
    if(b.owner===vic.id){vic.hasBall=false;b.owner=null;const pa=ka+(Math.random()-0.5)*2;b.vx=Math.cos(pa)*190;b.vy=Math.sin(pa)*190;b.vz=75;}
  });
  puff(vic.x,vic.y,12,'#fb7185',160,0.42,3.4);

}

function doSuper(h,p,ax,ay){
  if((h.sup||0)<100||p.knock>0||p.frz>0)return false;
  h.sup=0;G.stats.sup[p.team]++;G.hitstop=0.045;G.shake=0.55;G.crowd=1;
  const ob=G.balls.find(b=>b.owner===p.id);
  if(ob){doShot(p,ob,1,ax,ay,true);}
  else{
    const ang=Math.hypot(ax,ay)>0.2?Math.atan2(ay,ax):p.facing;
    p.facing=ang;p.vx=Math.cos(ang)*320;p.vy=Math.sin(ang)*320;p.tanim=0.34;p.pu='turbo';p.put=3;
    puff(p.x,p.y,18,'#38bdf8',180,0.45,3.6);
    G.players.forEach(op=>{

        const ka=Math.atan2(op.y-p.y,op.x-p.x);op.vx=Math.cos(ka)*190;op.vy=Math.sin(ka)*190;op.knock=0.85;

    sfx(580,0.2,'sawtooth',0.16,220);
  }

}

function render2DFrame(tSec){
  const cv=document.getElementById('stage2d');if(!cv)return;
  const ctx=cv.getContext('2d',{alpha:false});if(!ctx)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const pw=Math.max(320,cv.clientWidth),ph=Math.max(200,cv.clientHeight);
  if(cv.width!==Math.floor(pw*dpr)||cv.height!==Math.floor(ph*dpr)){cv.width=Math.floor(pw*dpr);cv.height=Math.floor(ph*dpr);}
  const cw=cv.width,ch=cv.height;
  const z=G.cam==='close'?1.24:1.0;
  const mb=G.balls[0]||{x:PW/2,y:PH/2};
  const tx=z>1?clamp(MX+mb.x,WW*0.34,WW*0.66):WW/2;
  const ty=z>1?clamp(MY+mb.y,WH*0.36,WH*0.64):WH/2;
  G.camX+=(tx-G.camX)*0.1;G.camY+=(ty-G.camY)*0.1;
  const sx=G.shake>0?(Math.random()-0.5)*G.shake*14:0;
  const sy=G.shake>0?(Math.random()-0.5)*G.shake*14:0;
  const sc=Math.min(cw/WW,ch/WH)*z;

  ctx.fillStyle='#0e071a';ctx.fillRect(0,0,cw,ch);
  ctx.save();
  ctx.translate(cw/2+sx,ch/2+sy);ctx.scale(sc,sc);ctx.translate(-G.camX,-G.camY);
  ctx.fillStyle='#1b112c';ctx.fillRect(0,0,WW,WH);

  // Cheering 2D crowd
  const amp=1.5+G.crowd*5.5;
  for(const f of fans){
    const dy=Math.abs(Math.sin(tSec*(3.2+G.crowd*5)+f.p))*amp;
    ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y-dy,4.5,0,Math.PI*2);ctx.fill();
  }

  // Matte pitch turf (ZERO shadows, ZERO reflections)
  ctx.fillStyle='#11613a';ctx.fillRect(MX-18,MY-12,PW+36,PH+24);
  for(let i=0;i<12;i++){ctx.fillStyle=i%2===0?'#187c4b':'#146d41';ctx.fillRect(MX+i*(PW/12),MY,PW/12,PH);}
  ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=2.5;ctx.strokeRect(MX,MY,PW,PH);
  ctx.beginPath();ctx.moveTo(MX+PW/2,MY);ctx.lineTo(MX+PW/2,MY+PH);ctx.stroke();
  ctx.beginPath();ctx.arc(MX+PW/2,MY+PH/2,68,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(MX+PW/2,MY+PH/2,4,0,Math.PI*2);ctx.fill();
  ctx.strokeRect(MX,MY+135,130,330);ctx.strokeRect(MX,MY+210,48,180);
  ctx.strokeRect(MX+PW-130,MY+135,130,330);ctx.strokeRect(MX+PW-48,MY+210,48,180);

  if(G.chaos==='crazy_wind'){
    ctx.strokeStyle='rgba(186,230,253,0.35)';ctx.lineWidth=2;
    for(let w=0;w<10;w++){
      const wx=MX+((w*130+tSec*240)%PW),wy=MY+45+(w*54)%(PH-90);
      ctx.beginPath();ctx.moveTo(wx,wy);ctx.lineTo(wx+34,wy+(G.wy>0?18:-18));ctx.stroke();
    }
  }
  if(G.chaos==='double_goal'){ctx.strokeStyle='#facc15';ctx.lineWidth=4;ctx.strokeRect(MX-4,MY-4,PW+8,PH+8);}

  // Goals with mesh & ripple
  [false,true].forEach((isR,idx)=>{
    const x0=MX+(isR?PW:-28),w=28,y0=MY+GT,h=GB-GT,bg=G.netR[idx]*(isR?9:-9);
    ctx.fillStyle='rgba(248,250,252,0.14)';
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0+w+bg,y0+4);ctx.lineTo(x0+w+bg,y0+h-4);ctx.lineTo(x0,y0+h);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(226,232,240,0.5)';ctx.lineWidth=1;
    for(let gx=6;gx<w;gx+=7){ctx.beginPath();ctx.moveTo(x0+gx,y0);ctx.lineTo(x0+gx,y0+h);ctx.stroke();}
    for(let gy=10;gy<h;gy+=12){ctx.beginPath();ctx.moveTo(x0,y0+gy);ctx.lineTo(x0+w+bg*0.6,y0+gy);ctx.stroke();}
    ctx.strokeStyle='#fff';ctx.lineWidth=3.5;ctx.beginPath();
    if(isR){ctx.moveTo(x0,y0);ctx.lineTo(x0+w+bg,y0);ctx.lineTo(x0+w+bg,y0+h);ctx.lineTo(x0,y0+h);}
    else{ctx.moveTo(x0+w,y0);ctx.lineTo(x0+bg,y0);ctx.lineTo(x0+bg,y0+h);ctx.lineTo(x0+w,y0+h);}
    ctx.stroke();
  });

  // Orbs
  G.orbs.forEach(o=>{
    const oy=MY+o.y+Math.sin(tSec*5+o.x)*3;
    ctx.fillStyle=o.col;ctx.beginPath();ctx.arc(MX+o.x,oy,13,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#0f172a';ctx.font='bold 14px Tajawal,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.sym,MX+o.x,oy+1);
  });

  // Particles
  G.pts.forEach(pt=>{
    ctx.globalAlpha=clamp(pt.life/pt.max,0,1);ctx.fillStyle=pt.col;
    ctx.beginPath();ctx.arc(MX+pt.x,MY+pt.y,pt.sz,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  // Players
  const cmap={};Object.values(G.humans).forEach(h=>{if(h.pid)cmap[h.pid]=h;});
  G.players.forEach(p=>{
    const t=TEAMS[p.team===0?G.homeIdx:G.awayIdx],h=cmap[p.id];
    ctx.save();ctx.translate(MX+p.x,MY+p.y);
    if(h){ctx.strokeStyle=h.color;ctx.lineWidth=2.8;ctx.beginPath();ctx.arc(0,0,p.r+6,0,Math.PI*2);ctx.stroke();}
    if(p.pu){const pv=PU_LIST.find(x=>x.kind===p.pu);if(pv){ctx.strokeStyle=pv.col;ctx.lineWidth=2.3;ctx.setLineDash([4,3]);ctx.beginPath();ctx.arc(0,0,p.r+3.5,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}}
    if(p.chg>0.05){ctx.strokeStyle=p.chg>0.78?'#ef4444':'#facc15';ctx.lineWidth=3.5;ctx.beginPath();ctx.arc(0,0,p.r+9,-Math.PI/2,-Math.PI/2+Math.PI*2*p.chg);ctx.stroke();}
    ctx.save();
    if(p.knock>0){ctx.rotate(p.tumble);ctx.scale(1.18,0.72);}else ctx.rotate(p.facing);
    ctx.fillStyle='#0f172a';ctx.beginPath();ctx.arc(p.r*0.75,-4,3.1,0,Math.PI*2);ctx.arc(p.r*0.75,4,3.1,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=p.frz>0?'#67e8f9':(p.role==='GK'?t.gk:t.c1);
    ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=p.frz>0?'#ecfeff':t.c2;ctx.lineWidth=2.3;ctx.beginPath();ctx.moveTo(-p.r*0.3,-p.r*0.8);ctx.lineTo(-p.r*0.3,p.r*0.8);ctx.stroke();
    ctx.strokeStyle='#0f172a';ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=p.frz>0?'#cffafe':'#e6b48a';ctx.beginPath();ctx.arc(1.5,0,p.r*0.48,0,Math.PI*2);ctx.fill();
    if(p.panim>0){ctx.fillStyle='#fb7185';ctx.beginPath();ctx.arc(p.r+7,0,5.5,0,Math.PI*2);ctx.fill();}
    ctx.restore();
    if(h){
      const bob=Math.sin(tSec*6)*2.5,ty2=-p.r-13+bob;
      ctx.fillStyle=h.color;ctx.beginPath();ctx.moveTo(0,ty2+6);ctx.lineTo(-5,ty2-1);ctx.lineTo(5,ty2-1);ctx.closePath();ctx.fill();
      if(h.name){
        ctx.font='800 11px Tajawal,sans-serif';const tw=ctx.measureText(h.name).width+12;
        ctx.fillStyle='rgba(14,7,24,0.92)';ctx.strokeStyle=h.color;ctx.lineWidth=1.5;
        ctx.beginPath();ctx.roundRect(-tw/2,ty2-21,tw,17,5);ctx.fill();ctx.stroke();
        ctx.fillStyle=h.color;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(h.name,0,ty2-12);
      }
    } else {
      ctx.font='700 9px monospace';ctx.fillStyle='rgba(248,250,252,0.85)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(p.num),0,p.r+9);
    }
    ctx.restore();
  });

  // Matte 2D Soccer Balls (zero shadows)
  G.balls.forEach(b=>{
    const r=b.r*(1+Math.min(b.z*0.008,0.35)),bx=MX+b.x,by=MY+b.y-b.z*0.45;
    ctx.save();ctx.translate(bx,by);
    if(b.fire){ctx.strokeStyle='#fb7185';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r+4,0,Math.PI*2);ctx.stroke();}
    ctx.fillStyle=b.fire?'#fed7aa':'#ffffff';ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=b.fire?'#ea580c':'#1e293b';ctx.lineWidth=Math.max(1.4,r*0.2);ctx.stroke();
    ctx.fillStyle=b.fire?'#ea580c':'#0f172a';ctx.beginPath();ctx.arc(0,0,r*0.34,0,Math.PI*2);ctx.fill();
    for(let k=0;k<4;k++){const a=(b.spin+b.x*0.04)+(k*Math.PI)/2;ctx.beginPath();ctx.arc(Math.cos(a)*r*0.68,Math.sin(a)*r*0.68,r*0.17,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  });

  if(G.mode==='penalty'&&G.pen&&G.pen.phase==='aim'){
    const ay=clamp(PH/2+G.pen.aim*44,GT+6,GB-6);
    ctx.strokeStyle='#ffd166';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(MX+PW-4,MY+ay,10,0,Math.PI*2);
    ctx.moveTo(MX+PW-18,MY+ay);ctx.lineTo(MX+PW+10,MY+ay);ctx.stroke();
  }
  ctx.restore();
}

function tickMatch(dt){
  G.shake=Math.max(0,G.shake-dt*2.2);G.netR[0]=Math.max(0,G.netR[0]-dt*1.4);G.netR[1]=Math.max(0,G.netR[1]-dt*1.4);G.crowd=Math.max(0.2,G.crowd-dt*0.18);
  for(let i=G.pts.length-1;i>=0;i--){const pt=G.pts[i];pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vx*=Math.pow(0.25,dt);pt.vy*=Math.pow(0.25,dt);pt.life-=dt;if(pt.life<=0)G.pts.splice(i,1);}
  if(G.commT>0){G.commT-=dt;if(G.commT<=0)G.comm='';}
  const cpEl=document.getElementById('comm-pill');if(cpEl){cpEl.textContent=G.comm;cpEl.style.display=G.comm?'block':'none';}
  if(G.hitstop>0){G.hitstop-=dt;return;}

  if(G.goalTimer>0){
    G.goalTimer-=dt;
    if(G.goalTimer<=0){
      if(G.mode==='golden_goal'){G.screen='fulltime';renderTv();broadcastState();}
      else if(G.mode==='penalty'&&G.pen){const go=document.getElementById('goal-ov');if(go)go.style.display='none';advancePenalty();}
      else{resetBalls();const go=document.getElementById('goal-ov');if(go)go.style.display='none';}
    }
    return;
  }

  if(G.mode==='penalty'&&G.pen){
    const pen=G.pen;
    Object.values(G.humans).forEach(h=>{
      const inp=inputs[h.id];if(!inp||pen.phase!=='aim')return;
      if(h.team===pen.turn){pen.aim=clamp(pen.aim+inp.my*dt*1.9,-1,1);if(inp.sh||inp.pa){inp.sh=false;inp.pa=false;launchPenalty();}}
      else pen.dive=clamp(inp.my,-1,1);
    });
    if(pen.phase==='aim'&&!Object.values(G.humans).some(h=>h.team===pen.turn)){
      pen.t+=dt;pen.aim=Math.sin(pen.t*3.1)*0.75;if(pen.t>1.1)launchPenalty();
    } else if(pen.phase==='flight'){
      pen.t+=dt;
      const gt=pen.turn===0?1:0,kp=G.players.find(p=>p.team===gt&&p.role==='GK'),b=G.balls[0];
      if(kp){kp.y=clamp(kp.y+kp.vy*dt,16,PH-16);kp.dive-=dt;if(kp.dive<=0)kp.vy*=0.7;}
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(kp&&dist(kp.x,kp.y,b.x,b.y)<kp.r+b.r+7){b.vx=-b.vx*0.4;pen.taken[pen.turn]++;pen.phase='res';pen.t=1.1;sfx(180,0.08,'square',0.1);}
      else if(b.x>PW+4&&b.y>GT&&b.y<GB){G.score[pen.turn]++;pen.taken[pen.turn]++;G.netR[1]=1;G.goalTimer=1.6;G.goalText='هدف ترجيحي!!';G.goalSub=TEAMS[pen.turn===0?G.homeIdx:G.awayIdx].name;const go=document.getElementById('goal-ov');if(go){document.getElementById('goal-txt').textContent=G.goalText;document.getElementById('goal-sub').textContent=G.goalSub;go.style.display='flex';}sfx(523,0.3,'triangle',0.16);broadcastState();}
      else if(pen.t>1.8){pen.taken[pen.turn]++;pen.phase='res';pen.t=0.9;}
    } else if(pen.phase==='res'){pen.t-=dt;if(pen.t<=0)advancePenalty();}
    return;
  }

  G.timeLeft=Math.max(0,G.timeLeft-dt);
  if(G.timeLeft<=0){G.screen='fulltime';sfx(760,0.2,'sine',0.12);renderTv();broadcastState();return;}

  Object.values(G.humans).forEach(h=>{
    h.sup=Math.min(100,(h.sup||0)+dt*3.8);
    const inp=inputs[h.id];if(!inp)return;
    if(inp.sw){inp.sw=false;switchPlayer(h);}
    const p=G.players.find(x=>x.id===h.pid);if(!p||p.knock>0||p.frz>0)return;
    if(inp.sup){inp.sup=false;if(doSuper(h,p,inp.mx,inp.my))return;}
    const mag=Math.hypot(inp.mx,inp.my),spr=inp.sp&&p.stam>8&&mag>0.1;
    p.stam=spr?Math.max(0,p.stam-22*dt):Math.min(100,p.stam+14*dt);
    const base=(95+p.pace*0.38)*(p.pu==='turbo'?1.48:1)*(G.chaos==='turbo_pitch'?1.32:1);
    const spd=(spr?base*1.28:base)*(p.hasBall?0.92:1);
    if(p.tanim<=0){
      const a=clamp(9.5*dt,0,1);
      if(mag>0.12){p.vx+=((inp.mx/Math.max(1,mag))*spd-p.vx)*a;p.vy+=((inp.my/Math.max(1,mag))*spd-p.vy)*a;}
      else{p.vx*=Math.pow(0.03,dt);p.vy*=Math.pow(0.03,dt);}
    }
    if(inp.pu){inp.pu=false;if(G.mode==='brawl')doPunch(p);}
    const ob=G.balls.find(b=>b.owner===p.id);
    if(p.hasBall&&ob){
      if(inp.pa){inp.pa=false;h.sup=Math.min(100,(h.sup||0)+14);doPass(p,ob,inp.mx,inp.my,h.id);p.chg=0;return;}
      if(inp.shH||inp.sh){inp.sh=false;p.chg=clamp(p.chg+dt*1.8,0.2,1);}
      if(inp.shR||(p.chg>=0.99&&inp.shH)){inp.shR=false;h.sup=Math.min(100,(h.sup||0)+12);doShot(p,ob,p.chg,inp.mx,inp.my,false);return;}
    }else{
      p.chg=0;
      if((inp.tk||inp.sh)&&p.tcd<=0){
        inp.tk=false;inp.sh=false;p.tcd=0.72;p.tanim=0.22;G.stats.tk[p.team]++;
        const ls=195*(p.pu==='turbo'?1.48:1);p.vx=Math.cos(p.facing)*ls;p.vy=Math.sin(p.facing)*ls;
        puff(p.x,p.y,4,'#cbd5e1',70,0.25,2.2);
      }
      inp.tk=false;inp.sh=false;inp.shR=false;
    }
  });

  if(G.puOn){
    G.orbTimer-=dt;
    if(G.orbTimer<=0&&G.orbs.length<3){
      const pk=PU_LIST[Math.floor(Math.random()*PU_LIST.length)];
      G.orbs.push({...pk,x:150+Math.random()*(PW-300),y:75+Math.random()*(PH-150),ttl:14});
      G.orbTimer=6.5;
    }
    for(let i=G.orbs.length-1;i>=0;i--){
      const o=G.orbs[i];o.ttl-=dt;if(o.ttl<=0){G.orbs.splice(i,1);continue;}
      for(const p of G.players){
        if(p.knock<=0&&p.frz<=0&&dist(p.x,p.y,o.x,o.y)<=p.r+15){
          G.orbs.splice(i,1);G.stats.pu[p.team]++;
          if(o.kind==='freeze'){G.players.forEach(op=>{if(op.team!==p.team&&op.role!=='GK'&&op.pu!=='titan'){op.frz=3.2;puff(op.x,op.y,8,'#67e8f9',90,0.45,3);}});G.comm='🧊 '+p.name+' جمّد الخصوم!';}
          else{p.pu=o.kind;p.put=6.5;p.r=o.kind==='titan'?14.5:11;if(o.kind==='fire_shot')p.fire=true;G.comm=o.lbl+' — '+p.name;}
          G.commT=2.4;
          const ch=Object.values(G.humans).find(h=>h.pid===p.id);if(ch)ch.sup=Math.min(100,(ch.sup||0)+25);
          puff(o.x,o.y,14,'#fde047',140,0.42,3.4);sfx(660,0.14,'sine',0.12,920);break;
        }
      }
    }
  }

  if(G.chaosOn){
    const chEl=document.getElementById('chaos-pill');
    if(G.chaos!=='none'){
      G.chaosTimer-=dt;if(G.chaosTimer<=0){G.chaos='none';G.chaosText='';G.wx=0;G.wy=0;if(chEl)chEl.style.display='none';}
    } else {
      G.nextChaos-=dt;
      if(G.nextChaos<=0){
        const pk=CHAOS_POOL[Math.floor(Math.random()*CHAOS_POOL.length)];
        G.chaos=pk.kind;G.chaosText=pk.banner;G.chaosTimer=10;G.nextChaos=14;
        if(pk.kind==='crazy_wind'){G.wx=(Math.random()>0.5?1:-1)*55;G.wy=(Math.random()>0.5?1:-1)*145;}else{G.wx=0;G.wy=0;}
        if(chEl){chEl.textContent=pk.banner;chEl.style.display='block';}
        sfx(320,0.22,'square',0.1,640);
      }
    }
  }

  const mainB=G.balls[0],ctrl=new Set(Object.values(G.humans).map(h=>h.pid));
  const owner=mainB.owner?G.players.find(x=>x.id===mainB.owner):null;
  const presser={0:null,1:null};
  [0,1].forEach(tm=>{
    if(owner&&owner.team===tm)return;
    let best=null,bd=1e9;
    G.players.forEach(p=>{if(p.team===tm&&p.role!=='GK'&&!ctrl.has(p.id)&&p.knock<=0&&p.frz<=0){const d=dist(p.x,p.y,mainB.x,mainB.y);if(d<bd){bd=d;best=p.id;}}});
    presser[tm]=best;
  });
  const aiPace=G.diff==='easy'?0.86:G.diff==='pro'?1.04:0.95;

  G.players.forEach(p=>{
    if(ctrl.has(p.id)||p.knock>0||p.frz>0)return;
    p.ait-=dt;const dir=p.team===0?1:-1,a=clamp(7.5*dt,0,1);
    if(p.role==='GK'){
      const tx=p.team===0?28:PW-28,ty=clamp(mainB.y,GT+10,GB-10),ob=G.balls.find(b=>b.owner===p.id);
      if(p.hasBall&&ob){p.vx=0;p.vy=0;if(p.ait<=0){p.ait=0.55;doPass(p,ob,dir,0,null);}return;}
      const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);
      p.vx+=((d>3?(dx/d)*112:0)-p.vx)*a;p.vy+=((d>3?(dy/d)*112:0)-p.vy)*a;p.facing=p.team===0?0:Math.PI;return;
    }
    const ob=G.balls.find(b=>b.owner===p.id);
    if(p.hasBall&&ob){
      const dg=dist(p.x,p.y,p.team===0?PW:0,300);
      if(p.ait<=0){p.ait=0.34;if(dg<220){doShot(p,ob,0.75,dir,0,false);return;}}
      const spd=(94+p.pace*0.32)*aiPace*0.92;
      p.vx+=(dir*spd-p.vx)*a;p.vy+=(clamp((300-p.y)/200,-0.4,0.4)*spd-p.vy)*a;return;
    }
    const isChasePass=!owner&&mainB.passTeam===p.team&&(mainB.passTarget===p.id||presser[p.team]===p.id);
    let tx=p.hx,ty=p.hy,spd=(95+p.pace*0.32)*aiPace;
    if(isChasePass){tx=clamp(mainB.x+mainB.vx*0.14,18,PW-18);ty=clamp(mainB.y+mainB.vy*0.14,18,PH-18);spd*=1.16;}
    else if(presser[p.team]===p.id){
      if(owner&&owner.team!==p.team){
        const ownG=p.team===0?26:PW-26;tx=clamp(owner.x+(ownG>owner.x?34:-34),42,PW-42);ty=owner.y;
        if(dist(p.x,p.y,mainB.x,mainB.y)<26&&p.tcd<=0&&p.ait<=0){p.ait=1.6;p.tcd=1.6;p.tanim=0.22;const ta=Math.atan2(mainB.y-p.y,mainB.x-p.x);p.vx=Math.cos(ta)*165;p.vy=Math.sin(ta)*165;return;}
      }else{tx=mainB.x;ty=mainB.y;}
    }else if(owner&&owner.team===p.team){tx=clamp(p.hx+dir*110,90,PW-90);ty=p.hy;}
    else{tx=clamp(p.hx+(mainB.x-500)*0.35,80,PW-80);ty=p.hy*0.75+mainB.y*0.25;}
    const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);
    p.vx+=((d>8?(dx/d)*spd:0)-p.vx)*a;p.vy+=((d>8?(dy/d)*spd:0)-p.vy)*a;
  });

  // Magnet attraction
  G.players.forEach(p=>{
    if(p.pu==='magnet'&&p.knock<=0){
      G.balls.forEach(b=>{if(!b.owner&&dist(p.x,p.y,b.x,b.y)<125){const ang=Math.atan2(p.y-b.y,p.x-b.x);b.vx+=Math.cos(ang)*420*dt;b.vy+=Math.sin(ang)*420*dt;}});
    }
  });

  G.players.forEach(p=>{
    if(p.kcd>0)p.kcd-=dt;if(p.tcd>0)p.tcd-=dt;if(p.tanim>0)p.tanim-=dt;if(p.pcd>0)p.pcd-=dt;if(p.panim>0)p.panim-=dt;
    if(p.frz>0)p.frz-=dt;if(p.put>0){p.put-=dt;if(p.put<=0){p.pu=null;p.r=11;p.fire=false;}}
    if(p.frz>0){p.vx*=0.8;p.vy*=0.8;}
    else if(p.knock>0){p.knock-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(p.fric,dt);p.vy*=Math.pow(p.fric,dt);p.tumble+=p.spin*dt;}
    else{p.tumble=0;p.x+=p.vx*dt;p.y+=p.vy*dt;if(Math.hypot(p.vx,p.vy)>12)p.facing=Math.atan2(p.vy,p.vx);}
    p.x=clamp(p.x,14,PW-14);p.y=clamp(p.y,16,PH-16);
  });

  // Player collisions + Titan knockback
  for(let i=0;i<G.players.length;i++){
    for(let j=i+1;j<G.players.length;j++){
      const a=G.players[i],b=G.players[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),md=a.r+b.r;
      if(d>0&&d<md){
        const nx=dx/d,ny=dy/d,ov=(md-d)*0.5;
        a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
        if(a.team!==b.team){
          if(a.pu==='titan'&&b.pu!=='titan'&&b.knock<=0){b.vx=nx*185;b.vy=ny*185;b.knock=0.55;}
          else if(b.pu==='titan'&&a.pu!=='titan'&&a.knock<=0){a.vx=-nx*185;a.vy=-ny*185;a.knock=0.55;}
        }
      }
    }
  }

  const grav=G.chaos==='low_gravity'?155:320;
  for(const b of G.balls){
    if(b.owner){
      const ow=G.players.find(x=>x.id===b.owner);
      if(ow&&ow.knock<=0&&ow.frz<=0){b.x=ow.x+Math.cos(ow.facing)*(ow.r+b.r+1);b.y=ow.y+Math.sin(ow.facing)*(ow.r+b.r+1);b.z=0;b.vx=ow.vx;b.vy=ow.vy;}
      else b.owner=null;
    }else{
      if(b.fire)puff(b.x,b.y,1,'#fb923c',40,0.22,3.4);
      b.vx+=G.wx*dt;b.vy+=G.wy*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(b.z>0||b.vz>0){b.z+=b.vz*dt;b.vz-=grav*dt;if(b.z<=0){b.z=0;b.vz=Math.abs(b.vz)>36?-b.vz*0.55:0;}}
      const damp=Math.pow(b.fire?0.68:0.42,dt);b.vx*=damp;b.vy*=damp;
      if(b.y<12){b.y=12;b.vy=Math.abs(b.vy)*0.68;}if(b.y>PH-12){b.y=PH-12;b.vy=-Math.abs(b.vy)*0.68;}
      const inG=b.y>GT&&b.y<GB;
      if(inG&&(b.x>PW+4||b.x<-4)){
        const sTeam=b.x>PW+4?0:1,pts=G.chaos==='double_goal'?2:1;
        G.score[sTeam]+=pts;G.goalTimer=2.1;G.netR[sTeam===0?1:0]=1;G.shake=0.6;G.crowd=1;
        G.goalText=pts===2?'هدف مزدوج x2!!':'هدف رائع!!';
        G.goalSub=(b.lastName||TEAMS[sTeam===0?G.homeIdx:G.awayIdx].name)+' — '+TEAMS[sTeam===0?G.homeIdx:G.awayIdx].name;
        const go=document.getElementById('goal-ov');
        if(go){document.getElementById('goal-txt').textContent=G.goalText;document.getElementById('goal-sub').textContent=G.goalSub;go.style.display='flex';}
        puff(b.x,b.y,26,'#ffd166',240,0.85,4.5);sfx(523,0.35,'triangle',0.16);
        broadcastState();return;
      }
      if(!inG){if(b.x<10){b.x=10;b.vx=Math.abs(b.vx)*0.65;}if(b.x>PW-10){b.x=PW-10;b.vx=-Math.abs(b.vx)*0.65;}}
    }
    if(b.z<=42){
      const curO=b.owner?G.players.find(x=>x.id===b.owner):null;
      for(const p of G.players){
        if(p.knock>0||p.frz>0||p.kcd>0)continue;
        if(!curO&&p.hasBall)continue;
        const d=dist(p.x,p.y,b.x,b.y),isRcv=!curO&&b.passTeam===p.team&&b.passTarget===p.id;
        const pr=p.r+b.r+(p.tanim>0?8:isRcv?9:3);
        if(d>pr)continue;
        if(!curO){
          p.hasBall=true;b.owner=p.id;b.fire=false;b.lastTeam=p.team;b.lastId=p.id;b.lastName=p.name;
          if(p.role==='GK')p.ait=0.45;
          if(b.passTeam===p.team&&b.passFromHuman&&G.humans[b.passFromHuman])G.humans[b.passFromHuman].pid=p.id;
          else if(b.passTeam!==p.team){Object.values(G.humans).forEach(h=>{if(h.team!==p.team){const c=G.players.find(x=>x.id===h.pid);if(!c||c.knock>0||dist(c.x,c.y,b.x,b.y)>220)switchPlayer(h);}});}
          b.passTeam=null;b.passTarget=null;b.passFromHuman=null;break;
        }else if(curO.team!==p.team&&curO.pu!=='titan'){
          const dx=p.x-curO.x,dy=p.y-curO.y,dl=Math.hypot(dx,dy)||1;
          const front=(dx/dl)*Math.cos(curO.facing)+(dy/dl)*Math.sin(curO.facing)>0.35;
          if((p.tanim>0&&d<=p.r+b.r+6)||(front&&d<=p.r+b.r-1)){
            curO.hasBall=false;curO.kcd=0.55;curO.chg=0;p.hasBall=true;b.owner=p.id;b.lastTeam=p.team;b.lastId=p.id;b.lastName=p.name;
            b.passTeam=null;b.passTarget=null;b.passFromHuman=null;
            const ch=Object.values(G.humans).find(h=>h.pid===p.id);if(ch)ch.sup=Math.min(100,(ch.sup||0)+16);
            puff(b.x,b.y,8,'#f8fafc',120,0.3,2.8);
            Object.values(G.humans).forEach(h=>{if(h.team===curO.team){const c=G.players.find(x=>x.id===h.pid);if(!c||dist(c.x,c.y,b.x,b.y)>170)switchPlayer(h);}});
            break;
          }
        }
      }
    }
  }

  const hc=document.getElementById('hud-clock'),hs=document.getElementById('hud-score');
  if(hc){const m=Math.floor(G.timeLeft/60),s=Math.floor(G.timeLeft%60);hc.textContent=G.mode==='penalty'?'ترجيح':(m+':'+(s<10?'0'+s:s));}
  if(hs)hs.textContent=G.score[0]+' - '+G.score[1];
}

function setLeague(id){
  G.lgFilter=id;
  const list=id==='all'?TEAMS:TEAMS.filter(t=>t.lgId===id);
  if(list[0])G.homeIdx=TEAMS.indexOf(list[0]);
  if(list[1])G.awayIdx=TEAMS.indexOf(list[1]);
  renderTv();
}

function renderTv(){
  const root=document.getElementById('root');
  const realCode=EMB&&EMB.code?String(EMB.code):null;
  const codeBadge=realCode?'<span class="gold-code" style="font-size:26px">'+realCode+'</span>':'<span style="font-size:13px;color:#fbbf24">يظهر تلقائياً عند التشغيل داخل ليالي الرياض</span>';

  if(G.screen==='lobby'){
    const list=G.lgFilter==='all'?TEAMS:TEAMS.filter(t=>t.lgId===G.lgFilter);
    const opts=list.map(t=>{const ix=TEAMS.indexOf(t);return '<option value="'+ix+'">'+t.name+' ('+t.ovr+')</option>';}).join('');
    const plist=Object.values(G.humans).map(h=>'<div class="player-item"><span><span class="color-dot" style="background:'+h.color+'"></span> '+h.name+(h.isHost?' (المضيف)':'')+'</span><span>'+(h.team===0?TEAMS[G.homeIdx].name:TEAMS[G.awayIdx].name)+'</span></div>').join('')||'<p style="opacity:.7;font-size:13px">بانتظار دخول اللاعبين من هواتفهم...</p>';
    const mBtns=MODES.map(m=>'<button class="mode-btn '+(G.mode===m.id?'active':'')+'" onclick="G.mode=\''+m.id+'\';renderTv();broadcastState()">'+m.label+'</button>').join('');
    const lBtns='<button class="mode-btn '+(G.lgFilter==='all'?'active':'')+'" onclick="setLeague(\'all\')">الكل ('+TEAMS.length+')</button>'+LEAGUES.map(l=>'<button class="mode-btn '+(G.lgFilter===l.id?'active':'')+'" onclick="setLeague(\''+l.id+'\')">'+l.name+'</button>').join('');

    root.innerHTML='<div class="tv-shell"><div class="tv-header"><div><strong style="font-size:20px">نجوم الملاعب 2D — ليالي الرياض</strong> <span style="opacity:.7;font-size:12px">('+TEAMS.length+' فريقاً · 9 أطوار)</span><div style="opacity:.72;font-size:11px;margin-top:2px">'+GAME_INFO.description+'</div></div><div>رمز الغرفة: '+codeBadge+'</div></div><div class="tv-body"><div class="lobby-grid"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px"><h3 style="margin:0">اختر المود الخارق (9 أطوار 2D)</h3><div style="display:flex;gap:6px"><button class="mode-btn '+(G.puOn?'active':'')+'" onclick="G.puOn=!G.puOn;renderTv()">كرات القوى: '+(G.puOn?'مفعلة':'مطفأة')+'</button><button class="mode-btn '+(G.chaosOn?'rose':'')+'" onclick="G.chaosOn=!G.chaosOn;renderTv()">أحداث المجنونة: '+(G.chaosOn?'مفعلة':'مطفأة')+'</button></div></div><div class="chip-row">'+mBtns+'</div><div class="chip-row" style="margin-top:12px">'+lBtns+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"><div><label style="font-size:11px;opacity:.75">الفريق الأول</label><select class="sel" onchange="G.homeIdx=Number(this.value);renderTv();broadcastState()">'+opts.replace('value="'+G.homeIdx+'"','value="'+G.homeIdx+'" selected')+'</select></div><div><label style="font-size:11px;opacity:.75">الفريق الثاني</label><select class="sel" onchange="G.awayIdx=Number(this.value);renderTv();broadcastState()">'+opts.replace('value="'+G.awayIdx+'"','value="'+G.awayIdx+'" selected')+'</select></div></div><div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px"><div class="chip-row"><button class="mode-btn '+(G.diff==='easy'?'active':'')+'" onclick="G.diff=\'easy\';renderTv()">سهل</button><button class="mode-btn '+(G.diff==='balanced'?'active':'')+'" onclick="G.diff=\'balanced\';renderTv()">متوازن</button><button class="mode-btn '+(G.diff==='pro'?'active':'')+'" onclick="G.diff=\'pro\';renderTv()">محترف</button><button class="mode-btn '+(G.dur===90?'active':'')+'" onclick="G.dur=90;renderTv()">1:30</button><button class="mode-btn '+(G.dur===120?'active':'')+'" onclick="G.dur=120;renderTv()">2:00</button><button class="mode-btn '+(G.dur===180?'active':'')+'" onclick="G.dur=180;renderTv()">3:00</button></div><button class="btn btn-gold" onclick="startMatch()">ابدأ المباراة 2D</button></div></div><div class="panel"><h3 style="margin:0 0 10px">اللاعبون المتصلون ('+Object.keys(G.humans).length+')</h3>'+plist+'</div></div></div></div>';
  } else {
    const isFt=G.screen==='fulltime';
    root.innerHTML='<div class="tv-shell"><div class="tv-body"><div class="hud-actions"><button class="btn btn-dark btn-sm" onclick="G.cam=G.cam===\'full\'?\'close\':\'full\';renderTv()">'+(G.cam==='full'?'كاميرا قريبة':'ملعب كامل')+'</button><button class="btn btn-dark btn-sm" onclick="muted=!muted;renderTv()">'+(muted?'تشغيل الصوت':'كتم')+'</button><button class="btn btn-dark btn-sm" onclick="G.screen=\'lobby\';renderTv();broadcastState()">اللوبي</button></div><div class="hud-bar"><span>'+TEAMS[G.homeIdx].name+'</span><span id="hud-score" style="color:#ffd166;font-size:19px">'+G.score[0]+' - '+G.score[1]+'</span><span>'+TEAMS[G.awayIdx].name+'</span><span id="hud-clock" style="opacity:.8">'+(Math.floor(G.timeLeft/60)+':'+String(Math.floor(G.timeLeft%60)).padStart(2,'0'))+'</span></div><div class="chaos-wrap"><div id="chaos-pill" class="chaos-pill" style="display:'+(G.chaosText?'block':'none')+'">'+G.chaosText+'</div><div id="comm-pill" class="comm-pill" style="display:'+(G.comm?'block':'none')+'">'+G.comm+'</div></div><canvas id="stage2d"></canvas><div id="goal-ov" class="goal-overlay" style="display:none"><div class="goal-card"><div id="goal-txt" style="font-size:30px;font-weight:900;color:#ffd166">هدف!</div><div id="goal-sub" style="font-size:14px;font-weight:700;margin-top:4px"></div></div></div>'+(isFt?'<div class="ft-overlay"><div class="ft-card"><h2 style="margin:0 0 8px;color:#ffd166">صافرة النهاية</h2><div style="font-size:26px;font-weight:900">'+TEAMS[G.homeIdx].name+' '+G.score[0]+' - '+G.score[1]+' '+TEAMS[G.awayIdx].name+'</div><div class="stats-grid"><div><div style="opacity:.7">التسديدات</div><b>'+G.stats.sh[0]+' - '+G.stats.sh[1]+'</b></div><div><div style="opacity:.7">التمريرات</div><b>'+G.stats.pa[0]+' - '+G.stats.pa[1]+'</b></div><div><div style="opacity:.7">السوبر</div><b>'+G.stats.sup[0]+' - '+G.stats.sup[1]+'</b></div></div><div style="display:flex;gap:10px;justify-content:center"><button class="btn btn-gold" onclick="startMatch()">لعب مجدداً</button><button class="btn btn-dark" onclick="G.screen=\'lobby\';renderTv();broadcastState()">اللوبي الرئيسي</button></div></div></div>':'')+'</div></div>';
  }
}

function onHostMsg(c,data){
  if(!data||!data.t)return;
  if(data.t==='join'){
    const idx=Object.keys(G.humans).length,pal=COLORS[idx%COLORS.length];
    if(!G.humans[c.id]){
      G.humans[c.id]={id:c.id,name:data.name||('لاعب '+(idx+1)),team:(idx%2),color:pal.hex,colorName:pal.name,pid:null,isHost:idx===0,sup:55};
      inputs[c.id]={mx:0,my:0,sp:false,sh:false,shH:false,shR:false,pa:false,sw:false,tk:false,pu:false,sup:false};
      if(G.screen==='match'){
        const cand=G.players.find(p=>p.team===G.humans[c.id].team&&p.role!=='GK');
        G.humans[c.id].pid=cand?cand.id:null;
      }
      if(G.screen==='lobby')renderTv();
    }
    broadcastState();
  }else if(data.t==='ctl'){
    const inp=inputs[c.id]||(inputs[c.id]={mx:0,my:0,sp:false,sh:false,shH:false,shR:false,pa:false,sw:false,tk:false,pu:false,sup:false});
    if(data.mx!==undefined)inp.mx=data.mx;
    if(data.my!==undefined)inp.my=data.my;
    if(data.sp!==undefined)inp.sp=!!data.sp;
    if(data.btn==='shD'){inp.sh=true;inp.shH=true;}
    if(data.btn==='shU'){inp.shH=false;inp.shR=true;}
    if(data.btn==='pass')inp.pa=true;
    if(data.btn==='switch')inp.sw=true;
    if(data.btn==='tackle')inp.tk=true;
    if(data.btn==='punch')inp.pu=true;
    if(data.btn==='super')inp.sup=true;
  }else if(data.t==='cmd'){
    if(data.action==='start')startMatch();
    if(data.action==='lobby'){G.screen='lobby';renderTv();broadcastState();}
    if(data.action==='swapTeam'&&G.humans[c.id]){
      const h=G.humans[c.id];h.team=h.team===0?1:0;
      if(G.screen==='match'){const cand=G.players.find(p=>p.team===h.team&&p.role!=='GK');h.pid=cand?cand.id:null;}
      if(G.screen==='lobby')renderTv();
      broadcastState();
    }
  }
}

function onPlayerLeave(id){
  delete G.humans[id];delete inputs[id];
  if(G.screen==='lobby')renderTv();
  broadcastState();
}

let PH_STATE=null;
function startPhone(){
  ctlSend({t:'join',name:(EMB&&EMB.name)?EMB.name:''});
  renderPhone();
}
function onCtlMsg(data){
  if(!data)return;
  if(data.t==='state'){PH_STATE=data;renderPhone();}
}
function attachJoy(){
  const joy=document.getElementById('joy'),knob=document.getElementById('knob');
  if(!joy||!knob)return;
  let drag=false;
  const upd=(cx,cy)=>{
    const r=joy.getBoundingClientRect(),dx=cx-(r.left+r.width/2),dy=cy-(r.top+r.height/2),max=42,d=Math.hypot(dx,dy),s=d>max?max/d:1,x=dx*s,y=dy*s;
    knob.style.left=(41+x)+'px';knob.style.top=(41+y)+'px';
    ctlSend({t:'ctl',mx:Number((x/max).toFixed(2)),my:Number((y/max).toFixed(2))});
  };
  const reset=()=>{drag=false;knob.style.left='41px';knob.style.top='41px';ctlSend({t:'ctl',mx:0,my:0});};
  joy.onpointerdown=e=>{drag=true;joy.setPointerCapture(e.pointerId);upd(e.clientX,e.clientY);};
  joy.onpointermove=e=>{if(drag)upd(e.clientX,e.clientY);};
  joy.onpointerup=reset;joy.onpointercancel=reset;
}
function renderPhone(){
  const root=document.getElementById('root');
  if(!PH_STATE||!PH_STATE.me){
    root.innerHTML='<div class="card"><h3 style="margin:0 0 8px">نجوم الملاعب 2D — ليالي الرياض</h3><p style="margin:0;opacity:.8">جاري الاتصال بشاشة التلفزيون...</p></div>';
    return;
  }
  const me=PH_STATE.me,isBrawl=PH_STATE.mode==='brawl',supR=(me.sup||0)>=100;
  const puInfo=me.pu?PU_LIST.find(x=>x.kind===me.pu):null;
  if(!document.getElementById('joy')){
    root.innerHTML='<div class="ph-wrap"><div class="ph-top"><span id="ph-info"></span><span id="ph-score"></span><div style="display:flex;gap:6px"><button class="btn btn-dark btn-sm" onclick="ctlSend({t:\'cmd\',action:\'swapTeam\'})">تبديل الفريق</button><span id="ph-host"></span></div></div><div class="ph-pad"><div class="joy-base" id="joy"><div class="joy-knob" id="knob"></div></div><div style="display:flex;flex-direction:column;gap:7px;align-items:center"><button class="pad-btn pad-sprint" style="width:88px;height:36px" ontouchstart="ctlSend({t:\'ctl\',sp:1})" ontouchend="ctlSend({t:\'ctl\',sp:0})" onmousedown="ctlSend({t:\'ctl\',sp:1})" onmouseup="ctlSend({t:\'ctl\',sp:0})">سرعة (R2)</button><button id="ph-sup" class="pad-btn" style="width:92px;height:40px" onclick="ctlSend({t:\'ctl\',btn:\'super\'})"></button><button id="ph-punch" class="pad-btn pad-punch" style="width:88px;height:36px;display:none" onclick="ctlSend({t:\'ctl\',btn:\'punch\'})">ضرب!</button></div><div class="ab-grid"><button class="pad-btn pad-switch" style="grid-column:2;grid-row:1" onclick="ctlSend({t:\'ctl\',btn:\'switch\'})">تبديل</button><button class="pad-btn pad-pass" style="grid-column:1;grid-row:2" onclick="ctlSend({t:\'ctl\',btn:\'pass\'})">ناوِل</button><button class="pad-btn pad-tackle" style="grid-column:3;grid-row:2" onclick="ctlSend({t:\'ctl\',btn:\'tackle\'})">تقطيع</button><button class="pad-btn pad-shoot" style="grid-column:2;grid-row:3" ontouchstart="ctlSend({t:\'ctl\',btn:\'shD\'})" ontouchend="ctlSend({t:\'ctl\',btn:\'shU\'})" onmousedown="ctlSend({t:\'ctl\',btn:\'shD\'})" onmouseup="ctlSend({t:\'ctl\',btn:\'shU\'})">شوت</button></div></div></div>';
    attachJoy();
  }
  const info=document.getElementById('ph-info'),sc=document.getElementById('ph-score'),hostEl=document.getElementById('ph-host'),supEl=document.getElementById('ph-sup'),punEl=document.getElementById('ph-punch');
  if(info)info.innerHTML='<span class="color-dot" style="background:'+me.color+'"></span> '+((EMB&&EMB.name)||'')+' ('+me.colorName+')'+(puInfo?' · '+puInfo.lbl:'');
  if(sc)sc.textContent=PH_STATE.home+' '+PH_STATE.score[0]+' - '+PH_STATE.score[1]+' '+PH_STATE.away;
  if(hostEl)hostEl.innerHTML=me.isHost?(PH_STATE.screen!=='match'?'<button class="btn btn-gold btn-sm" onclick="ctlSend({t:\'cmd\',action:\'start\'})">ابدأ</button>':'<button class="btn btn-dark btn-sm" onclick="ctlSend({t:\'cmd\',action:\'lobby\'})">اللوبي</button>'):'';
  if(supEl){supEl.textContent=supR?'سوبر 🔥 جاهز!':'سوبر '+me.sup+'%';supEl.className='pad-btn '+(supR?'pad-super':'');}
  if(punEl)punEl.style.display=isBrawl?'flex':'none';
}
function ctlSend(obj){ try{parent.postMessage({__emb:1,data:obj},'*')}catch(e){} }
</script>
