<style>
  html,body{margin:0;padding:0;background:#05070c;overflow:hidden;width:100%;height:100%;font-family:'Tajawal',Arial,Helvetica,sans-serif;color:#fff}
  #c{position:absolute;top:0;left:0;width:100%;height:100%;display:block}

  #phRoot{position:absolute;inset:0;display:none;background:radial-gradient(ellipse at 50% -10%,#2a1b4d 0%,#190d26 55%,#0d0714 100%)}
  #role.card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;
    background:#190d26;color:#ffd166;font-family:'Tajawal',Arial,sans-serif;font-size:18px}
  .hud{position:absolute;top:0;left:0;width:100%;padding:16px 24px;display:flex;justify-content:space-between;pointer-events:none;z-index:4;font-size:26px;font-weight:bold;text-shadow:0 2px 6px #000}

  #timer{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:26px;font-weight:bold;text-shadow:0 2px 6px #000;z-index:4}
  /* main menu */
  #menu{flex-direction:column;align-items:center;justify-content:center;position:absolute;inset:0;overflow:hidden;
    background:radial-gradient(ellipse at 50% -10%,#1c2c55 0%,#070b18 55%,#020309 100%)}
  .menu-stars{position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(2px 2px at 10% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 80% 15%,#fff,transparent),
      radial-gradient(2px 2px at 30% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 65% 55%,#fff,transparent),
      radial-gradient(2px 2px at 90% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 45% 35%,#fff,transparent),
      radial-gradient(1.5px 1.5px at 15% 85%,#fff,transparent);
    background-repeat:no-repeat;opacity:.55;animation:twinkle 3.5s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.25}to{opacity:.65}}
  @keyframes titleGlow{0%,100%{filter:drop-shadow(0 0 16px #3aa3ff99)}50%{filter:drop-shadow(0 0 26px #ff4d4d99)}}
  #menu h1{font-size:58px;letter-spacing:5px;margin-bottom:6px;z-index:1;

  #menu .sub{opacity:.65;margin-bottom:34px;z-index:1;font-size:14px;letter-spacing:1px}
  .menuCarStage{width:360px;height:220px;position:relative;z-index:1;overflow:hidden;margin-bottom:8px}
  .menu-list{display:flex;flex-direction:column;gap:12px;min-width:340px;z-index:1}
  .mitem{padding:16px 22px;background:linear-gradient(135deg,#131a2c,#0c111d);border:2px solid #ffffff14;border-radius:14px;
    font-size:20px;display:flex;justify-content:space-between;align-items:center;gap:14px;transition:all .15s ease}
  .mitem .ic{font-size:22px;filter:drop-shadow(0 0 4px #0008)}
  .mitem.sel{border-color:#3aa3ff;background:linear-gradient(135deg,#1c2a48,#15203a);box-shadow:0 0 24px #3aa3ff55,inset 0 0 18px #3aa3ff22;transform:scale(1.03)}
  /* quality menu */

  @keyframes spin{from{transform:translate(-50%,-50%) rotateX(70deg) rotateZ(0)}to{transform:translate(-50%,-50%) rotateX(70deg) rotateZ(360deg)}}
  #carCanvasWrap{position:absolute;inset:0}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
/* ===================== EMB BRIDGE (لا تغيّر هذا الجزء) ===================== */
let EMB=null; const embHostConns={};
window.addEventListener('message', e=>{
  const m=e&&e.data; if(!m||!m.__emb) return;
  if(m.init){ EMB={role:m.role,code:m.code,name:m.name}; return embStart(); }
  if(!EMB) return;
  if(EMB.role==='tv'){
    if(m.event==='data'){
      let c=embHostConns[m.id];
      if(!c)c=embHostConns[m.id]={id:m.id,send:obj=>{try{parent.postMessage({__emb:1,to:m.id,data:obj},'*')}catch(e){}}};
      try{onHostMsg(c,m.data)}catch(e){}
    } else if(m.event==='disconnect'){
      try{onPlayerLeave(m.id)}catch(e){}
      delete embHostConns[m.id];
    }
  } else if(EMB.role==='ph'){
    if(m.data!==undefined){try{onCtlMsg(m.data)}catch(e){}}
  }
});
function embReveal(){try{document.documentElement.classList.remove('emb-pending')}catch(e){}}
function embStart(){
  embReveal();
  if(EMB.role==='tv'){ startTv(); } else { startPhone(); }
}
setTimeout(()=>{ if(!EMB) embReveal(); }, 2500);

/* ===================== من هنا تبدأ اللعبة =====================
   Input/Input2 are the exact same control objects the rest of this
   file (stepCar/handleMenuInput/tick) already reads from — only now
   they're filled from phone messages over the EMB bridge instead of
   a local gamepad/keyboard, so none of the driving/menu logic below
   had to change. P1 (the room host's phone) drives Input + menu nav;
   P2 (a second phone, only once "DoubleBoost" is opened) drives
   Input2 and gets its own car + camera in a split-screen view. */
const Input = {steer:0,throttle:0,jump:false,boost:false,drift:false,pitch:0,yaw:0,roll:0,cameraToggle:false,pause:false};
const Input2 = {steer:0,throttle:0,jump:false,boost:false,drift:false,pitch:0,yaw:0,roll:0};
const MenuEdge = {up:false,down:false,left:false,right:false,select:false,back:false};
let P1=null, P2=null; // embHostConns ids of the two connected phones

function startTv(){
  document.getElementById('root').style.display='none';
  document.getElementById('tvRoot').style.display='block';
  bootGame();
  // room code + credit badge — the 4-digit code is already assigned and
  // handed to the game by the ليالي الرياض host app itself (EMB.code);
  // this just displays it, it isn't generated here
  const badge=document.createElement('div');
  badge.style.cssText='position:absolute;top:14px;right:18px;z-index:6;text-align:left;font-family:Tajawal,Arial,sans-serif;'+
    'background:#190d26cc;border:1px solid #ffd16655;border-radius:12px;padding:8px 14px;font-size:13px;color:#ffd166';
  badge.innerHTML = `كود الغرفة: <b style="font-size:16px;letter-spacing:2px">${EMB.code||'----'}</b>`+
    `<div style="font-size:10px;color:#ffffffaa;margin-top:3px">ليالي الرياض</div>`;
  document.getElementById('tvRoot').appendChild(badge);
  setInterval(broadcastState, 150);
}

function onHostMsg(c, data){
  // first message from a new connection assigns its role
  if(P1===null){ P1=c.id; c.send({t:'role', role:'P1'}); document.getElementById('noSignal').style.display='none'; }
  else if(P2===null && App.doubleBoostOpen && c.id!==P1){ P2=c.id; grantP2(); c.send({t:'role', role:'P2'}); }
  else if(c.id!==P1 && c.id!==P2){ c.send({t:'role', role:'spectator'}); return; }

  const role = c.id===P1 ? 'P1' : (c.id===P2 ? 'P2' : null);
  if(!role) return;
  if(data.t==='drive'){
    // normally applied straight to TV's own Input/Input2. In phone-processing
    // mode, P1's phone is simulating locally and already applied its own
    // drive to its own Input directly — this copy on TV is only used for the
    // camera/pause reads below, so it's harmless. P2's drive still has to be
    // relayed onward to P1's phone, since that's the device actually running
    // physics for P2's car now.
    const target = role==='P1' ? Input : Input2;
    ['steer','throttle','jump','boost','drift','pitch','yaw','roll'].forEach(k=>{ if(k in data) target[k]=data[k]; });
    if(role==='P2' && App.processing==='phone' && P1!==null && embHostConns[P1]){
      embHostConns[P1].send({t:'relayInput', patch:data});
    }
  } else if(data.t==='sim' && role==='P1' && App.processing==='phone'){
    applyRemoteSimState(data);
  } else if(role==='P1'){
    if(data.t==='nav') MenuEdge[data.dir]=true;
    else if(data.t==='select') MenuEdge.select=true;
    else if(data.t==='back') MenuEdge.back=true;
    else if(data.t==='camToggle') Input.cameraToggle = !Input.cameraToggle;
    else if(data.t==='pause') Input.pause=true;
    else if(data.t==='doubleBoost'){
      if(App.screen==='menu'){ App.doubleBoostOpen = !App.doubleBoostOpen; if(App.doubleBoostOpen) App.teamB=Math.max(2,App.teamB); renderMainMenu(); }
    } else if(data.t==='setProcessing'){
      if(App.screen==='menu'){ App.processing = App.processing==='tv'?'phone':'tv'; renderMainMenu(); }
    }
  }
}
// applies a physics snapshot that P1's phone computed, directly onto TV's own
// car meshes/ball/score/timer — TV does zero physics of its own in this mode,
// it's purely drawing whatever it was just told
// the phone that is simulating also renders its own frames and ships a
// compressed still image each one (see sendSimState on the phone side) —
// the TV never runs its own physics or its own 3D render while this is
// active, it only drops the received image into the <img> that covers the
// screen and keeps the score/timer text in sync
function applyRemoteSimState(data){
  if(data.img){
    const si=document.getElementById('streamImg');
    if(si){ si.src=data.img; si.style.display='block'; }
  }
  if(data.s){ score.B=data.s[0]; score.R=data.s[1]; updateScoreUI(); }
  if(data.tm!=null){ matchTime=data.tm; document.getElementById('timer').textContent=fmtTime(matchTime); }
  if(data.ended && matchRunning){ matchRunning=false; endMatch(); }
}
function hideStream(){ const si=document.getElementById('streamImg'); if(si) si.style.display='none'; }
function onPlayerLeave(id){
  if(id===P1){
    P1=null; Input.steer=Input.throttle=0; Input.jump=Input.boost=Input.drift=false; if(players[0]) players[0].human=false;
    if(App.processing==='phone'){ App.processing='tv'; hideStream(); if(App.screen==='menu') renderMainMenu(); } // the phone that was simulating+rendering just left — fall back to the TV doing both itself from wherever things were
    if(P2===null) document.getElementById('noSignal').style.display='flex'; // no player connected at all anymore — back to "no display" until someone joins again
  }
  if(id===P2){ P2=null; Input2.steer=Input2.throttle=0; Input2.jump=Input2.boost=Input2.drift=false; if(players[1]) players[1].human=false; splitActive=false; resize(); }
}
function grantP2(){ if(players[1]) players[1].human=true; splitActive=true; resize(); }
function broadcastState(){
  Object.keys(embHostConns).forEach(id=>{
    const c=embHostConns[id];
    const role = id===P1?'P1':(id===P2?'P2':'spectator');
    const myBoost = role==='P1'? (players[0]&&players[0].boost) : role==='P2'? (players[1]&&players[1].boost) : 0;
    c.send({t:'state', role, screen:App.screen, doubleBoostOpen:!!App.doubleBoostOpen, hasP2:P2!==null, processing:App.processing,
      scoreB:score.B, scoreR:score.R, time:Math.ceil(matchTime||0), boost:Math.round(myBoost||0)});
  });
}

/* ---- phone side ---- */
function startPhone(){
  document.getElementById('root').style.display='none';
  const ph=document.getElementById('phRoot'); ph.style.display='block';
  buildPhoneUI(ph);
  // announce this phone over the SAME existing channel right away, instead
  // of waiting for the player's first touch — onHostMsg assigns a role to
  // the very first message it ever sees from a connection, whatever that
  // message is, so this just makes that happen immediately. Without it, the
  // TV has no way to know this phone exists (and stays on "لا يوجد عرض")
  // until someone happens to touch a control.
  ctlSend({t:'hello'});
}
function onCtlMsg(data){
  if(data.t==='role'){ PhRole=data.role; renderPhoneUI(); }
  else if(data.t==='state'){ PhState=data; renderPhoneUI(); }
  else if(data.t==='matchStart'){ startLocalSim(data); }
  else if(data.t==='relayInput'){ Object.assign(Input2, data.patch||{}); } // P2's drive, forwarded here because this phone is doing the physics now
}
function ctlSend(obj){ try{parent.postMessage({__emb:1,data:obj},'*')}catch(e){} }

/* ---- phone-side physics + rendering (only runs when App.processing==='phone'
   AND this phone is P1). Reuses the exact same buildMatch/stepCar/aiThink/
   stepBall/updateCamera functions the TV itself uses — both tv and ph load
   the identical file, so this phone already has a full copy of the
   arena/scene/renderer sitting in memory; normally it's just never stepped
   or drawn (tvRoot stays display:none while the phone shows its own
   controller UI). Here it steps it, renders it to that same hidden canvas,
   and ships a small compressed still image each frame — the TV applies it
   with zero physics or 3D rendering of its own. ---- */
let simLoopRunning=false;
// this phone renders into the exact same (otherwise-invisible) canvas/scene
// the TV itself uses, just fixed at a small streaming size — that render
// target has nothing to do with this phone's own screen size, so the TV's
// aspect ratio is kept no matter what shape phone is running the match
const STREAM_W=1920, STREAM_H=1080, STREAM_QUALITY=0.6, STREAM_EVERY=6; // 1080p — heavier per frame, so the rate is eased back to ~10fps to keep each packet from backing up
function applyStreamRenderSize(){
  renderer.setSize(STREAM_W, STREAM_H, false);
  cam.aspect = STREAM_W/STREAM_H; cam.updateProjectionMatrix();
  if(cam2){ cam2.aspect = STREAM_W/(STREAM_H/2); cam2.updateProjectionMatrix(); }
}
function startLocalSim(data){
  App.teamB=data.teamB; App.teamR=data.teamR; App.carIndex=data.carIndex; App.matchMin=data.matchMin;
  P2 = data.hasP2 ? 'remote' : null; // reused purely as a truthy flag so buildMatch()'s human-car check matches TV's
  buildMatch(); resetKickoff(); score={B:0,R:0}; matchTime=App.matchMin*60; matchRunning=true;
  applyStreamRenderSize(); // buildMatch() calls resize(), which sizes the canvas to THIS phone's own window — override it right after
  streamFrameCounter=0;
  if(!simLoopRunning){ simLoopRunning=true; requestAnimationFrame(phoneSimTick); }
}
function phoneSimTick(){
  requestAnimationFrame(phoneSimTick);
  if(App.processing!=='phone' || !matchRunning) return;
  matchTime -= 1/60;
  let ended=false;
  if(matchTime<=0){ matchTime=0; matchRunning=false; ended=true; }
  players.forEach((p,i)=>{
    if(p.human){ stepCar(p, i===0?Input:Input2, 1); }
    else { const allies=players.filter(q=>q.team===p.team); aiThink(p, 1, allies, players.filter(q=>q.team!==p.team)); }
  });
  for(let i=0;i<players.length;i++) for(let j=i+1;j<players.length;j++){
    const a=players[i], b=players[j];
    const dx=b.mesh.position.x-a.mesh.position.x, dz=b.mesh.position.z-a.mesh.position.z;
    const dist=Math.hypot(dx,dz), minDist=95;
    if(dist>0 && dist<minDist){
      const push=(minDist-dist)/2, nx=dx/dist, nz=dz/dist;
      a.mesh.position.x-=nx*push; a.mesh.position.z-=nz*push;
      b.mesh.position.x+=nx*push; b.mesh.position.z+=nz*push;
      a.speed*=0.8; b.speed*=0.8;
    }
  }
  stepBall(1);
  updateCamera(); // every physics tick, so the camera stays smooth even though the rendered/sent frame is throttled below
  sendSimState(ended);
}
// physics/camera run at full 60Hz above; the actual render+encode+send is
// throttled to STREAM_EVERY ticks (~15fps) — that's the expensive part
// (GPU render + JPEG encode + a bigger postMessage payload), so it's kept
// off the hot path. Still just one small base64 image per packet, never a
// video codec or a real video stream.
let streamFrameCounter=0;
function sendSimState(ended){
  streamFrameCounter++;
  if(streamFrameCounter<STREAM_EVERY && !ended){ return; }
  streamFrameCounter=0;
  let img=null;
  try{
    if(splitActive && players[1]){
      renderer.setScissorTest(true);
      const half=Math.floor(STREAM_H/2);
      renderer.setViewport(0, half, STREAM_W, STREAM_H-half); renderer.setScissor(0, half, STREAM_W, STREAM_H-half); renderer.render(scene, cam);
      renderer.setViewport(0, 0, STREAM_W, half); renderer.setScissor(0, 0, STREAM_W, half); renderer.render(scene, cam2);
      renderer.setScissorTest(false);
      renderer.setViewport(0,0,STREAM_W,STREAM_H);
    } else {
      renderer.render(scene, cam);
    }
    img = canvas.toDataURL('image/jpeg', STREAM_QUALITY);
  } catch(e){ /* frame capture can fail on some mobile browsers — just skip that one frame, score/timer still arrive */ }
  ctlSend({t:'sim', img, s:[score.B,score.R], tm:Math.ceil(matchTime), ended:!!ended});
}
// every 'drive' control P1 sends also gets applied to THIS phone's own Input
// immediately (zero network round-trip) whenever this phone is the one doing
// the simulating — it still sends to TV too, for the camera/pause reads there
function sendDrive(patch){
  ctlSend({t:'drive', ...patch});
  if(App.processing==='phone' && PhRole==='P1') Object.assign(Input, patch);
}

/* ===================== PHONE CONTROLLER UI ===================== */
let PhRole=null, PhState=null;
function buildPhoneUI(root){
  const style=document.createElement('style'); style.textContent=`
    #phRoot{font-family:'Tajawal',Arial,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
    #phStatus{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:14px;opacity:.85;padding:0 20px}
    #phDouble{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);padding:16px 30px;border-radius:16px;
      background:linear-gradient(135deg,#ffd166,#ff9a3d);color:#190d26;font-weight:bold;font-size:20px;font-family:Arial,sans-serif;
      letter-spacing:.5px;box-shadow:0 6px 24px #ff9a3d55}
    #phProc{position:absolute;top:60%;left:50%;transform:translate(-50%,-50%);padding:12px 26px;border-radius:14px;
      background:#ffffff14;border:2px solid #ffffff33;color:#fff;font-weight:bold;font-size:15px;text-align:center;line-height:1.5}
    #phWaiting{position:absolute;top:76%;left:50%;transform:translate(-50%,-50%);text-align:center;font-size:14px;opacity:.8;padding:0 30px}
    .pt{position:absolute;touch-action:none;-webkit-user-select:none}
    .pt-joyBase{left:22px;bottom:24px;width:140px;height:140px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff33}
    .pt-joyKnob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;background:#ffd16655;border:2px solid #ffd166aa}
    .pt-btn{width:68px;height:68px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff33;display:flex;align-items:center;justify-content:center;
      font-size:13px;color:#fff;font-weight:bold}
    .pt-btn:active{background:#ffd16655;border-color:#ffd166}
    .pt-nav{left:50%;bottom:30px;transform:translateX(-50%);display:flex;gap:10px}
    /* gamepad-style diamond of 4 shape buttons (generic shapes/colors — an

const BALL_R = 91.25;
function ballTexture(){
  const cv=document.createElement('canvas'); cv.width=512; cv.height=256; const ctx=cv.getContext('2d');
  ctx.fillStyle='#f2f2f2'; ctx.fillRect(0,0,512,256);
  ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=3;
  for(let x=0;x<=512;x+=64){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,256); ctx.stroke(); }
  for(let y=0;y<=256;y+=64){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(512,y); ctx.stroke(); }
  ctx.fillStyle='#1c1c1c';
  for(let x=32;x<512;x+=64) for(let y=32;y<256;y+=64){ if(((x+y)/64)%2===0){ ctx.beginPath(); ctx.arc(x,y,16,0,7); ctx.fill(); } }
  return new THREE.CanvasTexture(cv);
}

/* -------- Rounded-box geometry: a flat Shape with quadratic-curved corners,
   extruded with a bevel on both ends. This is what turns the car's panels
   from flat cubes into smoothly curved, real-looking body panels. -------- */
function roundedBoxGeo(width, height, depth, radius, seg){
  radius = Math.max(0.05, Math.min(radius, width/2-0.1, height/2-0.1, depth/2-0.1));
  const w=width/2-radius, h=height/2-radius;
  const shape = new THREE.Shape();
  shape.moveTo(-w,-height/2);
  shape.lineTo(w,-height/2);
  shape.quadraticCurveTo(width/2,-height/2, width/2,-h);
  shape.lineTo(width/2,h);
  shape.quadraticCurveTo(width/2,height/2, w,height/2);
  shape.lineTo(-w,height/2);
  shape.quadraticCurveTo(-width/2,height/2, -width/2,h);
  shape.lineTo(-width/2,-h);
  shape.quadraticCurveTo(-width/2,-height/2, -w,-height/2);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: Math.max(0.05, depth-radius*2), bevelEnabled:true,
    bevelThickness:radius, bevelSize:radius, bevelSegments:seg||4, curveSegments:seg||4, steps:1
  });
  geo.center();
  return geo;
}

/* ============================ PHYSICS ============================
   Custom arcade car-soccer physics constants, converted to this engine's
   per-frame (~60fps) convention. Tuned for a responsive arcade feel. */
const CAR_MAXSPD=23.5, CAR_BOOSTSPD=38.3, CAR_ACC=.7, BOOST_ACCEL=.32, AIR_BOOST_ACCEL=.52,
      CAR_TURN=.072, GRAV=-0.1806, JUMPV=6.4, BOOST_DRAIN=.555;
const BOUND_X=FIELD_W/2-230, BOUND_Z=FIELD_L/2-260;

function stepCar(p, inp, dt){
  if(p.grounded){
    const maxS = inp.boost && p.boost>0 ? CAR_BOOSTSPD : CAR_MAXSPD;
    p.speed += inp.throttle*CAR_ACC + (inp.boost&&p.boost>0? BOOST_ACCEL:0);
    p.speed = Math.max(-CAR_MAXSPD*0.6, Math.min(maxS, p.speed));
    p.speed *= 0.985;
    const turnScale = inp.drift? 1.6 : 1.0;
    p.yaw -= inp.steer * CAR_TURN * turnScale * (0.3+Math.min(1,Math.abs(p.speed)/8));
    if(inp.boost && p.boost>0){ p.boost = Math.max(0,p.boost-BOOST_DRAIN); }
    p.mesh.rotation.y = p.yaw;
    p.mesh.position.x += Math.sin(p.yaw)*p.speed;
    p.mesh.position.z += Math.cos(p.yaw)*p.speed;
    // suspension feel: lean into turns, nose dips under throttle/brake
    const bankTarget = -inp.steer*0.16*Math.min(1,Math.abs(p.speed)/14);
    const pitchTarget = -inp.throttle*0.05;
    p.mesh.rotation.z += (bankTarget-p.mesh.rotation.z)*0.18;
    p.mesh.rotation.x += (pitchTarget-p.mesh.rotation.x)*0.18;
    if(inp.jump && !p.jumpHeld && p.jumpsLeft>0){
      p.vel.x = Math.sin(p.yaw)*p.speed; p.vel.z = Math.cos(p.yaw)*p.speed; // carry grounded momentum into the air
      p.vel.y = JUMPV; p.grounded=false; p.jumpsLeft--; p.jumpHeld=true; p.jumpHoldFrames=0;
    }
    if(!inp.jump) p.jumpHeld=false;
  } else {
    // variable jump height: holding jump (up to ~0.2s) adds extra lift on top of the
    // initial tap, so a quick tap gives a short hop and a held jump goes much higher
    if(inp.jump && p.jumpsLeft===1 && p.jumpHoldFrames<12){ p.vel.y += 0.5; p.jumpHoldFrames++; }
    // full 360° free rotation while airborne — roll fastest, yaw medium, pitch slowest
    const q = new THREE.Quaternion();
    q.setFromEuler(new THREE.Euler(inp.pitch*0.12, inp.yaw*0.15, -inp.roll*0.18));
    p.mesh.quaternion.multiply(q);
    if(inp.boost && p.boost>0){
      const fwd = new THREE.Vector3(0,0,1).applyQuaternion(p.mesh.quaternion);
      p.vel.addScaledVector(fwd, AIR_BOOST_ACCEL); p.boost=Math.max(0,p.boost-BOOST_DRAIN);
    }
    // second jump: a direction held at the instant of the press triggers a
    // flip/dodge — a strong impulse in that direction ADDED on top of whatever
    // momentum the car already had (not replacing it), plus a fast visual flip.
    // No direction held = a plain vertical double jump instead.
    if(inp.jump && !p.jumpHeld && p.jumpsLeft>0){
      const hasDir = Math.abs(inp.steer)>0.3 || Math.abs(inp.throttle)>0.3;
      if(hasDir){
        const dirLocal = new THREE.Vector3(inp.steer,0,inp.throttle).normalize();
        const dirWorld = dirLocal.applyQuaternion(p.mesh.quaternion);
        p.vel.addScaledVector(dirWorld, 24);
        p.vel.y = Math.max(p.vel.y, 2);
        p.flipSpin = {axis:new THREE.Vector3(-inp.throttle,0,inp.steer).normalize(), time:10};
      } else {
        p.vel.y = JUMPV*0.95;
      }
      p.jumpsLeft--; p.jumpHeld=true;
    }
    if(!inp.jump) p.jumpHeld=false;
    if(p.flipSpin && p.flipSpin.time>0){
      const fq=new THREE.Quaternion().setFromAxisAngle(p.flipSpin.axis, 0.55);
      p.mesh.quaternion.multiply(fq); p.flipSpin.time--;
    }
    p.vel.y += GRAV;
    p.mesh.position.addScaledVector(p.vel,1);
    if(p.mesh.position.y<=0){
      p.mesh.position.y=0; p.grounded=true; p.vel.set(0,0,0); p.jumpsLeft=2; p.jumpHeld=false; p.jumpHoldFrames=0; p.flipSpin=null; p.squash=1;
      p.mesh.quaternion.setFromEuler(new THREE.Euler(0,p.yaw,0));
    }
  }
  if(p.grounded) p.mesh.position.y = 0;
  p.boost = Math.min(100, p.boost + (p.grounded? 0.1:0)); // slow passive regen — arcade convenience, boost pads aren't modeled yet
  const preX=p.mesh.position.x, preZ=p.mesh.position.z;
  p.mesh.position.x = Math.max(-BOUND_X, Math.min(BOUND_X, p.mesh.position.x));
  p.mesh.position.z = Math.max(-BOUND_Z, Math.min(BOUND_Z, p.mesh.position.z));
  // also clamp against the angled corner walls — a plain box clamp lets a car
  // slide into the cut-off corner pocket, which is exactly where cars used to
  // get visually wedged against the angled wall mesh with nowhere to go
  const cornerLimit = (BOUND_X+BOUND_Z) - CORNER*1.15;
  if(Math.abs(p.mesh.position.x)+Math.abs(p.mesh.position.z) > cornerLimit){
    const k = cornerLimit/(Math.abs(p.mesh.position.x)+Math.abs(p.mesh.position.z));
    p.mesh.position.x*=k; p.mesh.position.z*=k;
  }
  if(preX!==p.mesh.position.x || preZ!==p.mesh.position.z){ p.speed*=0.45; p.vel.x*=0.3; p.vel.z*=0.3; } // an actual impact, not a silent slide along the wall
  if(p.shadowMesh){
    p.shadowMesh.position.set(p.mesh.position.x,0.8,p.mesh.position.z);
    const h = Math.max(0,p.mesh.position.y);
    const s = Math.max(0.35, 1-h/500);
    p.shadowMesh.scale.setScalar(s); p.shadowMesh.material.opacity = 0.4*s;
  }
  const boosting = inp.boost && p.boost>0;
  const flicker = boosting ? 0.6+Math.random()*0.3 : 0;
  p.mesh.userData.boostCone.material.opacity = flicker;
  p.mesh.userData.boostInner.material.opacity = boosting ? 0.8+Math.random()*0.2 : 0;
  p.mesh.userData.wheels.forEach(w=> w.rotation.x -= p.speed*0.6);
  // landing squash — a quick stocky compression that eases back out
  p.squash *= 0.82;
  const sq = p.squash*0.3;
  p.mesh.scale.set(1.84*(1+sq), 1.84*(1-sq*1.4), 1.84*(1+sq));
}

// Keep AI targets (and the escape logic below) inside the real drivable
// octagon, not just the X/Z bounding box — the arena's corners are angled,
// so a plain rectangular clamp can hand a bot a "safe" target that is
// actually past the angled wall, which is what sent bots straight into the
// corners and left them grinding there.
function clampToField(x, z, margin){
  const bx=BOUND_X-margin, bz=BOUND_Z-margin;
  x = Math.max(-bx, Math.min(bx, x));
  z = Math.max(-bz, Math.min(bz, z));
  const cornerLimit = (bx+bz) - (CORNER*1.15); // stay short of the chamfer line
  if(Math.abs(x)+Math.abs(z) > cornerLimit){
    const k = cornerLimit/(Math.abs(x)+Math.abs(z));
    x*=k; z*=k;
  }
  return {x,z};
}

function aiThink(p, dt, allies, foes){
  p.aiTimer -= dt;
  // use the flat ground distance (ignore height) for all steering/role
  // decisions — once a hit pops the ball into the air, the FULL 3d distance
  // (including the height gap) spikes even though the bot is still sitting
  // right under it, which used to read as "ball is far away" and send the
  // bot that just touched it peeling off/circling away like it was fleeing.
  const dist = Math.hypot(ballPos.x-p.mesh.position.x, ballPos.z-p.mesh.position.z);
  const out = {steer:0,throttle:0,jump:false,boost:false,drift:false,pitch:0,yaw:0,roll:0};
  const oppGoalZ = p.team==='B'? FIELD_L/2 : -FIELD_L/2;
  const px=p.mesh.position.x, pz=p.mesh.position.z;
  const toCenterAng = Math.atan2(-px,-pz);
  const edgeDist = Math.min(BOUND_X-Math.abs(px), BOUND_Z-Math.abs(pz), ((BOUND_X+BOUND_Z)-(Math.abs(px)+Math.abs(pz)))*0.7);

  // ---- stuck detection: if a bot hasn't actually covered ground while it
  // was trying to drive, force a short, deliberate reverse so it can never
  // sit grinding against a wall or a stuck teammate forever. Checked often
  // and recovers fast, so a freeze never lasts more than a fraction of a
  // second before it tries backing out. ----
  p.stuckCheckTimer = (p.stuckCheckTimer||30) - 1;
  if(p.stuckCheckTimer<=0){
    const moved = p.mesh.position.distanceTo(p.stuckPos);
    if(moved < 70 && p.grounded && p.aiState!=='unstuck'){ p.aiState='unstuck'; p.aiTimer=26; }
    p.stuckPos.copy(p.mesh.position); p.stuckCheckTimer=30;
  }
  if(p.aiState==='unstuck'){
    // straight reverse, with a small constant steer bias so it doesn't just
    // back up and down in a perfectly straight dead-end line
    out.throttle=-1; out.steer=(px>0?-1:1)*0.4; out.boost=false; out.jump=false;
    stepCar(p, out, dt);
    if(p.aiTimer<=0) p.aiState='chase';
    return;
  }

  // ---- role: chase the ball, or hang back in support if a teammate is
  // already on it. Switched with a minimum dwell time (hysteresis) so a
  // bot can't flip-flop between the two targets every frame and end up
  // steering nowhere in particular near a wall. ----
  p.aiRoleTimer = (p.aiRoleTimer||0) - 1;
  const allyOnBall = allies.some(a=> a!==p && Math.hypot(ballPos.x-a.mesh.position.x, ballPos.z-a.mesh.position.z) < 260);
  if(p.aiRoleTimer<=0){
    const wantRole = (allyOnBall && dist>330) ? 'support' : 'chase';
    if(wantRole !== p.aiRole){ p.aiRole = wantRole; p.aiRoleTimer = 40; }
  }

  let targetX, targetZ;
  if(p.aiRole==='support'){
    targetX = ballPos.x*0.3;
    targetZ = ballPos.z + (p.team==='B'? -500 : 500);
  } else {
    // line up a real shot: approach from the side of the ball away from the
    // opponent's goal, so driving into the ball actually sends it goal-ward
    let ax = ballPos.x, az = ballPos.z - oppGoalZ;
    const alen = Math.hypot(ax,az) || 1;
    ax/=alen; az/=alen;
    const behind = dist>160 ? 130 : 0; // once close enough, go straight for it instead of circling
    targetX = ballPos.x + ax*behind;
    targetZ = ballPos.z + az*behind;
  }
  // hard safety net: whatever the approach math above comes up with, never
  // let the actual target stray far from where the ball really is — this is
  // what stops a bot from ever committing to a distant point near a goal
  // wall while the ball sits somewhere completely different on the pitch
  const MAXLEAD=500;
  targetX = ballPos.x + Math.max(-MAXLEAD, Math.min(MAXLEAD, targetX-ballPos.x));
  targetZ = ballPos.z + Math.max(-MAXLEAD, Math.min(MAXLEAD, targetZ-ballPos.z));
  const clamped = clampToField(targetX, targetZ, 150);
  targetX = clamped.x; targetZ = clamped.z;
  const dx = targetX - px, dz = targetZ - pz;
  const ang = Math.atan2(dx,dz);
  let diff = ang - p.yaw; while(diff>Math.PI) diff-=2*Math.PI; while(diff<-Math.PI) diff+=2*Math.PI;

  // full human-like move set: reverse when the target is almost directly
  // behind (a human wouldn't spin 180° in place either), jump for a ball
  // that's up in the air right overhead, boost to close distance when clear.
  // Switching forward<->reverse uses two different thresholds (hysteresis):
  // without that gap, a diff value sitting right near one cutoff flickers
  // between forward and reverse every frame instead of committing to one.
  const wasReversing = p.aiReversing===true;
  const facingAway = wasReversing ? (Math.abs(diff) > 1.9) : (Math.abs(diff) > 2.35);
  p.aiReversing = facingAway;
  let throttleDir = 1, rawSteer;
  if(facingAway){
    throttleDir = -1;
    // while reversing, the car's actual travel direction is yaw+PI, so steer
    // to bring THAT (not the nose) toward the target angle
    let revDiff = diff - Math.PI; while(revDiff>Math.PI) revDiff-=2*Math.PI; while(revDiff<-Math.PI) revDiff+=2*Math.PI;
    rawSteer = Math.max(-1,Math.min(1, revDiff*1.4));
  } else {
    rawSteer = Math.max(-1,Math.min(1, diff*1.4));
  }

  // continuous wall/corner repulsion, blended smoothly into the steering
  // target instead of a hard on/off switch — removes the oscillation that
  // let a bot grind along a wall without ever committing to turn away.
  const margin = 420;
  let steerGoal = rawSteer, throttleGoal = throttleDir;
  if(edgeDist < margin){
    const pushAway = 1 - Math.max(0,edgeDist)/margin; // 0 at margin, 1 right at the wall
    // same reverse-aware angle math as above: aim whichever end is actually
    // leading (nose going forward, tail going in reverse) back toward center
    const centerTarget = facingAway ? toCenterAng - Math.PI : toCenterAng;
    let cdiff = centerTarget - p.yaw; while(cdiff>Math.PI) cdiff-=2*Math.PI; while(cdiff<-Math.PI) cdiff+=2*Math.PI;
    const centerSteer = Math.max(-1,Math.min(1, cdiff*1.6));
    steerGoal = rawSteer*(1-pushAway) + centerSteer*pushAway;
    throttleGoal = throttleDir*(1-pushAway*0.3); // ease off, don't power straight into the wall
  }
  p.aiSteer = (p.aiSteer||0) + (steerGoal-(p.aiSteer||0))*0.4;
  out.steer = p.aiSteer;
  out.throttle = throttleGoal;
  out.boost = !facingAway && dist>550 && edgeDist>500 && Math.random()<0.02;
  // jump to meet an aerial ball right overhead, or occasionally for a grounded one, same as before
  if(p.grounded && edgeDist>300){
    if(ballPos.y>140 && dist<260 && Math.random()<0.05) out.jump=true;
    else if(dist<220 && Math.random()<0.01) out.jump=true;
  }
  stepCar(p, out, dt);
}

/* -------- Ball physics + collisions -------- */
function stepBall(dt){
  ballV.y += GRAV*0.9;
  ballPos.addScaledVector(ballV, 1);
  ballV.multiplyScalar(0.996);
  if(ballPos.y - BALL_R < 0){ ballPos.y=BALL_R; ballV.y = Math.abs(ballV.y)*0.62; }
  if(ballPos.y + BALL_R > WALL_H){ ballPos.y=WALL_H-BALL_R; ballV.y = -Math.abs(ballV.y)*0.6; }
  if(ballPos.x > FIELD_W/2-BALL_R){ ballPos.x=FIELD_W/2-BALL_R; ballV.x*=-0.6; }
  if(ballPos.x < -FIELD_W/2+BALL_R){ ballPos.x=-FIELD_W/2+BALL_R; ballV.x*=-0.6; }
  const inGoalX = Math.abs(ballPos.x) < GOAL_W/2;
  if(ballPos.z > FIELD_L/2-BALL_R && !inGoalX){ ballPos.z=FIELD_L/2-BALL_R; ballV.z*=-0.6; }
  if(ballPos.z < -FIELD_L/2+BALL_R && !inGoalX){ ballPos.z=-FIELD_L/2+BALL_R; ballV.z*=-0.6; }

  players.forEach(p=>{
    const dx = ballPos.x-p.mesh.position.x, dz = ballPos.z-p.mesh.position.z;
    const dy = ballPos.y - (p.mesh.position.y+30);
    const flatDist = Math.hypot(dx,dz);
    const dist3 = Math.hypot(dx,dz,dy);
    const reach = 160;
    if(dist3 < reach && flatDist > 1){
      // use a mostly-horizontal contact normal for the velocity transfer — a
      // bumper hitting the ball should push it mostly forward along the
      // ground, not get diluted into the vertical gap between the car's
      // center height and the ball's height (that gap was quietly eating
      // most of the hit, which is why hits barely moved the ball at all)
      const nFlat = new THREE.Vector3(dx,0,dz).normalize();
      const carVel = p.grounded
        ? new THREE.Vector3(Math.sin(p.yaw),0,Math.cos(p.yaw)).multiplyScalar(p.speed)
        : p.vel;
      const relVel = carVel.clone().sub(ballV);
      const vn = relVel.dot(nFlat);
      if(vn > 0){
        const carSpeedMag = carVel.length();
        const supersonic = carSpeedMag > CAR_BOOSTSPD*0.956; // top-speed boosting threshold
        const massRatio = (2*180)/(180+30) * (supersonic ? 2.1 : 1.1); // punchy arcade hit, not a dead thud
        ballV.addScaledVector(nFlat, vn*massRatio*0.85);
        // a bit of lift on an actual hit only, scaled to how hard it was hit
        ballV.y += Math.min(4.5, vn*0.28);
      }
      // positional correction (full 3D) so the ball doesn't sink into the car model
      const n3 = new THREE.Vector3(dx,dy,dz).normalize();
      ballV.addScaledVector(n3, Math.max(0,reach-dist3)*0.06);
    }
  });

  if(Math.abs(ballPos.x) < GOAL_W/2 && ballPos.y < GOAL_H){
    if(ballPos.z > FIELD_L/2-BALL_R) scoreGoal('B');
    else if(ballPos.z < -FIELD_L/2+BALL_R) scoreGoal('R');
  }
  ball.position.copy(ballPos);
  ball.rotation.x += ballV.z*0.011;
  ball.rotation.z -= ballV.x*0.011;
}

// a second camera + its own smoothed yaw, used only in split-screen (P2 active)
cam2 = new THREE.PerspectiveCamera(78, innerWidth/(innerHeight/2), 1, 30000);
const camState = {main:{yaw:0}, p2:{yaw:0}};
function updateOneCamera(camObj, state, human){
  if(!human) return;
  camObj.fov = 78; camObj.updateProjectionMatrix(); // fixed FOV — no zoom/swing, stays stable at any speed

  // read the car's actual current facing (works mid-air too), smoothed so
  // flips/barrel-rolls don't whip the camera; guarded against the nose
  // pointing straight up/down, where a heading can't be read reliably
  const fwd = new THREE.Vector3(0,0,1).applyQuaternion(human.mesh.quaternion);
  const horiz = Math.hypot(fwd.x,fwd.z);
  if(horiz > 0.2){
    const targetYaw = Math.atan2(fwd.x, fwd.z);
    let d = targetYaw - state.yaw; while(d>Math.PI) d-=2*Math.PI; while(d<-Math.PI) d+=2*Math.PI;
    state.yaw += d*0.09;
  }

  if(App.cameraMode==='chase'){
    const back = new THREE.Vector3(-Math.sin(state.yaw), 0, -Math.cos(state.yaw));
    const camTarget = human.mesh.position.clone().addScaledVector(back,480).add(new THREE.Vector3(0,230,0));
    // safety clamp: if anything ever pulls the camera far from the car, snap back instead of staying lost
    if(camObj.position.distanceTo(camTarget) > 1400) camObj.position.copy(camTarget);
    camObj.position.lerp(camTarget, 0.14);
    const look = human.mesh.position.clone().add(new THREE.Vector3(0,60,0));
    camObj.lookAt(look);
  } else { // ball-cam: pivot is the CAR — camera sits behind the car (on the side away from the ball) and always looks at the ball, never its back
    let dir = new THREE.Vector3().subVectors(human.mesh.position, ballPos);
    if(dir.lengthSq() < 400) dir.set(0,0,1); else dir.normalize();
    const camTarget = human.mesh.position.clone().addScaledVector(dir,340).add(new THREE.Vector3(0,210,0));
    if(camObj.position.distanceTo(camTarget) > 1400) camObj.position.copy(camTarget);
    camObj.position.lerp(camTarget,0.12);
    camObj.lookAt(ballPos.clone().add(new THREE.Vector3(0,30,0)));
  }
}
function updateCamera(){
  updateOneCamera(cam, camState.main, players[0]);
  if(splitActive) updateOneCamera(cam2, camState.p2, players[1]);
}

function consumeMenuEdges(){
  const e=Object.assign({},MenuEdge);
  MenuEdge.up=MenuEdge.down=MenuEdge.left=MenuEdge.right=MenuEdge.select=MenuEdge.back=false;
  return e;
}
function handleMenuInput(){
  const e=consumeMenuEdges();
  if(App.screen==='menu'){
    const items=window.__mainItems||[]; const n=items.length;
    if(e.up) menuSel=(menuSel-1+n)%n;
    if(e.down) menuSel=(menuSel+1)%n;
    const it=items[menuSel];
    if(it){
      if(e.left||e.right){ const dir=e.right?1:-1;
        if(it.act==='teams'){ if(e.right) App.teamB=Math.min(4,App.teamB+1); else App.teamB=Math.max(1,App.teamB-1); }
        if(it.act==='time'){ App.matchMin=Math.max(1,Math.min(15,App.matchMin+dir)); }
      }
      if(e.select){
        if(it.act==='teams'){} // handled via left/right; select cycles red team
        if(it.act==='garage') showScreen('garage');
        else if(it.act==='quality') showScreen('quality');
        else if(it.act==='start') startMatch();
      }
    }
    renderMainMenu();
  } else if(App.screen==='quality'){
    const rows=window.__qRows||[]; const n=rows.length;
    if(e.up) menuSel=(menuSel-1+n)%n;
    if(e.down) menuSel=(menuSel+1)%n;
    const r=rows[menuSel];
    if(r){
      if(e.left) App.quality[r.key]=Math.max(0,App.quality[r.key]-1);
      if(e.right) App.quality[r.key]=Math.min(r.opts.length-1,App.quality[r.key]+1);
    }
    if(e.back) showScreen('menu');
    renderQuality(); applyQuality();
  } else if(App.screen==='garage'){
    if(e.left) App.carIndex=(App.carIndex-1+CARS.length)%CARS.length;
    if(e.right) App.carIndex=(App.carIndex+1)%CARS.length;
    if(e.left||e.right) refreshPreviewCar();
    if(e.select||e.back) showScreen('menu');
  } else if(App.screen==='result'){
    if(e.select||e.back) showScreen('menu');
  }
}
function applyQuality(){
  sun.castShadow = App.quality.shadows>0;
  renderer.shadowMap.enabled = App.quality.shadows>0;
  renderer.shadowMap.type = App.quality.shadows>1? THREE.PCFSoftShadowMap : THREE.BasicShadowMap;
  // shadow map resolution scales with the quality tier instead of always being
  // the expensive 4096 — a big part of what was making weaker TV hardware chug
  const shadowSize = App.quality.shadows>1? 2048 : 1024;
  if(sun.shadow.mapSize.width!==shadowSize){
    sun.shadow.mapSize.set(shadowSize,shadowSize);
    if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; } // force the shadow map to rebuild at the new size
  }
  wallMat.opacity = App.quality.fx>0? (App.quality.fx>1?0.45:0.3) : 0.08;
  ball.material.envMapIntensity = App.quality.fx;
  // hard-capped pixel ratio — devicePixelRatio alone can be 2-3x on some TV
  // browsers, which quietly quadruples the pixel count being rendered
  const scale = App.quality.res===0?0.6:(App.quality.res===1?0.75:1);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)*scale);
  renderer.setSize(innerWidth,innerHeight);
}

/* ============================ MAIN LOOP ============================ */
let lastCamToggle=false, lastPause=false;
// adaptive performance watchdog: if frame time stays high for a few seconds
// in a row (weak TV hardware struggling), step the quality preset DOWN
// automatically instead of just letting the game grind slower and slower
let perfLastT=performance.now(), perfBadStreak=0;
function perfWatchdog(){
  const now=performance.now(), dt=now-perfLastT; perfLastT=now;
  if(dt > 33){ perfBadStreak++; } else { perfBadStreak=Math.max(0,perfBadStreak-1); }
  if(perfBadStreak > 180){ // ~3s worth of consistently slow frames
    perfBadStreak=0;
    let changed=false;
    if(App.quality.res>0){ App.quality.res--; changed=true; }
    else if(App.quality.shadows>0){ App.quality.shadows--; changed=true; }
    else if(App.quality.fx>0){ App.quality.fx--; changed=true; }
    if(changed){ applyQuality(); if(App.screen==='quality') renderQuality(); }
  }
}
function tick(){
  requestAnimationFrame(tick);
  perfWatchdog();
  handleMenuInput();
  if(matchRunning){
    if(Input.cameraToggle && !lastCamToggle){ App.cameraMode = App.cameraMode==='chase'?'ball':'chase'; }
    lastCamToggle = Input.cameraToggle;
    if(Input.pause && !lastPause){ matchRunning=false; showScreen('menu'); }
    lastPause = Input.pause;

    if(App.processing==='tv'){
      // normal path: TV itself is the physics/AI authority
      matchTime -= 1/60;
      document.getElementById('timer').textContent = fmtTime(matchTime);
      if(matchTime<=0) endMatch();

      players.forEach((p,i)=>{
        if(p.human){ stepCar(p, i===0?Input:Input2, 1); }
        else {
          const allies = players.filter(q=>q.team===p.team);
          aiThink(p, 1, allies, players.filter(q=>q.team!==p.team));
        }
      });
      for(let i=0;i<players.length;i++) for(let j=i+1;j<players.length;j++){
        const a=players[i], b=players[j];
        const dx=b.mesh.position.x-a.mesh.position.x, dz=b.mesh.position.z-a.mesh.position.z;
        const dist=Math.hypot(dx,dz), minDist=95;
        if(dist>0 && dist<minDist){
          const push=(minDist-dist)/2, nx=dx/dist, nz=dz/dist;
          a.mesh.position.x-=nx*push; a.mesh.position.z-=nz*push;
          b.mesh.position.x+=nx*push; b.mesh.position.z+=nz*push;
          a.speed*=0.8; b.speed*=0.8;
        }
      }
      stepBall(1);
    }
    // when App.processing==='phone', P1's phone runs the loop above AND
    // renders+encodes its own frames (see sendSimState on the phone side);
    // the TV does zero 3D math and zero 3D rendering here — it only shows
    // the images that arrive through applyRemoteSimState()
    if(App.processing==='tv') updateCamera();
  }
  if(!(matchRunning && App.processing==='phone')) renderFrame();
}
// split-screen bypasses the bloom composer (it renders to a full-size target,
// which doesn't compose cleanly with two half-height viewports) and instead
// draws each camera straight to its own half of the canvas with the scissor
// test — simpler and plenty sharp for a secondary local-co-op view.
function renderFrame(){
  if(splitActive && players[1]){
    renderer.setScissorTest(true);
    const w=innerWidth, h=innerHeight, half=Math.floor(h/2);
    renderer.setViewport(0, half, w, h-half); renderer.setScissor(0, half, w, h-half); renderer.render(scene, cam);
    renderer.setViewport(0, 0, w, half); renderer.setScissor(0, 0, w, half); renderer.render(scene, cam2);
    renderer.setScissorTest(false);
    renderer.setViewport(0,0,w,h);
  } else if(composer) composer.render(); else renderer.render(scene, cam);
}
function bootGame(){
  initCarPreview();
  placePreviewCanvas('menuCarWrap',360,220);
  renderPreviewLoop();
  showScreen('menu'); renderMainMenu();
  applyQuality(); renderQuality();
  tick();
}
</script>
