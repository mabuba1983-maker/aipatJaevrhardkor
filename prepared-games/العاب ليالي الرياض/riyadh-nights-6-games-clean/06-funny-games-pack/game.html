<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>الألعاب المضحكة</title>
<script>try{if(window.self!==window.top)document.documentElement.classList.add('emb-pending')}catch(e){}</script>
<style>html.emb-pending body{visibility:hidden}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --obsidian: #0a0810;
    --velvet: #120e1c;
    --panel: #191327;
    --panel-elev: #221936;
    --gold: #d9b468;
    --gold-bright: #f4d898;
    --gold-line: rgba(217, 180, 104, 0.28);
    --ruby: #9b1c3c;
    --ruby-soft: rgba(155, 28, 60, 0.22);
    --sapphire: #1a3b6e;
    --emerald: #135d49;
    --ivory: #f7f2e7;
    --muted: #b7adc7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: var(--obsidian); color: var(--ivory);
    font-family: 'Cairo', 'Tajawal', system-ui, -apple-system, sans-serif;
    user-select: none;
  }
  body {
    background-image:
      radial-gradient(ellipse 80% 55% at 50% 0%, rgba(155, 28, 60, 0.14), transparent 65%),
      radial-gradient(ellipse 65% 45% at 50% 100%, rgba(217, 180, 104, 0.08), transparent 60%),
      linear-gradient(180deg, #0b0812 0%, #120e1d 100%);
  }
  #root {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; position: relative; overflow: hidden;
  }

  /* Luxury Shell Frames */
  .tv-shell {
    width: 100%; height: 100%; max-width: 1380px;
    display: flex; flex-direction: column; gap: 14px;
    position: relative; z-index: 2;
  }
  .tv-topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 12px 20px; border-radius: 16px;
    background: linear-gradient(180deg, rgba(31,24,49,0.92), rgba(20,15,32,0.96));
    border: 1px solid var(--gold-line);
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    flex-shrink: 0;
  }
  .brand-crest {
    display: flex; align-items: center; gap: 12px;
  }
  .jewel-emblem {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, #c2244c 0%, #6d0f28 100%);
    border: 1.5px solid var(--gold);
    box-shadow: 0 0 18px rgba(155, 28, 60, 0.45), inset 0 1px 4px rgba(255,255,255,0.28);
    display: flex; align-items: center; justify-content: center;
    transform: rotate(45deg);
  }
  .jewel-emblem > span { transform: rotate(-45deg); font-size: 15px; font-weight: 900; color: var(--gold-bright); }
  .brand-title { font-size: 20px; font-weight: 900; color: var(--gold-bright); letter-spacing: -0.01em; }
  .brand-sub { font-size: 13px; color: var(--muted); font-weight: 600; }

  .hud-stats {
    display: flex; align-items: center; gap: 18px;
    font-size: 14px; font-weight: 700; color: var(--ivory);
    font-variant-numeric: tabular-nums;
  }
  .timer-dial {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 72px; padding: 6px 14px; border-radius: 12px;
    background: rgba(10,8,16,0.75); border: 1px solid var(--gold-line);
    color: var(--gold-bright); font-size: 18px; font-weight: 900;
  }
  .timer-dial.urgent {
    border-color: rgba(225, 62, 95, 0.7); color: #ff8fa3;
    background: rgba(155, 28, 60, 0.28);
  }

  .tv-stage {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 18px 22px; border-radius: 20px;
    background: linear-gradient(180deg, rgba(24,18,38,0.88), rgba(15,11,24,0.94));
    border: 1px solid rgba(217, 180, 104, 0.22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 20px 55px rgba(0,0,0,0.55);
    overflow-y: auto; position: relative;
  }

  .card {
    background: linear-gradient(180deg, rgba(31,24,49,0.95), rgba(20,15,32,0.98));
    border: 1px solid var(--gold-line);
    border-radius: 20px; padding: 24px 28px;
    max-width: 560px; width: 100%; text-align: center;
    box-shadow: 0 22px 55px rgba(0,0,0,0.55);
  }

  /* Buttons */
  .btn {
    border: 1px solid rgba(255,230,170,0.35); cursor: pointer; font-family: inherit; font-weight: 800;
    border-radius: 12px; padding: 11px 22px; font-size: 15px;
    background: linear-gradient(135deg, #e2be72 0%, #b88a38 100%);
    color: #161020; transition: transform 160ms cubic-bezier(0.16, 1, 0.3, 1), filter 160ms;
    white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:disabled { opacity: 0.48; cursor: not-allowed; }
  .btn-ruby {
    background: linear-gradient(135deg, #b82248 0%, #7c112d 100%);
    color: var(--ivory); border-color: rgba(244, 216, 152, 0.32);
  }
  .btn-ghost {
    background: rgba(255,255,255,0.05); color: var(--ivory);
    border: 1px solid rgba(217, 180, 104, 0.24);
  }
  .btn-ghost:hover:not(:disabled) { background: rgba(217, 180, 104, 0.14); }
  .btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 10px; }

  /* Room Code Hero */
  .room-code {
    font-size: clamp(32px, 5vw, 52px); font-weight: 900; letter-spacing: 6px;
    color: var(--gold-bright); font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 18px rgba(217, 180, 104, 0.25);
  }

  /* Game Mode Grid */
  .games-grid {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px; width: 100%; max-width: 1120px; margin: 14px 0;
  }
  @media (max-width: 860px) { .games-grid { grid-template-columns: 1fr; } }
  .mode-card {
    background: linear-gradient(180deg, rgba(35,27,54,0.92), rgba(22,16,35,0.96));
    border: 1px solid rgba(217, 180, 104, 0.24);
    border-radius: 18px; padding: 20px; text-align: right;
    cursor: pointer; transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1), border-color 180ms;
    display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  }
  .mode-card:hover { transform: translateY(-2px); border-color: var(--gold); }
  .mode-card.active {
    border: 1.5px solid var(--gold-bright);
    background: linear-gradient(180deg, rgba(55, 32, 62, 0.96), rgba(26, 17, 39, 0.98));
    box-shadow: 0 12px 32px rgba(155, 28, 60, 0.28);
  }
  .mode-kicker { font-size: 12px; font-weight: 700; color: var(--gold); }
  .mode-name { font-size: 21px; font-weight: 900; color: var(--ivory); margin: 4px 0; }
  .mode-desc { font-size: 14px; color: var(--muted); line-height: 1.55; margin: 0; }

  /* Question / Prompt Monument */
  .question-monument {
    width: 100%; max-width: 980px; text-align: center;
    padding: 28px 32px; border-radius: 22px;
    background: linear-gradient(180deg, rgba(34, 25, 53, 0.95), rgba(20, 15, 33, 0.98));
    border: 1px solid var(--gold-line);
    box-shadow: 0 18px 46px rgba(0,0,0,0.45);
  }
  .monument-label {
    font-size: 13px; font-weight: 800; color: var(--gold);
    margin-bottom: 10px; letter-spacing: 0.02em;
  }
  .monument-text {
    font-size: clamp(24px, 3.2vw, 38px); font-weight: 900;
    line-height: 1.45; color: var(--ivory); margin: 0;
    text-wrap: balance;
  }
  .monument-twist {
    border-color: rgba(217, 180, 104, 0.65);
    background: linear-gradient(180deg, rgba(78, 20, 40, 0.92), rgba(24, 15, 35, 0.98));
  }
  .speaker-line {
    font-size: 15px; font-weight: 800; color: var(--gold-bright);
    margin-bottom: 8px;
  }

  /* Answer Cards Reveal Grid */
  .answers-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px; width: 100%; max-width: 1120px; margin-top: 16px;
  }
  .ans-card {
    border-radius: 16px; padding: 16px 18px;
    background: linear-gradient(180deg, rgba(35, 27, 56, 0.96), rgba(22, 16, 36, 0.98));
    border: 1px solid var(--gold-line);
    text-align: right; display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
    animation: cardReveal 220ms cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 10px 26px rgba(0,0,0,0.35);
  }
  .ans-card.winner {
    border: 1.5px solid var(--gold-bright);
    background: linear-gradient(180deg, rgba(75, 26, 48, 0.95), rgba(30, 19, 44, 0.98));
  }
  @keyframes cardReveal {
    from { opacity: 0; transform: translateY(10px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .ans-author { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 800; color: var(--gold); }
  .ans-body { font-size: 19px; font-weight: 800; color: var(--ivory); line-height: 1.5; word-break: break-word; }
  .ans-votes { font-size: 13px; font-weight: 700; color: var(--gold-bright); border-top: 1px solid rgba(255,255,255,0.08); padding-top: 8px; }

  /* Dor Makhraj Head-to-Head Duels */
  .duel-arena {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px;
    width: 100%; max-width: 1060px; align-items: stretch; margin-top: 16px;
  }
  @media (max-width: 820px) { .duel-arena { grid-template-columns: 1fr; } }
  .duel-card {
    border-radius: 20px; padding: 24px;
    background: linear-gradient(180deg, rgba(35, 27, 56, 0.96), rgba(21, 16, 35, 0.98));
    border: 1.5px solid var(--gold-line);
    display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
    text-align: center; box-shadow: 0 14px 36px rgba(0,0,0,0.42);
  }
  .duel-card.revealed-win {
    border-color: var(--gold-bright);
    background: linear-gradient(180deg, rgba(84, 24, 48, 0.96), rgba(26, 17, 39, 0.98));
  }
  .duel-slot-tag { font-size: 13px; font-weight: 800; color: var(--gold); }
  .duel-answer-txt { font-size: clamp(20px, 2.4vw, 27px); font-weight: 900; color: var(--ivory); line-height: 1.45; }
  .duel-vs {
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 900; color: var(--gold-bright); padding: 6px;
  }

  /* Players & Leaderboard */
  .players-roster {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 960px;
  }
  .player-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 12px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(217, 180, 104, 0.22);
    font-size: 14px; font-weight: 700;
  }
  .player-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .standings-list {
    width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 8px; margin-top: 12px;
  }
  .standing-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px; border-radius: 14px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(217, 180, 104, 0.18);
    font-size: 16px; font-weight: 800;
  }
  .standing-row.first {
    border-color: var(--gold-bright);
    background: linear-gradient(90deg, rgba(155, 28, 60, 0.28), rgba(217, 180, 104, 0.16));
  }

  /* Admin Bar & Settings */
  .settings-strip {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px;
    padding: 12px 16px; border-radius: 14px; width: 100%; max-width: 960px;
    background: rgba(10, 8, 16, 0.55); border: 1px solid rgba(217, 180, 104, 0.18);
  }
  .seg-group { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .seg-label { font-size: 13px; color: var(--muted); font-weight: 700; margin-left: 4px; }
  .seg-btn {
    border: 1px solid rgba(217, 180, 104, 0.22); background: rgba(255,255,255,0.04);
    color: var(--ivory); padding: 6px 12px; border-radius: 9px; font-family: inherit;
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .seg-btn.on { background: var(--gold); color: #161020; border-color: var(--gold-bright); }

  /* QuickPlay Dock & Phone UI */
  .qp-dock {
    width: 100%; max-width: 1380px;
    padding: 10px 16px; border-radius: 14px;
    background: rgba(16, 12, 26, 0.96); border: 1px solid var(--gold-line);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    flex-shrink: 0;
  }
  .txt-input {
    flex: 1; min-width: 220px; padding: 11px 14px; border-radius: 11px;
    border: 1px solid var(--gold-line); background: #0c0914; color: var(--ivory);
    font-family: inherit; font-size: 15px; font-weight: 700; outline: none;
  }
  .txt-input:focus { border-color: var(--gold-bright); }

  /* Phone View */
  .ph-wrap {
    width: 100%; height: 100%; max-width: 480px;
    display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding: 4px 0;
  }
  .ph-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--gold-line);
    flex-shrink: 0;
  }
  .ph-card {
    background: linear-gradient(180deg, rgba(31,24,49,0.95), rgba(19,14,31,0.98));
    border: 1px solid var(--gold-line); border-radius: 18px;
    padding: 20px; display: flex; flex-direction: column; gap: 14px; text-align: center;
  }
  .vote-btn {
    width: 100%; padding: 14px 16px; border-radius: 13px; text-align: right;
    background: rgba(255,255,255,0.05); border: 1px solid var(--gold-line);
    color: var(--ivory); font-family: inherit; font-size: 15px; font-weight: 800;
    cursor: pointer; transition: border-color 140ms, background 140ms;
  }
  .vote-btn:hover { background: rgba(217, 180, 104, 0.16); border-color: var(--gold-bright); }
  .fake-box {
    padding: 18px; border-radius: 16px;
    background: rgba(155, 28, 60, 0.18); border: 1px dashed rgba(244, 216, 152, 0.45);
  }
</style>
</head>

<div id="root">
  <div id="role" class="card"><p>هذي اللعبة جزء من لوبي «ليالي الرياض» — افتحها من هناك حتى تتوصل تلقائيًا.</p></div>

<script>
const __q = [];
function _defer(name) {
  return function(...args) {
    if (window.__FUNNY_PACK && window.__FUNNY_PACK[name]) return window.__FUNNY_PACK[name](...args);
    __q.push([name, args]);
  };
}
const startTv = _defer('startTv');
const startPhone = _defer('startPhone');
const onHostMsg = _defer('onHostMsg');
const onPlayerLeave = _defer('onPlayerLeave');
const onCtlMsg = _defer('onCtlMsg');
const startQuickPlay = _defer('startQuickPlay');

/* ===================== EMB BRIDGE (لا تغيّر هذا الجزء) ===================== */
let EMB=null; const embHostConns={};
window.addEventListener('message', e=>{
  const m=e&&e.data; if(!m||!m.__emb) return;
  if(m.init){ EMB={role:m.role,code:m.code,name:m.name}; return embStart(); }
  if(!EMB) return;
  if(EMB.role==='tv'){
    if(m.event==='data'){
      let c=embHostConns[m.id];
      if(!c)c=embHostConns[m.id]={id:m.id,send:obj=>{try{parent.postMessage({__emb:1,to:m.id,data:obj},'*')}catch(e){}}};
      try{onHostMsg(c,m.data)}catch(e){}
    } else if(m.event==='disconnect'){
      try{onPlayerLeave(m.id)}catch(e){}
      delete embHostConns[m.id];
    }
  } else if(EMB.role==='ph'){
    if(m.data!==undefined){try{onCtlMsg(m.data)}catch(e){}}
  }
});
function embReveal(){try{document.documentElement.classList.remove('emb-pending')}catch(e){}}
function embStart(){
  embReveal();
  if(EMB.role==='tv'){ startTv(); } else { startPhone(); }
}
setTimeout(()=>{ if(!EMB) embReveal(); }, 2500);
function ctlSend(obj){ try{parent.postMessage({__emb:1,data:obj},'*')}catch(e){} }

/* ===================== 1. حماية اللعبة المستقلة ===================== */
const GAME_SECURITY_FUNNY = {
  gameId: '06-funny-games-pack',
  ownerKeyId: 'OWNER-KEY-G6-FUNNY-7720',
  allowedHosts: ['', 'localhost', '127.0.0.1']
};
function verifyFunnyIntegrity() {
  try {
    if (window.location.protocol === 'file:' || window.location.protocol === 'data:' || window.location.protocol === 'blob:') return true;
    const host = (window.location.hostname || '').toLowerCase();
    return GAME_SECURITY_FUNNY.allowedHosts.includes(host) || host.endsWith('.run.app') || host.endsWith('.web.app') || host.endsWith('.firebaseapp.com') || window.self !== window.top;
  } catch { return true; }
}

/* ===================== 2. بنك الأسئلة (>1320 عادي + >1320 معكوس متطابق النطاق) ===================== */
const DOMAIN_BLUEPRINTS = [
  {
    domain: 'COLOR',

    normalSubjects: ['ملابسك اليومية','سيارتك','ديكور الصالة','جوالك','كوب القهوة','ساعتك اليدوية','شنطة السفر','دفتر ملاحظاتك','غرفة نومك','الحذاء الرياضي'],
    invertedStems: ['وش لون وجهك أول ما تتذكر إنك {C}؟','وش اللون اللي يطلع لك في الثلاجة إذا {C}؟','وش لون البطاقة اللي تستاهلها إذا {C}؟','لو مشاعرك عند {C} لها لون، وش بيكون؟','وش أكثر لون تكرهه لما {C}؟','وش لون الإنذار اللي يولع براسك وقت ما {C}؟'],
    invertedContexts: ['نسيت جوالك مفتوح بالصالة','أكلت آخر قطعة كيك مخباة','جتك الفاتورة بمبلغ دبل','دخلت مجلس غلط وما عرفت أحد','نمت عن دوامك ساعتين','قفطوك وأنت تسوي نفسك مشغول','قابلت واحد وسلمت عليه ونسيت اسمه','اكتشفت إن المايك مفتوح بالاجتماع','فتحت قروب العائلة بعد غيبة أسبوع','لبست شرابين مختلفين بالعيد']
  },
  {
    domain: 'FOOD_DISH',
    normalStems: ['وش أكثر أكلة تحب تطلبها {S}؟','لو عزمت شخص غالي {S}، وش تقدم له؟','وش وجبتك الأساسية اللي ما تمل منها {S}؟','وش أول طبق يخطر ببالك لما تجوع {S}؟','أي أكلة تعتبرها خيارك المضمون {S}؟','وش الطبق اللي يعطي جو حلو {S}؟'],
    normalSubjects: ['في فطور الجمعة','في ليالي الشتاء','وقت السفر','بعد يوم عمل طويل','مع العائلة بالويكند','في طلعة البر','عند مشاهدة المباراة','أول يوم بعد الراتب','في العشاء الخفيف','وقت العزيمة الكبيرة'],
    invertedStems: ['وش الشيء اللي لقيته طايح تحت مقعد السيارة لما {C}؟','وش الشيء اللي ممكن تتهاوش مع خويك عشانه وأنت {C}؟','وش أغرب شيء نسيته في جيب ثوبك يومين بعد ما {C}؟','وش الشيء اللي لو قالوا لك تدهن سيارتك فيه وقت ما {C} بتوافق؟','وش الشيء اللي تبكي إذا تذكرت إنك أكلته وأنت {C}؟','وش الحاجة اللي تخبيها بالدولاب إذا {C}؟'],
    invertedContexts: ['تنظف غرفتك من سنة','سهران الساعة ٣ الفجر','راجع من عزيمة ميت جوع','تبي تقهر أخوك الصغير','معصب وما نمت زين','مستعجل للدوام','ما معك إلا خمس ريال','البيت كله نايم','تسمع صوت المطبخ يفتح','متحمس وتصور سناب']
  },

(function initBanks() {
  for (const bp of DOMAIN_BLUEPRINTS) {
    const nList = [], iList = [];
    let ni = 0, ii = 0;
    for (const s of bp.normalStems) for (const sub of bp.normalSubjects) nList.push({ id: `N_${bp.domain}_${++ni}`, text: s.replace('{S}', sub) });
    for (const s of bp.invertedStems) for (const ctx of bp.invertedContexts) iList.push({ id: `I_${bp.domain}_${++ii}`, text: s.replace('{C}', ctx) });
    BANK_BY_DOMAIN[bp.domain] = { normal: nList, inverted: iList };
    TOTAL_NORMAL_COUNT += nList.length;
    TOTAL_INVERTED_COUNT += iList.length;
  }
})();

/* ===================== 3. الصوت الفخم (Web Audio Chimes) ===================== */
let aCtx = null;
function playChime(freq = 520, dur = 0.16, type = 'triangle', vol = 0.09) {
  try {
    if (!aCtx) aCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (aCtx.state === 'suspended') aCtx.resume();
    const o = aCtx.createOscillator(), g = aCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, aCtx.currentTime);
    g.gain.setValueAtTime(vol, aCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, aCtx.currentTime + dur);
    o.connect(g); g.connect(aCtx.destination);
    o.start(); o.stop(aCtx.currentTime + dur);
  } catch {}
}

function makeBot(idx) {
  const prof = BOT_PROFILES[idx % BOT_PROFILES.length];
  return {
    id: 'bot_' + (idx + 1),
    name: prof.name,
    color: PLAYER_COLORS[(idx + 1) % PLAYER_COLORS.length],
    score: 0,
    isBot: true
  };
}

function syncBots() {
  const humans = G.players.filter(p => !p.isBot);
  const targetTotal = Math.max(humans.length, G.botFillCount > 0 ? Math.min(8, Math.max(humans.length, 1 + G.botFillCount)) : humans.length);
  const needBots = Math.max(0, targetTotal - humans.length);
  const existingBots = G.players.filter(p => p.isBot);
  const keptBots = existingBots.slice(0, needBots);
  while (keptBots.length < needBots) {
    keptBots.push(makeBot(keptBots.length));
  }
  G.players = [...humans, ...keptBots];
}

function pickAt7adakPair() {
  const domains = DOMAIN_BLUEPRINTS.map(b => b.domain).filter(d =>
    BANK_BY_DOMAIN[d].normal.some(q => !G.usedNormalIds.has(q.id)) &&
    BANK_BY_DOMAIN[d].inverted.some(q => !G.usedInvertedIds.has(q.id))
  );
  if (!domains.length) { G.usedNormalIds.clear(); G.usedInvertedIds.clear(); }
  const poolDomains = domains.length ? domains : DOMAIN_BLUEPRINTS.map(b => b.domain);
  const d = poolDomains[Math.floor(Math.random() * poolDomains.length)];
  const nList = BANK_BY_DOMAIN[d].normal.filter(q => !G.usedNormalIds.has(q.id));
  const iList = BANK_BY_DOMAIN[d].inverted.filter(q => !G.usedInvertedIds.has(q.id));
  const nQ = nList[Math.floor(Math.random() * nList.length)] || BANK_BY_DOMAIN[d].normal[0];
  const iQ = iList[Math.floor(Math.random() * iList.length)] || BANK_BY_DOMAIN[d].inverted[0];
  G.usedNormalIds.add(nQ.id); G.usedInvertedIds.add(iQ.id);
  return { domain: d, normalText: nQ.text, invertedText: iQ.text };
}

function pickFillPrompt() {
  let pool = FILL_SENTENCES.filter(f => !G.usedFillIds.has(f.id));
  if (!pool.length) { G.usedFillIds.clear(); pool = FILL_SENTENCES; }
  const pick = pool[Math.floor(Math.random() * pool.length)];
  G.usedFillIds.add(pick.id);
  return pick;
}

function pickMakhrajScenario() {
  let pool = MAKHRAJ_SCENARIOS.filter(m => !G.usedMakhrajIds.has(m.id));

  const pick = pool[Math.floor(Math.random() * pool.length)];
  G.usedMakhrajIds.add(pick.id);
  return pick;
}

function spliceSentence(template, fill) {
  const clean = (fill || '').trim() || 'صمت مفاجئ';
  return template.includes('______') ? template.replace('______', clean) : `${template} ${clean}`;
}

function clearTimers() {
  if (G.timerHandle) { clearInterval(G.timerHandle); G.timerHandle = null; }
  if (G.revealHandle) { clearInterval(G.revealHandle); G.revealHandle = null; }
  while (G.botTimers.length) clearTimeout(G.botTimers.pop());
}

function startGameSession(mode) {
  if (mode && GAME_MODES[mode]) G.gameMode = mode;
  syncBots();
  if (G.players.length < 2) {
    G.botFillCount = 5;
    syncBots();
  }
  G.players.forEach(p => { p.score = 0; });
  G.round = 1;
  beginRound();
}

function beginRound() {
  clearTimers();
  G.answers = {};
  G.votes = {};
  G.revealedCount = 0;
  G.duels = [];
  G.duelIdx = 0;
  G.qpInputDraft = '';
  G.qpFakeNotice = '';

  if (G.gameMode === 'at7adak') {
    G.currentPair = pickAt7adakPair();
    G.currentFill = null; G.currentMakhraj = null;
  } else if (G.gameMode === 'akmil') {
    G.currentFill = pickFillPrompt();
    G.currentPair = null; G.currentMakhraj = null;
  } else {
    G.currentMakhraj = pickMakhrajScenario();
    G.currentPair = null; G.currentFill = null;
  }

  G.phase = 'answering';
  G.timeLeft = G.roundTimeSec;
  playChime(587, 0.2, 'triangle', 0.12);

  // إجابات البوتات بتأخير طبيعي
  G.players.filter(p => p.isBot).forEach((bot, idx) => {
    const delay = 900 + idx * 450 + Math.random() * 500;
    const h = setTimeout(() => {
      if (G.phase !== 'answering' || G.answers[bot.id]) return;
      if (G.gameMode === 'at7adak') {
        const list = DOMAIN_BOT_ANSWERS[G.currentPair.domain] || ['ما أدري والله'];
        G.answers[bot.id] = list[Math.floor(Math.random() * list.length)];
      } else if (G.gameMode === 'akmil') {
        G.answers[bot.id] = BOT_FILLS[Math.floor(Math.random() * BOT_FILLS.length)];
      } else {
        G.answers[bot.id] = BOT_MAKHRAJS[Math.floor(Math.random() * BOT_MAKHRAJS.length)];
      }
      checkAllAnswered();
      renderTv(); broadcastState();
    }, delay);
    G.botTimers.push(h);
  });

  G.timerHandle = setInterval(() => {
    if (G.phase !== 'answering') return;
    G.timeLeft = Math.max(0, G.timeLeft - 1);
    if (G.timeLeft <= 0) finalizeAnsweringPhase();
    else { renderTv(); broadcastState(); }
  }, 1000);

  renderTv();
  broadcastState();
}

function submitPlayerAnswer(playerId, rawText) {
  if (G.phase !== 'answering') return;
  const txt = String(rawText || '').trim().slice(0, 120);
  if (!txt) return;
  G.answers[playerId] = txt;
  playChime(660, 0.1, 'sine', 0.08);
  checkAllAnswered();
  renderTv();
  broadcastState();
}

function checkAllAnswered() {
  if (G.phase !== 'answering') return;
  const allDone = G.players.every(p => !!G.answers[p.id]);
  if (allDone) finalizeAnsweringPhase();
}

function finalizeAnsweringPhase() {
  clearTimers();
  G.players.forEach((p, idx) => {
    if (!G.answers[p.id]) {
      if (p.isBot) {
        if (G.gameMode === 'at7adak') {
          const list = DOMAIN_BOT_ANSWERS[G.currentPair?.domain] || ['ما أدري'];
          G.answers[p.id] = list[idx % list.length];
        } else if (G.gameMode === 'akmil') {
          G.answers[p.id] = BOT_FILLS[idx % BOT_FILLS.length];
        } else {
          G.answers[p.id] = BOT_MAKHRAJS[idx % BOT_MAKHRAJS.length];
        }
      } else {
        G.answers[p.id] = G.gameMode === 'makhraj' ? 'والله نسيت السالفة كلها!' : 'بدون تعليق';
      }
    }
  });

  if (G.gameMode === 'at7adak') {
    // أولاً كشف السؤال المعكوس ثم تطلع البطاقات بالتدريج!
    G.phase = 'twist_reveal';
    playChime(440, 0.25, 'sawtooth', 0.09);
    setTimeout(() => { if (G.phase === 'twist_reveal') playChime(659, 0.26, 'triangle', 0.11); }, 160);
    renderTv(); broadcastState();
    const h = setTimeout(() => { if (G.phase === 'twist_reveal') startGradualCardsReveal(); }, 2800);
    G.botTimers.push(h);
  } else if (G.gameMode === 'akmil') {
    startGradualCardsReveal();
  } else {
    // دور مخرج: بناء مواجهات ثنائية بدون أسماء وبالتسلسل
    buildDorMakhrajDuels();
  }
}

function startGradualCardsReveal() {
  clearTimers();
  G.phase = 'cards_reveal';
  G.revealOrder = G.players.map(p => p.id);
  for (let i = G.revealOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [G.revealOrder[i], G.revealOrder[j]] = [G.revealOrder[j], G.revealOrder[i]];
  }
  G.revealedCount = 1;
  playChime(740, 0.14, 'triangle', 0.1);
  renderTv(); broadcastState();

  G.revealHandle = setInterval(() => {
    if (G.phase !== 'cards_reveal') { clearInterval(G.revealHandle); return; }
    if (G.revealedCount < G.revealOrder.length) {
      G.revealedCount++;
      playChime(620 + G.revealedCount * 45, 0.12, 'triangle', 0.09);
      renderTv(); broadcastState();
    } else {
      clearInterval(G.revealHandle); G.revealHandle = null;
      const h = setTimeout(() => { if (G.phase === 'cards_reveal') enterVotingPhase(); }, 1600);
      G.botTimers.push(h);
    }
  }, 1900);
}

function stepRevealOrNext() {
  if (G.phase === 'twist_reveal') { startGradualCardsReveal(); return; }
  if (G.phase === 'cards_reveal') {
    if (G.revealedCount < G.revealOrder.length) {
      G.revealedCount++;
      playChime(700, 0.12, 'triangle', 0.09);
      renderTv(); broadcastState();
    } else {
      enterVotingPhase();
    }
    return;
  }
  if (G.phase === 'voting') { tallyStandardVotes(); return; }
  if (G.phase === 'duel_vote') { resolveCurrentDuel(); return; }
  if (G.phase === 'duel_reveal') { advanceAfterDuel(); return; }
  if (G.phase === 'round_scores') {
    if (G.round < G.totalRounds) { G.round++; beginRound(); }
    else { G.phase = 'podium'; playChime(880, 0.3, 'triangle', 0.14); renderTv(); broadcastState(); }
  }
}

function enterVotingPhase() {
  clearTimers();
  G.phase = 'voting';
  G.votes = {};
  G.timeLeft = 22;
  renderTv(); broadcastState();

  G.players.filter(p => p.isBot).forEach((bot, idx) => {
    const h = setTimeout(() => {
      if (G.phase !== 'voting' || G.votes[bot.id]) return;
      const others = G.players.filter(p => p.id !== bot.id);
      if (others.length) {
        G.votes[bot.id] = others[Math.floor(Math.random() * others.length)].id;
        checkAllVotedStandard();
        renderTv(); broadcastState();
      }
    }, 900 + idx * 400);
    G.botTimers.push(h);
  });

  G.timerHandle = setInterval(() => {
    if (G.phase !== 'voting') return;
    G.timeLeft = Math.max(0, G.timeLeft - 1);
    if (G.timeLeft <= 0) tallyStandardVotes();
    else { renderTv(); broadcastState(); }
  }, 1000);
}

function submitStandardVote(voterId, targetId) {
  if (G.phase !== 'voting' || voterId === targetId) return;
  if (!G.players.find(p => p.id === targetId)) return;
  G.votes[voterId] = targetId;
  playChime(780, 0.1, 'sine', 0.08);
  checkAllVotedStandard();
  renderTv(); broadcastState();
}

function checkAllVotedStandard() {
  if (G.players.every(p => !!G.votes[p.id])) tallyStandardVotes();
}

function tallyStandardVotes() {
  clearTimers();
  const counts = {};
  Object.values(G.votes).forEach(tid => { counts[tid] = (counts[tid] || 0) + 1; });
  let maxV = 0;
  Object.values(counts).forEach(c => { if (c > maxV) maxV = c; });
  G.players.forEach(p => {
    const v = counts[p.id] || 0;
    p.score += v * 120 + (maxV > 0 && v === maxV ? 100 : 0);
  });
  G.lastCounts = counts;
  G.phase = 'round_scores';
  playChime(880, 0.24, 'triangle', 0.12);
  renderTv(); broadcastState();
}

// ======================= DOR MAKHRAJ DUELS =======================
function buildDorMakhrajDuels() {
  const ids = G.players.map(p => p.id);
  const fixed = ids[0];
  const rest = ids.slice(1);
  const shift = (G.round - 1) % Math.max(1, rest.length);
  const ordered = [fixed, ...rest.slice(shift), ...rest.slice(0, shift)];
  const duels = [];
  for (let i = 0; i + 1 < ordered.length; i += 2) {
    const aId = ordered[i], bId = ordered[i + 1];
    duels.push({
      duelNum: duels.length + 1,
      aId, bId,
      ansA: G.answers[aId],
      ansB: G.answers[bId],
      votesA: 0, votesB: 0,
      votedIds: [],
      revealed: false
    });
  }
  if (ordered.length % 2 === 1 && ordered.length >= 3) {
    const lastId = ordered[ordered.length - 1];
    const oppId = ordered[0];
    duels.push({
      duelNum: duels.length + 1,
      aId: lastId, bId: oppId,
      ansA: G.answers[lastId],
      ansB: G.answers[oppId],
      votesA: 0, votesB: 0,
      votedIds: [],
      revealed: false
    });
  }
  G.duels = duels;
  G.duelIdx = 0;
  startCurrentDuel();
}

function startCurrentDuel() {
  clearTimers();
  const d = G.duels[G.duelIdx];
  if (!d) { G.phase = 'round_scores'; renderTv(); broadcastState(); return; }
  G.phase = 'duel_vote';
  G.timeLeft = 20;
  G.qpFakeNotice = '';
  playChime(540, 0.18, 'triangle', 0.1);
  renderTv(); broadcastState();

  // البوتات غير المشاركة في هذه المواجهة تصوّت تلقائيًا
  G.players.filter(p => p.isBot && p.id !== d.aId && p.id !== d.bId).forEach((bot, idx) => {
    const h = setTimeout(() => {
      if (G.phase !== 'duel_vote') return;
      const pick = Math.random() < 0.5 ? 'A' : 'B';
      castDuelVote(bot.id, pick);
    }, 900 + idx * 450);
    G.botTimers.push(h);
  });

  G.timerHandle = setInterval(() => {
    if (G.phase !== 'duel_vote') return;
    G.timeLeft = Math.max(0, G.timeLeft - 1);
    if (G.timeLeft <= 0) resolveCurrentDuel();
    else { renderTv(); broadcastState(); }
  }, 1000);
}

function castDuelVote(voterId, side) {
  if (G.phase !== 'duel_vote') return;
  const d = G.duels[G.duelIdx];
  if (!d || d.revealed) return;
  // أطراف المواجهة ممنوع تصويتهم (تطلع لهم شاشة "سو نفسك تصوت")
  if (voterId === d.aId || voterId === d.bId) return;
  if (d.votedIds.includes(voterId)) return;
  d.votedIds.push(voterId);
  if (side === 'A') d.votesA++; else if (side === 'B') d.votesB++;
  playChime(760, 0.1, 'sine', 0.08);

  const eligibleVoters = G.players.filter(p => p.id !== d.aId && p.id !== d.bId).length;
  if (d.votedIds.length >= eligibleVoters) resolveCurrentDuel();
  else { renderTv(); broadcastState(); }
}

function resolveCurrentDuel() {
  clearTimers();
  const d = G.duels[G.duelIdx];
  if (!d) return;
  d.revealed = true;
  const pA = G.players.find(p => p.id === d.aId);
  const pB = G.players.find(p => p.id === d.bId);
  if (pA) pA.score += d.votesA * 110 + (d.votesA > d.votesB ? 150 : (d.votesA === d.votesB ? 60 : 0));
  if (pB) pB.score += d.votesB * 110 + (d.votesB > d.votesA ? 150 : (d.votesA === d.votesB ? 60 : 0));
  G.phase = 'duel_reveal';
  playChime(880, 0.22, 'triangle', 0.12);
  renderTv(); broadcastState();

  const h = setTimeout(() => { if (G.phase === 'duel_reveal') advanceAfterDuel(); }, 4200);
  G.botTimers.push(h);
}

function advanceAfterDuel() {
  clearTimers();
  if (G.duelIdx + 1 < G.duels.length) {
    G.duelIdx++;
    startCurrentDuel();
  } else {
    G.phase = 'round_scores';
    playChime(920, 0.25, 'triangle', 0.12);
    renderTv(); broadcastState();
  }
}

/* ===================== 5. البث والحالة ===================== */
function makeSnapshot() {
  const curDuel = G.duels[G.duelIdx] || null;
  const sorted = [...G.players].sort((a, b) => b.score - a.score);
  return {
    code: G.code,
    adminId: G.adminId,
    phase: G.phase,
    gameMode: G.gameMode,
    roundTimeSec: G.roundTimeSec,
    totalRounds: G.totalRounds,
    round: G.round,
    botFillCount: G.botFillCount,
    timeLeft: G.timeLeft,
    players: sorted.map(p => ({ id: p.id, name: p.name, color: p.color, score: p.score, isBot: p.isBot })),
    answeredIds: Object.keys(G.answers),
    promptFill: G.currentFill ? G.currentFill.template : '',
    makhraj: G.currentMakhraj,
    revealedAnswers: G.revealOrder.slice(0, G.revealedCount).map(pid => {
      const p = G.players.find(x => x.id === pid);
      return { id: pid, name: p?.name || '', color: p?.color || '#d9b468', text: G.answers[pid] || '' };
    }),
    duel: curDuel ? {
      duelNum: curDuel.duelNum, totalDuels: G.duels.length,
      aId: curDuel.aId, bId: curDuel.bId,
      ansA: curDuel.ansA, ansB: curDuel.ansB,
      votesA: curDuel.votesA, votesB: curDuel.votesB,
      votedIds: curDuel.votedIds, revealed: curDuel.revealed
    } : null
  };
}

function broadcastState() {
  const snap = makeSnapshot();
  Object.values(embHostConns).forEach(c => {
    try { c.send(snap); } catch {}
  });
}

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

            <div class="brand-title">الألعاب المضحكة · ${esc(gm.title)}</div>
            <div class="brand-sub">${esc(roundLabel)}</div>
          </div>
        </div>
        <div class="hud-stats">
          ${G.phase !== 'lobby' ? `<button class="btn btn-ghost btn-sm" onclick="window.__FUNNY_PACK.backToLobby()">الألعاب الثلاث</button>` : ''}
          ${(G.phase === 'answering' || G.phase === 'voting' || G.phase === 'duel_vote')
            ? `<div class="timer-dial ${G.timeLeft <= 6 ? 'urgent' : ''}">${G.timeLeft} ث</div>`
            : `<div class="timer-dial">${G.players.length} لاعبين</div>`}
        </div>
      </header>
      <main class="tv-stage">${stageHtml}</main>
      ${qpDockHtml}
    </div>
  `;

  const qpInput = document.getElementById('qpInput');
  const qpBtn = document.getElementById('qpSubmitBtn');
  if (qpInput && qpBtn) {
    qpInput.focus();
    qpInput.addEventListener('input', () => { G.qpInputDraft = qpInput.value; });
    const send = () => { if (qpInput.value.trim()) submitPlayerAnswer('qp_1', qpInput.value); };
    qpBtn.onclick = send;
    qpInput.onkeydown = e => { if (e.key === 'Enter') send(); };
  }
}

/* ===================== 7. واجهة الجوال الفاخرة (EMB Phone) ===================== */
let phState = null;
let phMyId = '';
let phLastKey = '';
let phLocalFakeHint = '';

function renderPhone() {
  const root = document.getElementById('root');
  if (!root) return;
  if (!phState) {
    root.innerHTML = `<div class="card"><h3>جارٍ الاتصال بغرفة الألعاب المضحكة...</h3><p style="color:var(--muted)">الرمز: ${esc(EMB?.code || '')}</p></div>`;
    return;
  }
  const s = phState;
  const isAdmin = s.adminId && phMyId === s.adminId;
  const key = [s.phase, s.gameMode, s.round, s.duel?.duelNum, s.duel?.revealed, isAdmin, s.answeredIds.includes(phMyId), s.duel?.votedIds?.includes(phMyId), phLocalFakeHint].join('|');
  if (key === phLastKey) return;
  phLastKey = key;

  let bodyHtml = '';
  const adminBar = isAdmin ? `
    <div style="border-bottom:1px solid rgba(217,180,104,0.2);padding-bottom:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px">
      <div style="font-size:12px;color:var(--gold-bright);font-weight:800">صلاحيات الأدمن</div>
      ${s.phase === 'lobby' ? `
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
          ${Object.entries(GAME_MODES).map(([k, info]) => `<button class="seg-btn ${s.gameMode===k?'on':''}" onclick="ctlSend({t:'admin',action:'mode',mode:'${k}'})">${info.title}</button>`).join('')}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
          ${[20,35,45,60].map(sec => `<button class="seg-btn ${s.roundTimeSec===sec?'on':''}" onclick="ctlSend({t:'admin',action:'timer',sec:${sec}})">${sec} ث</button>`).join('')}
          ${[3,4,6].map(r => `<button class="seg-btn ${s.totalRounds===r?'on':''}" onclick="ctlSend({t:'admin',action:'rounds',rounds:${r}})">${r} جولات</button>`).join('')}
        </div>
        <button class="btn" onclick="ctlSend({t:'admin',action:'start'})">ابدأ اللعبة الآن</button>
      ` : `
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-sm" onclick="ctlSend({t:'admin',action:'next'})">الخطوة التالية</button>
          <button class="btn btn-ghost btn-sm" onclick="ctlSend({t:'admin',action:'lobby'})">تغيير اللعبة</button>
        </div>
      `}
    </div>
  ` : '';

  if (s.phase === 'lobby') {
    bodyHtml = `<div class="ph-card">${adminBar}<h3 style="margin:0;color:var(--gold-bright)">طالع التلفزيون</h3><p style="margin:0;color:var(--muted)">${isAdmin ? 'اختر اللعبة واضبط الوقت ثم اضغط ابدأ.' : 'الأدمن يضبط إعدادات الجولة الآن...'}</p></div>`;
  } else if (s.phase === 'answering') {
    const already = s.answeredIds.includes(phMyId);
    if (already) {
      bodyHtml = `<div class="ph-card">${adminBar}<h3 style="margin:0;color:#7be3b5">تم استلام إجابتك ✓</h3><p style="margin:0;color:var(--muted)">طالع التلفزيون حتى يكمل الجميع.</p></div>`;
    } else {
      const promptBox = s.gameMode === 'akmil'
        ? `<p style="font-size:16px;font-weight:800;color:var(--gold-bright);margin:0">${esc(s.promptFill)}</p>`
        : s.gameMode === 'makhraj'
        ? `<p style="font-size:15px;font-weight:700;color:var(--gold-bright);margin:0">${esc(s.makhraj?.speaker || '')}: ${esc(s.makhraj?.situation || '')}</p>`
        : `<p style="font-size:15px;font-weight:700;color:var(--muted);margin:0">طالع السؤال المعروض على التلفزيون وأجب بسرعة</p>`;

      bodyHtml = `
        <div class="ph-card">
          ${adminBar}
          ${promptBox}
          <input id="phAnsInput" class="txt-input" type="text" placeholder="اكتب إجابتك هنا..." maxlength="110">
          <button class="btn" id="phAnsSend">إرسال الإجابة</button>
        </div>
      `;
    }
  } else if (s.phase === 'twist_reveal' || s.phase === 'cards_reveal') {
    bodyHtml = `<div class="ph-card">${adminBar}<h3 style="margin:0;color:var(--gold-bright)">طالع التلفزيون!</h3><p style="margin:0;color:var(--muted)">تُكشف البطاقات الآن على الشاشة الكبيرة...</p></div>`;
  } else if (s.phase === 'voting') {
    const others = (s.revealedAnswers || []).filter(a => a.id !== phMyId);
    bodyHtml = `
      <div class="ph-card">
        ${adminBar}
        <h3 style="margin:0;color:var(--gold-bright)">صوّت لأطرف إجابة</h3>
        ${others.map(a => `<button class="vote-btn" onclick="ctlSend({t:'vote',target:'${a.id}'})">${esc(a.text)}</button>`).join('')}
      </div>
    `;
  } else if (s.phase === 'duel_vote') {
    const d = s.duel;
    const inDuel = d && (d.aId === phMyId || d.bId === phMyId);
    if (inDuel) {
      bodyHtml = `
        <div class="ph-card">
          ${adminBar}
          <div class="fake-box">
            <h3 style="margin:0 0 8px;color:var(--gold-bright)">أنت في هذه المواجهة! 🤫</h3>
            <p style="margin:0 0 14px;font-size:14px;color:var(--ivory)">ما يمديك تصوت لأن ردك معروض الحين — <strong>سو نفسك تصوّت</strong> ولا تبين للباقين!</p>
            <div style="display:flex;flex-direction:column;gap:8px">
              <button class="vote-btn" style="text-align:center" onclick="window.__FUNNY_PACK.phFakeTap()">تظاهر بالتصويت للرد الأول 👀</button>
              <button class="vote-btn" style="text-align:center" onclick="window.__FUNNY_PACK.phFakeTap()">تظاهر بالتصويت للرد الثاني 👀</button>
            </div>
            ${phLocalFakeHint ? `<div style="margin-top:10px;font-size:12px;color:var(--gold)">${esc(phLocalFakeHint)}</div>` : ''}
          </div>
        </div>
      `;
    } else if (d && d.votedIds.includes(phMyId)) {
      bodyHtml = `<div class="ph-card">${adminBar}<h3 style="margin:0;color:#7be3b5">تم تسجيل صوتك ✓</h3><p style="margin:0;color:var(--muted)">شاهد كشف الأسماء على التلفزيون.</p></div>`;
    } else {
      bodyHtml = `
        <div class="ph-card">
          ${adminBar}
          <h3 style="margin:0;color:var(--gold-bright)">اختر المخرج الأذكى (بدون أسماء)</h3>
          <button class="vote-btn" onclick="ctlSend({t:'duelVote',side:'A'})">١) ${esc(d?.ansA || '')}</button>
          <button class="vote-btn" onclick="ctlSend({t:'duelVote',side:'B'})">٢) ${esc(d?.ansB || '')}</button>
        </div>
      `;
    }
  } else {
    bodyHtml = `<div class="ph-card">${adminBar}<h3 style="margin:0;color:var(--gold-bright)">طالع الترتيب على التلفزيون</h3><p style="margin:0;color:var(--muted)">تحديث النقاط على الشاشة الرئيسية.</p></div>`;
  }

  root.innerHTML = `
    <div class="ph-wrap">
      <div class="ph-head">
        <span style="font-weight:900;color:var(--gold-bright)">${esc(EMB?.name || 'لاعب')}</span>
        <span style="font-size:13px;color:var(--muted)">الغرفة ${esc(s.code)}</span>
      </div>
      ${bodyHtml}
    </div>
  `;

  const inp = document.getElementById('phAnsInput');
  const snd = document.getElementById('phAnsSend');
  if (inp && snd) {
    snd.onclick = () => {
      if (!inp.value.trim()) return;
      ctlSend({ t: 'answer', text: inp.value.trim() });
    };
  }
}

/* ===================== 8. ربط دوال EMB والبدء ===================== */
window.__FUNNY_PACK = {
  startTv() {
    if (!verifyFunnyIntegrity()) return;
    G.code = EMB?.code || 'RYD6';
    G.quickplay = false;
    G.botFillCount = 0; // في البث الجماعي الحقيقي تبدأ بالمتصلين الفعليين (ويمكن للأدمن إكمال المقاعد)
    setInterval(broadcastState, 220);
    renderTv();
  },
  startPhone() {
    if (!verifyFunnyIntegrity()) return;
    ctlSend({ t: 'join', name: EMB?.name || 'لاعب' });
    renderPhone();
  },
  onHostMsg(c, data) {
    if (!data || !data.t) return;
    if (data.t === 'join') {
      if (!G.players.find(p => p.id === c.id)) {
        const humans = G.players.filter(p => !p.isBot);
        if (!G.adminId) G.adminId = c.id; // أول من يدخل هو الأدمن
        G.players.push({
          id: c.id,
          name: String(data.name || EMB?.name || 'لاعب').slice(0, 18),
          color: PLAYER_COLORS[humans.length % PLAYER_COLORS.length],
          score: 0,
          isBot: false
        });
        syncBots();
      }
      c.send({ t: 'welcome', id: c.id });
      renderTv(); broadcastState();
    } else if (data.t === 'admin' && c.id === G.adminId) {
      if (data.action === 'mode' && GAME_MODES[data.mode]) G.gameMode = data.mode;
      else if (data.action === 'timer') G.roundTimeSec = Math.max(15, Math.min(120, Number(data.sec) || 35));
      else if (data.action === 'rounds') G.totalRounds = Math.max(1, Math.min(10, Number(data.rounds) || 4));
      else if (data.action === 'bots') { G.botFillCount = Math.max(0, Math.min(6, Number(data.count) || 0)); syncBots(); }
      else if (data.action === 'start') { startGameSession(data.mode || G.gameMode); return; }
      else if (data.action === 'next') { stepRevealOrNext(); return; }
      else if (data.action === 'lobby') { clearTimers(); G.phase = 'lobby'; }
      renderTv(); broadcastState();
    } else if (data.t === 'answer') {
      submitPlayerAnswer(c.id, data.text);
    } else if (data.t === 'vote') {
      submitStandardVote(c.id, data.target);
    } else if (data.t === 'duelVote') {
      castDuelVote(c.id, data.side);
    }
  },
  onPlayerLeave(id) {
    G.players = G.players.filter(p => p.id !== id);
    if (G.adminId === id) {
      const nextHuman = G.players.find(p => !p.isBot);
      G.adminId = nextHuman ? nextHuman.id : '';
    }
    renderTv(); broadcastState();
  },
  onCtlMsg(data) {
    if (!data) return;
    if (data.t === 'welcome') { phMyId = data.id; phLastKey = ''; renderPhone(); return; }
    phState = data;
    renderPhone();
  },
  startQuickPlay(modeOverride) {
    if (!verifyFunnyIntegrity()) return;
    embReveal();
    G.quickplay = true;
    G.code = 'RYD6';
    G.adminId = 'qp_1';
    G.botFillCount = 5;
    G.players = [{ id: 'qp_1', name: 'أنت', color: PLAYER_COLORS[0], score: 0, isBot: false }];
    syncBots();
    G.phase = 'lobby';
    if (modeOverride && GAME_MODES[modeOverride]) startGameSession(modeOverride);
    else renderTv();
  },
  selectMode(m) { if (GAME_MODES[m]) { G.gameMode = m; renderTv(); broadcastState(); } },
  setTimer(s) { G.roundTimeSec = s; renderTv(); broadcastState(); },
  setRounds(r) { G.totalRounds = r; renderTv(); broadcastState(); },
  setBots(b) { G.botFillCount = b; syncBots(); renderTv(); broadcastState(); },
  startGame(m) { startGameSession(m || G.gameMode); },
  forceEndAnswering() { if (G.phase === 'answering') finalizeAnsweringPhase(); },
  stepNext() { stepRevealOrNext(); },
  backToLobby() { clearTimers(); G.phase = 'lobby'; renderTv(); broadcastState(); },
  castStdVote(v, t) { submitStandardVote(v, t); },
  castDuel(v, s) { castDuelVote(v, s); },
  fakeTap() { G.qpFakeNotice = 'ممتاز! واصل التظاهر بالتصويت دون كشف ردك 👀'; renderTv(); },
  phFakeTap() { phLocalFakeHint = 'تم التمويه بصمت ✓ واصل التظاهر أمام الجميع'; phLastKey = ''; renderPhone(); }
};

while (__q.length) {
  const [fn, args] = __q.shift();
  if (window.__FUNNY_PACK[fn]) window.__FUNNY_PACK[fn](...args);
}

(function() {
  const qs = new URLSearchParams(location.search);
  const direct = qs.get('game');
  if (qs.has('quickplay') || qs.has('autostart')) {
    window.__FUNNY_PACK.startQuickPlay(direct);
  } else setTimeout(() => {
    if (!EMB) {
      embReveal();
      document.getElementById('root').innerHTML = `<div class="card"><div style="font-size:13px;color:var(--gold);font-weight:800;margin-bottom:6px">باقة الألعاب المضحكة</div><h1 style="color:var(--gold-bright);margin:0 0 10px">أتحداك تجاوب صح · أكمل الجملة · دور مخرج</h1><p style="color:var(--muted);margin:0 0 18px">أكثر من ${TOTAL_NORMAL_COUNT} سؤالاً عاديًا ومثلها معكوسًا، مع نظام المواجهات السرية والترتيب العام.</p><button class="btn" data-start="true" onclick="startQuickPlay()">تشغيل سريع</button></div>`;
    }
  }, 350);
})();
</script>
