<div id="role" class="card"><p>هذي اللعبة جزء من لوبي «ليالي الرياض» — افتحها من هناك حتى تتوصل تلقائيًا.</p></div>

<script>
/* ===================== EMB BRIDGE (لا تغيّر هذا الجزء) ===================== */
let EMB=null; const embHostConns={};
window.addEventListener('message', e=>{
  const m=e&&e.data; if(!m||!m.__emb) return;
  if(m.init){ EMB={role:m.role,code:m.code,name:m.name}; return embStart(); }
  if(!EMB) return;
  if(EMB.role==='tv'){
    if(m.event==='data'){
      let c=embHostConns[m.id];
      if(!c)c=embHostConns[m.id]={id:m.id,send:obj=>{try{parent.postMessage({__emb:1,to:m.id,data:obj},'*')}catch(e){}}};
      try{onHostMsg(c,m.data)}catch(e){}
    } else if(m.event==='disconnect'){
      try{onPlayerLeave(m.id)}catch(e){}
      delete embHostConns[m.id];
    }
  } else if(EMB.role==='ph'){
    if(m.data!==undefined){try{onCtlMsg(m.data)}catch(e){}}
  }
});
function embReveal(){try{document.documentElement.classList.remove('emb-pending')}catch(e){}}

function embShowRoomCode(){
  if(!EMB || EMB.role!=='tv' || !EMB.code) return;
  if(document.getElementById('emb-room-code-card')) return;
  const style=document.createElement('style');
  style.textContent='#emb-room-code-card{position:fixed;top:14px;right:14px;z-index:2147483000;min-width:150px;padding:9px 16px;border-radius:18px;text-align:center;background:rgba(25,13,38,.94);border:2px solid rgba(255,209,102,.58);box-shadow:0 8px 28px rgba(0,0,0,.4),0 0 24px rgba(255,154,61,.16);backdrop-filter:blur(12px);pointer-events:none;color:#fff;font-family:Tajawal,system-ui,sans-serif}#emb-room-code-card span{display:block;font-size:12px;font-weight:800;color:#ffd166;margin-bottom:2px}#emb-room-code-card strong{display:block;font:900 30px/1.1 monospace,monospace;letter-spacing:6px;color:#ffd166}@media(max-width:600px){#emb-room-code-card{top:8px;right:8px;min-width:112px;padding:6px 10px}#emb-room-code-card strong{font-size:23px;letter-spacing:4px}}';
  document.head.appendChild(style);
  const card=document.createElement('div');
  card.id='emb-room-code-card';
  const label=document.createElement('span'); label.textContent='رمز الغرفة';
  const code=document.createElement('strong'); code.textContent=String(EMB.code).slice(0,4);
  card.append(label,code); document.body.appendChild(card);
}

function embStart(){
  embReveal();
  if(EMB.role==='tv'){ embShowRoomCode(); startTv(); } else { startPhone(); }
}
setTimeout(()=>{ if(!EMB) embReveal(); }, 2500);

/* ===================== من هنا تبدأ لعبتك ===================== */
function ctlSend(obj){ try{parent.postMessage({__emb:1,data:obj},'*')}catch(e){} }

// نظام حماية مستقل للعبة سوق الديرة 3D
const GAME_SECURITY_MARKET = Object.freeze({
  gameId: 'dira_market_3d',
  ownerKeyId: 'OWNER-KEY-G3-MARKET3D-5541',
  sealHash: 'mkt5541c9e2'
});
function verifyMarketIntegrity() {
  if (!GAME_SECURITY_MARKET || GAME_SECURITY_MARKET.gameId !== 'dira_market_3d' || GAME_SECURITY_MARKET.ownerKeyId !== 'OWNER-KEY-G3-MARKET3D-5541') {
    document.getElementById('root').innerHTML = '<div class="card"><h2>تم إيقاف التشغيل</h2><p>تم اكتشاف تعديل غير مصرح به في ملفات اللعبة — يلزم تفويض المالك.</p></div>';
    return false;
  }
  return true;
}

const __q = [];
function __call(fn, args) {
  if (window.__G3D && window.__G3D[fn]) return window.__G3D[fn](...args);
  __q.push([fn, args]);
}
function startTv() { __call('startTv', []); }
function startPhone() { __call('startPhone', []); }
function onHostMsg(c, data) { __call('onHostMsg', [c, data]); }
function onPlayerLeave(id) { __call('onPlayerLeave', [id]); }
function onCtlMsg(data) { __call('onCtlMsg', [data]); }
function startQuickPlay() { __call('startQuickPlay', []); }
function startStoreDay() { __call('startStoreDay', []); }

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const STAFF_COLORS = [0x10b981, 0x38bdf8, 0xf59e0b, 0xec4899];
const COLOR_HEX = ['#34d399', '#38bdf8', '#fbbf24', '#f472b6'];
const SHELF_SPECS = [
  { id: 'coffee',  label: 'قهوة مختصة', x: -4.5, z: -4.5, color: 0x92400e, price: 28 },
  { id: 'juice',   label: 'عصائر طازجة', x: -4.5, z: 1.5,  color: 0xf97316, price: 16 },
  { id: 'snacks',  label: 'مخبوزات وحلويات', x: 4.5,  z: -4.5, color: 0xeab308, price: 22 },
  { id: 'devices', label: 'ألعاب وهدايا', x: 4.5,  z: 1.5,  color: 0x3b82f6, price: 45 }
];
const DELIVERY_BAY = { x: -8.2, z: 7.5 };
const CHECKOUT_SPOT = { x: 4.8, z: 7.4 };

let audioCtx = null, muted = false, userInteracted = false;
window.addEventListener('pointerdown', () => { userInteracted = true; }, { passive: true });
window.addEventListener('keydown', () => { userInteracted = true; }, { passive: true });
function sfx(freq, dur, type='sine', vol=0.11) {
  if (muted || !userInteracted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

const G = {
  phase: 'lobby', // lobby | playing | matchEnd
  adminId: null,
  players: [],
  botsCount: 1,
  timeLeft: 160,
  storeCash: 120,
  totalSales: 0,
  rating: 4.8,
  speedLevel: 1,
  shelves: [],
  boxes: [],
  customers: [],
  custSpawnTimer: 1.5,
  quickplay: false
};

function makeStaffPlayer(id, name, idx, isBot) {
  return {
    id, name, color: STAFF_COLORS[idx % STAFF_COLORS.length], colorHex: COLOR_HEX[idx % COLOR_HEX.length],
    isBot, x: -1.5 + idx * 1.4, z: 5.2, yaw: 0, ix: 0, iy: 0,
    carrying: null, // { shelfId, qty }
    served: 0, stocked: 0, scoreCash: 0, hint: 'احمل صندوق بضاعة من منطقة الاستلام أو حاسب الزبائن',
    mesh: null, botWait: 0
  };
}

function syncBots() {
  G.players = G.players.filter(p => !p.isBot);
  const bNames = ['مساعد المحل', 'كاشير الليل'];
  for (let i = 0; i < G.botsCount && G.players.length < 4; i++) {
    G.players.push(makeStaffPlayer('bot_' + i, bNames[i % bNames.length] + ' (بوت)', G.players.length, true));
  }
}

let renderer, scene, camera, scannerBeamMesh, isSoftwareGl = false, frameId = 0, lastTs = 0;
const shelfGroups = [], boxMeshes = [], custMeshes = [];
const _camPos = new THREE.Vector3(), _camLook = new THREE.Vector3();

function detectSoftwareGl() {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl2') || c.getContext('webgl');
    if (!gl) return true;
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    const gpu = String(gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER));
    gl.getExtension('WEBGL_lose_context')?.loseContext();
    return /SwiftShader|llvmpipe|softpipe|Software|Basic Render/i.test(gpu);
  } catch { return true; }
}

function makeFloorTexture() {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 512;
  const ctx = cv.getContext('2d');
  const s = 64;
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    ctx.fillStyle = (x + y) % 2 === 0 ? '#f1f5f9' : '#dbeafe';
    ctx.fillRect(x * s, y * s, s, s);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(6, 5);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function buildCharacterMesh(colorNum, isShopper = false) {
  const grp = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: colorNum, roughness: 0.45, metalness: 0.08 });
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xfdba74, roughness: 0.55 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.6 });

  const legs = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.26, 0.55, 12), darkMat);
  legs.position.y = 0.28;
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.34, 0.72, 14), bodyMat);
  torso.position.y = 0.88; torso.castShadow = true;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.27, 14, 14), skinMat);
  head.position.y = 1.48; head.castShadow = true;
  grp.add(legs, torso, head);

  if (!isShopper) {
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.29, 0.14, 12), bodyMat);
    cap.position.y = 1.66;
    const carryBox = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.42, 0.45), new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.6 }));
    carryBox.position.set(0, 0.95, 0.48);
    carryBox.visible = false;
    grp.add(cap, carryBox);
    grp.userData.carryBox = carryBox;
  } else {
    const bag = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.36, 0.24), new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.5 }));
    bag.position.set(0.36, 0.65, 0.15);
    grp.add(bag);
  }
  return grp;
}

function init3D(mountEl) {
  isSoftwareGl = detectSoftwareGl();
  renderer = new THREE.WebGLRenderer({ antialias: !isSoftwareGl, powerPreference: 'high-performance' });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.setPixelRatio(isSoftwareGl ? 1 : Math.min(window.devicePixelRatio, 2));
  renderer.setSize(mountEl.clientWidth || 1280, mountEl.clientHeight || 720);
  renderer.shadowMap.enabled = !isSoftwareGl;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  mountEl.innerHTML = '';
  mountEl.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1e293b);
  scene.fog = new THREE.Fog(0x1e293b, 26, 56);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  pmrem.dispose();

  camera = new THREE.PerspectiveCamera(50, (mountEl.clientWidth || 1280) / (mountEl.clientHeight || 720), 0.1, 80);
  camera.position.set(0, 12.5, 16.5);
  camera.lookAt(0, 0.8, 0.5);

  scene.add(new THREE.HemisphereLight(0xf8fafc, 0x334155, 1.05));
  const key = new THREE.DirectionalLight(0xfffbeb, 1.45);
  key.position.set(8, 16, 10);
  if (!isSoftwareGl) {
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.near = 2; key.shadow.camera.far = 42;
    key.shadow.camera.left = -16; key.shadow.camera.right = 16;
    key.shadow.camera.top = 16; key.shadow.camera.bottom = -16;
  }
  scene.add(key);

  // Tiled supermarket floor
  const floorTex = makeFloorTexture();
  floorTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(24, 20),
    new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.3, metalness: 0.08 })
  );
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
  scene.add(floor);

  // Supermarket back & side interior walls + refrigerated glass coolers
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.65 });
  const backWall = new THREE.Mesh(new THREE.BoxGeometry(24, 5.4, 0.4), wallMat);
  backWall.position.set(0, 2.7, -9.8);
  const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 5.4, 20), wallMat);
  leftWall.position.set(-12, 2.7, 0);
  const rightWall = leftWall.clone(); rightWall.position.x = 12;
  scene.add(backWall, leftWall, rightWall);

  // Glowing beverage coolers along back wall
  const coolerBodyMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3, metalness: 0.7 });
  const coolerGlowMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0ea5e9, emissiveIntensity: 0.65, roughness: 0.2 });
  for (let x = -7.5; x <= 7.5; x += 5) {
    const fr = new THREE.Mesh(new THREE.BoxGeometry(3.8, 3.4, 1.1), coolerBodyMat);
    fr.position.set(x, 1.7, -9.0);
    const gl = new THREE.Mesh(new THREE.BoxGeometry(3.3, 2.5, 0.08), coolerGlowMat);
    gl.position.set(x, 1.8, -8.42);
    scene.add(fr, gl);
  }

  // Overhead warm ceiling light panels
  const lightPanelMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfef3c7, emissiveIntensity: 1.2 });
  for (const lz of [-5, 1, 6]) {
    for (const lx of [-5, 5]) {
      const lp = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.12, 0.9), lightPanelMat);
      lp.position.set(lx, 5.1, lz);
      scene.add(lp);
    }
  }

  // 4 Stockable 3D Display Shelves
  shelfGroups.length = 0;
  const woodMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.55 });
  const metalMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.25, metalness: 0.85 });
  SHELF_SPECS.forEach((sp, idx) => {
    const sg = new THREE.Group();
    sg.position.set(sp.x, 0, sp.z);
    const frame = new THREE.Mesh(new THREE.BoxGeometry(3.4, 2.1, 1.3), metalMat);
    frame.position.y = 1.05; frame.castShadow = true;
    const deck1 = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.12, 1.4), woodMat);
    deck1.position.y = 0.72;
    const deck2 = deck1.clone(); deck2.position.y = 1.42;
    const topper = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.28, 1.4), new THREE.MeshStandardMaterial({ color: sp.color, roughness: 0.35 }));
    topper.position.y = 2.15;
    const itemSlots = new THREE.Group();
    const prodMat = new THREE.MeshStandardMaterial({ color: sp.color, roughness: 0.28, metalness: 0.2 });
    for (let k = 0; k < 8; k++) {
      const row = k < 4 ? 0 : 1;
      const col = k % 4;
      const item = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), prodMat);
      item.position.set(-1.05 + col * 0.7, (row === 0 ? 1.0 : 1.7), 0.35);
      item.castShadow = true;
      itemSlots.add(item);
    }
    sg.add(frame, deck1, deck2, topper, itemSlots);
    scene.add(sg);
    shelfGroups.push(itemSlots);
  });

  // Delivery Bay Pad (Left Front)
  const bayRing = new THREE.Mesh(
    new THREE.RingGeometry(1.7, 2.0, 28),
    new THREE.MeshBasicMaterial({ color: 0xf59e0b, side: THREE.DoubleSide })
  );
  bayRing.rotation.x = -Math.PI / 2; bayRing.position.set(DELIVERY_BAY.x, 0.03, DELIVERY_BAY.z);
  scene.add(bayRing);

  // Checkout Counter & Red Barcode Scanner (Right Front)
  const counterGrp = new THREE.Group();
  counterGrp.position.set(CHECKOUT_SPOT.x + 1.8, 0, CHECKOUT_SPOT.z);
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.0, 3.6), new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4, metalness: 0.4 }));
  base.position.y = 0.5; base.castShadow = true;
  const belt = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.08, 3.0), new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 }));
  belt.position.set(0, 1.04, 0);
  const monitor = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.42, 0.1), new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.7 }));
  monitor.position.set(0.35, 1.42, -0.5);
  scannerBeamMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, 0.65), new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.65 }));
  scannerBeamMesh.position.set(-0.1, 1.18, 0.3);
  counterGrp.add(base, belt, monitor, scannerBeamMesh);
  scene.add(counterGrp);

  window.addEventListener('resize', () => {
    if (!renderer || !mountEl) return;
    const w = mountEl.clientWidth || window.innerWidth, h = mountEl.clientHeight || window.innerHeight;
    camera.aspect = w / h; camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
}

function syncDynamicMeshes() {
  if (!scene) return;
  // Staff
  const pIds = new Set(G.players.map(p => p.id));
  scene.children.filter(o => o.userData?.staffId && !pIds.has(o.userData.staffId)).forEach(o => scene.remove(o));
  for (const p of G.players) {
    if (!p.mesh) {
      p.mesh = buildCharacterMesh(p.color, false);
      p.mesh.userData.staffId = p.id;
      scene.add(p.mesh);
    }
    p.mesh.position.set(p.x, 0, p.z);
    p.mesh.rotation.y = p.yaw;
    if (p.mesh.userData.carryBox) p.mesh.userData.carryBox.visible = Boolean(p.carrying);
  }

  // Shelves stock count visual
  G.shelves.forEach((sh, i) => {
    const slots = shelfGroups[i];
    if (!slots) return;
    slots.children.forEach((child, idx) => { child.visible = idx < sh.stock; });
  });

  // Supply boxes on floor
  while (boxMeshes.length < G.boxes.length) {
    const bm = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.68, 0.85), new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.65 }));
    bm.castShadow = true;
    scene.add(bm);
    boxMeshes.push(bm);
  }
  boxMeshes.forEach((bm, idx) => {
    const b = G.boxes[idx];
    bm.visible = Boolean(b);
    if (b) bm.position.set(b.x, 0.34, b.z);
  });

  // 3D Shoppers
  while (custMeshes.length < G.customers.length) {
    const cm = buildCharacterMesh(0xf43f5e, true);
    scene.add(cm);
    custMeshes.push(cm);
  }
  custMeshes.forEach((cm, idx) => {
    const cu = G.customers[idx];
    cm.visible = Boolean(cu);
    if (cu) { cm.position.set(cu.x, 0, cu.z); cm.rotation.y = cu.yaw; }
  });
}

function spawnSupplyShipment(free = false) {
  if (!free) {
    if (G.storeCash < 40) return false;
    G.storeCash -= 40;
  }
  for (let i = 0; i < 4; i++) {
    const sp = SHELF_SPECS[i % SHELF_SPECS.length];
    G.boxes.push({
      shelfId: sp.id,
      x: DELIVERY_BAY.x + (i % 2) * 1.15 - 0.5,
      z: DELIVERY_BAY.z - Math.floor(i / 2) * 1.15
    });
  }
  sfx(520, 0.14, 'triangle', 0.12);
  return true;
}

function performPlayerAction(p) {
  if (!p || G.phase !== 'playing') return;
  // 1. If standing near checkout counter and a customer is waiting -> Scan & Checkout!
  if (Math.hypot(p.x - CHECKOUT_SPOT.x, p.z - CHECKOUT_SPOT.z) < 2.8) {
    const waiting = G.customers.find(c => c.state === 'queue' && Math.hypot(c.x - CHECKOUT_SPOT.x, c.z - (CHECKOUT_SPOT.z + 0.5)) < 2.4);
    if (waiting) {
      G.storeCash += waiting.bill;
      G.totalSales += waiting.bill;
      p.scoreCash += waiting.bill;
      p.served += 1;
      waiting.state = 'leaving';
      p.hint = `تمت المحاسبة بنجاح! (+${waiting.bill} ر.س)`;
      if (scannerBeamMesh) scannerBeamMesh.material.opacity = 1.0;
      sfx(1040, 0.12, 'square', 0.14);
      return;
    }
  }

  // 2. If not carrying a box and near a delivery box -> Pick it up!
  if (!p.carrying) {
    const bi = G.boxes.findIndex(b => Math.hypot(b.x - p.x, b.z - p.z) < 2.2);
    if (bi !== -1) {
      const box = G.boxes.splice(bi, 1)[0];
      p.carrying = { shelfId: box.shelfId, qty: 4 };
      const lbl = SHELF_SPECS.find(s => s.id === box.shelfId)?.label || 'بضاعة';
      p.hint = `تحمل صندوق ${lbl} — اتجه للرف لترصّه!`;
      sfx(440, 0.1, 'triangle', 0.12);
      return;
    }
  } else {
    // 3. Carrying a box -> Find nearest shelf (prefer matching, or any non-full shelf within range)
    const sh = G.shelves.find(s => Math.hypot(s.x - p.x, s.z - p.z) < 3.1 && s.stock < 8);
    if (sh) {
      sh.stock = Math.min(8, sh.stock + p.carrying.qty);
      p.carrying = null;
      p.stocked += 1;
      p.scoreCash += 20;
      p.hint = 'تم رصّ البضاعة بالرف! (+20 مكافأة)';
      sfx(680, 0.14, 'triangle', 0.13);
      return;
    }
  }
}

function upgradeStore(p) {

function startStoreDay() {

  });

function stepMarket(dt) {
  if (G.phase !== 'playing') return;
  G.timeLeft = Math.max(0, G.timeLeft - dt);
  if (G.timeLeft <= 0) {
    G.phase = 'matchEnd';
    updateOverlay();
    broadcastState();
    return;
  }

  // Spawn 3D shoppers
  G.custSpawnTimer -= dt;
  if (G.custSpawnTimer <= 0 && G.customers.length < 5) {
    G.custSpawnTimer = 4.2;
    const sh = G.shelves[Math.floor(Math.random() * G.shelves.length)];
    G.customers.push({
      x: 0, z: 9.2, yaw: Math.PI, state: 'browsing',
      targetShelf: sh, bill: 0, patience: 28
    });
  }

  // Update shoppers
  for (let i = G.customers.length - 1; i >= 0; i--) {
    const cu = G.customers[i];
    let tx = cu.x, tz = cu.z;
    if (cu.state === 'browsing') {
      tx = cu.targetShelf.x; tz = cu.targetShelf.z + 1.65;
      if (Math.hypot(tx - cu.x, tz - cu.z) < 0.5) {
        if (cu.targetShelf.stock > 0) {
          cu.targetShelf.stock -= 1;
          cu.bill = cu.targetShelf.price * (1 + Math.floor(Math.random() * 2));
          cu.state = 'queue';
        } else {
          G.rating = Math.max(2.0, +(G.rating - 0.1).toFixed(1));
          cu.state = 'leaving';
        }
      }
    } else if (cu.state === 'queue') {
      tx = CHECKOUT_SPOT.x; tz = CHECKOUT_SPOT.z + 0.4;
    } else {
      tx = 0; tz = 9.8;
      if (Math.hypot(tx - cu.x, tz - cu.z) < 0.8) { G.customers.splice(i, 1); continue; }
    }
    const dx = tx - cu.x, dz = tz - cu.z, d = Math.hypot(dx, dz);
    if (d > 0.12) {
      const sp = 2.6;
      cu.x += (dx / d) * sp * dt;
      cu.z += (dz / d) * sp * dt;
      cu.yaw = Math.atan2(dx, dz);
    }
  }

  // Update staff players + Bot assistant AI
  const moveSpeed = 5.4 + (G.speedLevel - 1) * 1.1;
  for (const p of G.players) {
    if (p.isBot) {
      const needCheckout = G.customers.some(c => c.state === 'queue' && Math.hypot(c.x - CHECKOUT_SPOT.x, c.z - (CHECKOUT_SPOT.z + 0.5)) < 2.2);
      let gx = p.x, gz = p.z;
      if (needCheckout && !p.carrying) {
        gx = CHECKOUT_SPOT.x; gz = CHECKOUT_SPOT.z - 0.4;
        if (Math.hypot(gx - p.x, gz - p.z) < 1.8) performPlayerAction(p);
      } else if (p.carrying) {
        const sh = G.shelves.find(s => s.id === p.carrying.shelfId && s.stock < 8) || G.shelves.find(s => s.stock < 8);
        if (sh) { gx = sh.x; gz = sh.z + 1.8; if (Math.hypot(gx - p.x, gz - p.z) < 2.3) performPlayerAction(p); }
      } else if (G.boxes.length > 0) {
        gx = G.boxes[0].x; gz = G.boxes[0].z;
        if (Math.hypot(gx - p.x, gz - p.z) < 1.8) performPlayerAction(p);
      }
      const dx = gx - p.x, dz = gz - p.z, d = Math.hypot(dx, dz);
      p.ix = d > 0.4 ? dx / d : 0; p.iy = d > 0.4 ? dz / d : 0;
    }

    const mag = Math.hypot(p.ix, p.iy);
    if (mag > 0.08) {
      const nx = p.ix / Math.max(1, mag), nz = p.iy / Math.max(1, mag);
      p.x = Math.max(-10.5, Math.min(10.5, p.x + nx * moveSpeed * dt));
      p.z = Math.max(-8.2, Math.min(8.5, p.z + nz * moveSpeed * dt));
      p.yaw = Math.atan2(nx, nz);
    }
  }

  if (scannerBeamMesh && scannerBeamMesh.material.opacity > 0.45) {
    scannerBeamMesh.material.opacity = Math.max(0.45, scannerBeamMesh.material.opacity - dt * 1.5);
  }
  syncDynamicMeshes();
}

function afterDraw(cb) {
  const gl = renderer.getContext();
  const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
  gl.flush();
  const poll = () => {
    const st = sync && gl.getSyncParameter(sync, gl.SYNC_STATUS);
    if (st === gl.UNSIGNALED) frameId = setTimeout(poll, 5);
    else { gl.deleteSync(sync); frameId = setTimeout(cb, 80); }
  };
  frameId = setTimeout(poll, 5);
}

function tick(ts) {
  const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
  lastTs = ts;
  stepMarket(dt);

  const hero = G.players.find(p => !p.isBot) || G.players[0];
  if (hero && camera) {
    _camPos.set(hero.x * 0.45, 11.8, hero.z * 0.35 + 14.5);
    _camLook.set(hero.x * 0.35, 1.0, hero.z * 0.25 - 0.5);
    camera.position.lerp(_camPos, Math.min(1, dt * 4));
    camera.lookAt(_camLook);
  }

  const tm = document.getElementById('hudTime'), sc = document.getElementById('hudCash'), hb = document.getElementById('hintBar');
  if (tm) tm.textContent = Math.ceil(G.timeLeft) + ' ث';
  if (sc) sc.textContent = `خزينة المتجر: ${G.storeCash} ر.س · المبيعات: ${G.totalSales} ر.س · التقييم: ${G.rating}★`;
  if (hb && hero) hb.textContent = hero.hint;

  renderer.render(scene, camera);
  if (isSoftwareGl) afterDraw(() => tick(performance.now()));
  else frameId = requestAnimationFrame(tick);
}

function wireJoystick(zoneId, knobId, onChange) {
  const z = document.getElementById(zoneId), k = document.getElementById(knobId);
  if (!z || !k) return;
  let active = false; const maxR = 46;
  function upd(cx, cy) {
    const r = z.getBoundingClientRect();
    let dx = cx - (r.left + r.width/2), dy = cy - (r.top + r.height/2);
    const d = Math.hypot(dx, dy);
    if (d > maxR) { dx = (dx/d)*maxR; dy = (dy/d)*maxR; }
    k.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    onChange(dx/maxR, dy/maxR);
  }
  function rst() { active = false; k.style.transform = 'translate(-50%,-50%)'; onChange(0,0); }
  z.addEventListener('pointerdown', e => { e.preventDefault(); active=true; z.setPointerCapture(e.pointerId); upd(e.clientX, e.clientY); });
  z.addEventListener('pointermove', e => { if (active) upd(e.clientX, e.clientY); });
  z.addEventListener('pointerup', rst); z.addEventListener('pointercancel', rst);
}

    window.addEventListener('keyup', e => { keys.delete(e.code); syncKeys(); });
    window.addEventListener('blur', () => { keys.clear(); syncKeys(); });
    lastTs = performance.now();
    tick(lastTs);
  }
};

while (__q.length) {
  const [fn, args] = __q.shift();
  if (window.__G3D[fn]) window.__G3D[fn](...args);
}

(function() {
  const qs = new URLSearchParams(location.search);
  if (qs.has('quickplay') || qs.has('autostart')) window.__G3D.startQuickPlay();
  else setTimeout(() => {
    if (!EMB) {
      embReveal();
      document.getElementById('root').innerHTML = `<div class="card"><h1 style="color:#ffd166;margin:0 0 10px">سوق الديرة 3D</h1><p style="opacity:0.85;margin:0 0 18px">محاكي السوبرماركت الثلاثي الأبعاد: البضائع والرفوف والكاشير.</p><button class="btn" data-start="true" onclick="startQuickPlay()">تشغيل سريع</button></div>`;
    }
  }, 350);
})();
</script>
