<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#190d26;color:#f8f5ff;font-family:'Tajawal',system-ui,sans-serif}
#root{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center}
.card{background:rgba(25,13,38,0.95);border:1px solid rgba(255,209,102,0.34);border-radius:20px;padding:18px;max-width:860px;width:95%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.58);max-height:92vh;overflow-y:auto}
.btn{cursor:pointer;border:none;border-radius:14px;padding:11px 20px;font-family:inherit;font-size:16px;font-weight:800;background:linear-gradient(135deg,#ffd166,#ff9a3d);color:#190d26;transition:transform .14s}
.btn:active{transform:scale(0.97)}
.btn-alt{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,209,102,0.38)}
.btn-green{background:linear-gradient(135deg,#06d6a0,#34d399);color:#042f2e}
.tv-wrap{width:100%;height:100%;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 45%,#281540,#140920)}
#cv,#glMount{width:100%;height:100%;display:block;position:absolute;inset:0}
#glMount{display:none}
.tv-hud{position:absolute;top:10px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;gap:10px;z-index:4}
.hud-box{background:rgba(19,9,31,0.9);border:1px solid rgba(255,209,102,0.34);border-radius:14px;padding:7px 14px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.gold{color:#ffd166}
.tv-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,8,24,0.84);padding:16px;z-index:6}
.game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.game-card{cursor:pointer;background:rgba(255,255,255,0.06);border:1px solid rgba(255,209,102,0.34);border-radius:14px;overflow:hidden;text-align:right;padding:0;color:#fff;font-family:inherit;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.game-card:hover{border-color:#ffd166;transform:translateY(-2px)}
.game-thumb{width:100%;height:94px;object-fit:cover;background:#12081c;display:block}
.game-meta{padding:8px 10px}
.game-meta .g-title{font-size:15px;font-weight:800;color:#ffd166;display:block}
.game-meta .g-sub{font-size:11.5px;opacity:0.84;display:block;margin-top:2px;line-height:1.35}
.full-span{grid-column:1 / -1}
.tashkeela-box{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0;text-align:right}
.team-card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,209,102,0.35);border-radius:14px;padding:12px}
.ph-wrap{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:14px;background:linear-gradient(180deg,#1f1030,#140920)}
.ph-head{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.08);border-radius:14px;padding:10px 14px}
.ph-pad{flex:1;display:flex;align-items:center;justify-content:space-between;gap:12px;max-height:360px;margin:auto 0}
.joy-zone{width:154px;height:154px;border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid rgba(255,209,102,0.42);position:relative;touch-action:none;flex-shrink:0}
.joy-knob{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#ffd166,#ff9a3d);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.act-btn{touch-action:none;width:124px;height:112px;border-radius:22px;border:none;font-family:inherit;font-size:20px;font-weight:800;cursor:pointer;color:#190d26;background:linear-gradient(135deg,#ffd166,#ff9a3d)}
.jump-btn{touch-action:none;width:126px;height:96px;border-radius:20px;border:none;font-family:inherit;font-size:21px;font-weight:800;cursor:pointer;color:#042f2e;background:linear-gradient(135deg,#06d6a0,#34d399)}
.dive-btn{touch-action:none;width:126px;height:52px;border-radius:14px;border:2px solid #ffd166;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;color:#ffd166;background:rgba(19,9,31,0.92)}
.mine-btn{touch-action:none;width:118px;height:56px;border-radius:16px;border:none;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ef476f,#b5179e)}
.steer-row{display:flex;gap:10px}
.steer-btn{touch-action:none;width:82px;height:86px;border-radius:18px;border:2px solid rgba(255,209,102,0.45);background:rgba(19,9,31,0.9);color:#ffd166;font-family:inherit;font-size:18px;font-weight:800;cursor:pointer}
.drift-btn{touch-action:none;width:122px;height:78px;border-radius:18px;border:none;background:linear-gradient(135deg,#ef476f,#ff9a3d);color:#fff;font-family:inherit;font-size:18px;font-weight:800;cursor:pointer}
.boost-btn{touch-action:none;width:122px;height:56px;border-radius:14px;border:none;background:linear-gradient(135deg,#06d6a0,#3b82f6);color:#042f2e;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer}
.step-btn{touch-action:none;flex:1;padding:14px;border-radius:14px;border:2px solid rgba(255,209,102,0.65);background:rgba(19,9,31,0.92);color:#ffd166;font-family:inherit;font-size:18px;font-weight:800;cursor:pointer}
.throw-btn{touch-action:none;width:100%;padding:16px;border-radius:18px;border:none;font-family:inherit;font-size:21px;font-weight:800;cursor:pointer;color:#190d26;background:linear-gradient(135deg,#ffd166,#ff9a3d)}
.banner{position:absolute;top:72px;left:50%;transform:translateX(-50%);background:rgba(19,9,31,0.94);border:2px solid #ffd166;border-radius:16px;padding:9px 24px;font-size:22px;font-weight:800;color:#ffd166;z-index:5;pointer-events:none;display:none}
.qp-controls{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:5}
.qp-controls>*{pointer-events:auto}
.mute-btn,.menu-btn{pointer-events:auto;background:rgba(19,9,31,0.9);border:1px solid rgba(255,255,255,0.24);color:#fff;border-radius:10px;padding:7px 12px;font-family:inherit;font-weight:700;cursor:pointer}
.menu-btn{border-color:rgba(255,209,102,0.5);color:#ffd166}
</style>

<script>
/* ===================== EMB BRIDGE (لا تغيّر هذا الجزء) ===================== */
let EMB=null; const embHostConns={};
window.addEventListener('message', e=>{
  const m=e&&e.data; if(!m||!m.__emb) return;
  if(m.init){ EMB={role:m.role,code:m.code,name:m.name}; return embStart(); }
  if(!EMB) return;
  if(EMB.role==='tv'){
    if(m.event==='data'){
      let c=embHostConns[m.id];
      if(!c)c=embHostConns[m.id]={id:m.id,send:obj=>{try{parent.postMessage({__emb:1,to:m.id,data:obj},'*')}catch(e){}}};
      try{onHostMsg(c,m.data)}catch(e){}
    } else if(m.event==='disconnect'){
      try{onPlayerLeave(m.id)}catch(e){}
      delete embHostConns[m.id];
    }
  } else if(EMB.role==='ph'){
    if(m.data!==undefined){try{onCtlMsg(m.data)}catch(e){}}
  }
});
function embReveal(){try{document.documentElement.classList.remove('emb-pending')}catch(e){}}
function embStart(){
  embReveal();
  if(EMB.role==='tv'){ startTv(); } else { startPhone(); }
}
setTimeout(()=>{ if(!EMB) embReveal(); }, 2500);

/* ===================== من هنا تبدأ لعبتك ===================== */
function ctlSend(obj){ try{parent.postMessage({__emb:1,data:obj},'*')}catch(e){} }

// نظام حماية مستقل لباقة تحديات الألعاب (7 ألعاب مدمجة)
const GAME_SECURITY_PACK = Object.freeze({
  gameId: 'challenges_pack',
  ownerKeyId: 'OWNER-KEY-G1-PACK-9041',
  sealHash: 'pack9041a8f3',
  challenges: Object.freeze(['skyfall3d', 'bowling3d', 'arena', 'heist', 'kitchen', 'tanks', 'drift'])
});
function verifyPackIntegrity() {
  if (!GAME_SECURITY_PACK || GAME_SECURITY_PACK.gameId !== 'challenges_pack' || GAME_SECURITY_PACK.ownerKeyId !== 'OWNER-KEY-G1-PACK-9041' || GAME_SECURITY_PACK.challenges.length !== 7) {
    document.getElementById('root').innerHTML = '<div class="card"><h2>تم إيقاف التشغيل</h2><p>تم اكتشاف تعديل غير مصرح به في ملفات الباقة — يلزم تفويض المالك.</p></div>';
    return false;
  }
  return true;
}

const __q = [];
function __call(fn, args) {
  if (window.__PACK && window.__PACK[fn]) return window.__PACK[fn](...args);
  __q.push([fn, args]);
}
function startTv() { __call('startTv', []); }
function startPhone() { __call('startPhone', []); }
function onHostMsg(c, data) { __call('onHostMsg', [c, data]); }
function onPlayerLeave(id) { __call('onPlayerLeave', [id]); }
function onCtlMsg(data) { __call('onCtlMsg', [data]); }
function startQuickPlay() { __call('startQuickPlay', []); }
function startPack(mode) { __call('startPack', [mode]); }
function generateTashkeela() { __call('generateTashkeela', []); }
function goToGamePicker() { __call('goToGamePicker', []); }
function returnToMenu() { __call('returnToMenu', []); }
function returnToConnect() { __call('returnToConnect', []); }
function handleAction(p, sub) { __call('handleAction', [p, sub]); }
</script>

}

function detectSoftwareGl() {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl2') || c.getContext('webgl');
    if (!gl) return true;
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    const gpu = String(gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER));
    gl.getExtension('WEBGL_lose_context')?.loseContext();
    return /SwiftShader|llvmpipe|softpipe|Software|Basic Render/i.test(gpu);
  } catch { return true; }
}

function ensureRenderer() {
  const mountEl = document.getElementById('glMount');
  if (!mountEl) return;
  if (!renderer) {
    isSoftwareGl = detectSoftwareGl();
    renderer = new THREE.WebGLRenderer({ antialias: !isSoftwareGl, powerPreference: 'high-performance', preserveDrawingBuffer: true });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.setPixelRatio(isSoftwareGl ? 1 : Math.min(window.devicePixelRatio, 2));
    renderer.setSize(mountEl.clientWidth || 1280, mountEl.clientHeight || 720);
    renderer.shadowMap.enabled = !isSoftwareGl;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    mountEl.innerHTML = '';
    mountEl.appendChild(renderer.domElement);
    window.addEventListener('resize', () => {
      if (!renderer || !camera) return;
      const w = mountEl.clientWidth || window.innerWidth, h = mountEl.clientHeight || window.innerHeight;
      camera.aspect = w / h; camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });
  }
}

function toggleCanvasLayer(is3d) {
  const cv = document.getElementById('cv'), gl = document.getElementById('glMount'), bn = document.getElementById('banner');
  if (cv) cv.style.display = is3d ? 'none' : 'block';
  if (gl) gl.style.display = is3d ? 'block' : 'none';

}

function makeSkyTileTexture() {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#e0f2fe'; ctx.fillRect(0, 0, 256, 256);
  ctx.fillStyle = '#bae6fd';
  ctx.fillRect(0, 0, 128, 128); ctx.fillRect(128, 128, 128, 128);
  ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 4; ctx.strokeRect(2, 2, 252, 252);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

  const pmrem = new THREE.PMREMGenerator(renderer);

  pmrem.dispose();

  const w = document.getElementById('glMount').clientWidth || 1280;
  const h = document.getElementById('glMount').clientHeight || 720;
  camera = new THREE.PerspectiveCamera(58, w / h, 0.2, 320);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x3b82f6, 1.0));
  const sun = new THREE.DirectionalLight(0xfff7ed, 1.65);
  sun.position.set(22, 42, 24);
  if (!isSoftwareGl) { sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); }
  scene.add(sun);

  const tileTex = makeSkyTileTexture();
  tileTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const railMat = new THREE.MeshStandardMaterial({ color: 0xff4d8d, roughness: 0.35, metalness: 0.15 });
  const trimMat = new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.25, metalness: 0.72 });

  for (const seg of roundSpec.platforms) {
    const len = seg.zStart - seg.zEnd;
    const mat = new THREE.MeshStandardMaterial({ map: tileTex.clone(), roughness: 0.4, metalness: 0.05 });
    mat.map.repeat.set(seg.halfW, len / 4); mat.map.needsUpdate = true;
    const plat = new THREE.Mesh(new THREE.BoxGeometry(seg.halfW * 2, 1.2, len), mat);
    plat.position.set(0, seg.y - 0.6, (seg.zStart + seg.zEnd) / 2);
    plat.receiveShadow = true;
    const rL = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.55, len), railMat);
    rL.position.set(-seg.halfW - 0.22, seg.y + 0.26, (seg.zStart + seg.zEnd) / 2);
    const rR = rL.clone(); rR.position.x = seg.halfW + 0.22;
    scene.add(plat, rL, rR);
  }

  const boostMat = new THREE.MeshStandardMaterial({ color: 0x06d6a0, emissive: 0x06d6a0, emissiveIntensity: 0.5, roughness: 0.25 });
  for (const bp of roundSpec.boosts) {
    const py = skyPlatformAt(bp.x, bp.z) || 0;
    const pad = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.14, 3.6), boostMat);
    pad.position.set(bp.x, py + 0.07, bp.z);
    scene.add(pad);
  }

  const hubMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3, metalness: 0.7 });
  const barMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.32, metalness: 0.15 });
  const capMat = new THREE.MeshStandardMaterial({ color: 0xef476f, roughness: 0.35, metalness: 0.15 });
  sweeperMeshes3d.length = 0;
  for (const sw of roundSpec.sweepers) {
    const grp = new THREE.Group(); grp.position.set(sw.x, sw.y, sw.z);
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.9, 1.3, 18), hubMat);
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, sw.radius * 2, 14), barMat);
    arm.rotation.z = Math.PI / 2; arm.position.y = 0.25;
    const c1 = new THREE.Mesh(new THREE.SphereGeometry(0.46, 12, 12), capMat); c1.position.set(sw.radius, 0.25, 0);
    const c2 = c1.clone(); c2.position.x = -sw.radius;
    grp.add(hub, arm, c1, c2);
    scene.add(grp);
    sweeperMeshes3d.push(grp);
  }

  const wallMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.3, metalness: 0.25 });
  wallMeshes3d.length = 0;
  for (const mw of roundSpec.walls) {
    const grp = new THREE.Group();
    const blk = new THREE.Mesh(new THREE.BoxGeometry(mw.w, mw.h, mw.d), wallMat);
    const stp = new THREE.Mesh(new THREE.BoxGeometry(mw.w + 0.06, 0.35, mw.d + 0.06), trimMat); stp.position.y = 0.5;

  // Fluffy distant 3D clouds
  const clouds = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 12, 10), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95 }), 64);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < 64; i++) {
    const side = (i % 2 === 0 ? -1 : 1) * (14 + (i % 5) * 6);
    dummy.position.set(side, -6 - (i % 4) * 3, 14 - i * 6.8);
    dummy.scale.set(4 + (i % 3) * 1.6, 2.2, 3.5);

  const aL = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 6.5, 16), trimMat); aL.position.set(-6.4, 3.25, 0);

  for (const p of G.players) {
    p.mesh3d = buildRunnerMesh3D(p.colorHexNum);
    scene.add(p.mesh3d);
  }
}

function skyPlatformAt(x, z) {
  const segs = SKYFALL_ROUNDS[G.sky.round % SKYFALL_ROUNDS.length].platforms;
  for (const pl of segs) {
    // 0.35 tolerance at ends prevents false edge drops when stepping/jumping fast
    if (z <= pl.zStart + 0.35 && z >= pl.zEnd - 0.35 && Math.abs(x) <= pl.halfW + 0.18) return pl.y;
  }
  return null;
}

function triggerSkyJump(p) {
  if (!p || G.phase !== 'playing' || p.finished) return;
  p.jumpBuf = 0.18;
  if (p.grounded || p.coyote > 0) {
    p.rVy = 10.6;
    p.grounded = false;
    p.coyote = 0;
    p.jumpBuf = 0;
    sfx(540, 0.12, 'triangle', 0.14);
  }
}
function triggerSkyDive(p) {
  if (!p || G.phase !== 'playing' || p.finished || p.diveCd > 0) return;
  p.diveCd = 1.25;
  p.rVz -= 11.5;
  if (p.grounded) p.rVy = 4.6;
  sfx(680, 0.13, 'sine', 0.12);
}

  ctx.fillStyle = '#dc2626'; ctx.fillRect(0, 880, 512, 14);

function computeBowlingScore(rolls) {
  let total = 0, idx = 0;
  for (let f = 0; f < G.bowl.totalFrames && idx < rolls.length; f++) {
    const r1 = rolls[idx] ?? 0;
    if (r1 === 10) { total += 10 + (rolls[idx+1] ?? 0) + (rolls[idx+2] ?? 0); idx += 1; }
    else { const r2 = rolls[idx+1] ?? 0; total += r1 + r2 + (r1 + r2 === 10 ? (rolls[idx+2] ?? 0) : 0); idx += 2; }
  }

}

function handleAction(p, sub) {
  if (!p || G.phase !== 'playing') return;
  if (G.currentChallenge === 'skyfall3d') {
    if (sub === 'dive') triggerSkyDive(p); else triggerSkyJump(p);
  } else if (G.currentChallenge === 'bowling3d') {
    const cur = G.players[G.bowl.turnIdx];
    if (cur && cur.id === p.id && G.bowl.subPhase === 'aiming') throwBowlBall(G.bowl.aimX, G.bowl.spin, G.bowl.power);
  } else if (G.currentChallenge === 'arena') {
    if (!p.alive || p.dashCd > 0) return;
    const m = Math.hypot(p.ix, p.iy); const dx = m>0.1?p.ix/m:1, dy = m>0.1?p.iy/m:0;
    p.vx += dx*520; p.vy += dy*520; p.dashTime = 0.25; p.dashCd = 1.4; sfx(380,0.12,'triangle',0.14); emitParticles(p.x,p.y,p.color,8);
  } else if (G.currentChallenge === 'heist') {
    if (p.stun > 0 || p.dashCd > 0) return; p.dashTime = 0.35; p.dashCd = 1.8; sfx(460,0.12,'sine',0.12); emitParticles(p.x,p.y,'#06d6a0',10);
  } else if (G.currentChallenge === 'kitchen') {
    let near = null, best = 95;
    for (const s of G.kitchen.stations) { const d = Math.hypot(p.x-s.x,p.y-s.y); if (d<best) { best=d; near=s; } }
    if (!near) return;
    if (near.type === 'crate') { p.holding = p.holding === near.item ? null : (!p.holding ? near.item : p.holding); sfx(600,0.07,'sine',0.1); }
    else if (near.type === 'chop') {
      if (p.holding==='raw_lettuce'&&!near.item){near.item='raw_lettuce';near.progress=0;p.holding=null;}
      else if (near.item==='raw_lettuce'){near.progress+=0.5;sfx(480,0.06,'square',0.08);if(near.progress>=1)near.item='chopped_lettuce';}
      else if (near.item==='chopped_lettuce'&&!p.holding){p.holding='chopped_lettuce';near.item=null;near.progress=0;}
    } else if (near.type === 'grill') {
      if (p.holding==='raw_patty'&&!near.item){near.item='raw_patty';near.progress=0;near.burn=0;p.holding=null;}
      else if ((near.item==='cooked_patty'||near.item==='burnt')&&!p.holding){p.holding=near.item==='burnt'?null:'cooked_patty';near.item=null;near.progress=0;near.burn=0;sfx(720,0.09,'triangle',0.1);}
    } else if (near.type === 'plate') {
      if (p.holding&&['bun','cooked_patty','chopped_lettuce','cheese'].includes(p.holding)&&!near.items.includes(p.holding)){
        near.items.push(p.holding); p.holding=null; sfx(520,0.08,'sine',0.1);
        const key=[...near.items].sort().join('+');
        if(key==='bun+chopped_lettuce+cooked_patty'){near.items=[];p.holding='burger';sfx(840,0.15,'triangle',0.14);}
        else if(key==='bun+cheese+cooked_patty'){near.items=[];p.holding='cheese_burger';sfx(880,0.15,'triangle',0.14);}
      }
    } else if (near.type === 'serve' && (p.holding==='burger'||p.holding==='cheese_burger')) {
      const idx=G.kitchen.orders.findIndex(o=>o.kind===p.holding);
      if(idx!==-1){G.kitchen.orders.splice(idx,1);const pts=Math.round((p.holding==='cheese_burger'?160:130)*G.kitchen.combo);p.stageScore+=pts;p.totalScore+=pts;G.kitchen.combo=Math.min(3,+(G.kitchen.combo+0.5).toFixed(1));p.holding=null;emitParticles(near.x,near.y,'#ffd166',18);sfx(940,0.22,'triangle',0.18);pushKitchenOrder();}
    }
  } else if (G.currentChallenge === 'tanks') {
    if (sub === 'mine') dropTankMine(p); else fireTankShell(p);
  } else if (G.currentChallenge === 'drift') {
    useDriftItem(p);
  }
}

// 3D SkyFall step (Multi-round + Coyote Time + Jump Buffer)
function stepSkyFall3D(dt) {
  const rSpec = SKYFALL_ROUNDS[G.sky.round % SKYFALL_ROUNDS.length];
  G.sky.elapsed += dt;
  rSpec.sweepers.forEach((sw, i) => { sw.angle += sw.speed * dt; if (sweeperMeshes3d[i]) sweeperMeshes3d[i].rotation.y = sw.angle; });
  rSpec.walls.forEach((mw, i) => { mw.x = Math.sin(G.sky.elapsed * mw.speed + mw.phase) * mw.amp; if (wallMeshes3d[i]) wallMeshes3d[i].position.x = mw.x; });
  if (crownGroup3d) crownGroup3d.rotation.y += dt * 1.8;

  for (const p of G.players) {
    if (p.finished) continue;
    if (p.diveCd > 0) p.diveCd = Math.max(0, p.diveCd - dt);
    if (p.boost3d > 0) p.boost3d = Math.max(0, p.boost3d - dt);
    if (p.stun3d > 0) p.stun3d = Math.max(0, p.stun3d - dt);
    if (p.coyote > 0) p.coyote = Math.max(0, p.coyote - dt);
    if (p.jumpBuf > 0) p.jumpBuf = Math.max(0, p.jumpBuf - dt);

    if (p.isBot) {
      p.iy = -0.92;
      const laneOff = ((parseInt(p.id.replace('bot_',''),10)||0) - 1) * 1.9;
      let tx = laneOff + Math.sin(G.sky.elapsed * 0.9 + p.animT) * 1.5;
      for (const mw of rSpec.walls) {
        if (p.rZ - mw.z < 9 && p.rZ - mw.z > 0 && Math.abs(p.rX - mw.x) < mw.w * 0.75) tx = p.rX > mw.x ? 4.2 : -4.2;
      }
      p.ix = Math.max(-1, Math.min(1, (tx - p.rX) * 0.65));
      if ((p.grounded || p.coyote > 0) && skyPlatformAt(p.rX, p.rZ - 2.3) === null && skyPlatformAt(p.rX, p.rZ - 5.2) !== null) triggerSkyJump(p);
    }

    if (p.stun3d <= 0) {
      const sp = p.boost3d > 0 ? 16.5 : 11.4;
      const mag = Math.hypot(p.ix, p.iy);
      if (mag > 0.06) {
        const nx = p.ix / Math.max(1, mag), nz = p.iy / Math.max(1, mag);
        p.rVx += (nx * sp - p.rVx) * Math.min(1, dt * 8.5);
        p.rVz += (nz * sp - p.rVz) * Math.min(1, dt * 8.5);

    } else if (gY === null || p.rY > gY + 0.15) {
      p.grounded = false;
    }

    if (p.rY < -7) { p.rX = p.cpX; p.rY = p.cpY + 1.5; p.rZ = p.cpZ; p.rVx = 0; p.rVy = 0; p.rVz = 0; p.stun3d = 0.25; if (!p.isBot) sfx(180,0.2,'sawtooth',0.12); }

      }
    }
    for (const sw of rSpec.sweepers) {
      if (Math.abs(p.rY - sw.y) > 1.2) continue;
      const dx = p.rX - sw.x, dz = p.rZ - sw.z, d = Math.hypot(dx, dz);

        return;
      } else {
        finishStage();
        return;
      }
    }

    if (p.mesh3d) {

      p.mesh3d.rotation.y = p.yaw;
      const spd = Math.hypot(p.rVx, p.rVz);

      p.mesh3d.userData.armL.rotation.x = -swg; p.mesh3d.userData.armR.rotation.x = swg;
    }
  }
}

    const mag=Math.hypot(p.ix,p.iy);if(mag>0.08){const sp=p.speedBoost>0?255:185;p.x+=(p.ix/Math.max(1,mag))*sp*dt;p.y+=(p.iy/Math.max(1,mag))*sp*dt;p.angle=Math.atan2(p.iy,p.ix);}
    for(const w of TANK_WALLS)resolveCR(p,20,w); for(const cr of G.tanks.crates)resolveCR(p,20,cr);
    for(let i=G.tanks.powerups.length-1;i>=0;i--){const pw=G.tanks.powerups[i];if(Math.hypot(p.x-pw.x,p.y-pw.y)<32){if(pw.type==='triple')p.triple=9;else if(pw.type==='shield')p.shield=12;else p.speedBoost=8;G.tanks.powerups.splice(i,1);}}
  }
  for(let i=G.tanks.mines.length-1;i>=0;i--){const mn=G.tanks.mines[i];if(mn.arm>0){mn.arm-=dt;continue;}for(const p of G.players)if(p.alive&&Math.hypot(p.x-mn.x,p.y-mn.y)<28){killTank(p,mn.ownerId);G.tanks.mines.splice(i,1);break;}}
  for(let i=G.tanks.shells.length-1;i>=0;i--){const sh=G.tanks.shells[i];sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;sh.life-=dt;if(sh.life<=0)sh.alive=false;for(const w of TANK_WALLS)if(stepSW(sh,w))break;for(let ci=G.tanks.crates.length-1;ci>=0;ci--){const cr=G.tanks.crates[ci];if(sh.x>cr.x-sh.r&&sh.x<cr.x+cr.w+sh.r&&sh.y>cr.y-sh.r&&sh.y<cr.y+cr.h+sh.r){sh.alive=false;cr.hp--;if(cr.hp<=0){const ts=['triple','shield','speed'];G.tanks.powerups.push({x:cr.x+20,y:cr.y+20,type:ts[Math.floor(Math.random()*3)]});G.tanks.crates.splice(ci,1);}break;}}if(sh.alive)for(const p of G.players)if(p.alive&&!(sh.bounces===2&&sh.ownerId===p.id&&sh.life>4.25)&&Math.hypot(sh.x-p.x,sh.y-p.y)<20+sh.r){sh.alive=false;killTank(p,sh.ownerId);break;}if(!sh.alive)G.tanks.shells.splice(i,1);}
  const alive=G.players.filter(p=>p.alive);if(alive.length<=1){if(alive[0]){alive[0].stageScore+=150;alive[0].totalScore+=150;}finishStage();}
}
function distToTrack(x,y){let m=9999;for(let i=0;i<DRIFT_WAYPOINTS.length;i++){const a=DRIFT_WAYPOINTS[i],b=DRIFT_WAYPOINTS[(i+1)%DRIFT_WAYPOINTS.length],vx=b.x-a.x,vy=b.y-a.y,l2=vx*vx+vy*vy||1,t=Math.max(0,Math.min(1,((x-a.x)*vx+(y-a.y)*vy)/l2)),d=Math.hypot(x-(a.x+t*vx),y-(a.y+t*vy));if(d<m)m=d;}return m;}
function stepDrift(dt){
  for(let i=G.drift.oils.length-1;i>=0;i--){G.drift.oils[i].ttl-=dt;if(G.drift.oils[i].ttl<=0)G.drift.oils.splice(i,1);}
  for(let i=G.drift.rockets.length-1;i>=0;i--){const rk=G.drift.rockets[i];rk.x+=rk.vx*dt;rk.y+=rk.vy*dt;rk.ttl-=dt;let hit=rk.ttl<=0;for(const p of G.players)if(p.id!==rk.ownerId&&Math.hypot(p.x-rk.x,p.y-rk.y)<24){p.stun=1.1;p.vx*=0.25;p.vy*=0.25;hit=true;break;}if(hit)G.drift.rockets.splice(i,1);}
  for(const p of G.players){
    if(p.finished)continue;if(p.stun>0){p.stun=Math.max(0,p.stun-dt);p.angle+=dt*10;continue;}
    if(p.isBot){const wp=DRIFT_WAYPOINTS[p.wp%DRIFT_WAYPOINTS.length];let diff=Math.atan2(wp.y-p.y,wp.x-p.x)-p.angle;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;p.steer=Math.max(-1,Math.min(1,diff*2.2));p.drifting=Math.abs(diff)>0.48;p.throttle=0.96;if(p.item&&Math.random()<dt*0.9)useDriftItem(p);}
    const sp=Math.hypot(p.vx,p.vy);p.angle+=p.steer*(p.drifting?3.8:2.7)*(sp>20?1:0.4)*dt;const fX=Math.cos(p.angle),fY=Math.sin(p.angle),off=distToTrack(p.x,p.y)>64,acc=(p.boost>0?780:off?280:495)*p.throttle;p.vx+=fX*acc*dt;p.vy+=fY*acc*dt;const rx=-fY,ry=fX,lat=p.vx*rx+p.vy*ry,gr=p.drifting?0.94:0.78;p.vx-=rx*lat*(1-Math.pow(gr,dt*60));p.vy-=ry*lat*(1-Math.pow(gr,dt*60));
    if(p.drifting&&Math.abs(p.steer)>0.25&&sp>130){p.driftCharge=Math.min(1.5,p.driftCharge+dt);if(Math.random()<0.5)G.drift.skids.push({x:p.x,y:p.y,ttl:2.2});}else if(!p.drifting&&p.driftCharge>=0.7){p.boost=Math.max(p.boost,0.95);p.driftCharge=0;}else if(!p.drifting)p.driftCharge=Math.max(0,p.driftCharge-dt*2);
    if(p.boost>0)p.boost=Math.max(0,p.boost-dt);const d=Math.pow(off?0.25:0.48,dt);p.vx*=d;p.vy*=d;p.x=Math.max(24,Math.min(976,p.x+p.vx*dt));p.y=Math.max(24,Math.min(596,p.y+p.vy*dt));
    for(const bp of DRIFT_BOOSTS)if(Math.hypot(p.x-bp.x,p.y-bp.y)<30)p.boost=1.1;
    for(const ib of DRIFT_ITEMS)if(!p.item&&Math.hypot(p.x-ib.x,p.y-ib.y)<28){const pl=['nitro','rocket','oil'];p.item=pl[Math.floor(Math.random()*3)];}
    for(let oi=G.drift.oils.length-1;oi>=0;oi--)if(G.drift.oils[oi].ownerId!==p.id&&Math.hypot(p.x-G.drift.oils[oi].x,p.y-G.drift.oils[oi].y)<24){p.stun=0.9;G.drift.oils.splice(oi,1);}
    const tw=DRIFT_WAYPOINTS[p.wp%DRIFT_WAYPOINTS.length];if(Math.hypot(p.x-tw.x,p.y-tw.y)<78){p.wp++;p.stageScore+=25;p.totalScore+=25;if(p.wp>=DRIFT_WAYPOINTS.length){p.wp=0;p.lap++;if(p.lap>G.drift.totalLaps){p.finished=true;p.stageScore+=180;p.totalScore+=180;finishStage();return;}}}
  }
  for(let i=G.drift.skids.length-1;i>=0;i--){G.drift.skids[i].ttl-=dt;if(G.drift.skids[i].ttl<=0)G.drift.skids.splice(i,1);}
}

let driftTrackCache = null;
function getDriftTrackCache() {
  if (driftTrackCache) return driftTrackCache;
  const c = document.createElement('canvas'); c.width = 1000; c.height = 620;
  const tc = c.getContext('2d');
  tc.fillStyle = '#14532d'; tc.fillRect(0,0,1000,620); tc.lineJoin = 'round'; tc.lineCap = 'round';
  tc.beginPath(); DRIFT_WAYPOINTS.forEach((p,i)=>i===0?tc.moveTo(p.x,p.y):tc.lineTo(p.x,p.y)); tc.closePath();
  tc.strokeStyle='#dc2626'; tc.lineWidth=132; tc.stroke(); tc.strokeStyle='#f8fafc'; tc.setLineDash([22,22]); tc.lineWidth=132; tc.stroke(); tc.setLineDash([]);
  tc.strokeStyle='#1e293b'; tc.lineWidth=114; tc.stroke(); tc.strokeStyle='rgba(255,255,255,0.22)'; tc.setLineDash([18,18]); tc.lineWidth=3; tc.stroke(); tc.setLineDash([]);
  tc.fillStyle='#fff'; tc.fillRect(490,53,14,114); tc.fillStyle='#111'; for(let y=53;y<167;y+=16){tc.fillRect(490,y,7,8);tc.fillRect(497,y+8,7,8);}
  driftTrackCache = c; return c;
}

function render2DTv(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);
  const scale = Math.min(w/1000, h/620);
  ctx.save(); ctx.translate((w-1000*scale)/2+(Math.random()-0.5)*G.shake, (h-620*scale)/2+(Math.random()-0.5)*G.shake); ctx.scale(scale, scale);
  if (G.currentChallenge === 'arena') {
    const cx=500,cy=315; ctx.fillStyle='#2d1c45'; ctx.beginPath(); ctx.arc(cx,cy,G.arena.radius,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#ffd166'; ctx.lineWidth=8; ctx.stroke();
    ctx.fillStyle='rgba(56,189,248,0.16)'; ctx.beginPath(); ctx.arc(cx,cy,95,0,Math.PI*2); ctx.fill();
    for(const bp of G.arena.bumpers){ctx.fillStyle='#190d26';ctx.beginPath();ctx.arc(bp.x,bp.y,bp.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffd166';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle='#ffd166';ctx.font='bold 20px Tajawal';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⚡',bp.x,bp.y+1);}
    for(const mt of G.arena.meteors){ctx.fillStyle='rgba(239,71,111,0.28)';ctx.beginPath();ctx.arc(mt.x,mt.y,mt.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ef476f';ctx.lineWidth=3;ctx.stroke();}
  } else if (G.currentChallenge === 'heist') {
    ctx.fillStyle='#1b102d'; ctx.fillRect(0,0,1000,620);
    for(const p of G.players)if(p.home){ctx.fillStyle=p.color+'26';ctx.strokeStyle=p.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.home.x,p.home.y,44,0,Math.PI*2);ctx.fill();ctx.stroke();}
    for(const sp of G.heist.spotlights){ctx.fillStyle='rgba(255,209,102,0.22)';ctx.beginPath();ctx.arc(sp.cx+Math.cos(sp.angle)*sp.orbitR,sp.cy+Math.sin(sp.angle)*sp.orbitR,sp.r,0,Math.PI*2);ctx.fill();}
    for(const gm of G.heist.gems){ctx.fillStyle=gm.kind==='ruby'?'#ef476f':'#ffd166';ctx.beginPath();ctx.moveTo(gm.x,gm.y-12);ctx.lineTo(gm.x+10,gm.y);ctx.lineTo(gm.x,gm.y+12);ctx.lineTo(gm.x-10,gm.y);ctx.closePath();ctx.fill();}
    for(const l of G.heist.lasers){ctx.strokeStyle='#ff4d6d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(l.cx,l.cy);ctx.lineTo(l.cx+Math.cos(l.angle)*l.len,l.cy+Math.sin(l.angle)*l.len);ctx.stroke();}
  } else if (G.currentChallenge === 'kitchen') {
    ctx.fillStyle='#231434'; ctx.fillRect(60,130,880,420);
    G.kitchen.orders.forEach((o,i)=>{const ox=110+i*390;ctx.fillStyle='rgba(19,9,31,0.92)';ctx.strokeStyle='#ffd166';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(ox,64,360,54,12);ctx.fill();ctx.stroke();ctx.fillStyle='#ffd166';ctx.font='bold 15px Tajawal';ctx.textAlign='right';ctx.fillText(o.label,ox+344,90);ctx.fillStyle='#06d6a0';ctx.fillRect(ox+16,104,(328*Math.max(0,o.ttl))/34,6);});
    for(const s of G.kitchen.stations){ctx.fillStyle=s.type==='serve'?'#06d6a0':s.type==='grill'?'#475569':s.type==='chop'?'#c2410c':s.type==='plate'?'#e2e8f0':s.color;ctx.beginPath();ctx.roundRect(s.x-46,s.y-34,92,68,12);ctx.fill();ctx.fillStyle=(s.type==='grill'||s.type==='chop')?'#fff':'#190d26';ctx.font='bold 14px Tajawal';ctx.textAlign='center';ctx.fillText(s.label,s.x,s.y+4);}
  } else if (G.currentChallenge === 'tanks') {
    ctx.fillStyle='#251d33'; ctx.fillRect(0,0,1000,620);
    for(const cr of G.tanks.craters){ctx.fillStyle='rgba(0,0,0,0.38)';ctx.beginPath();ctx.arc(cr.x,cr.y,cr.r,0,Math.PI*2);ctx.fill();}
    for(const wR of TANK_WALLS){ctx.fillStyle='#47365e';ctx.fillRect(wR.x,wR.y,wR.w,wR.h);ctx.strokeStyle='#ffd166';ctx.lineWidth=2;ctx.strokeRect(wR.x,wR.y,wR.w,wR.h);}
    for(const c of G.tanks.crates){ctx.fillStyle='#b45309';ctx.fillRect(c.x,c.y,c.w,c.h);ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.strokeRect(c.x,c.y,c.w,c.h);}
    for(const pw of G.tanks.powerups){ctx.fillStyle=pw.type==='triple'?'#ef476f':pw.type==='shield'?'#06d6a0':'#38bdf8';ctx.beginPath();ctx.arc(pw.x,pw.y,14,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();}

    else if(G.currentChallenge==='drift'){ctx.rotate(p.angle);ctx.fillStyle=p.color;ctx.beginPath();ctx.roundRect(-18,-11,36,22,6);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#0f172a';ctx.fillRect(2,-8,9,16);}
    else{ctx.fillStyle=p.stun>0?'#94a3b8':p.color;ctx.beginPath();ctx.arc(0,0,23,0,Math.PI*2);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();}
    ctx.restore();
    ctx.fillStyle='#fff';ctx.font='bold 12px Tajawal';ctx.textAlign='center';ctx.fillText(p.name.split(' ')[0],p.x,p.y-28);
  }
  ctx.restore();
}

function wireJoystick(zoneId, knobId, onChange) {
  const z = document.getElementById(zoneId), k = document.getElementById(knobId);
  if (!z || !k) return;
  let active = false; const maxR = 46;
  function upd(cx, cy) {
    const r = z.getBoundingClientRect();
    let dx = cx - (r.left + r.width/2), dy = cy - (r.top + r.height/2);
    const d = Math.hypot(dx, dy);
    if (d > maxR) { dx = (dx/d)*maxR; dy = (dy/d)*maxR; }
    k.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    onChange(dx/maxR, dy/maxR);
  }
  function rst() { active = false; k.style.transform = 'translate(-50%,-50%)'; onChange(0,0); }
  z.addEventListener('pointerdown', e => { e.preventDefault(); active=true; z.setPointerCapture(e.pointerId); upd(e.clientX, e.clientY); });
  z.addEventListener('pointermove', e => { if (active) upd(e.clientX, e.clientY); });
  z.addEventListener('pointerup', rst); z.addEventListener('pointercancel', rst);
}

function afterDraw(cb) {
  const gl = renderer.getContext();
  const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
  gl.flush();
  const poll = () => {
    const st = sync && gl.getSyncParameter(sync, gl.SYNC_STATUS);
    if (st === gl.UNSIGNALED) setTimeout(poll, 5);
    else { gl.deleteSync(sync); setTimeout(cb, 80); }
  };
  setTimeout(poll, 5);
}

function tvLoop(ts) {
  const dt = Math.min(0.05, Math.max(0.001, (ts - (G.lastTick || ts)) / 1000));
  G.lastTick = ts;

  if (G.phase === 'playing') {
    if (G.hitstop > 0) { G.hitstop -= dt; }
    else {
      G.timeLeft = Math.max(0, G.timeLeft - dt);
      if (G.timeLeft <= 0) { finishStage(); }
      else if (G.currentChallenge === 'skyfall3d') stepSkyFall3D(dt);
      else if (G.currentChallenge === 'bowling3d') stepBowling3D(dt);
      else if (G.currentChallenge === 'arena') stepArena(dt);
      else if (G.currentChallenge === 'heist') stepHeist(dt);
      else if (G.currentChallenge === 'kitchen') stepKitchen(dt);
      else if (G.currentChallenge === 'tanks') stepTanks(dt);
      else if (G.currentChallenge === 'drift') stepDrift(dt);

      for (let i=G.particles.length-1;i>=0;i--) { const pt=G.particles[i]; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.life-=dt; if(pt.life<=0)G.particles.splice(i,1); }
      G.shake = Math.max(0, G.shake - dt*36);
    }
  }

  updateOverlay();

  if (G.phase === 'playing' && (G.currentChallenge === 'skyfall3d' || G.currentChallenge === 'bowling3d') && renderer && scene && camera) {
    if (G.currentChallenge === 'skyfall3d') {
      const hero = G.players.find(p => !p.isBot) || G.players[0];
      if (hero) {
        _v3.set(hero.rX * 0.45, hero.rY + 5.6, hero.rZ + 9.2);
        _look3.set(hero.rX * 0.35, hero.rY + 1.2, hero.rZ - 7);
        camera.position.lerp(_v3, Math.min(1, dt * 6));
        camera.lookAt(_look3);
      }
    } else if (G.currentChallenge === 'bowling3d') {
      if (G.bowl.subPhase === 'rolling' && G.bowl.ball.z < -8) {
        _v3.set(G.bowl.ball.x * 0.25, 1.55, Math.max(-7.5, G.bowl.ball.z + 5.2));
        _look3.set(0, 0.35, -16.4);
      } else {
        _v3.set(G.bowl.aimX * 0.35, 2.25, 7.6);
        _look3.set(0, 0.4, -10);
      }
      camera.position.lerp(_v3, Math.min(1, dt * 4.5));
      camera.lookAt(_look3);
    }
    renderer.render(scene, camera);
    if (isSoftwareGl) { afterDraw(() => tvLoop(performance.now())); return; }
  } else {
    const cv = document.getElementById('cv');
    if (cv && G.phase === 'playing') {
      const r = cv.getBoundingClientRect();
      if (cv.width !== Math.floor(r.width) || cv.height !== Math.floor(r.height)) { cv.width = Math.max(300, Math.floor(r.width)); cv.height = Math.max(200, Math.floor(r.height)); }
      render2DTv(cv.getContext('2d'), cv.width, cv.height);
    }
  }
  requestAnimationFrame(tvLoop);
}

      me.ix = (keys.has('ArrowRight')||keys.has('KeyD')?1:0) - (keys.has('ArrowLeft')||keys.has('KeyA')?1:0);
      me.iy = (keys.has('ArrowDown')||keys.has('KeyS')?1:0) - (keys.has('ArrowUp')||keys.has('KeyW')?1:0);
      me.steer = me.ix;
      me.throttle = keys.has('ArrowDown')||keys.has('KeyS') ? -0.45 : 1;
      me.drifting = keys.has('ShiftLeft') || keys.has('ShiftRight');
    }
    window.addEventListener('keydown', e => {
      keys.add(e.code); syncKeys();
      if (e.code === 'Space' || e.code === 'KeyE') { e.preventDefault(); handleAction(me, 'jump'); }
      else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') { if (G.currentChallenge === 'skyfall3d') handleAction(me, 'dive'); }
    });
    window.addEventListener('keyup', e => { keys.delete(e.code); syncKeys(); });
    window.addEventListener('blur', () => { keys.clear(); syncKeys(); });
    requestAnimationFrame(tvLoop);
  }
};

while (__q.length) {
  const [fn, args] = __q.shift();
  if (window.__PACK[fn]) window.__PACK[fn](...args);
}

(function() {
  const qs = new URLSearchParams(location.search);
  const direct = qs.get('game');
  if (qs.has('quickplay') || qs.has('autostart')) {
    window.__PACK.startQuickPlay();
    if (direct && CHALLENGE_META[direct]) startPack(direct);
  } else setTimeout(() => {
    if (!EMB) {
      embReveal();
      document.getElementById('root').innerHTML = `<div class="card"><h1 style="color:#ffd166;margin:0 0 10px">باقة تحديات الألعاب</h1><p style="opacity:0.85;margin:0 0 18px">7 ألعاب جماعية متكاملة تبدأ بالتشكيلة ثم اختيار اللعبة بصورها الحقيقية.</p><button class="btn" data-start="true" onclick="startQuickPlay()">تشغيل سريع</button></div>`;
    }
  }, 350);
})();
</script>
