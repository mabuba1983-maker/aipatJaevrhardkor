<!doctype html>
<html lang="ar" dir="rtl" class=""><head>
  <script type="module" src="/@vite/client"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>سباق الصواريخ</title>
<script>try{if(window.self!==window.top)document.documentElement.classList.add('emb-pending')}catch(e){}</script>
<style>html.emb-pending body{visibility:hidden}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&amp;display=swap" rel="stylesheet">
<style>
/* ===================== النمط والتصميم العام ===================== */
:root {
  --bg-deep: #190d26;
  --bg-card: rgba(25, 13, 38, 0.9);
  --gold-1: #ffd166;
  --gold-2: #ff9a3d;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  font-family: 'Tajawal', sans-serif;
  background-color: var(--bg-deep);
  color: var(--text-main);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  display: flex;
  flex-direction: column;
}

#root {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* بطاقة اللوبي الافتراضية قبل اتصال الإطار الحاضن */
.card {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  border: 2px solid rgba(255, 209, 102, 0.35);
  border-radius: 28px;
  padding: 36px 32px;
  text-align: center;
  max-width: 560px;
  margin: auto;
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 154, 61, 0.15);
}

.gold-gradient-text {
  background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.btn-primary {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #fff;
  border: none;
  font-family: 'Tajawal', sans-serif;
  font-weight: 800;
  font-size: 1.1rem;
  padding: 14px 28px;
  border-radius: 9999px;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-primary:active {
  transform: scale(0.96);
}

.btn-export {
  background: linear-gradient(135deg, #ffd166, #ff9a3d);
  color: #12081d;
  border: none;
  font-family: 'Tajawal', sans-serif;
  font-weight: 800;
  font-size: 1rem;
  padding: 12px 24px;
  border-radius: 9999px;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(255, 209, 102, 0.3);
  transition: transform 0.15s ease;
}
.btn-export:active {
  transform: scale(0.95);
}

.btn-danger {
  background: rgba(239, 68, 68, 0.25);
  border: 1px solid rgba(239, 68, 68, 0.6);
  color: #fca5a5;
  border-radius: 12px;
  padding: 6px 14px;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
}

/* ===================== أنماط شاشة التلفزيون TV ===================== */
.tv-container {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: radial-gradient(circle at 50% 25%, #24113d 0%, #10061d 100%);
  overflow: hidden;
}

.room-code-card {
  background: rgba(25, 13, 38, 0.92);
  border: 2px solid rgba(255, 209, 102, 0.45);
  box-shadow: 0 0 60px rgba(255, 154, 61, 0.25), inset 0 0 30px rgba(255, 209, 102, 0.1);
  border-radius: 36px;
  padding: 36px 60px;
  text-align: center;
  backdrop-filter: blur(20px);
  animation: floatCode 4s ease-in-out infinite;
  max-width: 720px;
  margin: auto;
}

@keyframes floatCode {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.room-code-badge {
  font-size: 5.5rem;
  font-weight: 900;
  letter-spacing: 14px;
  background: linear-gradient(135deg, #ffd166, #ff9a3d);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 6px 30px rgba(255, 154, 61, 0.6);
  font-family: monospace, 'Tajawal';
  margin: 10px 0;
}

.players-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 16px;
  max-width: 1100px;
  margin: 15px auto 25px auto;
  padding: 10px;
  min-height: 70px;
}

.player-chip {
  background: rgba(255, 255, 255, 0.08);
  border: 2px solid transparent;
  border-radius: 20px;
  padding: 10px 22px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 1.2rem;
  font-weight: 700;
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  animation: popIn 0.35s ease-out;
}

@keyframes popIn {
  0% { transform: scale(0.6); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.player-rocket-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  box-shadow: 0 0 15px currentColor;
}

.tv-hud-bar {
  position: absolute;
  top: 24px;
  left: 32px;
  right: 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 20;
  pointer-events: none;
}

.hud-glass-badge {
  background: rgba(18, 9, 31, 0.75);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 16px;
  padding: 10px 22px;
  font-size: 1.15rem;
  font-weight: 700;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

#flightCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 5;
}

.countdown-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(15, 7, 26, 0.9);
  backdrop-filter: blur(10px);
  z-index: 30;
}

.countdown-num {
  font-size: 12rem;
  font-weight: 900;
  background: linear-gradient(135deg, #ffd166, #ef4444);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: countPulse 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
}

@keyframes countPulse {
  0% { transform: scale(0.4); opacity: 0; }
  50% { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(1); opacity: 0.9; }
}

.podium-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(15, 7, 26, 0.93);
  backdrop-filter: blur(20px);
  z-index: 35;
  padding: 40px;
  animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.podium-ranks {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 24px;
  margin: 30px 0;
  width: 100%;
  max-width: 900px;
}

.podium-slot {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 24px 24px 12px 12px;
  padding: 24px 16px;
  border: 2px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.podium-1 {
  order: 2;
  height: 380px;
  border-color: #ffd166;
  background: linear-gradient(180deg, rgba(255, 209, 102, 0.25) 0%, rgba(255, 154, 61, 0.05) 100%);
  transform: translateY(-20px);
}
.podium-2 {
  order: 1;
  height: 310px;
  border-color: #94a3b8;
  background: linear-gradient(180deg, rgba(148, 163, 184, 0.2) 0%, rgba(148, 163, 184, 0.05) 100%);
}
.podium-3 {
  order: 3;
  height: 260px;
  border-color: #d97706;
  background: linear-gradient(180deg, rgba(217, 119, 6, 0.2) 0%, rgba(217, 119, 6, 0.05) 100%);
}

/* ===================== أنماط شاشة الجوال PHONE ===================== */
.phone-container {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 24px 20px;
  touch-action: manipulation;
  overflow: hidden;
  transition: background-color 0.4s ease;
}

.tap-zone {
  flex: 1;
  margin: 16px 0;
  border-radius: 32px;
  border: 4px solid rgba(255, 255, 255, 0.35);
  background: rgba(0, 0, 0, 0.65);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9), 0 10px 30px rgba(0, 0, 0, 0.6);
  transition: transform 0.06s ease, border-color 0.15s ease;
}

.tap-zone:active {
  transform: scale(0.97);
  border-color: #ffffff;
}

.tap-label {
  font-size: 3.5rem;
  font-weight: 900;
  color: #ffffff;
  text-shadow: 0 4px 20px rgba(0, 0, 0, 0.95);
  pointer-events: none;
  animation: pulseTap 1.2s ease-in-out infinite;
}

@keyframes pulseTap {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

.tap-counter-display {
  font-size: 5.5rem;
  font-weight: 900;
  color: #ffd166;
  margin-top: 10px;
  pointer-events: none;
  text-shadow: 0 4px 25px rgba(255, 209, 102, 0.7);
  font-family: monospace, 'Tajawal';
}

.tap-ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.5);
  transform: scale(0);
  animation: rippleFx 0.45s linear;
  pointer-events: none;
}

@keyframes rippleFx {
  to {
    transform: scale(4);
    opacity: 0;
  }
}
</style>
</head>
<body>
<div id="root">
<div id="role" class="card">
  <h2 class="gold-gradient-text" style="font-size:2.2rem;margin-bottom:12px;">🚀 سباق الصواريخ</h2>
  <p style="font-size:1.15rem;color:#cbd5e1;line-height:1.7;margin-bottom:24px;">هذي اللعبة جزء من لوبي «ليالي الرياض» — افتحها من هناك حتى تتوصل تلقائيًا.</p>
  <button class="btn-export" onclick="exportFile()">📥 تصدير ملف اللعبة (rocket_race.html)</button>
</div>
</div>
<script>
/* ===================== EMB BRIDGE (لا تغيّر هذا الجزء) ===================== */
let EMB=null; const embHostConns={};
window.addEventListener('message', e=>{
  const m=e&&e.data; if(!m||!m.__emb) return;
  if(m.init){ EMB={role:m.role,code:m.code,name:m.name}; return embStart(); }
  if(!EMB) return;
  if(EMB.role==='tv'){
    if(m.event==='data'){
      let c=embHostConns[m.id];
      if(!c)c=embHostConns[m.id]={id:m.id,send:obj=>{try{parent.postMessage({__emb:1,to:m.id,data:obj},'*')}catch(e){}}};
      try{onHostMsg(c,m.data)}catch(e){}
    } else if(m.event==='disconnect'){
      try{onPlayerLeave(m.id)}catch(e){}
      delete embHostConns[m.id];
    }
  } else if(EMB.role==='ph'){
    if(m.data!==undefined){try{onCtlMsg(m.data)}catch(e){}}
  }
});
function embReveal(){try{document.documentElement.classList.remove('emb-pending')}catch(e){}}
function embStart(){
  embReveal();
  if(EMB.role==='tv'){ startTv(); } else { startPhone(); }
}
setTimeout(()=>{ if(!EMB) embReveal(); }, 2500);

/* ===================== من هنا تبدأ لعبتك ===================== */

const PALETTES = [
  { hex: '#ef4444', bg: '#450a0a', name: 'أحمر', emoji: '🚀' },
  { hex: '#06b6d4', bg: '#083344', name: 'سماوي', emoji: '🛸' },
  { hex: '#10b981', bg: '#022c22', name: 'أخضر', emoji: '⚡' },
  { hex: '#f59e0b', bg: '#451a03', name: 'ذهبي', emoji: '⭐' },
  { hex: '#a855f7', bg: '#3b0764', name: 'بنفسجي', emoji: '🔮' },
  { hex: '#ec4899', bg: '#500724', name: 'وردي', emoji: '💖' },
  { hex: '#3b82f6', bg: '#172554', name: 'أزرق', emoji: '🌌' },
  { hex: '#f97316', bg: '#431407', name: 'برتقالي', emoji: '🔥' }
];

let G = {
  phase: 'lobby',
  code: '',
  duration: 15,
  timer: 15,
  adminId: null,
  players: {},
  flightStartTime: 0,
  flightDuration: 10000
};

function tvBroadcast(evt) {
  const safePlayers = {};
  for (let id in G.players) {
    const p = G.players[id];
    const pal = PALETTES[p.colorIdx % PALETTES.length];
    safePlayers[id] = {
      id: p.id,
      name: p.name,
      color: pal.hex,
      bgColor: pal.bg,
      taps: p.taps,
      altitude: Math.round(p.altitude),
      isAdmin: p.id === G.adminId
    };
  }

  const payload = {
    t: 'sync',
    evt: evt || 'tick',
    phase: G.phase,
    code: G.code,
    timer: G.timer,
    duration: G.duration,
    adminId: G.adminId,
    players: safePlayers
  };

  for (let id in embHostConns) {
    try {
      embHostConns[id].send(payload);
    } catch(e){}
  }
}

function startTv() {
  G.code = EMB.code || '';

  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="tv-container">
      <div class="tv-hud-bar">
        <div class="hud-glass-badge">
          🚀 <span class="gold-gradient-text" style="font-weight:900;">سباق الصواريخ</span>
        </div>
        <div id="tvTimerBadge" class="hud-glass-badge" style="display:none;font-size:1.3rem;color:#ffd166;">
          ⏱️ <span id="tvTimerVal">15</span>ث
        </div>
        <div class="hud-glass-badge">
          👥 اللاعبون المتصلون: <span id="tvCount" style="color:#ffd166;font-weight:900;">0</span>
        </div>
      </div>

      <canvas id="flightCanvas"></canvas>

      <div id="tvLobbyLayer" style="position:relative;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px;">
        <div class="room-code-card">
          <p style="font-size:1.25rem;color:#ffd166;font-weight:700;margin-bottom:6px;">رمز الانضمام للغرفة</p>
          <div class="room-code-badge">${G.code || '----'}</div>
          <p style="font-size:1.2rem;color:#f1f5f9;margin-top:14px;max-width:620px;line-height:1.7;">
            افتح لعبة «ليالي الرياض» على جوالك واكتب الرمز أعلاه.<br>
            <strong style="color:#ffd166;">الفكرة:</strong> اضغط بأقصى سرعة على شاشة هاتفك لشحن الصاروخ. كل الصواريخ تنطلق معاً، وصاحب أعلى ارتفاع يحسم اللقب!
          </p>
        </div>

        <div class="players-grid" id="tvList">
          <p style="color:#64748b;font-size:1.15rem;margin:auto;">بانتظار انضمام اللاعبين من جوالاتهم...</p>
        </div>

        <div style="display:flex;align-items:center;gap:16px;background:rgba(0,0,0,0.55);padding:12px 28px;border-radius:999px;border:1px solid rgba(255,255,255,0.15);">
          <span style="color:#94a3b8;font-size:0.95rem;">👑 تحكم السباق:</span>
          <label style="color:#cbd5e1;font-size:0.95rem;">
            المدة:
            <select id="tvDurSel" style="background:#1e1038;color:#ffd166;border:1px solid #ff9a3d;border-radius:8px;padding:4px 8px;font-family:inherit;font-weight:700;">
              <option value="10">10 ثوانٍ (سريع)</option>
              <option value="15" selected>15 ثانية (مثالي)</option>
              <option value="30">30 ثانية</option>
              <option value="60">دقيقة كاملة</option>
              <option value="90">دقيقة ونصف</option>
            </select>
          </label>
          <button class="btn-primary" id="tvStartBtn" style="padding:10px 24px;font-size:1.05rem;">🚀 انطلاق السباق</button>
          <button class="btn-danger" id="tvResetBtn">🔄 إعادة ضبط</button>
        </div>
      </div>

      <div id="tvCountdownLayer" class="countdown-overlay" style="display:none;">
        <p style="font-size:2.5rem;font-weight:800;color:#cbd5e1;margin-bottom:20px;">استعدوا للانطلاق!</p>
        <div class="countdown-num" id="tvCountdownDigit">3</div>
      </div>

      <div id="tvPodiumLayer" class="podium-overlay" style="display:none;">
        <h1 class="gold-gradient-text" style="font-size:3.5rem;font-weight:900;margin-bottom:10px;">🏆 منصة التتويج 🏆</h1>
        <p style="font-size:1.4rem;color:#cbd5e1;margin-bottom:20px;">أقوى وأعلى صواريخ وصلت إلى الفضاء الخارجي!</p>
        <div class="podium-ranks" id="tvPodiumSlots"></div>
        <div style="display:flex;gap:16px;margin-top:20px;">
          <button class="btn-primary" id="tvAgainBtn" style="font-size:1.2rem;padding:14px 36px;">🔄 سباق جديد</button>
        </div>
      </div>
    </div>
  `;

  initTvCanvas();

  document.getElementById('tvStartBtn').onclick = () => tvLaunchCountdown();
  document.getElementById('tvResetBtn').onclick = () => tvResetGame();
  document.getElementById('tvAgainBtn').onclick = () => tvResetGame();
  document.getElementById('tvDurSel').onchange = (e) => {
    G.duration = parseInt(e.target.value) || 15;
    tvBroadcast('duration');
  };

  setInterval(() => tvBroadcast('tick'), 200);
}

function onHostMsg(c, data) {
  if (!data || !data.t) return;

  if (data.t === 'join') {
    if (!G.players[c.id]) {
      const pCount = Object.keys(G.players).length;
      if (!G.adminId) G.adminId = c.id;

      G.players[c.id] = {
        id: c.id,
        name: data.name || ('لاعب ' + (pCount + 1)),
        colorIdx: pCount % PALETTES.length,
        taps: 0,
        altitude: 0,
        lastTap: 0,
        rank: 0
      };

      updateTvLobby();
      tvBroadcast('join');
    }
  }
  else if (data.t === 'tap') {
    const p = G.players[c.id];
    if (p && G.phase === 'tapping') {
      const now = Date.now();
      if (now - p.lastTap >= 35) {
        p.taps++;
        p.lastTap = now;
        p.altitude = p.taps * 130 * (1 + Math.min(2.5, Math.pow(p.taps / 25, 1.3)));
      }
    }
  }
  else if (data.t === 'admin_start') {
    if (c.id === G.adminId && G.phase === 'lobby') {
      if (data.duration) G.duration = data.duration;
      tvLaunchCountdown();
    }
  }
  else if (data.t === 'admin_reset') {
    if (c.id === G.adminId) {
      tvResetGame();
    }
  }
}

function onPlayerLeave(id) {
  if (G.players[id]) {
    delete G.players[id];
    if (G.adminId === id) {
      const remaining = Object.keys(G.players);
      G.adminId = remaining.length ? remaining[0] : null;
    }
    updateTvLobby();
    tvBroadcast('leave');
  }
}

function updateTvLobby() {
  const listEl = document.getElementById('tvList');
  const countEl = document.getElementById('tvCount');
  if (!listEl) return;

  const keys = Object.keys(G.players);
  countEl.innerText = keys.length;

  if (keys.length === 0) {
    listEl.innerHTML = `<p style="color:#64748b;font-size:1.15rem;margin:auto;">بانتظار انضمام اللاعبين من جوالاتهم...</p>`;
    return;
  }

  listEl.innerHTML = keys.map(id => {
    const p = G.players[id];
    const pal = PALETTES[p.colorIdx % PALETTES.length];
    const isAdmin = id === G.adminId;
    return `
      <div class="player-chip" style="border-color:${pal.hex};background:rgba(255,255,255,0.08);">
        <div class="player-rocket-icon" style="background:${pal.hex};color:#fff;">
          ${pal.emoji}
        </div>
        <div>
          <div style="color:#fff;font-size:1.15rem;">${p.name} ${isAdmin ? '👑 (المدير)' : ''}</div>
          <div style="font-size:0.85rem;color:${pal.hex};">${pal.name}</div>
        </div>
      </div>
    `;
  }).join('');
}

function tvLaunchCountdown() {
  G.phase = 'countdown';
  document.getElementById('tvLobbyLayer').style.display = 'none';
  const overlay = document.getElementById('tvCountdownLayer');
  overlay.style.display = 'flex';
  const digit = document.getElementById('tvCountdownDigit');

  let count = 3;
  digit.innerText = count;

  const countInterval = setInterval(() => {
    count--;
    if (count > 0) {
      digit.innerText = count;
    } else if (count === 0) {
      digit.innerText = 'انطلق! 🔥';
    } else {
      clearInterval(countInterval);
      overlay.style.display = 'none';
      tvStartTapping();
    }
  }, 1000);

  tvBroadcast('countdown');
}

function tvStartTapping() {
  G.phase = 'tapping';
  G.timer = G.duration;
  const badge = document.getElementById('tvTimerBadge');
  const val = document.getElementById('tvTimerVal');
  badge.style.display = 'flex';
  val.innerText = G.timer;

  tvBroadcast('tapping');

  const tInt = setInterval(() => {
    G.timer--;
    val.innerText = G.timer;
    if (G.timer <= 0) {
      clearInterval(tInt);
      badge.style.display = 'none';
      tvStartFlight();
    }
  }, 1000);
}

function tvStartFlight() {
  G.phase = 'launch';
  G.flightStartTime = Date.now();

  const arr = Object.values(G.players);
  arr.forEach(p => {
    const tps = p.taps / Math.max(1, G.duration);
    const boost = 1 + Math.min(3.0, Math.pow(tps / 4, 1.4));
    p.finalAltitude = Math.round(p.taps * 140 * boost);
  });

  arr.sort((a, b) => b.finalAltitude - a.finalAltitude);
  arr.forEach((p, idx) => { p.rank = idx + 1; });

  tvBroadcast('launch');

  setTimeout(() => {
    tvShowPodium();
  }, G.flightDuration);
}

function tvShowPodium() {
  G.phase = 'podium';
  const overlay = document.getElementById('tvPodiumLayer');
  const slots = document.getElementById('tvPodiumSlots');
  overlay.style.display = 'flex';

  const sorted = Object.values(G.players).sort((a, b) => b.finalAltitude - a.finalAltitude);
  const top3 = [sorted[0], sorted[1], sorted[2]].filter(Boolean);

  slots.innerHTML = top3.map((p, idx) => {
    const pal = PALETTES[p.colorIdx % PALETTES.length];
    const rankClass = idx === 0 ? 'podium-1' : (idx === 1 ? 'podium-2' : 'podium-3');
    const medal = idx === 0 ? '🥇 الأول' : (idx === 1 ? '🥈 الثاني' : '🥉 الثالث');
    return `
      <div class="podium-slot ${rankClass}">
        <div style="font-size:2rem;margin-bottom:8px;">${medal}</div>
        <div class="player-rocket-icon" style="background:${pal.hex};color:#fff;width:56px;height:56px;font-size:1.8rem;margin-bottom:12px;">
          ${pal.emoji}
        </div>
        <h3 style="font-size:1.5rem;font-weight:900;color:#fff;margin-bottom:6px;">${p.name}</h3>
        <p style="font-size:1.3rem;font-weight:800;color:${pal.hex};margin-bottom:4px;">
          ${fmtAlt(p.finalAltitude)}
        </p>
        <p style="font-size:0.95rem;color:#94a3b8;">إجمالي الضغطات: <strong>${p.taps}</strong></p>
      </div>
    `;
  }).join('');

  tvBroadcast('podium');
}

function fmtAlt(m) {
  if (m >= 1000) return (m / 1000).toFixed(1) + ' كم';
  return m + ' متر';
}

function tvResetGame() {
  G.phase = 'lobby';
  G.timer = G.duration;
  for (let id in G.players) {
    const p = G.players[id];
    p.taps = 0;
    p.altitude = 0;
    p.finalAltitude = 0;
    p.rank = 0;
  }
  document.getElementById('tvPodiumLayer').style.display = 'none';
  document.getElementById('tvCountdownLayer').style.display = 'none';
  document.getElementById('tvTimerBadge').style.display = 'none';
  document.getElementById('tvLobbyLayer').style.display = 'flex';
  updateTvLobby();
  tvBroadcast('reset');
}

function initTvCanvas() {
  const canvas = document.getElementById('flightCanvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const stars = [];
  for (let i = 0; i < 150; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 2 + 0.5,
      alpha: Math.random() * 0.8 + 0.2,
      speed: Math.random() * 0.8 + 0.2
    });
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const players = Object.values(G.players);

    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    if (G.phase === 'launch') {
      grad.addColorStop(0, '#04010a');
      grad.addColorStop(0.5, '#0b0416');
      grad.addColorStop(1, '#1b0e2e');
    } else {
      grad.addColorStop(0, '#190d26');
      grad.addColorStop(0.6, '#12081d');
      grad.addColorStop(1, '#090210');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    stars.forEach(s => {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
      ctx.fill();

      if (G.phase === 'launch') {
        s.y += s.speed * 6;
        if (s.y > canvas.height) {
          s.y = 0;
          s.x = Math.random() * canvas.width;
        }
      }
    });

    if (G.phase === 'lobby' || G.phase === 'countdown' || G.phase === 'tapping') {
      const baseH = 80;
      ctx.fillStyle = 'rgba(20, 10, 35, 0.95)';
      ctx.fillRect(0, canvas.height - baseH, canvas.width, baseH);
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - baseH);
      ctx.lineTo(canvas.width, canvas.height - baseH);
      ctx.stroke();

      if (players.length > 0) {
        const laneW = canvas.width / (players.length + 1);
        const groundY = canvas.height - 110;
        players.forEach((p, idx) => {
          const x = laneW * (idx + 1);
          const pal = PALETTES[p.colorIdx % PALETTES.length];
          let shakeX = 0;
          let shakeY = 0;
          if (G.phase === 'tapping') {
            const shakeAmt = Math.min(8, (p.taps / 15) * 4);
            shakeX = (Math.random() - 0.5) * shakeAmt;
            shakeY = (Math.random() - 0.5) * shakeAmt;
          }
          drawRocket(ctx, x + shakeX, groundY + shakeY, pal, 1.0);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 16px Tajawal';
          ctx.textAlign = 'center';
          ctx.fillText(p.name, x, groundY + 70);
          if (G.phase === 'tapping') {
            ctx.fillStyle = pal.hex;
            ctx.font = 'bold 18px monospace';
            ctx.fillText(`${p.taps} ضغطة`, x, groundY - 60);
          }
        });
      }
    } else if (G.phase === 'launch' || G.phase === 'podium') {
      const elapsed = Date.now() - G.flightStartTime;
      const progress = Math.min(1.0, elapsed / (G.flightDuration * 0.85));
      const easeProgress = 1 - Math.pow(1 - progress, 3);

      players.forEach(p => {
        p.currentAlt = (p.finalAltitude || 1000) * easeProgress;
      });

      const sorted = [...players].sort((a, b) => b.finalAltitude - a.finalAltitude);
      const leaderAlt = sorted[0] ? sorted[0].currentAlt : 1000;

      const isDuel = players.length >= 2 && progress > 0.45;
      const zoomFactor = isDuel ? 1.0 + (progress - 0.45) * 1.2 : 1.0;
      const count = players.length;
      const baseLaneW = canvas.width / (count + 1);

      players.forEach((p, idx) => {
        const pal = PALETTES[p.colorIdx % PALETTES.length];
        let targetX = baseLaneW * (idx + 1);

        if (isDuel && (p.id === sorted[0].id || p.id === sorted[1].id)) {
          const centerX = canvas.width / 2;
          const offset = (p.id === sorted[0].id) ? -75 : 75;
          const pullFactor = (progress - 0.45) * 2;
          targetX = targetX * (1 - pullFactor) + (centerX + offset) * pullFactor;
        }

        const altRatio = (p.currentAlt || 1) / Math.max(1, leaderAlt);
        const topMargin = canvas.height * 0.28;
        const bottomMargin = canvas.height * 0.78;
        const y = bottomMargin - (altRatio * (bottomMargin - topMargin));

        const scale = (isDuel && (p.id === sorted[0].id || p.id === sorted[1].id)) ? 1.35 * zoomFactor : 1.0;
        drawRocket(ctx, targetX, y, pal, scale);

        ctx.save();
        ctx.fillStyle = 'rgba(15, 7, 26, 0.85)';
        ctx.strokeStyle = pal.hex;
        ctx.lineWidth = 1.5;
        const badgeW = 100;
        const badgeH = 40;
        ctx.beginPath();
        ctx.roundRect(targetX - badgeW/2, y - 65, badgeW, badgeH, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px Tajawal';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, targetX, y - 48);

        ctx.fillStyle = pal.hex;
        ctx.font = 'bold 14px monospace';
        ctx.fillText(fmtAlt(Math.round(p.currentAlt)), targetX, y - 32);
        ctx.restore();
      });
    }

    requestAnimationFrame(render);
  }

  render();
}

function drawRocket(ctx, x, y, pal, scale=1.0) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  const flameH = 25 + Math.random() * 15;
  const flameGrad = ctx.createLinearGradient(0, 20, 0, 20 + flameH);
  flameGrad.addColorStop(0, '#ffffff');
  flameGrad.addColorStop(0.3, '#f59e0b');
  flameGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = flameGrad;
  ctx.beginPath();
  ctx.moveTo(-10, 20);
  ctx.quadraticCurveTo(0, 20 + flameH, 10, 20);
  ctx.fill();

  const bodyGrad = ctx.createLinearGradient(-15, 0, 15, 0);
  bodyGrad.addColorStop(0, pal.hex);
  bodyGrad.addColorStop(0.5, '#ffffff');
  bodyGrad.addColorStop(1, pal.hex);
  ctx.fillStyle = bodyGrad;

  ctx.beginPath();
  ctx.moveTo(0, -38);
  ctx.bezierCurveTo(16, -20, 16, 12, 14, 22);
  ctx.lineTo(-14, 22);
  ctx.bezierCurveTo(-16, 12, -16, -20, 0, -38);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = pal.hex;
  ctx.beginPath();
  ctx.moveTo(14, 6); ctx.lineTo(24, 24); ctx.lineTo(14, 20); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-14, 6); ctx.lineTo(-24, 24); ctx.lineTo(-14, 20); ctx.closePath(); ctx.fill();

  ctx.beginPath();
  ctx.arc(0, -10, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#0f172a'; ctx.fill();
  ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.stroke();

  ctx.restore();
}

// -------------------------------------------------------------
// 2) جهة الجوال
// -------------------------------------------------------------
let C = {
  name: '',
  color: '#ef4444',
  bgColor: '#450a0a',
  taps: 0,
  phase: 'lobby',
  isAdmin: false,
  timer: 15
};

function ctlSend(obj) {
  try { parent.postMessage({ __emb: 1, data: obj }, '*'); } catch (e) {}
}

function startPhone() {
  C.name = EMB.name || 'لاعب';
  ctlSend({ t: 'join', name: C.name });
  renderPhone();
}

function onCtlMsg(data) {
  if (!data || !data.t) return;
  if (data.t === 'sync') {
    C.phase = data.phase;
    C.timer = data.timer;
    if (data.players) {
      const arr = Object.values(data.players);
      const me = arr.find(p => p.name === C.name) || arr[0];
      if (me) {
        C.color = me.color;
        C.bgColor = me.bgColor;
        C.isAdmin = me.isAdmin;
      }
    }
    renderPhone();
  }
}

function renderPhone() {
  const root = document.getElementById('root');
  const bg = (C.phase === 'tapping') ? C.bgColor : '#190d26';

  if (C.phase === 'lobby') {
    root.innerHTML = `
      <div class="phone-container" style="background:${bg};">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h2 style="font-size:1.6rem;font-weight:900;color:${C.color};">🚀 ${C.name}</h2>
          <div style="background:${C.color};width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 15px ${C.color};">
            🚀
          </div>
        </div>

        ${C.isAdmin ? `
          <div style="background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.2);border-radius:24px;padding:20px;text-align:center;">
            <h3 style="color:#ffd166;font-size:1.2rem;margin-bottom:8px;">👑 أنت مدير الغرفة</h3>
            <p style="font-size:0.9rem;color:#cbd5e1;margin-bottom:16px;">حدد مدة الضغط ثم ابدأ السباق عندما يكتمل اللاعبون:</p>
            <div style="display:flex;gap:8px;margin-bottom:16px;">
              <button class="btn-primary" style="flex:1;padding:8px;font-size:0.9rem;" onclick="ctlSend({t:'admin_start', duration:10})">10ث</button>
              <button class="btn-primary" style="flex:1;padding:8px;font-size:0.9rem;background:linear-gradient(135deg,#10b981,#059669);" onclick="ctlSend({t:'admin_start', duration:15})">15ث (مثالي)</button>
              <button class="btn-primary" style="flex:1;padding:8px;font-size:0.9rem;" onclick="ctlSend({t:'admin_start', duration:30})">30ث</button>
            </div>
            <button class="btn-primary" style="width:100%;font-size:1.2rem;padding:14px;" onclick="ctlSend({t:'admin_start'})">🚀 إطلاق السباق للجميع</button>
          </div>
        ` : `
          <div class="card" style="margin:20px 0;">
            <p style="font-size:1.25rem;color:#ffd166;font-weight:700;">بانتظار انطلاق السباق...</p>
            <p style="font-size:0.95rem;color:#94a3b8;margin-top:8px;">المدير سيطلق العد التنازلي. جهّز إصبعك للضغط السريع!</p>
          </div>
        `}

        <div style="text-align:center;padding:12px;color:#64748b;font-size:0.85rem;">
          نظام سباق الصواريخ • ليالي الرياض
        </div>
      </div>
    `;
  }
  else if (C.phase === 'countdown') {
    root.innerHTML = `
      <div class="phone-container" style="background:#0a0314;justify-content:center;align-items:center;text-align:center;">
        <h1 class="tap-label" style="color:#ffd166;">استعد! 🔥</h1>
        <p style="font-size:1.4rem;color:#cbd5e1;margin-top:16px;">ضع يدك فوق الشاشة، وابدأ الضغط فوراً!</p>
      </div>
    `;
  }
  else if (C.phase === 'tapping') {
    root.innerHTML = `
      <div class="phone-container" style="background:${C.bgColor};">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 8px;">
          <span style="font-size:1.2rem;font-weight:800;color:#ffffff;">🚀 ${C.name}</span>
          <span style="font-size:1.4rem;font-weight:900;color:#ffd166;">⏱️ ${C.timer}ث</span>
        </div>

        <div class="tap-zone" id="pTapZone" style="border-color:${C.color};">
          <div class="tap-label">اضغط هنا! 🔥</div>
          <div class="tap-counter-display" id="pCounter">${C.taps}</div>
          <p style="font-size:1.1rem;color:#cbd5e1;margin-top:8px;">بأقصى سرعة ممكنة!</p>
        </div>

        <div style="text-align:center;padding:8px;color:#cbd5e1;font-size:0.95rem;">
          شحن المحرك جاري ⚡
        </div>
      </div>
    `;

    const zone = document.getElementById('pTapZone');
    if (zone) {
      zone.addEventListener('pointerdown', (e) => {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        C.taps++;
        const counter = document.getElementById('pCounter');
        if (counter) counter.innerText = C.taps;
        if (navigator.vibrate) try { navigator.vibrate(12); } catch(err){}
        ctlSend({ t: 'tap' });

        try {
          const rect = zone.getBoundingClientRect();
          const ripple = document.createElement('div');
          ripple.className = 'tap-ripple';
          const size = Math.max(rect.width, rect.height) * 0.8;
          ripple.style.width = ripple.style.height = `${size}px`;
          let x = rect.width / 2;
          let y = rect.height / 2;
          if (e && e.clientX) {
            x = e.clientX - rect.left;
            y = e.clientY - rect.top;
          }
          ripple.style.left = `${x - size/2}px`;
          ripple.style.top = `${y - size/2}px`;
          zone.appendChild(ripple);
          setTimeout(() => ripple.remove(), 450);
        } catch(err){}
      }, { passive: false });
    }
  }
  else if (C.phase === 'launch') {
    root.innerHTML = `
      <div class="phone-container" style="background:${C.bgColor};justify-content:center;align-items:center;text-align:center;">
        <div style="font-size:4rem;margin-bottom:16px;">🚀</div>
        <h1 style="font-size:2.4rem;font-weight:900;color:#ffd166;margin-bottom:12px;">انطلق الصاروخ!</h1>
        <p style="font-size:1.3rem;color:#ffffff;line-height:1.6;max-width:320px;">
          راقب شاشة التلفزيون الآن لتشاهد رحلة صاروخك نحو الفضاء!
        </p>
        <div style="margin-top:24px;padding:12px 24px;background:rgba(0,0,0,0.5);border-radius:16px;border:1px solid ${C.color};">
          <p style="color:#94a3b8;font-size:0.95rem;">مجموع ضغطاتك:</p>
          <p style="font-size:2.2rem;font-weight:900;color:${C.color};">${C.taps}</p>
        </div>
      </div>
    `;
  }
  else if (C.phase === 'podium') {
    root.innerHTML = `
      <div class="phone-container" style="background:#190d26;justify-content:center;align-items:center;text-align:center;">
        <div style="font-size:4.5rem;margin-bottom:12px;">🏆</div>
        <h1 class="gold-gradient-text" style="font-size:2.4rem;font-weight:900;margin-bottom:8px;">نهاية السباق!</h1>
        <p style="font-size:1.2rem;color:#cbd5e1;margin-bottom:20px;">
          راجع شاشة التلفزيون لمعرفة الفائز والترتيب النهائي.
        </p>
        ${C.isAdmin ? `
          <button class="btn-primary" style="font-size:1.1rem;padding:12px 30px;" onclick="ctlSend({t:'admin_reset'})">🔄 جولة جديدة للجميع</button>
        ` : ''}
      </div>
    `;
  }
}

function exportFile() {
  const html = '<!doctype html>\n' + document.documentElement.outerHTML;
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'rocket_race.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
