name: Extract Layali Riyadh Games

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-games:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify source archive
        run: |
          test -f "العاب ليالي الرياض (١).zip" || {
            echo "Source archive not found: العاب ليالي الرياض (١).zip"
            exit 1
          }

      - name: Extract main and nested ZIP archives
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile, BadZipFile
          from io import BytesIO
          import hashlib
          import json

          source = Path("العاب ليالي الرياض (١).zip")
          output = Path("prepared-games")
          output.mkdir(exist_ok=True)
          manifest = []
          MAX_DEPTH = 12

          def safe_target(base: Path, name: str) -> Path:
              normalized = name.replace("\\", "/")
              rel = PurePosixPath(normalized)
              if rel.is_absolute() or any(part in ("..", "") for part in rel.parts):
                  raise ValueError(f"Unsafe archive path: {name}")
              target = (base / Path(*rel.parts)).resolve()
              root = base.resolve()
              if target != root and root not in target.parents:
                  raise ValueError(f"Archive path escapes output folder: {name}")
              return target

          def unpack_zip(data: bytes, destination: Path, archive_label: str, depth: int = 0):
              if depth > MAX_DEPTH:
                  raise ValueError("Nested ZIP depth limit exceeded")
              try:
                  archive = ZipFile(BytesIO(data))
              except BadZipFile as exc:
                  raise ValueError(f"Invalid ZIP archive: {archive_label}") from exc

              with archive:
                  for info in archive.infolist():
                      if info.is_dir():
                          continue
                      target = safe_target(destination, info.filename)
                      if target.name in (".DS_Store",) or "__MACOSX" in target.parts:
                          continue
                      payload = archive.read(info)
                      if target.suffix.lower() == ".zip":
                          nested_destination = target.parent / target.stem
                          nested_destination.mkdir(parents=True, exist_ok=True)
                          unpack_zip(payload, nested_destination, f"{archive_label}!/{info.filename}", depth + 1)
                          continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(payload)
                      manifest.append({
                          "path": target.relative_to(output).as_posix(),
                          "size": len(payload),
                          "sha256": hashlib.sha256(payload).hexdigest(),
                          "source": archive_label
                      })

          unpack_zip(source.read_bytes(), output, source.name)

          manifest_path = output / "manifest.json"
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8"
          )
          print(f"Extracted {len(manifest)} files into {output}")
          PY

      - name: Commit extracted game files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prepared-games/
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
          else
            git commit -m "Extract Layali Riyadh games archive"
            git push
          fi
