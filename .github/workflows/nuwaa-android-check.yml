name: Nuwaa Android Kotlin check

on:
  push:
    branches: [main]
    paths:
      - "extracted/android/**"
      - ".github/workflows/nuwaa-android-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compile Android Kotlin sources (no APK packaging)
        run: gradle -p extracted/android :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon
