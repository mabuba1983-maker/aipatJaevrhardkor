name: Prepare Layali Riyadh Games

on:
  workflow_dispatch:
  push:
    paths:
      - 'العاب ليالي الرياض.zip'
      - '.github/workflows/prepare-games.yml'

permissions:
  contents: write

jobs:
  prepare-games:
    name: Extract and inspect game archives (NO APK BUILD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract outer and nested ZIP files and create full manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import json

          root = Path("prepared-games")
          root.mkdir(exist_ok=True)
          outer = Path("العاب ليالي الرياض.zip")
          if not outer.is_file():
              raise SystemExit("ERROR: outer archive missing")

          records = []
          def safe_target(base, member):
              name = member.replace("\\\\", "/")
              rel = PurePosixPath(name)
              if rel.is_absolute() or ".." in rel.parts:
                  raise SystemExit(f"Unsafe archive path rejected: {name}")
              return base.joinpath(*rel.parts), name

          def unpack(archive_path, destination, depth=0):
              if depth > 4:
                  raise SystemExit("Nested ZIP depth exceeded safety limit")
              with ZipFile(archive_path) as zf:
                  for info in zf.infolist():
                      if info.is_dir():
                          continue
                      target, member = safe_target(destination, info.filename)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as src, target.open("wb") as dst:
                          dst.write(src.read())
                      records.append({
                          "path": str(target),
                          "archive_member": member,
                          "size_bytes": target.stat().st_size,
                          "type": target.suffix.lower() or "(no extension)",
                          "nested_level": depth
                      })
                      if target.suffix.lower() == ".zip":
                          nested_dir = target.with_suffix("")
                          nested_dir.mkdir(exist_ok=True)
                          unpack(target, nested_dir, depth + 1)

          unpack(outer, root)
          manifest = {
              "source_archive": outer.name,
              "total_extracted_files_including_nested": len(records),
              "html_files": [r for r in records if r["type"] in (".html", ".htm")],
              "zip_files": [r for r in records if r["type"] == ".zip"],
              "all_files": records
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(f"Total files including nested archives: {len(records)}")
          print(f"HTML files: {len(manifest['html_files'])}")
          print(f"Nested ZIP files: {len(manifest['zip_files'])}")
          for item in records:
              print(f"- {item['path']} | {item['size_bytes']} bytes | {item['type']}")
              p = Path(item["path"])
              if p.name == "info.json":
                  print("  INFO.JSON:", p.read_text(encoding="utf-8", errors="replace"))
              elif p.suffix.lower() == ".html":
                  import re
                  html = p.read_text(encoding="utf-8", errors="replace")
                  title = re.search(r"<title[^>]*>(.*?)</title>", html, re.I | re.S)
                  print("  HTML TITLE:", re.sub(r"\\s+", " ", title.group(1)).strip() if title else "(no title tag)")
          PY

      - name: Upload fully extracted files for inspection
        uses: actions/upload-artifact@v4
        with:
          name: Layali-Riyadh-Fully-Extracted-Games
          path: prepared-games/
          if-no-files-found: error
          retention-days: 14

      - name: Save extracted source files into repository for review
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prepared-games/
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
          else
            git commit -m "Stage extracted Layali Riyadh game sources for review"
            git push
          fi
