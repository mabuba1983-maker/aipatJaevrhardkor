name: Prepare Layali Riyadh Games

on:
  workflow_dispatch:
  push:
    paths:
      - 'العاب ليالي الرياض.zip'
      - '.github/workflows/prepare-games.yml'

permissions:
  contents: read

jobs:
  prepare-games:
    name: Extract and inspect game archive (NO APK BUILD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP safely and create manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import json

          archive = Path("العاب ليالي الرياض.zip")
          output = Path("prepared-games")
          output.mkdir(exist_ok=True)

          if not archive.is_file():
              raise SystemExit("ERROR: العاب ليالي الرياض.zip was not found.")

          extracted = []
          with ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename.replace("\\\\", "/")
                  rel = PurePosixPath(name)
                  if rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit(f"Unsafe ZIP path rejected: {name}")
                  if info.is_dir():
                      continue
                  target = output.joinpath(*rel.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(info) as src, target.open("wb") as dst:
                      dst.write(src.read())
                  extracted.append({
                      "path": str(target),
                      "archive_path": name,
                      "size_bytes": target.stat().st_size,
                      "is_html": target.suffix.lower() in (".html", ".htm")
                  })

          manifest = {
              "archive": archive.name,
              "extracted_file_count": len(extracted),
              "html_file_count": sum(item["is_html"] for item in extracted),
              "files": extracted
          }
          (output / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print(f"Extracted files: {len(extracted)}")
          print(f"HTML files: {manifest['html_file_count']}")
          for item in extracted:
              print(f"- {item['archive_path']} ({item['size_bytes']} bytes)")
          PY

      - name: Upload extracted games for inspection
        uses: actions/upload-artifact@v4
        with:
          name: Layali-Riyadh-Extracted-Games
          path: prepared-games/
          if-no-files-found: error
          retention-days: 14
