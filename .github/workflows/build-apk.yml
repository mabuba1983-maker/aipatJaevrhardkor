name: Layali Riyadh APK (Manual Only)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Verify games and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare complete game assets without replacing the app library
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copy2, copytree
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          import re

          root = Path.cwd()
          assets = root / "app/src/main/assets"
          assets.mkdir(parents=True, exist_ok=True)

          library = assets / "مكتبة_الألعاب-1.html"
          if not library.is_file() or library.stat().st_size < 1000:
              raise SystemExit("The app-specific game library asset is missing or incomplete.")
          # Android's asset path is ASCII to avoid filename/encoding edge cases in APK packaging.
          copy2(library, assets / "game-library.html")

          # Copy every standalone HTML game from the repository root.
          root_games = sorted(p for p in root.glob("*.html") if p.name != "مكتبة_الألعاب-1.html")
          if not root_games:
              raise SystemExit("No standalone HTML game files were found.")
          for src in root_games:
              copy2(src, assets / src.name)

          # Preserve the complete prepared-games directory tree and all relative resources.
          prepared = root / "prepared-games"
          if prepared.is_dir():
              copytree(prepared, assets / "prepared-games", dirs_exist_ok=True)

          class References(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in ("src", "href", "poster") and value:
                          self.refs.append(value)
              def handle_data(self, data):
                  pass

          # Copy local resources referenced by every root-level game, preserving paths.
          for game in root_games:
              parser = References()
              parser.feed(game.read_text(encoding="utf-8", errors="replace"))
              source_text = game.read_text(encoding="utf-8", errors="replace")
              refs = list(parser.refs)
              refs += re.findall(r"url\(\s*['\"]?([^'\")]+)", source_text, re.I)
              for ref in refs:
                  ref = ref.strip()
                  parts = urlsplit(ref)
                  if parts.scheme or parts.netloc or not parts.path:
                      continue
                  rel = Path(unquote(parts.path).lstrip("/"))
                  if ".." in rel.parts:
                      raise SystemExit(f"Unsafe relative game asset path: {ref}")
                  src = root / rel
                  if src.is_file():
                      dst = assets / rel
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      copy2(src, dst)
                  elif Path(parts.path).suffix.lower() in (
                      ".png", ".jpg", ".jpeg", ".webp", ".gif", ".svg",
                      ".mp3", ".wav", ".ogg", ".mp4", ".webm",
                      ".js", ".css", ".json", ".glb", ".gltf", ".bin",
                      ".woff", ".woff2", ".ttf"
                  ):
                      print(f"WARNING: referenced local asset not present in repository: {game} -> {ref}")

          if not (assets / "game-library.html").is_file():
              raise SystemExit("Android library asset was not prepared.")
          print(f"Prepared {len(root_games)} root-level HTML games.")
          for game in root_games:
              copied = assets / game.name
              if not copied.is_file() or copied.stat().st_size != game.stat().st_size:
                  raise SystemExit(f"Game file copy failed: {game}")
              print(f"APK asset ready: {game.name} ({copied.stat().st_size} bytes)")
          PY

      - name: Check game HTML and inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess, tempfile

          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
                  self.current = None
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      a = dict(attrs)
                      self.current = {"attrs": a, "code": ""}
              def handle_data(self, data):
                  if self.current is not None:
                      self.current["code"] += data
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      self.scripts.append(self.current)
                      self.current = None

          games = sorted(p for p in Path.cwd().glob("*.html") if p.name != "مكتبة_الألعاب-1.html")
          games += sorted(Path("prepared-games").rglob("*.html")) if Path("prepared-games").exists() else []
          checked = 0
          with tempfile.TemporaryDirectory() as tmp:
              for game in games:
                  html = game.read_text(encoding="utf-8", errors="replace")
                  if "<html" not in html.lower() or "<body" not in html.lower():
                      raise SystemExit(f"HTML document is incomplete: {game}")
                  parser = ScriptParser()
                  parser.feed(html)
                  for index, item in enumerate(parser.scripts, 1):
                      attrs = item["attrs"]
                      code = item["code"]
                      if attrs.get("src") or not code.strip():
                          continue
                      typ = attrs.get("type", "text/javascript").lower()
                      if typ not in ("text/javascript", "application/javascript", "module"):
                          continue
                      script = Path(tmp) / f"check_{checked}.js"
                      script.write_text(code, encoding="utf-8")
                      result = subprocess.run(
                          ["node", "--check", str(script)],
                          capture_output=True, text=True
                      )
                      if result.returncode:
                          print(f"JavaScript syntax error: {game}, inline script #{index}")
                          print(result.stderr)
                          raise SystemExit(result.returncode)
                      checked += 1
                  print(f"HTML structure and inline scripts checked: {game}")
          print(f"Inline JavaScript syntax checks passed: {checked}")
          PY

      - name: Browser smoke test for both game interfaces
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
          cat > /tmp/game-smoke-test.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const path = require('path');
          const { pathToFileURL } = require('url');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--enable-webgl', '--use-gl=angle', '--use-angle=swiftshader']
            });
            let failed = false;
            for (const file of ['tahadi_al_ashara (1).html', 'captain-bean-layali-riyadh (1).html']) {
              const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              const gameUrl = pathToFileURL(path.resolve(file)).href;
              await page.setContent('<!doctype html><html><body style="margin:0"><iframe id="game" style="width:100vw;height:100vh;border:0"></iframe></body></html>');
              await page.evaluate(url => {
                const frame = document.getElementById('game');
                frame.src = url;
                frame.addEventListener('load', () => {
                  frame.contentWindow.postMessage({__emb:1,init:1,role:'tv',code:'TEST42',name:'اختبار'}, '*');
                }, {once:true});
              }, gameUrl);
              const frame = page.frameLocator('#game');
              await page.waitForTimeout(4000);
              const state = await page.evaluate(() => {
                const frame = document.getElementById('game');
                const d = frame.contentDocument;
                return {
                  title: d?.title || '',
                  text: (d?.body?.innerText || '').trim(),
                  visible: !!d?.body && getComputedStyle(d.body).visibility !== 'hidden',
                  children: d?.body?.children.length || 0,
                  canvas: d?.querySelectorAll('canvas').length || 0
                };
              });
              console.log(JSON.stringify({file,...state,pageErrors:errors}));
              const lobbyOnly = state.text.includes('افتحها من هناك') && state.children <= 2;
              if (!state.title || !state.visible || lobbyOnly || (!state.text && !state.canvas) || errors.length) failed = true;
              await page.close();
            }
            await browser.close();
            if (failed) process.exit(1);
          })().catch(error => { console.error(error); process.exit(1); });
          JS
          node /tmp/game-smoke-test.cjs

      - name: Build APK only
        run: gradle --no-daemon assembleDebug

      - name: Verify all repository game files are packaged in the APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib

          apk = next(Path("app/build/outputs/apk/debug").glob("*.apk"))
          checks = [(p.name, p) for p in sorted(Path.cwd().glob("*.html")) if p.name != "مكتبة_الألعاب-1.html"]
          checks.append(("game-library.html", Path("app/src/main/assets/game-library.html")))
          checks.extend((p.as_posix(), p) for p in sorted(Path("prepared-games").rglob("*")) if p.is_file())
          missing = []
          mismatched = []
          with ZipFile(apk) as z:
              names = set(z.namelist())
              for asset_name, source in checks:
                  entry = "assets/" + asset_name
                  if entry not in names:
                      missing.append(entry)
                      continue
                  actual = z.read(entry)
                  expected = source.read_bytes()
                  if hashlib.sha256(actual).digest() != hashlib.sha256(expected).digest():
                      mismatched.append(entry)
                  else:
                      print(f"VERIFIED {entry}: {len(actual)} bytes, SHA-256 matches")
          print(f"APK contains {len(names)} entries; checked {len(checks)} game/resource files.")
          if missing or mismatched:
              print("MISSING ENTRIES:", missing)
              print("CONTENT MISMATCHES:", mismatched)
              raise SystemExit(1)
          print(f"APK verified: {apk} ({apk.stat().st_size} bytes)")
          PY

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Layali-Riyadh-APK
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
