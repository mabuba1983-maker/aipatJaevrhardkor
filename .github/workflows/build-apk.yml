name: Build Layali Riyadh APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy root HTML games into Android assets without replacing app-specific files
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          shopt -s nullglob
          for file in ./*.html; do
            name="$(basename "$file")"
            if [ ! -e "app/src/main/assets/$name" ]; then
              cp "$file" "app/src/main/assets/$name"
            fi
          done
          echo "HTML files included in APK assets:"
          find app/src/main/assets -maxdepth 1 -type f -iname '*.html' -printf '%f (%s bytes)\\n' | sort

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Layali-Riyadh-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
