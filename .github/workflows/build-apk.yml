name: Build Layali Riyadh APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'
      - '*.html'
      - 'app/src/main/**'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    name: Verify games and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare complete game assets without replacing the app library
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copy2
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          import re

          root = Path.cwd()
          assets = root / "app/src/main/assets"
          assets.mkdir(parents=True, exist_ok=True)

          required = [
              Path("tahadi_al_ashara (1).html"),
              Path("captain-bean-layali-riyadh (1).html"),
          ]
          for src in required:
              if not src.is_file() or src.stat().st_size < 1000:
                  raise SystemExit(f"Required game file missing or incomplete: {src}")

          library = assets / "مكتبة_الألعاب-1.html"
          if not library.is_file() or library.stat().st_size < 1000:
              raise SystemExit("The app-specific game library asset is missing or incomplete.")

          # Copy root HTML games only when the app does not already have an app-specific copy.
          # The library is intentionally preserved because its Android asset copy contains the
          # latest app-specific cards and must not be overwritten by a possibly older root copy.
          for src in root.glob("*.html"):
              dst = assets / src.name
              if not dst.exists():
                  copy2(src, dst)

          # Always install the exact uploaded versions of these two requested games.
          challenge_src = required[0]
          captain_src = required[1]
          copy2(challenge_src, assets / challenge_src.name)
          copy2(captain_src, assets / captain_src.name)

          # Keep the old Captain Bean filename as an alias so the retained library card
          # continues to resolve even though the uploaded replacement has "(1)" in its name.
          copy2(captain_src, assets / "captain-bean-layali-riyadh.html")

          class References(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in ("src", "href", "poster") and value:
                          self.refs.append(value)
              def handle_data(self, data):
                  pass

          # Copy local resources referenced by either game, preserving relative paths.
          for game in (challenge_src, captain_src):
              parser = References()
              parser.feed(game.read_text(encoding="utf-8", errors="replace"))
              source_text = game.read_text(encoding="utf-8", errors="replace")
              refs = list(parser.refs)
              refs += re.findall(r"url\\(\\s*['\"]?([^'\"\\)]+)", source_text, re.I)
              for ref in refs:
                  ref = ref.strip()
                  parts = urlsplit(ref)
                  if parts.scheme or parts.netloc or not parts.path:
                      continue
                  rel = Path(unquote(parts.path).lstrip("/"))
                  if ".." in rel.parts:
                      raise SystemExit(f"Unsafe relative game asset path: {ref}")
                  src = root / rel
                  if src.is_file():
                      dst = assets / rel
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      copy2(src, dst)
                  elif Path(parts.path).suffix.lower() in (
                      ".png", ".jpg", ".jpeg", ".webp", ".gif", ".svg",
                      ".mp3", ".wav", ".ogg", ".mp4", ".webm",
                      ".js", ".css", ".json", ".glb", ".gltf", ".bin",
                      ".woff", ".woff2", ".ttf"
                  ):
                      raise SystemExit(f"Referenced local game asset is missing: {game} -> {ref}")

          for name in (
              "مكتبة_الألعاب-1.html",
              "tahadi_al_ashara (1).html",
              "captain-bean-layali-riyadh (1).html",
              "captain-bean-layali-riyadh.html",
          ):
              path = assets / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"APK asset was not prepared: {name}")
              print(f"APK asset ready: {name} ({path.stat().st_size} bytes)")
          PY

      - name: Check game HTML and inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess, tempfile

          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
                  self.current = None
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      a = dict(attrs)
                      self.current = {"attrs": a, "code": ""}
              def handle_data(self, data):
                  if self.current is not None:
                      self.current["code"] += data
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      self.scripts.append(self.current)
                      self.current = None

          games = [
              Path("tahadi_al_ashara (1).html"),
              Path("captain-bean-layali-riyadh (1).html"),
          ]
          checked = 0
          with tempfile.TemporaryDirectory() as tmp:
              for game in games:
                  html = game.read_text(encoding="utf-8", errors="replace")
                  if "<html" not in html.lower() or "<body" not in html.lower():
                      raise SystemExit(f"HTML document is incomplete: {game}")
                  parser = ScriptParser()
                  parser.feed(html)
                  for index, item in enumerate(parser.scripts, 1):
                      attrs = item["attrs"]
                      code = item["code"]
                      if attrs.get("src") or not code.strip():
                          continue
                      typ = attrs.get("type", "text/javascript").lower()
                      if typ not in ("text/javascript", "application/javascript", "module"):
                          continue
                      script = Path(tmp) / f"check_{checked}.js"
                      script.write_text(code, encoding="utf-8")
                      result = subprocess.run(
                          ["node", "--check", str(script)],
                          capture_output=True, text=True
                      )
                      if result.returncode:
                          print(f"JavaScript syntax error: {game}, inline script #{index}")
                          print(result.stderr)
                          raise SystemExit(result.returncode)
                      checked += 1
                  print(f"HTML structure and inline scripts checked: {game}")
          print(f"Inline JavaScript syntax checks passed: {checked}")
          PY

      - name: Browser smoke test for both game interfaces
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
          cat > /tmp/game-smoke-test.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const path = require('path');
          const { pathToFileURL } = require('url');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--enable-webgl', '--use-gl=angle', '--use-angle=swiftshader']
            });
            let failed = false;
            for (const file of ['tahadi_al_ashara (1).html', 'captain-bean-layali-riyadh (1).html']) {
              const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              await page.goto(pathToFileURL(path.resolve(file)).href, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(3500);
              const state = await page.evaluate(() => ({
                title: document.title,
                text: (document.body?.innerText || '').trim(),
                elements: document.body?.children.length || 0,
                canvas: document.querySelectorAll('canvas').length
              }));
              console.log(JSON.stringify({ file, ...state, pageErrors: errors }));
              if (!state.title || (!state.text && state.elements === 0 && state.canvas === 0) || errors.length) {
                failed = true;
              }
              await page.close();
            }
            await browser.close();
            if (failed) process.exit(1);
          })().catch(error => { console.error(error); process.exit(1); });
          JS
          node /tmp/game-smoke-test.cjs

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify requested games are inside the APK byte-for-byte
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib

          apk = next(Path("app/build/outputs/apk/debug").glob("*.apk"))
          checks = [
              ("tahadi_al_ashara (1).html", Path("tahadi_al_ashara (1).html")),
              ("captain-bean-layali-riyadh (1).html", Path("captain-bean-layali-riyadh (1).html")),
              ("captain-bean-layali-riyadh.html", Path("captain-bean-layali-riyadh (1).html")),
              ("مكتبة_الألعاب-1.html", Path("app/src/main/assets/مكتبة_الألعاب-1.html")),
          ]
          with ZipFile(apk) as z:
              names = set(z.namelist())
              for asset_name, source in checks:
                  entry = "assets/" + asset_name
                  if entry not in names:
                      raise SystemExit(f"APK is missing: {entry}")
                  actual = z.read(entry)
                  expected = source.read_bytes()
                  if hashlib.sha256(actual).digest() != hashlib.sha256(expected).digest():
                      raise SystemExit(f"APK asset differs from verified source: {entry}")
                  print(f"VERIFIED {entry}: {len(actual)} bytes, SHA-256 matches")
          print(f"APK verified: {apk} ({apk.stat().st_size} bytes)")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Layali-Riyadh-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
