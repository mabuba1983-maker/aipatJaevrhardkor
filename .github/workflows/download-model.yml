name: Clear repository files

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clear-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete every tracked file except this workflow
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if [[ "$file" == ".github/workflows/download-model.yml" ]]; then
              continue
            fi
            rm -f -- "$file"
          done < <(git ls-files -z)

          find . -mindepth 1 -type d -empty ! -path "./.git*" -delete

          echo "Remaining tracked files:"
          git ls-files

      - name: Commit repository cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository is already clean."
            exit 0
          fi
          git commit -m "Clear repository contents [skip ci]"
          git push origin HEAD:main
