name: Download and extract replacement archive

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the supplied Google Drive archive
        run: |
          python -m pip install --disable-pip-version-check gdown
          gdown "https://drive.google.com/file/d/10Y0kaPxWa-Igvg6re3JJWuYyQenEBcTM/view?usp=drivesdk" -O /tmp/replacement-archive
          test -s /tmp/replacement-archive

      - name: Extract archive into repository root
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, is_zipfile
          import tarfile

          archive = Path("/tmp/replacement-archive")
          root = Path(".").resolve()

          def safe_path(name):
              target = (root / name).resolve()
              if target != root and root not in target.parents:
                  raise SystemExit(f"Unsafe archive path rejected: {name}")
              return target

          if is_zipfile(archive):
              with ZipFile(archive) as z:
                  for item in z.infolist():
                      safe_path(item.filename)
                  z.extractall(root)
          elif tarfile.is_tarfile(archive):
              with tarfile.open(archive) as t:
                  for item in t.getmembers():
                      safe_path(item.name)
                      if item.issym() or item.islnk():
                          raise SystemExit(f"Archive links are not allowed: {item.name}")
                  t.extractall(root, filter="data")
          else:
              raise SystemExit("The Google Drive download is not a ZIP or TAR archive.")

          files = [p for p in root.rglob("*") if p.is_file() and ".git" not in p.parts]
          print(f"Extracted {len(files)} files from the supplied archive.")
          if not files:
              raise SystemExit("The archive contained no files.")
          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted file changes to commit."
            exit 0
          fi
          git commit -m "Import replacement archive from Google Drive [skip ci]"
          git push origin HEAD:main
