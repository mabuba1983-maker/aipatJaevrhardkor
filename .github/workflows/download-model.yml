name: Download and extract project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download archive from Google Drive
        run: |
          python -m pip install --disable-pip-version-check gdown
          gdown --fuzzy "https://drive.google.com/file/d/10Y0kaPxWa-Igvg6re3JJWuYyQenEBcTM/view?usp=drivesdk" -O /tmp/project.zip
          unzip -t /tmp/project.zip

      - name: Extract archive
        run: |
          mkdir -p /tmp/project-extracted
          unzip -q /tmp/project.zip -d /tmp/project-extracted

      - name: Replace repository files with extracted files
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/project-extracted/. .
          git status --short

      - name: Save extracted files to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Extract project archive from Google Drive"
            git push origin HEAD:main
          fi
