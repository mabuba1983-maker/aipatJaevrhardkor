name: Download and extract model archive

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout empty workspace
        uses: actions/checkout@v4

      - name: Download Google Drive file
        env:
          DRIVE_FILE_ID: "1Vess6t3gN2nryInZzgFJxMDuXbc4o9Cq"
        run: |
          python -m pip install --disable-pip-version-check gdown
          gdown "${DRIVE_FILE_ID}" --output downloaded-model --retries 3 --timeout 120
          test -s downloaded-model

      - name: Extract archive safely or keep single model file
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, is_zipfile
          import tarfile, shutil, subprocess

          source = Path("downloaded-model")
          out = Path("model")
          out.mkdir(exist_ok=True)

          def safe_target(name):
              target = (out / name).resolve()
              root = out.resolve()
              if target != root and root not in target.parents:
                  raise SystemExit(f"Unsafe archive path rejected: {name}")
              return target

          if is_zipfile(source):
              with ZipFile(source) as z:
                  for item in z.infolist():
                      safe_target(item.filename)
                  z.extractall(out)
          elif tarfile.is_tarfile(source):
              with tarfile.open(source) as t:
                  for item in t.getmembers():
                      safe_target(item.name)
                      if item.issym() or item.islnk():
                          raise SystemExit(f"Links are not allowed in archive: {item.name}")
                  t.extractall(out, filter="data")
          elif subprocess.run(["bash", "-lc", "command -v 7z >/dev/null"], check=False).returncode == 0 and subprocess.run(["7z", "t", str(source)], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0:
              subprocess.run(["7z", "x", str(source), f"-o{out}", "-y"], check=True)
          else:
              shutil.copy2(source, out / "model-file.bin")

          files = [p for p in out.rglob("*") if p.is_file()]
          if not files:
              raise SystemExit("The Drive file contained no extractable model files.")
          if any(p.stat().st_size >= 100 * 1024 * 1024 for p in files):
              raise SystemExit("At least one extracted file is 100 MB or larger; GitHub may reject it.")
          print(f"Prepared {len(files)} editable files under model/.")
          PY

      - name: Commit extracted model files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f model/
          if git diff --cached --quiet; then
            echo "No model changes to commit."
            exit 0
          fi
          git commit -m "Import model from Google Drive"
          git push origin HEAD:main
