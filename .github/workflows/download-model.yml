name: Clean repository before model import

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove all tracked project files except this workflow
        run: |
          python - <<'PY'
          import subprocess
          keep = ".github/workflows/download-model.yml"
          raw = subprocess.check_output(["git", "ls-files", "-z"])
          paths = [p.decode() for p in raw.split(bytes([0])) if p]
          remove = [p for p in paths if p != keep]
          if remove:
              subprocess.run(["git", "rm", "-f", "--", *remove], check=True)
          print(f"Removed {len(remove)} tracked files; preserved {keep}.")
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Repository is already clean."
            exit 0
          fi
          git commit -m "Clean repository before importing replacement model [skip ci]"
          git push origin HEAD:main
