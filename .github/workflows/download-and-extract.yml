name: Download and extract Google Drive archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/download-and-extract.yml"

permissions:
  contents: write

jobs:
  download-and-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download shared Google Drive file
        env:
          DRIVE_FILE_ID: "1Qbm6a6_GIrGjj3NH_GAl74m-wfd98ISA"
        run: |
          python -m pip install --disable-pip-version-check gdown
          gdown "$DRIVE_FILE_ID" --output source-archive --retries 3 --timeout 60
          test -s source-archive

      - name: Verify and safely extract ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile

          archive = Path("source-archive")
          output = Path("extracted")
          output.mkdir(exist_ok=True)

          try:
              with ZipFile(archive) as zf:
                  root = output.resolve()
                  for item in zf.infolist():
                      target = (output / item.filename).resolve()
                      if target != root and root not in target.parents:
                          raise SystemExit(f"Unsafe ZIP path rejected: {item.filename}")
                  zf.extractall(output)
          except BadZipFile:
              raise SystemExit("Downloaded file is not a valid ZIP archive.")

          files = [p for p in output.rglob("*") if p.is_file()]
          if not files:
              raise SystemExit("ZIP archive contained no files.")

          git_dirs = [p for p in output.rglob(".git") if p.is_dir()]
          for path in git_dirs:
              import shutil
              shutil.rmtree(path)

          oversized = [p for p in output.rglob("*") if p.is_file() and p.stat().st_size >= 100 * 1024 * 1024]
          if oversized:
              raise SystemExit("A file is at least 100 MB; GitHub will reject it: " + ", ".join(str(p) for p in oversized))

          print(f"Extracted {len(files)} files.")
          PY

      - name: Commit extracted project into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f extracted/
          if git diff --cached --quiet; then
            echo "No extracted file changes to commit."
          else
            git commit -m "Add extracted Google Drive project"
            git push origin HEAD:main
          fi

      - name: Upload extracted project as a backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-google-drive-project
          path: extracted/
          if-no-files-found: error
          retention-days: 7
