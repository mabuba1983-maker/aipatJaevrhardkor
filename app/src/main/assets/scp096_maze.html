<body>
<div id="root">
<div id="role" class="card"><p>هذي اللعبة جزء من لوبي «ليالي الرياض» — افتحها من هناك حتى تتوصل تلقائيًا.</p></div>

<script>
/* ===================== EMB BRIDGE (لا تغيّر هذا الجزء) ===================== */
let EMB=null; const embHostConns={};
window.addEventListener('message', e=>{
  const m=e&&e.data; if(!m||!m.__emb) return;
  if(m.init){ EMB={role:m.role,code:m.code,name:m.name}; return embStart(); }
  if(!EMB) return;
  if(EMB.role==='tv'){
    if(m.event==='data'){
      let c=embHostConns[m.id];
      if(!c)c=embHostConns[m.id]={id:m.id,send:obj=>{try{parent.postMessage({__emb:1,to:m.id,data:obj},'*')}catch(e){}}};
      try{onHostMsg(c,m.data)}catch(e){}
    } else if(m.event==='disconnect'){
      try{onPlayerLeave(m.id)}catch(e){}
      delete embHostConns[m.id];
    }
  } else if(EMB.role==='ph'){
    if(m.data!==undefined){try{onCtlMsg(m.data)}catch(e){}}
  }
});
function embReveal(){try{document.documentElement.classList.remove('emb-pending')}catch(e){}}
function embStart(){
  embReveal();
  if(EMB.role==='tv'){ startTv(); } else { startPhone(); }
}
setTimeout(()=>{ if(!EMB) embReveal(); }, 2500);

/* ===================== أدوات عامة ===================== */
const PALETTE=['#ff6b6b','#4ecdc4','#ffd166','#a78bfa','#6bcb77','#ff9a3d','#45aaf2','#f783ac'];
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function dist(x1,y1,x2,y2){const dx=x1-x2,dy=y1-y2;return Math.sqrt(dx*dx+dy*dy)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

/* ===================== توليد المتاهة ===================== */
function genMaze(cw,ch){
  const cells=[];
  for(let y=0;y<ch;y++)for(let x=0;x<cw;x++)cells.push({x,y,N:false,E:false,S:false,W:false,visited:false});
  const idx=(x,y)=>y*cw+x;
  const stack=[0]; cells[0].visited=true;
  const dirs=[[0,-1,'N','S'],[1,0,'E','W'],[0,1,'S','N'],[-1,0,'W','E']];
  while(stack.length){
    const ci=stack[stack.length-1];
    const cx=cells[ci].x, cy=cells[ci].y;
    const opts=[];
    for(const d of dirs){
      const nx=cx+d[0], ny=cy+d[1];
      if(nx<0||ny<0||nx>=cw||ny>=ch) continue;
      const ni=idx(nx,ny);
      if(!cells[ni].visited) opts.push([ni,d[2],d[3]]);
    }
    if(opts.length===0){ stack.pop(); continue; }
    const o=pick(opts);
    cells[ci][o[1]]=true; cells[o[0]][o[2]]=true;
    cells[o[0]].visited=true;
    stack.push(o[0]);
  }
  const gw=cw*2+1, gh=ch*2+1;
  const grid=new Uint8Array(gw*gh).fill(1);
  for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){
    const c=cells[idx(x,y)];
    const gx=x*2+1, gy=y*2+1;
    grid[gy*gw+gx]=0;
    if(c.N) grid[(gy-1)*gw+gx]=0;
    if(c.S) grid[(gy+1)*gw+gx]=0;
    if(c.E) grid[gy*gw+gx+1]=0;
    if(c.W) grid[gy*gw+gx-1]=0;
  }
  return {cw,ch,cells,gw,gh,grid};
}
function bfsCell(maze,sx,sy){
  const {cw,ch,cells}=maze; const idx=(x,y)=>y*cw+x;
  const dist=new Array(cw*ch).fill(-1), prev=new Array(cw*ch).fill(-1);
  dist[idx(sx,sy)]=0; const q=[idx(sx,sy)]; let qi=0;
  while(qi<q.length){
    const ci=q[qi++]; const c=cells[ci]; const nbrs=[];
    if(c.N) nbrs.push(idx(c.x,c.y-1));
    if(c.S) nbrs.push(idx(c.x,c.y+1));
    if(c.E) nbrs.push(idx(c.x+1,c.y));
    if(c.W) nbrs.push(idx(c.x-1,c.y));
    for(const ni of nbrs){ if(dist[ni]===-1){ dist[ni]=dist[ci]+1; prev[ni]=ci; q.push(ni);} }
  }
  return {dist,prev};
}
function cellPathCoords(maze,prev,fromIdx,toIdx){
  const path=[]; let cur=toIdx;
  while(cur!==-1 && cur!==fromIdx){ path.push(cur); cur=prev[cur]; }
  if(cur===fromIdx) path.push(fromIdx);
  path.reverse();
  return path.map(i=>{const c=maze.cells[i]; return {x:c.x*2+1,y:c.y*2+1};});
}
function cellCenter(cx,cy){ return {x:cx*2+1,y:cy*2+1}; }

/* شعاع رؤية بسيط مع توقف عند الجدران */
function castVisible(maze,px,py,angle,setPassive,setCone){
  const {gw,gh,grid}=maze;
  function markAlong(ax,ay,maxDist,target){
    const steps=Math.ceil(maxDist/0.18);
    for(let s=0;s<=steps;s++){
      const t=s/steps*maxDist;
      const x=px+ax*t, y=py+ay*t;
      const gx=Math.floor(x), gy=Math.floor(y);
      if(gx<0||gy<0||gx>=gw||gy>=gh) break;
      const cx=Math.floor((gx-1)/2), cy=Math.floor((gy-1)/2);
      target.add(cx+','+cy);
      if(grid[gy*gw+gx]===1) break;
    }
  }
  const PR=1.35, FR=4.6, HALF=30*Math.PI/180;
  for(let i=0;i<14;i++){ const a=i/14*Math.PI*2; markAlong(Math.cos(a),Math.sin(a),PR,setPassive); }
  for(let i=0;i<10;i++){ const a=angle-HALF+(i/9)*HALF*2; markAlong(Math.cos(a),Math.sin(a),FR,setCone); }
}

/* تصادم حركة بسيط */
function moveWithCollision(maze,px,py,dx,dy){
  const r=0.27; const {gw,gh,grid}=maze;
  function blocked(x,y){
    const gx=Math.floor(x), gy=Math.floor(y);
    if(gx<0||gy<0||gx>=gw||gy>=gh) return true;
    return grid[gy*gw+gx]===1;
  }
  let nx=px, ny=py;
  if(dx!==0){
    const tx=px+dx; const ex=dx>0? tx+r:tx-r;
    if(!(blocked(ex,py-r)||blocked(ex,py+r)||blocked(ex,py))) nx=tx;
  }
  if(dy!==0){
    const ty=py+dy; const ey=dy>0? ty+r:ty-r;
    if(!(blocked(nx-r,ey)||blocked(nx+r,ey)||blocked(nx,ey))) ny=ty;
  }
  return {x:nx,y:ny};
}

/* ===================== صوت (WebAudio) ===================== */
let actx=null;
function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function playGrowl(vol){
  const ctx=ensureAudio(); if(!ctx) return;
  const t0=ctx.currentTime;
  const osc=ctx.createOscillator(); osc.type='sawtooth'; osc.frequency.setValueAtTime(55+rnd(-8,8),t0);
  osc.frequency.exponentialRampToValueAtTime(32,t0+0.9);
  const g=ctx.createGain(); g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.08);
  g.gain.exponentialRampToValueAtTime(0.001,t0+1.1);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+1.2);
  const bufSize=ctx.sampleRate*0.4;
  const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i]=(Math.random()*2-1)*(1-i/bufSize);
  const noise=ctx.createBufferSource(); noise.buffer=buf;
  const ng=ctx.createGain(); ng.gain.setValueAtTime(vol*0.4,t0);
  ng.gain.exponentialRampToValueAtTime(0.001,t0+0.4);
  const flt=ctx.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=400;
  noise.connect(flt); flt.connect(ng); ng.connect(ctx.destination);
  noise.start(t0);
}
let ambientNode=null, ambientGain=null;
function ensureAmbient(){
  const ctx=ensureAudio(); if(!ctx||ambientNode) return;
  const osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.value=48;
  const g=ctx.createGain(); g.gain.value=0;
  osc.connect(g); g.connect(ctx.destination); osc.start();
  ambientNode=osc; ambientGain=g;
}
function setAmbientVol(v){ if(ambientGain) ambientGain.gain.linearRampToValueAtTime(clamp(v,0,0.5), ensureAudio().currentTime+0.3); }
function vibrate(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }

/* ===================================================================== */
/* ============================  جهة التلفزيون  ========================= */
/* ===================================================================== */
let TVG=null, tvTickHandle=null, tvLastT=0;

function startTv(){
  buildTvDom();
  TVG={
    phase:'lobby', code:EMB.code||'----',
    players:{}, order:[], adminId:null,
    settings:{keysNeeded:6, monsterSpeed:'normal', minPlayers:3},
    maze:null, keys:[], exit:null, spawn:null, monster:null,
    escapedIds:[], caughtName:null, graceEndsAt:0, graceActive:false, endReason:null
  };
  renderTvLobby();
  tvLastT=performance.now();
  tvTickHandle=setInterval(tvTick,100);
}

function onHostMsg(c,data){
  if(!TVG) return;
  if(data.t==='join') return tvAddPlayer(c,data.name||'لاعب');
  const p=TVG.players[c.id]; if(!p) return;
  if(data.t==='setSettings'){
    if(c.id!==TVG.adminId || TVG.phase!=='lobby') return;
    if(data.keysNeeded) TVG.settings.keysNeeded=clamp(data.keysNeeded|0,3,8);
    if(data.monsterSpeed) TVG.settings.monsterSpeed=data.monsterSpeed;
    if(data.minPlayers) TVG.settings.minPlayers=clamp(data.minPlayers|0,2,8);
    renderTvLobby(); tvBroadcastLobby();
  } else if(data.t==='start'){
    if(c.id!==TVG.adminId || TVG.phase!=='lobby') return;
    if(TVG.order.length<TVG.settings.minPlayers) return;
    tvStartGame();
  } else if(data.t==='input'){
    if(TVG.phase!=='playing') return;
    p.input.dx=clamp(data.dx||0,-1,1); p.input.dy=clamp(data.dy||0,-1,1);
  } else if(data.t==='restart'){
    if(c.id!==TVG.adminId || (TVG.phase!=='win'&&TVG.phase!=='lose')) return;
    tvResetToLobby();
  }
}
function onPlayerLeave(id){
  if(!TVG) return;
  delete TVG.players[id];
  TVG.order=TVG.order.filter(x=>x!==id);
  if(TVG.adminId===id) TVG.adminId=TVG.order[0]||null;
  if(TVG.phase==='lobby'){ renderTvLobby(); tvBroadcastLobby(); }
}

function tvAddPlayer(c,name){
  if(TVG.players[c.id]){
    if(TVG.phase==='lobby'){
      const list=TVG.order.map(id=>{const p=TVG.players[id]; return {id,name:p.name,color:p.color,isAdmin:id===TVG.adminId};});
      c.send({t:'lobby',youAreAdmin:c.id===TVG.adminId,settings:TVG.settings,players:list,code:TVG.code});
    }
    return;
  }
  if(TVG.phase!=='lobby'){ c.send({t:'error',msg:'اللعبة بدأت بالفعل'}); return; }
  const colorIdx=TVG.order.length%PALETTE.length;
  TVG.players[c.id]={id:c.id,conn:c,name:name.slice(0,16)||'لاعب',color:PALETTE[colorIdx],
    x:0,y:0,angle:0,input:{dx:0,dy:0},escaped:false,caught:false};
  TVG.order.push(c.id);
  if(!TVG.adminId) TVG.adminId=c.id;
  renderTvLobby(); tvBroadcastLobby();
}

function tvBroadcastLobby(){
  const list=TVG.order.map(id=>{const p=TVG.players[id]; return {id,name:p.name,color:p.color,isAdmin:id===TVG.adminId};});
  for(const id of TVG.order){
    TVG.players[id].conn.send({t:'lobby',youAreAdmin:id===TVG.adminId,settings:TVG.settings,players:list,code:TVG.code});
  }
}

function tvResetToLobby(){
  TVG.phase='lobby'; TVG.maze=null; TVG.keys=[]; TVG.exit=null; TVG.monster=null;
  TVG.escapedIds=[]; TVG.caughtName=null; TVG.graceActive=false; TVG.endReason=null;
  for(const id of TVG.order){ const p=TVG.players[id]; p.escaped=false; p.caught=false; p.input={dx:0,dy:0}; }
  renderTvLobby(); tvBroadcastLobby();
}

function tvStartGame(){
  const n=TVG.order.length;
  const cw=13, ch=13;
  const maze=genMaze(cw,ch);
  TVG.maze=maze;
  const {dist,prev}=bfsCell(maze,0,0);
  let maxD=-1, exitIdx=0;
  for(let i=0;i<dist.length;i++){ if(dist[i]>maxD){ maxD=dist[i]; exitIdx=i; } }
  const exitCell=maze.cells[exitIdx];
  TVG.exit=cellCenter(exitCell.x,exitCell.y);
  TVG.spawn=cellCenter(0,0);

  const needed=TVG.settings.keysNeeded;
  const candidates=[];
  for(let i=0;i<dist.length;i++){ if(i!==exitIdx && dist[i]>=3) candidates.push(i); }
  for(let i=candidates.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [candidates[i],candidates[j]]=[candidates[j],candidates[i]]; }
  const chosen=[];
  for(const ci of candidates){
    const cc=maze.cells[ci];
    let ok=true;
    for(const kc of chosen){ if(Math.abs(kc.x-cc.x)+Math.abs(kc.y-cc.y)<3){ ok=false; break; } }
    if(ok){ chosen.push(cc); if(chosen.length>=needed) break; }
  }
  TVG.keys=chosen.map((cc,i)=>{ const p=cellCenter(cc.x,cc.y); return {id:'k'+i,x:p.x,y:p.y,found:false,by:null}; });

  let monsterIdx=0, best=-1;
  for(let i=0;i<dist.length;i++){ if(dist[i]>=Math.floor(maxD*0.4) && dist[i]<=Math.floor(maxD*0.75)){ if(Math.random()>0.5||best<0){ monsterIdx=i; best=dist[i]; } } }
  const mc=maze.cells[monsterIdx];
  TVG.monster={x:mc.x*2+1,y:mc.y*2+1,angle:0,mode:'wander',path:[],pathIdx:0,nextWanderAt:0,replanAt:0};

  let i=0;
  for(const id of TVG.order){
    const p=TVG.players[id];
    const off=i*0.18;
    p.x=TVG.spawn.x+Math.cos(i*2.1)*off; p.y=TVG.spawn.y+Math.sin(i*2.1)*off;
    p.angle=0; p.escaped=false; p.caught=false; p.input={dx:0,dy:0};
    i++;
  }
  TVG.escapedIds=[]; TVG.caughtName=null; TVG.graceActive=false; TVG.graceEndsAt=0; TVG.endReason=null;
  TVG.phase='playing';

  const mazePayload={cw:maze.cw,ch:maze.ch,gw:maze.gw,gh:maze.gh,grid:Array.from(maze.grid)};
  const playersMeta=TVG.order.map(id=>({id,name:TVG.players[id].name,color:TVG.players[id].color}));
  for(const id of TVG.order){
    TVG.players[id].conn.send({t:'started',maze:mazePayload,spawn:TVG.spawn,keysNeeded:needed,you:{id,color:TVG.players[id].color,name:TVG.players[id].name},players:playersMeta});
  }
  renderTvGame(true);
}

function tvMonsterSpeed(){
  const m={slow:0.62,normal:1,fast:1.45}[TVG.settings.monsterSpeed]||1;
  return 2.25*m;
}

function tvTick(){
  const now=performance.now();
  const dt=Math.min(0.25,(now-tvLastT)/1000);
  tvLastT=now;
  if(!TVG) return;
  if(TVG.phase==='playing') tvSimulate(dt, now);
  tvRenderDashboard(now);
  tvBroadcastState();
}

function tvSimulate(dt,now){
  const maze=TVG.maze;
  // حركة اللاعبين
  for(const id of TVG.order){
    const p=TVG.players[id];
    if(p.escaped||p.caught) continue;
    const mag=Math.hypot(p.input.dx,p.input.dy);
    if(mag>0.15){
      const nx=p.input.dx/mag, ny=p.input.dy/mag;
      const speed=2.9*Math.min(1,mag);
      const res=moveWithCollision(maze,p.x,p.y,nx*speed*dt,ny*speed*dt);
      p.x=res.x; p.y=res.y;
      p.angle=Math.atan2(ny,nx);
    }
  }
  // التقاط المفاتيح: يتطلب أن يكون في مخروط كشاف لاعب نشط + قريب
  for(const id of TVG.order){
    const p=TVG.players[id];
    if(p.escaped||p.caught) continue;
    const passive=new Set(), cone=new Set();
    castVisible(maze,p.x,p.y,p.angle,passive,cone);
    for(const k of TVG.keys){
      if(k.found) continue;
      const kcx=Math.floor((k.x-1)/2), kcy=Math.floor((k.y-1)/2);
      if(cone.has(kcx+','+kcy) && dist(p.x,p.y,k.x,k.y)<0.85){
        k.found=true; k.by=p.name;
      }
    }
    p._vis={passive,cone};
  }
  // وحش
  const mo=TVG.monster;
  const active=TVG.order.filter(id=>!TVG.players[id].escaped && !TVG.players[id].caught);
  let target=null, targetDist=1e9;
  for(const id of active){ const p=TVG.players[id]; const d=dist(mo.x,mo.y,p.x,p.y); if(d<targetDist){ targetDist=d; target=p; } }
  const speed=tvMonsterSpeed();
  if(target && targetDist<7){
    mo.mode='chase';
    if(now>mo.replanAt){
      const mcx=Math.floor((mo.x-1)/2), mcy=Math.floor((mo.y-1)/2);
      const tcx=Math.floor((target.x-1)/2), tcy=Math.floor((target.y-1)/2);
      const {dist:dmap,prev}=bfsCell(maze,mcx,mcy);
      const tIdx=tcy*maze.cw+tcx;
      const mIdx=mcy*maze.cw+mcx;
      if(dmap[tIdx]>=0){ mo.path=cellPathCoords(maze,prev,mIdx,tIdx); mo.pathIdx=0; }
      mo.replanAt=now+1200;
    }
  } else {
    if(mo.mode!=='wander'){ mo.mode='wander'; mo.path=[]; }
    if(now>mo.nextWanderAt || mo.pathIdx>=mo.path.length){
      const mcx=Math.floor((mo.x-1)/2), mcy=Math.floor((mo.y-1)/2);
      const cell=maze.cells[mcy*maze.cw+mcx];
      const nbrs=[];
      if(cell.N) nbrs.push({x:cell.x,y:cell.y-1});
      if(cell.S) nbrs.push({x:cell.x,y:cell.y+1});
      if(cell.E) nbrs.push({x:cell.x+1,y:cell.y});
      if(cell.W) nbrs.push({x:cell.x-1,y:cell.y});
      if(nbrs.length){ const nb=pick(nbrs); mo.path=[cellCenter(cell.x,cell.y),cellCenter(nb.x,nb.y)]; mo.pathIdx=0; }
      mo.nextWanderAt=now+rnd(1400,2600);
    }
  }
  if(mo.path && mo.pathIdx<mo.path.length){
    const wp=mo.path[mo.pathIdx];
    const d=dist(mo.x,mo.y,wp.x,wp.y);
    if(d<0.15){ mo.pathIdx++; }
    else{
      const dx=(wp.x-mo.x)/d, dy=(wp.y-mo.y)/d;
      mo.angle=Math.atan2(dy,dx);
      const res=moveWithCollision(maze,mo.x,mo.y,dx*speed*dt,dy*speed*dt);
      mo.x=res.x; mo.y=res.y;
    }
  }
  // تصادم / إمساك
  for(const id of active){
    const p=TVG.players[id];
    if(dist(mo.x,mo.y,p.x,p.y)<0.55){
      TVG.caughtName=p.name;
      for(const id2 of TVG.order){ TVG.players[id2].caught=true; }
      TVG.phase='lose'; TVG.endReason='caught';
      vibrate([200,80,200]);
    }
  }
  if(TVG.phase!=='playing') return;

  // وصول للمخرج
  const foundCount=TVG.keys.filter(k=>k.found).length;
  const unlocked=foundCount>=TVG.settings.keysNeeded;
  if(unlocked){
    for(const id of active){
      const p=TVG.players[id];
      if(dist(p.x,p.y,TVG.exit.x,TVG.exit.y)<0.7){
        p.escaped=true; TVG.escapedIds.push(id);
      }
    }
  }
  const remaining=TVG.order.filter(id=>!TVG.players[id].escaped && !TVG.players[id].caught);
  if(TVG.order.length>1 && remaining.length===1 && !TVG.graceActive){
    TVG.graceActive=true; TVG.graceEndsAt=now+40000;
  }
  if(remaining.length===0 && TVG.order.length>0){
    TVG.phase='win'; TVG.endReason='escaped';
  } else if(TVG.graceActive && now>TVG.graceEndsAt){
    TVG.phase='lose'; TVG.endReason='timeout';
    for(const id of TVG.order) TVG.players[id].caught = TVG.players[id].caught || !TVG.players[id].escaped;
  }
}

function tvBroadcastState(){
  if(!TVG || TVG.phase==='lobby') return;
  const maze=TVG.maze;
  for(const id of TVG.order){
    const p=TVG.players[id];
    const conn=p.conn;
    let visCells=[], monsterOut=null, exitVisible=false, othersOut=[], keysOut=[];
    if(maze){
      const passive=p._vis?p._vis.passive:new Set(), cone=p._vis?p._vis.cone:new Set();
      const all=new Set([...passive,...cone]);
      visCells=Array.from(all);
      const mo=TVG.monster;
      if(mo){
        const mcx=Math.floor((mo.x-1)/2), mcy=Math.floor((mo.y-1)/2);
        if(all.has(mcx+','+mcy)) monsterOut={x:mo.x,y:mo.y};
      }
      const ecx=Math.floor((TVG.exit.x-1)/2), ecy=Math.floor((TVG.exit.y-1)/2);
      exitVisible=all.has(ecx+','+ecy);
      for(const oid of TVG.order){
        if(oid===id) continue;
        const op=TVG.players[oid];
        if(op.caught) continue;
        const ocx=Math.floor((op.x-1)/2), ocy=Math.floor((op.y-1)/2);
        if(all.has(ocx+','+ocy)) othersOut.push({id:oid,name:op.name,color:op.color,x:op.x,y:op.y,escaped:op.escaped});
      }
      for(const k of TVG.keys){
        if(k.found) continue;
        const kcx=Math.floor((k.x-1)/2), kcy=Math.floor((k.y-1)/2);
        if(cone.has(kcx+','+kcy)) keysOut.push({id:k.id,x:k.x,y:k.y});
      }
    }
    conn.send({
      t:'state', phase:TVG.phase,
      pos:{x:p.x,y:p.y}, angle:p.angle,
      visCells, monster:monsterOut,
      exit: exitVisible?TVG.exit:null,
      others:othersOut, keys:keysOut,
      keysFound:TVG.keys.filter(k=>k.found).length, keysNeeded:TVG.settings.keysNeeded,
      escaped:p.escaped, caught:p.caught,
      graceActive:TVG.graceActive, graceRemaining: TVG.graceActive? Math.max(0,Math.ceil((TVG.graceEndsAt-performance.now())/1000)) : null,
      endReason:TVG.endReason, caughtName:TVG.caughtName
    });
  }
}

let lastDashUnlocked=false;
function tvRenderDashboard(now){
  if(!TVG) return;
  if(TVG.phase==='lobby'){ return; }
  // لاعبون
  const pc=document.getElementById('tvPlayersCol');
  if(pc) pc.innerHTML='<div class="panel"><div class="titleglow" style="font-size:16px">اللاعبون</div>'+
    TVG.order.map(id=>{
      const p=TVG.players[id];
      let badge='<span class="pbadge">يتجول بالمتاهة</span>';
      if(p.caught) badge='<span class="pbadge dead">افترسه الوحش 💀</span>';
      else if(p.escaped) badge='<span class="pbadge ok">خرج بأمان ✅</span>';
      return `<div class="playerRow">${tvAvatarSvg(p.color,30)}<div class="pname">${p.name}</div>${badge}</div>`;
    }).join('')+'</div>';

  if(TVG.maze && document.getElementById('tvKeyGrid')){
    const foundCount=TVG.keys.filter(k=>k.found).length;
    const cEl=document.getElementById('tvKeyCount'); if(cEl) cEl.textContent=foundCount;
    document.getElementById('tvKeyGrid').innerHTML=TVG.keys.map(k=>
      `<div class="keyCell ${k.found?'found':''}"><div class="keyIcon">🔑</div><div class="keyBy">${k.found?('وجده: '+k.by):'لم يُعثر عليه بعد'}</div></div>`
    ).join('');
    const unlocked=foundCount>=TVG.settings.keysNeeded;
    if(unlocked && !lastDashUnlocked){ playGrowl(0.35); }
    lastDashUnlocked=unlocked;
    const bb=document.getElementById('bigBanner');
    if(bb){
      if(unlocked && TVG.phase==='playing'){ bb.textContent='🔓 تم فتح المخرج! اذهبوا الآن قبل أن يجدكم SCP-096'; bb.classList.remove('hidden'); }
      else bb.classList.add('hidden');
    }
    const gb=document.getElementById('graceBanner');
    if(gb){
      if(TVG.graceActive && TVG.phase==='playing'){
        const rem=Math.max(0,Math.ceil((TVG.graceEndsAt-now)/1000));
        gb.textContent='⏳ آخر لاعب يحاول الوصول… '+rem+' ثانية!';
        gb.classList.remove('hidden');
      } else gb.classList.add('hidden');
    }
  }

  // أجواء الرعب: المسافة بين الوحش وأقرب لاعب
  let minD=999;
  if(TVG.monster){
    for(const id of TVG.order){ const p=TVG.players[id]; if(p.escaped||p.caught) continue; minD=Math.min(minD,dist(TVG.monster.x,TVG.monster.y,p.x,p.y)); }
  }
  ensureAmbient();
  const near=clamp(1-minD/8,0,1);
  setAmbientVol(near*0.22);
  const vg=document.getElementById('tvVignette');
  if(vg) vg.style.boxShadow='inset 0 0 '+(220-near*140)+'px '+(60+near*60)+'px rgba(120,0,0,'+(near*0.55)+')';
  if(!TVG._lastGrowlAt || now-TVG._lastGrowlAt>rnd(2600,5200)-near*2000){
    if(TVG.phase==='playing'){ playGrowl(0.12+near*0.3); TVG._lastGrowlAt=now; }
  }

  if((TVG.phase==='win'||TVG.phase==='lose') && !TVG._endShown){
    TVG._endShown=true;
    const mc=document.getElementById('tvMainCol');
    const title = TVG.phase==='win' ? '🎉 نجا الجميع من المتاهة!' :
      (TVG.endReason==='caught' ? '💀 أمسك SCP-096 بـ '+TVG.caughtName+'… خسر الجميع' : '⏳ انتهى الوقت… خسر الجميع');
    mc.innerHTML=`<div class="panel" style="text-align:center;padding:40px">
      <div class="titleglow" style="font-size:30px;${TVG.phase==='lose'?'color:#ff6b6b':''}">${title}</div>
      <p style="color:#9a88b5;margin-top:14px">يقدر الأدمن يبدأ جولة جديدة من جواله.</p>
    </div>`;
    setAmbientVol(0);
  }
  if(TVG.phase==='playing') TVG._endShown=false;
}

function onCtlMsg(data){
  if(data.t==='lobby'){
    PH.youAreAdmin=data.youAreAdmin; PH.settings=data.settings; PH.players=data.players; PH.code=data.code;
    if(PH.phase==='lobby'){ PH.youAreAdmin? renderPhAdmin() : renderPhLobbyWaiting(); }
  } else if(data.t==='started'){
    PH.phase='playing';
    PH.maze={cw:data.maze.cw,ch:data.maze.ch,gw:data.maze.gw,gh:data.maze.gh,grid:Uint8Array.from(data.maze.grid)};
    PH.spawn=data.spawn; PH.you=data.you; PH.players=data.players; PH.keysNeeded=data.keysNeeded;
    PH.pos={x:data.spawn.x,y:data.spawn.y}; PH.angle=0; PH.escaped=false; PH.caught=false; PH.graceActive=false;
    renderPhGame();
  } else if(data.t==='state'){
    PH.pos=data.pos; PH.angle=data.angle; PH.visCells=new Set(data.visCells);
    PH.monster=data.monster; PH.exit=data.exit; PH.others=data.others; PH.keys=data.keys;
    PH.keysFound=data.keysFound; PH.keysNeeded=data.keysNeeded; PH.escaped=data.escaped; PH.caught=data.caught;
    PH.graceActive=data.graceActive; PH.graceRemaining=data.graceRemaining;
    if(data.phase==='win'||data.phase==='lose'){
      PH.endReason=data.endReason; PH.caughtName=data.caughtName;
      if(PH.phase!=='end'){ PH.phase='end'; renderPhEnd(data.phase); }
    } else {
      phUpdateHud();
    }
  } else if(data.t==='error'){
    const r=document.getElementById('role'); if(r) r.innerHTML='<p>'+data.msg+'</p>';
  }
}

}
function renderPhEnd(phase){
  const win=phase==='win';
  let title = win? '🎉 نجوتوا جميعًا!' : (PH.endReason==='caught'? '💀 افترسكم SCP-096' : '⏳ انتهى الوقت… خسرتم');
  document.getElementById('root').innerHTML=`
  <div id="endScreen">
    <div class="titleglow ${win?'':'flicker'}" style="font-size:28px;${win?'':'color:#ff6b6b'}">${title}</div>
    ${PH.youAreAdmin?'<button class="btn" id="restartBtn">جولة جديدة</button>':'<p style="color:#9a88b5">بانتظار الأدمن ليبدأ جولة جديدة…</p>'}
  </div>`;
  if(PH.youAreAdmin) document.getElementById('restartBtn').onclick=()=>ctlSend({t:'restart'});
}

/* ---------- جويستيك ---------- */
function phInitJoystick(){
  const base=document.getElementById('joyBase'), stick=document.getElementById('joyStick');
  let active=false, cx=0, cy=0;
  function setStick(dx,dy){ stick.style.transform='translate('+(dx*35)+'px,'+(dy*35)+'px)'; }
  function start(clientX,clientY){
    const r=base.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2; active=true;
    move(clientX,clientY);
    if(!joy.sendTimer) joy.sendTimer=setInterval(()=>{ if(PH.phase==='playing'&&!PH.escaped&&!PH.caught) ctlSend({t:'input',dx:joy.dx,dy:joy.dy}); },66);
  }
  function move(clientX,clientY){
    if(!active) return;
    let dx=(clientX-cx)/50, dy=(clientY-cy)/50;
    const m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; }
    joy.dx=dx; joy.dy=dy; setStick(dx,dy);
  }
  function end(){ active=false; joy.dx=0; joy.dy=0; setStick(0,0); ctlSend({t:'input',dx:0,dy:0}); }
  base.addEventListener('touchstart',e=>{e.preventDefault(); const t=e.touches[0]; start(t.clientX,t.clientY);},{passive:false});
  window.addEventListener('touchmove',e=>{ if(!active) return; e.preventDefault(); const t=e.touches[0]; move(t.clientX,t.clientY);},{passive:false});
  window.addEventListener('touchend',()=>{ if(active) end(); });
  base.addEventListener('mousedown',e=>{ start(e.clientX,e.clientY); });
  window.addEventListener('mousemove',e=>{ if(active) move(e.clientX,e.clientY); });
  window.addEventListener('mouseup',()=>{ if(active) end(); });
}

/* ---------- رسم المتاهة على الجوال ---------- */
let phCanvas,phCtx,phAnimT=0;
function phInitCanvas(){
  phCanvas=document.getElementById('gameCanvas'); phCtx=phCanvas.getContext('2d');
  function resize(){ phCanvas.width=innerWidth*devicePixelRatio; phCanvas.height=innerHeight*devicePixelRatio; }
  resize(); window.addEventListener('resize',resize);
  ensureAudio();
}
function drawBean(ctx,x,y,scale,color,moving,animT,label,dim){
  ctx.save(); ctx.translate(x,y); ctx.globalAlpha = dim? 0.55:1;
  const swing = moving? Math.sin(animT*9)*0.4 : Math.sin(animT*1.4)*0.08;
  ctx.strokeStyle='#1a1220'; ctx.lineWidth=3*scale; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-5*scale,9*scale); ctx.lineTo(-5*scale+swing*7*scale,19*scale);
  ctx.moveTo(5*scale,9*scale); ctx.lineTo(5*scale-swing*7*scale,19*scale);
  ctx.moveTo(-8*scale,0); ctx.lineTo(-8*scale-swing*5*scale,8*scale);
  ctx.moveTo(8*scale,0); ctx.lineTo(8*scale+swing*5*scale,8*scale);
  ctx.stroke();
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.ellipse(0,0,9*scale,11*scale,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1.3*scale; ctx.stroke();
  ctx.fillStyle='#0c0c10';
  const rx=-7*scale,ry=-3.5*scale,rw=14*scale,rh=5*scale;
  if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(rx,ry,rw,rh,2*scale); ctx.fill(); }
  else ctx.fillRect(rx,ry,rw,rh);
  ctx.restore();
  if(label){ ctx.fillStyle='#fff'; ctx.font='bold '+Math.round(11*scale)+'px Tajawal'; ctx.textAlign='center'; ctx.fillText(label,x,y+26*scale); }
}
function phDrawFrame(){
  if(!phCtx || !PH.maze) return;
  phAnimT+=0.12;
  const ctx=phCtx, W=phCanvas.width, H=phCanvas.height;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  const maze=PH.maze;
  const winR=6.2;
  const CELL=Math.min(W,H)/(winR*2);
  const px=PH.pos.x, py=PH.pos.y;
  const originX=W/2 - px*CELL, originY=H/2 - py*CELL;
  const minGX=Math.max(0,Math.floor(px-winR*2)), maxGX=Math.min(maze.gw-1,Math.ceil(px+winR*2));
  const minGY=Math.max(0,Math.floor(py-winR*2)), maxGY=Math.min(maze.gh-1,Math.ceil(py+winR*2));
  for(let gy=minGY; gy<=maxGY; gy++){
    for(let gx=minGX; gx<=maxGX; gx++){
      const cx=Math.floor((gx-1)/2), cy=Math.floor((gy-1)/2);
      const vis=PH.visCells.has(cx+','+cy);
      if(!vis) continue;
      const isWall=maze.grid[gy*maze.gw+gx]===1;
      const sx=originX+gx*CELL, sy=originY+gy*CELL;
      ctx.fillStyle = isWall ? '#241a33' : '#0f0a16';
      ctx.fillRect(sx,sy,CELL+1,CELL+1);
      if(!isWall){ ctx.fillStyle='rgba(255,255,255,.015)'; if((gx+gy)%2===0) ctx.fillRect(sx,sy,CELL+1,CELL+1); }
    }
  }
  // توهج مخروط الكشاف
  ctx.save();
  ctx.translate(originX+px*CELL, originY+py*CELL);
  ctx.rotate(PH.angle);
  const grad=ctx.createRadialGradient(0,0,0,0,0,CELL*4.6);
  grad.addColorStop(0,'rgba(255,230,160,.22)'); grad.addColorStop(1,'rgba(255,230,160,0)');
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.moveTo(0,0);
  ctx.arc(0,0,CELL*4.6,-30*Math.PI/180,30*Math.PI/180);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  // المخرج
  if(PH.exit){
    const sx=originX+PH.exit.x*CELL, sy=originY+PH.exit.y*CELL;
    ctx.fillStyle = (PH.keysFound>=PH.keysNeeded)?'#8fe3a8':'#6a5a40';
    ctx.font=Math.round(CELL*0.9)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🚪',sx,sy);
  }
  // المفاتيح الظاهرة
  for(const k of PH.keys){
    const sx=originX+k.x*CELL, sy=originY+k.y*CELL;
    ctx.save(); ctx.translate(sx,sy); ctx.scale(1+0.15*Math.sin(phAnimT*4),1+0.15*Math.sin(phAnimT*4));
    ctx.font=Math.round(CELL*0.85)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor='#ffd166'; ctx.shadowBlur=14;
    ctx.fillText('🔑',0,0);
    ctx.restore();
  }
  // لاعبون آخرون
  for(const o of PH.others){
    const sx=originX+o.x*CELL, sy=originY+o.y*CELL;
    drawBean(ctx,sx,sy,CELL/22,o.color,false,phAnimT,o.name,o.escaped);
  }
  // اللاعب نفسه
  {
    const sx=originX+px*CELL, sy=originY+py*CELL;
    const moving=Math.hypot(joy.dx,joy.dy)>0.15;
    drawBean(ctx,sx,sy,CELL/22,(PH.you&&PH.you.color)||'#ffd166',moving,phAnimT,null,false);
  }
  // الوحش
  if(PH.monster){
    const sx=originX+PH.monster.x*CELL, sy=originY+PH.monster.y*CELL;
    ctx.save(); ctx.translate(sx,sy);
    ctx.fillStyle='#0a0a0c';
    ctx.beginPath(); ctx.ellipse(0,2,CELL*0.55,CELL*0.95,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#e8e0d8';
    ctx.beginPath(); ctx.ellipse(0,-CELL*0.95,CELL*0.42,CELL*0.5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#8a0000'; ctx.shadowColor='#ff2a2a'; ctx.shadowBlur=18;
    ctx.beginPath(); ctx.arc(-CELL*0.14,-CELL*0.98,CELL*0.07,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(CELL*0.14,-CELL*0.98,CELL*0.07,0,Math.PI*2); ctx.fill();
    ctx.restore();
    const dd=dist(px,py,PH.monster.x,PH.monster.y);
    if(dd<4.6){
      ctx.fillStyle='rgba(180,0,0,'+clamp(1-dd/4.6,0,.55)+')'; ctx.fillRect(0,0,W,H);
    }
    if(dd<1.4) vibrate(60);
    ensureAmbient(); setAmbientVol(clamp(1-dd/9,0,1)*0.3);
  } else setAmbientVol(0.03);
  requestAnimationFrame(()=>{ if(PH.phase==='playing') phDrawFrame(); });
}

function ctlSend(obj){ try{parent.postMessage({__emb:1,data:obj},'*')}catch(e){} }
</script>
