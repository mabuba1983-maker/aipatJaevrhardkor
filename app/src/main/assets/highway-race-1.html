<script>
/* الخط يتحمّل بعد اكتمال تحميل الصفحة، حتى ما يؤخّر حدث load اللي ينتظره التطبيق قبل ما يرسل init */

<script>
/* ===== نافذة الأخطاء المنبثقة — تلتقط أي خطأ وتعرضه على الشاشة (تلفزيون وجوال) ===== */
(function(){
  var count=0, seen={};
  function box(){
    var b=document.getElementById('errBox'); if(b) return b;
    b=document.createElement('div'); b.id='errBox';
    b.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:2147483647;max-height:75%;overflow:auto;background:#3a0d12;color:#fff;border:2px solid #ff5a5a;border-radius:14px;padding:10px 12px;font:14px/1.6 Tajawal,system-ui,sans-serif;direction:rtl;text-align:right;box-shadow:0 10px 40px rgba(0,0,0,.65);user-select:text;-webkit-user-select:text';
    var x=document.createElement('button'); x.id='errClose'; x.textContent='إغلاق ✕';
    x.style.cssText='position:sticky;top:0;float:left;background:#ff5a5a;color:#fff;border:0;border-radius:10px;padding:6px 14px;font:700 14px Tajawal,system-ui,sans-serif';
    x.onclick=function(){ if(b.parentNode) b.parentNode.removeChild(b); seen={}; count=0; };
    b.appendChild(x);
    (document.body||document.documentElement).appendChild(b); return b;
  }
  window.__showErr=function(title,detail){
    try{
      var key=title+'|'+detail; if(seen[key]) return null; seen[key]=1; if(++count>8) return null;
      document.documentElement.classList.remove('emb-pending');
      var b=box(), item=document.createElement('div');
      item.style.cssText='border-bottom:1px solid rgba(255,255,255,.2);padding:6px 0;clear:both';
      var h=document.createElement('b'); h.textContent='⚠ '+title;
      var pr=document.createElement('pre');
      pr.style.cssText='white-space:pre-wrap;word-break:break-word;margin:4px 0 0;font:12px/1.5 monospace;direction:ltr;text-align:left';
      pr.textContent=String(detail||'');
      item.appendChild(h); item.appendChild(pr); b.appendChild(item);
      try{ if(window.__onErrSent) window.__onErrSent(title,detail); }catch(_){}
      return item;
    }catch(e){ return null; }
  };
  window.__clearErr=function(item){
    try{ if(item&&item.parentNode){ var b=item.parentNode; b.removeChild(item); if(!b.querySelector('div')&&b.parentNode) b.parentNode.removeChild(b); } }catch(e){}
  };
  window.addEventListener('error',function(e){
    if(e.target&&e.target!==window){ return; } // فشل تحميل مورد (خط/سكربت) يعالجه المحمّل نفسه، مو خطأ كود
    __showErr('خطأ في الكود',(e.message||'')+'\n'+String(e.filename||'').split('/').pop()+':'+(e.lineno||'')+':'+(e.colno||'')+(e.error&&e.error.stack?'\n'+e.error.stack:''));
  },true);
  window.addEventListener('unhandledrejection',function(e){ __showErr('وعد مرفوض (Promise)',String((e.reason&&e.reason.stack)||e.reason)); });
})();
</script>
<script>
/* ===== مخزن الرسائل المبكرة: أي رسالة من التطبيق توصل قبل ما تجهز اللعبة تنحفظ، وتتمرر بنفس ترتيبها بعد الجاهزية ===== */
(function(){
  var q=[];
  window.addEventListener('message',function(e){
    var m=e&&e.data; if(!m||!m.__emb||m.init||m.__replay) return;
    var ready=false; try{ ready=!!EMB; }catch(_){}
    if(!ready&&q.length<300) q.push(m);
  });
  window.__embReplay=function(){
    var items=q.splice(0,q.length);
    items.forEach(function(m){
      var c={}; for(var k in m) c[k]=m[k]; c.__replay=1;
      try{ window.dispatchEvent(new MessageEvent('message',{data:c})); }catch(_){}
    });
  };
})();
</script>

<div id="role" class="card"><p>هذي اللعبة جزء من لوبي «ليالي الرياض» — افتحها من هناك حتى تتوصل تلقائيًا.</p></div>

<script>
/* ===================== EMB BRIDGE (لا تغيّر هذا الجزء) ===================== */
let EMB=null; const embHostConns={};
window.addEventListener('message', e=>{
  const m=e&&e.data; if(!m||!m.__emb) return;
  if(m.init){ EMB={role:m.role,code:m.code,name:m.name}; return embStart(); }
  if(!EMB) return;
  if(EMB.role==='tv'){
    if(m.event==='data'){
      let c=embHostConns[m.id];
      if(!c)c=embHostConns[m.id]={id:m.id,send:obj=>{try{parent.postMessage({__emb:1,to:m.id,data:obj},'*')}catch(e){}}};
      try{onHostMsg(c,m.data)}catch(e){}
    } else if(m.event==='disconnect'){
      try{onPlayerLeave(m.id)}catch(e){}
      delete embHostConns[m.id];
    }
  } else if(EMB.role==='ph'){
    if(m.data!==undefined){try{onCtlMsg(m.data)}catch(e){}}
  }
});
function embReveal(){try{document.documentElement.classList.remove('emb-pending')}catch(e){}}
function embStart(){
  embReveal();
  if(EMB.role==='tv'){ startTv(); } else { startPhone(); }
}
setTimeout(()=>{ if(!EMB) embReveal(); }, 2500);

/* ===================== من هنا تبدأ لعبتك ===================== */
function ctlSend(obj){ try{parent.postMessage({__emb:1,data:obj},'*')}catch(e){} } // يرسل من الجوال للتلفزيون

/* ===== المداخل اللي يستدعيها الجسر — مغلّفة حتى لا يضيع أي خطأ بصمت ===== */
function _guard(where,fn){ try{ return fn(); }catch(e){ __showErr('خطأ: '+where,(e&&e.stack)||String(e)); } }
function startTv(){ _guard('تشغيل شاشة التلفزيون',function(){ _startTv(); }); _guard('تمرير الرسائل المخزّنة',function(){ __embReplay(); }); }
function startPhone(){ _guard('تشغيل واجهة الجوال',function(){ _startPhone(); }); _guard('تمرير الرسائل المخزّنة',function(){ __embReplay(); }); }
function onHostMsg(c,data){ _guard('استقبال رسالة لاعب',function(){ _onHostMsg(c,data); }); }
function onPlayerLeave(id){ _guard('خروج لاعب',function(){ _onPlayerLeave(id); }); }
function onCtlMsg(data){ _guard('استقبال رسالة من التلفزيون',function(){ _onCtlMsg(data); }); }
window.__onErrSent=function(title,detail){   // الجوال يبلّغ التلفزيون بأخطائه
  if(EMB&&EMB.role==='ph') ctlSend({t:'err',title:String(title).slice(0,80),detail:String(detail).slice(0,400)});
};

/* ===================== ثوابت اللعبة ===================== */
var LANES=4, LANE_W=4.2, ROAD_HALF=LANE_W*2;          // أربع مسارات، عرض الطريق 16.8م
var LAT_MAX=9.0;                                       // أقصى انحراف جانبي للسيارة (قبل الحاجز)
var VMAX=80;                                           // م/ث  (~288 كم/س)
var SEG=80, NSEG=11;                                   // قطع الطريق المعاد تدويرها
var COLORS=[0xe63946,0x2a9df4,0xffd166,0x06d6a0,0xc77dff,0xff9a3d,0xf1f1f1,0x48cae4];
var HEX=['#e63946','#2a9df4','#ffd166','#06d6a0','#c77dff','#ff9a3d','#f1f1f1','#48cae4'];
var MAX_PLAYERS=8;
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function laneLat(i){return (i-(LANES-1)/2)*LANE_W}
function hash(n){var x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}

/* مطبات قفز (باركور): موزّعة بشكل حتمي حسب المسافة، فنفس المطب يطلع بنفس المكان عند التلفزيون (فيزياء) وعند كل جوال (رسم) بدون أي تزامن شبكي */
var RAMP_GAP=190, RAMP_LEN=9, RAMP_LIFT=12.5, GRAVITY=25;
function rampAt(seg){
  var h=hash(seg*3.17+9.4);
  if(h<0.45) return null;                                   // مو كل قطعة فيها مطب
  var lane=Math.floor(hash(seg*7.91+1.3)*LANES);
  return {seg:seg,lane:lane,lat:laneLat(lane),d:seg*RAMP_GAP+RAMP_GAP*0.5+(hash(seg*5.03)-0.5)*50};
}
function rampNear(d){
  var seg=Math.floor(d/RAMP_GAP), s, r;
  for(s=seg-1;s<=seg+1;s++){ r=rampAt(s); if(r&&d>r.d-RAMP_LEN/2&&d<r.d+RAMP_LEN/2) return r; }
  return null;
}

/* =====================================================================
   جهة التلفزيون: عرض ثنائي الأبعاد من فوق + لوحة الترتيب (المحاكاة كلها هنا)
   منظور السائق (من داخل السيارة، يلف حتى 190°) يُرسم على جوال كل لاعب — انظر جهة الجوال
   المحرّك ثلاثي الأبعاد أدناه (Canvas 2D بدون أي مكتبة خارجية) يشتغل في الجوال فقط
   ===================================================================== */
var T=null;                                  // حالة اللعبة كاملة
var LOOK_MAX=190*Math.PI/180;                // أقصى دوران للكاميرا الداخلية
var FOGC=[52,24,84];                         // لون الضباب = لون الأفق
var TILE=8;                                  // طول قطعة الأسفلت
var EYE=[-0.30,1.17,-0.10];                  // موضع عين السائق داخل السيارة (يسار)
var PITCH=0.17;                               // ميلان الكاميرا للأسفل ليظهر الدركسون
var LIGHT=(function(){var x=0.3,y=0.85,z=-0.4,l=Math.sqrt(x*x+y*y+z*z);return [x/l,y/l,z/l]})();
var GLASS=[22,32,44];
function hex2rgb(h){return [(h>>16)&255,(h>>8)&255,h&255]}

function _startTv(){
  var root=document.getElementById('root');
  root.innerHTML=
    '<canvas id="gl"></canvas>'+
    '<div id="topbar" class="hud"><div id="rows"></div>'+
      '<div id="leader"><span class="lk">المتصدر</span> <b id="ldName">—</b> <span id="ldInfo"></span></div>'+
      '<div id="tvTitle">رمز الغرفة: <b class="gold" id="roomCode2">----</b></div></div>'+
    '<div id="lobby" class="hud"><h1 class="gold">سباق الطريق السريع</h1>'+
      '<p>رمز الغرفة: <b class="gold code" id="roomCode">----</b></p>'+
      '<p>افتح اللعبة من جوالك وادخل برمز الغرفة</p>'+
      '<p>كل لاعب يشوف السباق من داخل سيارته الملوّنة على جواله</p>'+
      '<p>والتلفزيون يعرض السباق من فوق والمتصدر والترتيب</p></div>'+
    '<div id="tvCredit" class="hud">جميع الحقوق محفوظة © ليالي الرياض</div>';
  var code=(EMB&&EMB.code)||'----';
  document.getElementById('roomCode').textContent=code;
  document.getElementById('roomCode2').textContent=code;
  T={players:{},traffic:[],attractD:0,leaderD:0,leaderV:30,camD:null,lastHud:0,lastT:0,rx:0,cv:null,ctx:null};
  T.cv=document.getElementById('gl'); T.ctx=T.cv.getContext('2d');
  if(!T.ctx) __showErr('تعذّر تشغيل لوحة الرسم (Canvas)','المتصفح ما يدعم Canvas 2D.');
  sizeCanvas();
  window.addEventListener('resize',sizeCanvas);
  for(var i=0;i<16;i++){T.traffic.push({d:0,lat:0,lane:0,v:30,col:hex2rgb(TRAFFIC_COLORS[i%TRAFFIC_COLORS.length])})}
  T.traffic.forEach(function(t){placeTraffic(t,0,60,700)});
  setInterval(broadcast,100);
  requestAnimationFrame(frame);
}
var TRAFFIC_COLORS=[0x8d99ae,0xb56576,0x6d6875,0xe5989b,0x457b9d,0xa8dadc,0x588157,0xbc6c25];
function sizeCanvas(){
  if(!T||!T.cv) return;
  var w=Math.max(320,window.innerWidth||800), h=Math.max(240,window.innerHeight||450);
  if(T.cv.width!==w||T.cv.height!==h){ T.cv.width=w; T.cv.height=h; }
}

/* ---------- الشبكة ---------- */
function _onHostMsg(c,data){
  if(!T||!data||typeof data!=='object') return;
  if(data.t==='err'){ var q=T.players[c.id]; __showErr('خطأ من جوال '+(q?q.name:c.id)+': '+data.title,data.detail); return; }
  var p=T.players[c.id];
  if(data.t==='join'||(!p&&data.t==='in')){
    if(!p) p=addPlayer(c,data.name);
    if(!p){ c.send({t:'full'}); return; }
    p.conn=c;
    c.send({t:'welcome',name:p.name,color:HEX[p.ci],n:Object.keys(T.players).length});
  }
  if(!p) return;
  p.conn=c; p.lastSeen=Date.now(); T.rx++;
  if(data.t==='in'){
    p.steer=clamp(+data.s||0,-1,1);
    p.gas=!!data.g; p.brake=!!data.b;
  }
}
function _onPlayerLeave(id){
  if(!T) return;
  if(T.players[id]) delete T.players[id];
}
function addPlayer(c,name){
  var n=Object.keys(T.players).length;
  if(n>=MAX_PLAYERS) return null;
  var used={}, k, ci=0;
  for(k in T.players) used[T.players[k].ci]=1;
  while(used[ci]) ci++;
  var nm=String(name||'').replace(/\s+/g,' ').trim().slice(0,14)||('لاعب '+(ci+1));
  // أبعد مسار عن باقي اللاعبين
  var lane=0,best=-1,l,minDist;
  for(l=0;l<LANES;l++){
    minDist=99;
    for(k in T.players){ minDist=Math.min(minDist,Math.abs(T.players[k].lat-laneLat(l))); }
    if(minDist>best){best=minDist;lane=l;}
  }
  var lead=n?T.leaderD:0, lv=n?T.leaderV:0;
  var p={id:c.id,conn:c,name:nm,ci:ci,rgb:hex2rgb(COLORS[ci]),lat:laneLat(lane),d:n?Math.max(0,lead-8):0,v:n?lv*0.7:0,yaw:0,
    steer:0,gas:false,brake:false,lv:0,lastSeen:Date.now(),hitCd:1.0,hitFlag:0,hits:0,h:0,vy:0,air:false};
  T.players[c.id]=p;
  return p;
}
function r1(x){return Math.round(x*10)/10}
function r2(x){return Math.round(x*100)/100}
/* لقطة الحالة لكل جوال (10 مرات بالثانية): سيارته + المرور القريب + باقي اللاعبين → الجوال يرسم منظوره بنفسه */
function broadcast(){
  if(!T) return;
  var list=ranked(), i, j, p, q, t, tr, oth;
  for(i=0;i<list.length;i++){
    p=list[i]; tr=[]; oth=[];
    for(j=0;j<T.traffic.length;j++){ t=T.traffic[j]; if(t.d>p.d-150&&t.d<p.d+260) tr.push([j,r1(t.d),r1(t.lat),r1(t.v)]); }
    for(j=0;j<list.length;j++){ q=list[j]; if(q!==p) oth.push([q.ci,q.name,r1(q.d),r1(q.lat),r1(q.v),r2(q.yaw),r1(q.h)]); }
    try{ p.conn.send({t:'st',spd:Math.round(p.v*3.6),dist:Math.round(p.d),rank:i+1,n:list.length,hit:p.hitFlag,
      d:r1(p.d),lat:r2(p.lat),v:r1(p.v),lv:r1(p.lv),h:r1(p.h),ld:list[0].name,tr:tr,o:oth}); }catch(e){}
    p.hitFlag=0;
  }
}
function ranked(){
  var a=[],k; for(k in T.players) a.push(T.players[k]);
  a.sort(function(x,y){return y.d-x.d});
  return a;
}
function playersByColor(){
  var a=[],k; for(k in T.players) a.push(T.players[k]);
  a.sort(function(x,y){return x.ci-y.ci});
  return a;
}

/* ---------- المرور ---------- */
function placeTraffic(t,ref,minAhead,maxAhead){
  var tries,lane,d,ok,i,u;
  for(tries=0;tries<14;tries++){
    lane=Math.floor(Math.random()*LANES);
    d=ref+minAhead+Math.random()*(maxAhead-minAhead);
    ok=true;
    for(i=0;i<T.traffic.length;i++){u=T.traffic[i]; if(u!==t&&u.lane===lane&&Math.abs(u.d-d)<35){ok=false;break;}}
    if(ok) break;
  }
  t.lane=lane; t.lat=laneLat(lane); t.d=d; t.v=22+Math.random()*18;
}

/* ---------- المحاكاة ---------- */
function step(dt){
  var now=Date.now(), k, p, i, j, t, list=[];
  for(k in T.players){
    p=T.players[k];
    if(now-p.lastSeen>20000){ onPlayerLeave(k); continue; }
    var stale=(now-p.lastSeen)>1500;
    var steer=stale?0:p.steer, gas=stale?false:p.gas, brake=stale?false:p.brake;
    var v=p.v;
    if(brake) v-=48*dt;
    else if(gas) v+=24*(1-v/VMAX)*dt;
    else v-=(2.5+v*0.025)*dt;
    var lv=steer*(4+Math.min(v,50)*0.16)*clamp(v/6,0,1);
    p.lv=lv; p.lat+=lv*dt;
    if(p.lat>LAT_MAX){p.lat=LAT_MAX; v-=30*dt;}
    if(p.lat<-LAT_MAX){p.lat=-LAT_MAX; v-=30*dt;}
    p.yaw+=(steer*0.2*clamp(v/10,0,1)-p.yaw)*Math.min(1,dt*8);
    p.steerVis=(p.steerVis||0)+(steer-(p.steerVis||0))*Math.min(1,dt*10);
    p.v=clamp(v,0,VMAX);
    p.d+=p.v*dt;
    p.hitCd=Math.max(0,p.hitCd-dt);
    // مطبات القفز: يطير اللاعب فوق المطب بارتفاع يتناسب مع سرعته، ولا يتصادم وهو بالهواء
    if(!p.air){
      var rp=rampNear(p.d);
      if(rp&&Math.abs(p.lat-rp.lat)<1.9){ p.air=true; p.vy=RAMP_LIFT*clamp(0.55+p.v/VMAX*0.9,0.55,1.25); p.h=0.03; }
    }
    if(p.air){
      p.h+=p.vy*dt; p.vy-=GRAVITY*dt;
      if(p.h<=0){ p.h=0; p.vy=0; p.air=false; p.hitCd=Math.max(p.hitCd,0.2); }
    }
    list.push(p);
  }
  for(i=0;i<T.traffic.length;i++){ t=T.traffic[i]; t.d+=t.v*dt; }
  // تصادم اللاعبين بسيارات المرور: دفع جانبي + خسارة سرعة تتناسب مع شدة الصدمة (ما يصطدم وهو طاير فوق مطب)
  for(i=0;i<list.length;i++){
    p=list[i]; if(p.hitCd>0||p.air) continue;
    for(j=0;j<T.traffic.length;j++){ if(hitPair(p,T.traffic[j],false)) break; }
  }
  // تصادم بين اللاعبين أنفسهم: فيزياء ثنائية الاتجاه (كل طرف يتأثر)
  for(i=0;i<list.length;i++) for(j=i+1;j<list.length;j++){
    if(list[i].hitCd<=0&&list[j].hitCd<=0&&!list[i].air&&!list[j].air) hitPair(list[i],list[j],true);
  }

  var leadD,leadV,lastD;
  if(list.length){
    list.sort(function(a,b){return b.d-a.d});
    leadD=list[0].d; leadV=list[0].v; lastD=list[list.length-1].d;
    for(i=1;i<list.length;i++){   // اللي يتأخر كثير يرجع للسباق
      if(leadD-list[i].d>120){ list[i].d=leadD-35; list[i].v=Math.max(list[i].v,leadV*0.6); list[i].hitCd=2; }
    }
  } else {
    T.attractD+=30*dt; leadD=T.attractD; leadV=30; lastD=leadD;
  }
  T.leaderD=leadD; T.leaderV=leadV;
  var ref=lastD;
  for(i=0;i<T.traffic.length;i++){
    t=T.traffic[i];
    if(t.d<ref-90) placeTraffic(t,leadD,260,720);
  }
  document.getElementById('lobby').style.display=list.length?'none':'block';
}
/* تصادم واقعي بين p وطرف آخر (سيارة مرور أو لاعب): دفع جانبي يتناسب مع مقدار التداخل،
   وخسارة سرعة تتناسب مع شدة الصدمة (فرق السرعة)، وثنائي الاتجاه إذا كان الطرفان لاعبين */
function hitPair(p,o,twoWay){
  var dd=p.d-o.d, dl=p.lat-o.lat;
  var DLIM=4.3, LLIM=1.75;
  if(Math.abs(dd)>=DLIM||Math.abs(dl)>=LLIM) return false;
  var ovL=LLIM-Math.abs(dl), ovD=DLIM-Math.abs(dd);
  var sign=dl!==0?(dl>0?1:-1):(dd>0?1:-1);
  var push=clamp(ovL*1.1,0.25,2.2);
  p.lat=clamp(p.lat+sign*push*(twoWay?0.55:1),-LAT_MAX,LAT_MAX);
  if(twoWay) o.lat=clamp(o.lat-sign*push*0.55,-LAT_MAX,LAT_MAX);
  var rel=p.v-o.v, sev=clamp(Math.abs(rel)/22+ovD/8,0.15,1);
  if(dd>=0){                              // p قدّام الطرف الثاني (صدمه من الخلف أو قطع عليه)
    p.v=Math.max(0,p.v-9*sev-3);
    if(twoWay) o.v=Math.min(VMAX,o.v+5*sev);
  } else {                                // p خلف الطرف الثاني (انصدم من الخلف)
    p.v=Math.min(p.v,o.v*0.5+2);
    if(twoWay) o.v=Math.max(0,o.v-6*sev);
  }
  p.hitCd=0.85+sev*0.9; p.hitFlag=1; p.hits=(p.hits||0)+1;
  if(twoWay){ o.hitCd=0.85+sev*0.9; o.hitFlag=1; o.hits=(o.hits||0)+1; }
  return true;
}

/* ---------- واجهة DOM: المتصدر في الشريط العلوي ---------- */
function updateHud(){
  var rows=document.getElementById('rows'); if(!rows) return;
  var list=ranked();
  while(rows.firstChild) rows.removeChild(rows.firstChild);
  var ld=document.getElementById('leader');
  var r=document.createElement('span'); r.className='chip'; r.innerHTML='اللاعبون <b>'+list.length+'</b>'; rows.appendChild(r);
  if(!list.length){ ld.style.visibility='hidden'; return; }
  ld.style.visibility='visible';
  document.getElementById('ldName').textContent=list[0].name;
  document.getElementById('ldName').style.color=HEX[list[0].ci];
  document.getElementById('ldInfo').textContent=list.length>1?('· '+Math.round(list[0].v*3.6)+' كم/س'):'· لوحدك في السباق';
}

function frame(ts){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(ts-T.lastT)/1000||0.016); T.lastT=ts;
  step(dt);
  if(ts-T.lastHud>250){ T.lastHud=ts; updateHud(); }
  renderTv(dt);
}

/* ---------- رسم التلفزيون: طريق من فوق (السيارات تمشي لليمين) + لوحة الترتيب ---------- */
function rr(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}
function rgbs(c,k){ k=k===undefined?1:k; return 'rgb('+Math.min(255,c[0]*k|0)+','+Math.min(255,c[1]*k|0)+','+Math.min(255,c[2]*k|0)+')'; }
/* سيارة من فوق، مقدمتها لليمين */
function drawCarTop(ctx,cx,cy,len,wid,rgb,yaw,big){
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(yaw||0);
  ctx.fillStyle='rgba(0,0,0,.38)'; rr(ctx,-len/2+2,-wid/2+3,len,wid,wid*0.3); ctx.fill();
  ctx.fillStyle=rgbs(rgb,1); rr(ctx,-len/2,-wid/2,len,wid,wid*0.3); ctx.fill();
  if(big){ ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=Math.max(1.5,wid*0.06); rr(ctx,-len/2,-wid/2,len,wid,wid*0.3); ctx.stroke(); }
  ctx.fillStyle=rgbs(rgb,0.62); rr(ctx,-len*0.40,-wid*0.40,len*0.20,wid*0.80,wid*0.1); ctx.fill();          // الشنطة
  ctx.fillStyle='rgb(20,28,40)'; rr(ctx,-len*0.16,-wid*0.40,len*0.40,wid*0.80,wid*0.14); ctx.fill();          // زجاج الكابينة
  ctx.fillStyle=rgbs(rgb,0.85); rr(ctx,-len*0.09,-wid*0.31,len*0.20,wid*0.62,wid*0.1); ctx.fill();            // السقف
  ctx.fillStyle='rgb(255,242,192)'; ctx.fillRect(len/2-len*0.07,-wid*0.40,len*0.06,wid*0.22); ctx.fillRect(len/2-len*0.07,wid*0.18,len*0.06,wid*0.22);
  ctx.fillStyle='rgb(255,48,48)'; ctx.fillRect(-len/2+len*0.01,-wid*0.40,len*0.05,wid*0.2); ctx.fillRect(-len/2+len*0.01,wid*0.20,len*0.05,wid*0.2);
  ctx.restore();
}
function tvLayout(W,H){
  var bar=Math.round(H*0.085), sL=W/170, sT=sL*1.6, stripH=Math.min(20.4*sT,H*0.34);
  sT=stripH/20.4;
  var top=bar+Math.round(H*0.16), bY=top+stripH+Math.round(H*0.035);
  return {bar:bar,sL:sL,sT:sT,stripH:stripH,top:top,cy:top+stripH/2,boardY:bY,boardH:H-bY-Math.round(H*0.05)};
}
function renderTv(dt){
  var ctx=T.ctx; if(!ctx) return;
  sizeCanvas();
  var W=T.cv.width, H=T.cv.height, L=tvLayout(W,H), list=ranked(), n=list.length, i, k, p, t, d0, lat;
  ctx.setTransform(1,0,0,1,0,0);
  var bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#1d1033'); bg.addColorStop(1,'#0c0618');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  if(T.camD===null) T.camD=T.leaderD;
  T.camD+=(T.leaderD-T.camD)*Math.min(1,dt*5);
  var cam=T.camD, sL=L.sL, sT=L.sT;
  function X(d){ return W*0.80-(cam-d)*sL; }
  function Y(l){ return L.cy+l*sT; }
  var dMin=cam-W*0.80/sL-12, dMax=cam+W*0.20/sL+12;
  // الأسفلت
  ctx.fillStyle='#2a2640'; ctx.fillRect(0,Y(-10.2),W,20.4*sT);
  ctx.fillStyle='#38344f'; ctx.fillRect(0,Y(-8.4),W,16.8*sT);
  ctx.fillStyle='#3d3956';
  for(d0=Math.floor(dMin/16)*16; d0<dMax; d0+=16) ctx.fillRect(X(d0),Y(-8.4),8*sL,16.8*sT);
  ctx.fillStyle='rgb(255,209,102)'; ctx.fillRect(0,Y(-8.4)-2,W,4);
  ctx.fillStyle='rgb(244,244,244)'; ctx.fillRect(0,Y(8.4)-2,W,4);
  ctx.fillStyle='rgba(244,244,244,.85)';
  for(d0=Math.floor(dMin/16)*16; d0<dMax; d0+=16) for(k=-1;k<=1;k++) ctx.fillRect(X(d0+1),Y(k*LANE_W)-2,4*sL,4);
  // الحواجز + أعمدة الإنارة
  ctx.fillStyle='rgb(112,106,134)'; ctx.fillRect(0,Y(-10.2)-3,W,6); ctx.fillRect(0,Y(10.2)-3,W,6);
  ctx.fillStyle='rgb(150,142,176)';
  for(d0=Math.floor(dMin/8)*8; d0<dMax; d0+=8){ ctx.fillRect(X(d0)-2,Y(-10.2)-7,4,14); ctx.fillRect(X(d0)-2,Y(10.2)-7,4,14); }
  var gs=glowSprite(), gr=Math.max(18,sT*2.2);
  ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.8;
  for(d0=Math.floor(dMin/40)*40; d0<dMax; d0+=40){
    ctx.drawImage(gs,X(d0)-gr,Y(-10.2)-gr*1.25-gr,gr*2,gr*2); ctx.drawImage(gs,X(d0)-gr,Y(10.2)+gr*0.25,gr*2,gr*2);
  }
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  // مطبات القفز (باركور)
  var rs0=Math.floor(dMin/RAMP_GAP)-1, rs1=Math.floor(dMax/RAMP_GAP)+1, rk, rp;
  for(rk=rs0;rk<=rs1;rk++){
    rp=rampAt(rk); if(!rp||rp.d<dMin||rp.d>dMax) continue;
    ctx.fillStyle='rgb(255,122,38)'; rr(ctx,X(rp.d-RAMP_LEN/2),Y(rp.lat)-sT*0.95,RAMP_LEN*sL,sT*1.9,4); ctx.fill();
    ctx.strokeStyle='rgb(255,209,102)'; ctx.lineWidth=2; rr(ctx,X(rp.d-RAMP_LEN/2),Y(rp.lat)-sT*0.95,RAMP_LEN*sL,sT*1.9,4); ctx.stroke();
  }
  // المرور
  var len=Math.max(26,4.4*sL), wid=Math.max(14,1.9*sT);
  for(i=0;i<T.traffic.length;i++){ t=T.traffic[i]; if(t.d<dMin||t.d>dMax) continue; drawCarTop(ctx,X(t.d),Y(t.lat),len,wid,t.col,0,false); }
  // اللاعبون (الأبعد خلفًا أولًا) + بطاقات الأسماء
  var labs=[], fs=Math.max(13,Math.round(H*0.025));
  for(i=n-1;i>=0;i--){
    p=list[i]; if(p.d<dMin||p.d>dMax) continue;
    var px=X(p.d), py=Y(p.lat);
    if(p.air){                                               // ظل أرضي + رفع الرسمة لإحساس القفز فوق المطب
      ctx.fillStyle='rgba(0,0,0,.32)'; ctx.beginPath(); ctx.ellipse(px,py,len*0.62,wid*0.5,0,0,Math.PI*2); ctx.fill();
      py-=p.h*sT*2.0;
    }
    drawCarTop(ctx,px,py,len*1.5,wid*1.5,p.rgb,p.yaw*1.0,true);
    labs.push({x:px,y:py-wid*0.8,p:p,rank:i+1});
  }
  labs.sort(function(a,b){return a.x-b.x});
  ctx.font='bold '+fs+'px Tajawal, DejaVu Sans, sans-serif'; ctx.textBaseline='middle'; ctx.textAlign='center';
  var rowEnd=[-1e9,-1e9,-1e9,-1e9], row, lw, lx, ly;
  for(i=0;i<labs.length;i++){
    var o=labs[i], tx=o.rank+' · '+o.p.name;
    lw=ctx.measureText(tx).width+fs*1.2; lx=clamp(o.x,lw/2+6,W-lw/2-6);
    for(row=0;row<3;row++) if(lx-lw/2>rowEnd[row]+8) break;
    if(row>2) row=2;
    rowEnd[row]=lx+lw/2;
    ly=L.top-fs*1.2-row*fs*1.6;
    ctx.strokeStyle=rgbs(o.p.rgb,1); ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(lx,ly+fs*0.8); ctx.lineTo(o.x,o.y); ctx.stroke();
    ctx.fillStyle='rgba(12,6,24,.88)'; rr(ctx,lx-lw/2,ly-fs*0.8,lw,fs*1.6,fs*0.4); ctx.fill();
    ctx.strokeStyle=o.rank===1?'#ffd166':rgbs(o.p.rgb,1); ctx.lineWidth=o.rank===1?4:3; rr(ctx,lx-lw/2,ly-fs*0.8,lw,fs*1.6,fs*0.4); ctx.stroke();
    ctx.fillStyle=o.rank===1?'#ffd166':'#fff'; ctx.fillText(tx,lx,ly+1);
  }
  // لوحة الترتيب
  drawBoard(ctx,L,W,H,list);
}
function drawBoard(ctx,L,W,H,list){
  var n=list.length, i, p, cols, per, gap=W*0.02, bw, bx0;
  ctx.textBaseline='middle';
  if(!n){ return; }
  cols=n>4?2:1; per=Math.ceil(n/cols);
  bw=cols===1?W*0.72:(W*0.94-gap)/2; bx0=cols===1?(W-bw)/2:W*0.03;
  var rh=Math.min(L.boardH/per-6,H*0.105), leadD=list[0].d;
  for(i=0;i<n;i++){
    p=list[i];
    var col=Math.floor(i/per), r=i%per, x0=bx0+col*(bw+gap), y0=L.boardY+r*(rh+6), cy=y0+rh/2, gapM=Math.max(0,Math.round(leadD-p.d));
    ctx.fillStyle='rgba(255,255,255,.07)'; rr(ctx,x0,y0,bw,rh,rh*0.25); ctx.fill();
    var fr=clamp(1-gapM/130,0.08,1)*bw;
    ctx.fillStyle='rgba('+p.rgb[0]+','+p.rgb[1]+','+p.rgb[2]+',.30)'; rr(ctx,x0+bw-fr,y0,fr,rh,rh*0.25); ctx.fill();
    ctx.strokeStyle=i===0?'#ffd166':'rgba(255,255,255,.14)'; ctx.lineWidth=i===0?3:1.5; rr(ctx,x0,y0,bw,rh,rh*0.25); ctx.stroke();
    ctx.fillStyle=i===0?'#ffd166':'rgba(255,255,255,.2)'; ctx.beginPath(); ctx.arc(x0+bw-rh*0.62,cy,rh*0.34,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=i===0?'#2b1a00':'#fff'; ctx.font='900 '+Math.round(rh*0.42)+'px Tajawal, DejaVu Sans, sans-serif'; ctx.textAlign='center';
    ctx.fillText(String(i+1),x0+bw-rh*0.62,cy+1);
    drawCarTop(ctx,x0+bw-rh*1.7,cy,rh*0.95,rh*0.5,p.rgb,0,false);
    ctx.textAlign='right'; ctx.font='bold '+Math.round(rh*0.44)+'px Tajawal, DejaVu Sans, sans-serif'; ctx.fillStyle='#fff';
    ctx.fillText(p.name,x0+bw-rh*2.35,cy+1,bw*0.36);
    ctx.textAlign='left'; ctx.font='bold '+Math.round(rh*0.32)+'px Tajawal, DejaVu Sans, sans-serif';
    ctx.fillStyle='#fff'; ctx.fillText(Math.round(p.v*3.6)+' كم/س',x0+bw*0.03,cy+1);
    ctx.fillStyle='rgba(255,255,255,.82)'; ctx.fillText(Math.round(p.d)+' م',x0+bw*0.25,cy+1);
    ctx.fillStyle=i===0?'#ffd166':'#ff9a9a'; ctx.fillText(i===0?'المتصدر':('− '+gapM+' م'),x0+bw*0.43,cy+1);
  }
}

/* =====================================================================
   المحرّك (يشتغل على الجوال): إسقاط منظوري + قصّ المستوى القريب + ترتيب الرسم من الأبعد للأقرب
   ===================================================================== */
function makeView(ctx,vp,x,y,z,yaw,far,pitch){
  var f=Math.min(vp.h*0.76, vp.w/2/Math.tan(40*Math.PI/180));
  var cy=vp.y+vp.h*0.55;
  return {ctx:ctx,vp:vp,cx:vp.x+vp.w/2,cy:cy,f:f,x:x,y:y,z:z,yaw:yaw,c:Math.cos(yaw),s:Math.sin(yaw),
    cp:Math.cos(pitch),sp:Math.sin(pitch),hy:cy-Math.tan(pitch)*f,far:far,near:0.15,
    mt:[],ground:[],objs:[],inter:[]};
}
/* يحوّل نقطة عالم لإحداثيات الكاميرا [x,y,z] */
function camPt(V,x,y,z){
  var dx=x-V.x, dz=z-V.z, dy=y-V.y;
  var x1=dx*V.c-dz*V.s, z1=dx*V.s+dz*V.c;
  return [x1, dy*V.cp+z1*V.sp, -dy*V.sp+z1*V.cp];
}
function mixFog(rgb,k,ft){
  var r=rgb[0]*k, g=rgb[1]*k, b=rgb[2]*k;
  r=r+(FOGC[0]-r)*ft; g=g+(FOGC[1]-g)*ft; b=b+(FOGC[2]-b)*ft;
  return 'rgb('+(r<0?0:r>255?255:r|0)+','+(g<0?0:g>255?255:g|0)+','+(b<0?0:b>255?255:b|0)+')';
}
/* يضيف مضلّعًا للقائمة. P = نقاط عالم، opt: {nofog,stroke,fogFar} */
function emitPoly(V,list,P,rgb,k,nofog,stroke,fogFar){
  var n=P.length, cam=new Array(n), i, zmin=1e9, zmax=-1e9, c, vp=V.vp;
  for(i=0;i<n;i++){ c=camPt(V,P[i][0],P[i][1],P[i][2]); cam[i]=c; if(c[2]<zmin)zmin=c[2]; if(c[2]>zmax)zmax=c[2]; }
  if(zmax<V.near) return null;
  var ff=fogFar||V.far;
  if(!nofog&&zmin>ff) return null;
  var out=cam;
  if(zmin<V.near){
    out=[];
    for(i=0;i<n;i++){
      var a=cam[i], b=cam[(i+1)%n], ai=a[2]>=V.near, bi=b[2]>=V.near;
      if(ai) out.push(a);
      if(ai!==bi){ var t=(V.near-a[2])/(b[2]-a[2]); out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,V.near]); }
    }

  for(k=0;k<N;k++){
    a0=rot+k/N*Math.PI*2; a1=rot+(k+1)/N*Math.PI*2;
    emitPoly(V,L,[WP(ro,a0),WP(ro,a1),WP(ri,a1),WP(ri,a0)],(k===Math.round(N*0.75))?CAR:[18,16,24],1,true,true);
  }
  [Math.PI,0,-Math.PI/2].forEach(function(sa){
    var a=rot+sa, hw=0.014;
    var ux=Math.cos(a), uy=Math.sin(a), nx2=-uy, ny2=ux;
    function SP(r,o){ var xx=ux*r+nx2*o, yy=uy*r+ny2*o; return W(C[0]+xx, C[1]+yy*vy, C[2]+yy*vz); }
    emitPoly(V,L,[SP(0.03,-hw),SP(ri,-hw),SP(ri,hw),SP(0.03,hw)],[22,20,30],1,true,true);
  });
  emitPoly(V,L,circlePts(0,0,0,0.055,14,function(x,y){ var ux=x, uy=y; return W(C[0]+ux, C[1]+uy*vy, C[2]+uy*vz-0.004); }),[44,38,56],1,true,true);
  emitPoly(V,L,circlePts(0,0,0,0.028,12,function(x,y){ var ux=x, uy=y; return W(C[0]+ux, C[1]+uy*vy, C[2]+uy*vz-0.008); }),CAR,1,true,false);
}

/* ---------- رسم منظور السائق (على الجوال) ---------- */
/* world = {traffic:[{lat,d,col}], others:[{lat,d,yaw,rgb,name}]}، p = سيارة اللاعب نفسه */
function renderScene(ctx,world,p,vp,far){
  var V, eyeX, eyeY=EYE[1]+(p.h||0), eyeZ, yaw, i, t, q, k, o, j;
  var c=Math.cos(p.yaw), s=Math.sin(p.yaw);
  eyeX=p.lat+EYE[0]*c+EYE[2]*s; eyeZ=p.d-EYE[0]*s+EYE[2]*c; yaw=p.yaw+p.look;
  V=makeView(ctx,vp,eyeX,eyeY,eyeZ,yaw,far,PITCH);
  ctx.save(); ctx.beginPath(); ctx.rect(vp.x,vp.y,vp.w,vp.h); ctx.clip();
  drawSky(V);
  buildWorld(V);
  for(i=0;i<world.traffic.length;i++){ t=world.traffic[i]; emitCar(V,V.objs,t.lat,t.d,0,t.col,null,null); }
  for(i=0;i<world.others.length;i++){ q=world.others[i]; emitCar(V,V.objs,q.lat,q.d,q.yaw,q.rgb,q.name,q.rgb,q.h); }
  buildInterior(V,p);
  V.mt.sort(byFar); V.ground.sort(byFar); V.objs.sort(byFar); V.inter.sort(byFar);
  for(k=0;k<V.mt.length;k++) drawPoly(ctx,V.mt[k]);
  for(k=0;k<V.ground.length;k++) drawPoly(ctx,V.ground[k]);
  for(k=0;k<V.objs.length;k++){
    o=V.objs[k];
    if(o.kind==='multi'){ for(j=0;j<o.polys.length;j++) drawPoly(ctx,o.polys[j]); }
    else if(o.kind==='line'){ ctx.strokeStyle=o.col; ctx.lineWidth=o.w; ctx.beginPath(); ctx.moveTo(o.x0,o.y0); ctx.lineTo(o.x1,o.y1); ctx.stroke(); }
    else if(o.kind==='glow'){ ctx.globalAlpha=o.a; ctx.globalCompositeOperation='lighter'; ctx.drawImage(glowSprite(),o.x-o.r,o.y-o.r,o.r*2,o.r*2); ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1; }
    else if(o.kind==='label'){ drawLabel(ctx,o); }
  }
  for(k=0;k<V.inter.length;k++) drawPoly(ctx,V.inter[k]);
  drawHud(V,p);
  ctx.restore();
}
function drawLabel(ctx,o){
  ctx.font='bold '+Math.round(o.px)+'px Tajawal, DejaVu Sans, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  var w=ctx.measureText(o.text).width+o.px*0.8, h=o.px*1.5;
  ctx.fillStyle='rgba(15,8,28,0.75)'; ctx.fillRect(o.x-w/2,o.y-h/2,w,h);
  ctx.strokeStyle='rgb('+o.col[0]+','+o.col[1]+','+o.col[2]+')'; ctx.lineWidth=2; ctx.strokeRect(o.x-w/2,o.y-h/2,w,h);
  ctx.fillStyle='#fff'; ctx.fillText(o.text,o.x,o.y+1);
}
/* الاسم والمركز تعرضهما عناصر DOM فوق الشاشة (#phTop/#phRank) — هنا فقط السرعة ومؤشر النظر، بدون بطاقات خلفية، بظل نص فقط حتى الكاميرا تبقى ظاهرة كاملة */
function drawHud(V,p){
  var ctx=V.ctx, vp=V.vp, fs=Math.max(13,Math.round(vp.h*0.045)), cx=vp.x+vp.w/2, by=vp.y+vp.h-Math.max(fs*2.2,vp.h*0.26);
  ctx.textBaseline='middle'; ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,.85)'; ctx.shadowBlur=8;
  var spTxt=String(Math.round(p.v*3.6))+' كم/س', spFs=Math.round(fs*2.1);
  ctx.font='900 '+spFs+'px Tajawal, DejaVu Sans, sans-serif';
  if(ctx.measureText(spTxt).width>vp.w*0.62){ spFs=Math.round(spFs*(vp.w*0.62/ctx.measureText(spTxt).width)); ctx.font='900 '+spFs+'px Tajawal, DejaVu Sans, sans-serif'; }
  ctx.fillStyle='#fff'; ctx.fillText(spTxt,cx,by-fs*0.3);
  if(Math.abs(p.look)>0.35){
    ctx.font='bold '+Math.round(fs*0.95)+'px Tajawal, DejaVu Sans, sans-serif'; ctx.fillStyle='#ffd166';
    ctx.fillText('◉ '+Math.round(Math.abs(p.look)*180/Math.PI)+'°',cx,vp.y+fs*1.7);
  }
  ctx.shadowBlur=0;
  if(p.hitCd>0.4&&Math.floor(Date.now()/100)%2===0){ ctx.fillStyle='rgba(255,60,60,0.22)'; ctx.fillRect(vp.x,vp.y,vp.w,vp.h); }
}


/* =====================================================================
   جهة الجوال — منظور السائق من داخل السيارة (يلف حتى 190°) + ريموت
   التلفزيون هو الحَكَم: يرسل لقطة 10 مرات بالثانية، والجوال يرسم ويتنبأ بحركته محليًا
   كل تغيير في الأزرار + نبضة كل 100ms تروح للتلفزيون
   ===================================================================== */
var PH=null, S=null;
function _startPhone(){
  var root=document.getElementById('root');
  root.innerHTML=
    '<div id="ph">'+
      '<canvas id="pv"></canvas>'+
      '<div id="phTop"><div id="phName" class="gold"></div>'+
        '<div id="phRank" style="font-weight:900;font-size:15px;text-shadow:0 1px 5px #000"></div>'+
        '<div id="phStatus"><span class="dotS"></span><span id="phStatusTxt">بانتظار التلفزيون…</span></div></div>'+
      '<div id="pad">'+
        '<div class="side">'+
          '<div class="rowb"><div class="pb sm" id="bLL">◀👁</div><div class="pb sm" id="bLR">👁▶</div></div>'+
          '<div class="rowb"><div class="pb" id="bL">◀</div><div class="pb" id="bR">▶</div></div>'+
        '</div>'+
        '<div class="side">'+
          '<div class="rowb"><div class="pb brake" id="bB">⏹</div><div class="pb gas" id="bG">▲</div></div>'+
        '</div>'+
      '</div>'+
      '<div id="phFoot">جميع الحقوق محفوظة © ليالي الرياض · <span id="sent">0</span> رسالة مرسلة</div>'+
    '</div>';
  PH={connected:false,L:false,R:false,LL:false,LR:false,g:false,b:false,seq:0,sent:0,lastRx:0,lastSend:0,look:0,lookIdle:0,
      cv:document.getElementById('pv'),ctx:null,lastDraw:0};
  S={have:false,d:0,lat:0,v:0,yaw:0,steerVis:0,rank:1,n:1,hitCd:0,rgb:[230,57,70],name:'',tr:{},oth:{},snaps:0,lastSnap:0,h:0,vy:0,air:false};
  PH.ctx=PH.cv.getContext('2d');
  if(!PH.ctx) __showErr('تعذّر تشغيل لوحة الرسم (Canvas)','المتصفح ما يدعم Canvas 2D.');
  document.getElementById('phName').textContent=(EMB&&EMB.name)||'لاعب';
  function push(){ phSend({t:'in',s:(PH.R?1:0)-(PH.L?1:0),g:PH.g,b:PH.b,n:++PH.seq}); }
  function hold(id,set,send){
    var el=document.getElementById(id), ids={};
    function down(e){ e.preventDefault(); try{el.setPointerCapture(e.pointerId)}catch(_){}
      ids[e.pointerId]=1; set(true); el.classList.add('on'); if(send) push(); }
    function up(e){ delete ids[e.pointerId];
      if(!Object.keys(ids).length){ set(false); el.classList.remove('on'); if(send) push(); } }
    el.addEventListener('pointerdown',down);
    ['pointerup','pointercancel','lostpointercapture'].forEach(function(n){el.addEventListener(n,up)});
    el.addEventListener('contextmenu',function(e){e.preventDefault()});
  }
  hold('bL',function(v){PH.L=v},true); hold('bR',function(v){PH.R=v},true);
  hold('bG',function(v){PH.g=v},true); hold('bB',function(v){PH.b=v},true);
  hold('bLL',function(v){PH.LL=v},false); hold('bLR',function(v){PH.LR=v},false);   // النظر محلي على الجوال
  function releaseAll(){ PH.L=PH.R=PH.g=PH.b=PH.LL=PH.LR=false; ['bL','bR','bG','bB','bLL','bLR'].forEach(function(i){document.getElementById(i).classList.remove('on')}); push(); }
  window.addEventListener('blur',releaseAll);
  document.addEventListener('visibilitychange',function(){ if(document.hidden) releaseAll(); });
  // الانضمام: يرسل فورًا ويكرر (كل 250ms أول 20 ثانية ثم كل 700ms) لين التلفزيون يرد
  PH.t0=Date.now(); PH.wd=null; PH.rx=0;
  (function tick(){
    if(!PH.connected) phSend({t:'join',name:(EMB&&EMB.name)||''});
    // لو التلفزيون سكت أكثر من 2.5 ثانية نعتبر الاتصال مقطوع ونرجع نعيد الانضمام
    if(PH.connected&&Date.now()-PH.lastRx>2500){ PH.connected=false; S.have=false; S.tr={}; S.oth={}; setStatus(false); }
    // ما رد خلال 8 ثواني: ننبّه بنافذة فيها التفاصيل
    if(!PH.connected&&!PH.wd&&Date.now()-PH.t0>8000){
      PH.wd=__showErr('ما وصل رد من التلفزيون','أرسل الجوال '+PH.sent+' رسالة والتلفزيون ما رد.\nتأكد أن اللعبة شغّالة على التلفزيون بنفس الرمز: '+((EMB&&EMB.code)||'؟')+'\n(الجوال يكمل المحاولة تلقائيًا)');
    }
    setTimeout(tick,(Date.now()-PH.t0<20000)?250:700);
  })();
  // نبضة التحكم: دايمًا تروح حتى لو ما لمست شي (تثبت إن الجوال حي)
  setInterval(push,100);
  setStatus(false);
  requestAnimationFrame(pframe);
}

/* ---------- حلقة الرسم على الجوال ---------- */
function pframe(ts){
  requestAnimationFrame(pframe);
  if(!PH||ts-PH.lastDraw<26) return;                       // ~35 إطار/ثانية كحد أعلى (توفير بطارية)
  var dt=Math.min(0.06,(ts-PH.lastDraw)/1000||0.033); PH.lastDraw=ts;
  _guard('رسم منظور السائق',function(){ pstep(dt); pdraw(); });
}
function pstep(dt){
  if(!S.have) return;
  var steer=(PH.R?1:0)-(PH.L?1:0), v=S.v, lk=(PH.LR?1:0)-(PH.LL?1:0);
  if(PH.b) v-=48*dt; else if(PH.g) v+=24*(1-v/VMAX)*dt; else v-=(2.5+v*0.025)*dt;
  var lv=steer*(4+Math.min(v,50)*0.16)*clamp(v/6,0,1);
  S.lat+=lv*dt;
  if(S.lat>LAT_MAX){S.lat=LAT_MAX; v-=30*dt;} if(S.lat<-LAT_MAX){S.lat=-LAT_MAX; v-=30*dt;}
  S.yaw+=(steer*0.2*clamp(v/10,0,1)-S.yaw)*Math.min(1,dt*8);
  S.steerVis+=(steer-S.steerVis)*Math.min(1,dt*10);
  S.v=clamp(v,0,VMAX); S.d+=S.v*dt;
  S.hitCd=Math.max(0,S.hitCd-dt);
  // مطبات القفز: نفس حساب التلفزيون بالضبط عشان الإحساس بالقفز يطلع متطابق تقريبًا محليًا بدون انتظار الشبكة
  if(!S.air){
    var rp=rampNear(S.d);
    if(rp&&Math.abs(S.lat-rp.lat)<1.9){ S.air=true; S.vy=RAMP_LIFT*clamp(0.55+S.v/VMAX*0.9,0.55,1.25); S.h=0.03; }
  }
  if(S.air){ S.h+=S.vy*dt; S.vy-=GRAVITY*dt; if(S.h<=0){ S.h=0; S.vy=0; S.air=false; } }
  // الكاميرا الداخلية: تلف بالأزرار حتى 190° وترجع للأمام لما تفلتها
  if(lk!==0){ PH.look=clamp(PH.look+lk*dt*2.6,-LOOK_MAX,LOOK_MAX); PH.lookIdle=0; }
  else { PH.lookIdle+=dt; if(PH.lookIdle>0.7){ var rr2=Math.min(Math.abs(PH.look),dt*5); PH.look-=(PH.look>0?1:-1)*rr2; } }
}
/* كيان (سيارة مرور / لاعب آخر): تنبّؤ بالسرعة + تلاشي تدريجي لفرق اللقطة الجديدة */
function entPos(e,now){
  var raw=(now-e.t0)/1000, age=Math.min(0.4,raw), dec=Math.exp(-raw*8);
  return {d:e.d+e.v*age+e.ed*dec, l:e.lat+e.el*dec};
}
function entUpdate(e,d,lat,v,now,h){
  if(e.has){ var pr=entPos(e,now); e.ed=pr.d-d; e.el=pr.l-lat; if(Math.abs(e.ed)>25||Math.abs(e.el)>8){ e.ed=0; e.el=0; } }
  else { e.ed=0; e.el=0; e.has=true; }
  e.d=d; e.lat=lat; e.v=v; e.t0=now; e.seen=now; e.h=h||0;
}
function pdraw(){
  var cv=PH.cv, ctx=PH.ctx; if(!ctx) return;
  var cw=cv.clientWidth||300, ch=cv.clientHeight||200, sc=Math.min(window.devicePixelRatio||1,1.75,760/cw);
  var w=Math.max(160,Math.round(cw*sc)), h=Math.max(120,Math.round(ch*sc));
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  ctx.setTransform(1,0,0,1,0,0);
  if(!S.have){
    var g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,'#1d1033'); g.addColorStop(1,'#0c0618'); ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='bold '+Math.round(h*0.07)+'px Tajawal, DejaVu Sans, sans-serif';
    ctx.fillText(PH.connected?'جاري تحميل الطريق…':'بانتظار التلفزيون…',w/2,h/2);
    return;
  }
  var now=Date.now(), k, e, world={traffic:[],others:[]}, pp;
  for(k in S.tr){ e=S.tr[k]; if(now-e.seen>900){ delete S.tr[k]; continue; } pp=entPos(e,now); world.traffic.push({lat:pp.l,d:pp.d,col:e.col}); }
  for(k in S.oth){ e=S.oth[k]; if(now-e.seen>900){ delete S.oth[k]; continue; } pp=entPos(e,now); world.others.push({lat:pp.l,d:pp.d,yaw:e.yaw,rgb:e.rgb,name:e.name,h:e.h||0}); }
  var me={lat:S.lat,d:S.d,yaw:S.yaw,look:PH.look,v:S.v,steerVis:S.steerVis,rgb:S.rgb,name:S.name||(EMB&&EMB.name)||'',hitCd:S.hitCd,rank:S.rank,h:S.h||0};
  renderScene(ctx,world,me,{x:0,y:0,w:w,h:h},w<500?160:200);
}
function onSnap(data){
  var now=Date.now(), j, a, e;
  if(!isFinite(data.d)||!isFinite(data.lat)||!isFinite(data.v)) return;   // لقطة ناقصة: تجاهلها
  if(!isFinite(data.lv)) data.lv=0;
  if(!S.have||Math.abs(S.d-(data.d+data.v*0.06))>25){ S.d=data.d+data.v*0.06; S.lat=data.lat; S.v=data.v; S.have=true; S.h=data.h||0; }
  else { S.d+=(data.d+data.v*0.06-S.d)*0.35; S.lat+=(data.lat+data.lv*0.06-S.lat)*0.25; S.v+=(data.v-S.v)*0.35; if(isFinite(data.h)) S.h+=(data.h-S.h)*0.25; }
  S.rank=data.rank|0; S.n=data.n|0; S.snaps++; S.lastSnap=now;
  var rkEl=document.getElementById('phRank');
  if(rkEl){ rkEl.textContent=(S.rank===1?'المتصدر':('المركز '+S.rank+'/'+S.n)); rkEl.style.color=S.rank===1?'#ffd166':'#fff'; }
  if(data.hit){ S.hitCd=1.2; try{navigator.vibrate&&navigator.vibrate(120)}catch(_){} }
  if(data.tr) for(j=0;j<data.tr.length;j++){
    a=data.tr[j]; e=S.tr[a[0]];
    if(!e){ e={col:hex2rgb(TRAFFIC_COLORS[a[0]%TRAFFIC_COLORS.length])}; S.tr[a[0]]=e; }
    entUpdate(e,a[1],a[2],a[3],now);
  }
  if(data.o) for(j=0;j<data.o.length;j++){
    a=data.o[j]; e=S.oth[a[0]];
    if(!e){ e={rgb:hex2rgb(COLORS[a[0]%COLORS.length])}; S.oth[a[0]]=e; }
    e.name=a[1]; e.yaw=a[5]||0; entUpdate(e,a[2],a[3],a[4],now,a[6]);
  }
}
function phSend(obj){
  ctlSend(obj);
  if(PH){ PH.sent++; var el=document.getElementById('sent'); if(el) el.textContent=String(PH.sent); }
}
function setStatus(ok){
  var st=document.getElementById('phStatus'), tx=document.getElementById('phStatusTxt');
  if(!st) return;
  st.className=ok?'ok':''; tx.textContent=ok?'متصل بالتلفزيون ✓':'بانتظار التلفزيون…';
}
function _onCtlMsg(data){
  if(!PH||!data||typeof data!=='object') return;
  PH.lastRx=Date.now(); PH.rx++;
  if(data.t==='welcome'){
    PH.connected=true; setStatus(true);
    if(PH.wd){ __clearErr(PH.wd); PH.wd=null; }
    if(data.name) document.getElementById('phName').textContent=data.name;
    if(data.color){ document.getElementById('phName').style.cssText='color:'+data.color+';-webkit-text-fill-color:'+data.color;
      var m=/^#([0-9a-f]{6})$/i.exec(data.color); if(m) S.rgb=hex2rgb(parseInt(m[1],16)); }
    if(data.name) S.name=data.name;
  } else if(data.t==='full'){
    document.getElementById('phStatusTxt').textContent='الغرفة ممتلئة';
  } else if(data.t==='st'){
    if(!PH.connected){ PH.connected=true; setStatus(true); }
    if(PH.wd){ __clearErr(PH.wd); PH.wd=null; }
    onSnap(data);
  }
}
