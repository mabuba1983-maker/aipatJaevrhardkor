plugins {
    id 'com.android.application'
}
android {
    namespace 'com.layaliriyadh.library'
    compileSdk 35
    defaultConfig {
        applicationId 'com.layaliriyadh.library'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            // Sign the release APK so Android can install it.
            // This uses the standard debug key for this test distribution.
            signingConfig signingConfigs.debug
        }
    }
}
