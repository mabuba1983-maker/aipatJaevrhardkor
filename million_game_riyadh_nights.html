/* ===================== EMB BRIDGE (لا تغيّر هذا الجزء) ===================== */
let EMB=null; const embHostConns={};
window.addEventListener('message', e=>{
  const m=e&&e.data; if(!m||!m.__emb) return;
  if(m.init){ EMB={role:m.role,code:m.code,name:m.name}; return embStart(); }
  if(!EMB) return;
  if(EMB.role==='tv'){
    if(m.event==='data'){
      let c=embHostConns[m.id];
      if(!c)c=embHostConns[m.id]={id:m.id,send:obj=>{try{parent.postMessage({__emb:1,to:m.id,data:obj},'*')}catch(e){}}};
      try{onHostMsg(c,m.data)}catch(e){}
    } else if(m.event==='disconnect'){
      try{onPlayerLeave(m.id)}catch(e){}
      delete embHostConns[m.id];
    }
  } else if(EMB.role==='ph'){
    if(m.data!==undefined){try{onCtlMsg(m.data)}catch(e){}}
  }
});
function embReveal(){try{document.documentElement.classList.remove('emb-pending')}catch(e){}}
function embStart(){
  embReveal();
  if(EMB.role==='tv'){ startTv(); } else { startPhone(); }
}
setTimeout(()=>{ if(!EMB) embReveal(); }, 2500);

class SoundFx {
  constructor() { this.ctx = null; }
  init() {
    if(!this.ctx && window.AudioContext) this.ctx = new AudioContext();
    if(this.ctx && this.ctx.state==='suspended') this.ctx.resume().catch(()=>{});
  }
  thump() {
    this.init(); if(!this.ctx) return;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain(), t=this.ctx.currentTime;
    o.type='sine'; o.frequency.setValueAtTime(60, t); o.frequency.exponentialRampToValueAtTime(25, t+0.25);
    g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.01, t+0.25);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t+0.25);
  }
  correct() {
    this.init(); if(!this.ctx) return;
    [261.6, 329.6, 392.0, 523.2, 659.2].forEach((f, i) => {
      const o=this.ctx.createOscillator(), g=this.ctx.createGain(), t=this.ctx.currentTime + i*0.09;
      o.type='triangle'; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.5);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t+0.5);
    });
  }
  wrong() {
    this.init(); if(!this.ctx) return;
    [120, 115, 80].forEach(f => {
      const o=this.ctx.createOscillator(), g=this.ctx.createGain(), t=this.ctx.currentTime;
      o.type='sawtooth'; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.7);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t+0.7);
    });
  }
  cash() {
    this.init(); if(!this.ctx) return;
    for(let i=0; i<4; i++){
      const o=this.ctx.createOscillator(), g=this.ctx.createGain(), t=this.ctx.currentTime + i*0.08;
      o.type='sine'; o.frequency.setValueAtTime(900+i*300, t);
      g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.01, t+0.25);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t+0.25);
    }
  }
}

function broadcastTvState() {
  const payload = {
    t: 'state',
    status: TV.status,
    activeContestantId: TV.activeContestantId,
    activeContestantName: TV.activeContestantName,
    level: TV.level,
    currentPrize: TV.currentPrize,
    nextPrize: TV.nextPrize,
    timer: TV.timer,
    selectedOpt: TV.selectedOpt,
    players: TV.players,
    category: TV.currentQ ? TV.currentQ.category : '',
    qText: TV.currentQ ? TV.currentQ.q : '',
    options: TV.currentQ ? TV.currentQ.options : []
  };
  for(let id in embHostConns) {
    embHostConns[id].send(payload);
  }
}

function updateTvLadder() {
  const container = document.getElementById('tv-ladder');
  if(!container) return;
  container.innerHTML = PRIZES.map(p => {
    let cls = 'ladder-item';
    if(TV.level === p.level) cls += ' active';
    else if(TV.level > p.level) cls += ' passed';
    return `<div class="${cls}">
      <span>${p.level} ${p.milestone?'⭐':''}</span>
      <span>${p.label}</span>
    </div>`;
  }).join('');
}

function updateTvPlayerList() {
  const list = document.getElementById('tv-player-list');
  const count = document.getElementById('tv-player-count');
  if(!list) return;
  count.innerText = `${TV.players.length} لاعب`;
  if(TV.players.length === 0) {
    list.innerHTML = '<div style="font-size:0.8rem; color:#a380c9; text-align:center; padding:20px 8px;">لم يدخل أي لاعب بعد.<br>أول لاعب يدخل سيكون الأدمن.</div>';
    return;
  }
  const sorted = [...TV.players].sort((a,b) => b.score - a.score);
  list.innerHTML = sorted.map((p, idx) => `
    <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(40,15,65,0.6); padding:8px 10px; border-radius:10px; border:1px solid ${p.id===TV.activeContestantId?'#ffd166':'rgba(255,209,102,0.1)'};">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-weight:900; color:#ffd166; font-size:0.75rem;">#${idx+1}</span>
        <div class="avatar-circle" style="background:${p.color||'#ffd166'};">${p.name.slice(0,1)}</div>
        <div style="font-size:0.85rem; font-weight:700;">${p.name} ${p.isAdmin?'<span style="font-size:0.65rem; color:#ffd166;">(أدمن)</span>':''}</div>
      </div>
      <div style="font-weight:900; color:#ffd166; font-size:0.85rem;">${p.score.toLocaleString()} <span style="font-size:0.65rem; color:#d1b8f0;">ر.س</span></div>

}

function startRoundWithRandomPlayer() {
  if(TV.players.length === 0) return;
  const rand = TV.players[Math.floor(Math.random() * TV.players.length)];
  TV.activeContestantId = rand.id;
  TV.activeContestantName = rand.name;
  TV.level = 1;
  TV.currentPrize = 0;
  TV.nextPrize = 1000;
  loadNextQuestion();
}

let questionDeck = [];
function getNextNonRepeatingQuestion() {
  if (questionDeck.length === 0) {
    questionDeck = [...QUESTIONS];
    for (let i = questionDeck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const temp = questionDeck[i];
      questionDeck[i] = questionDeck[j];
      questionDeck[j] = temp;
    }
  }
  return questionDeck.pop();
}

function loadNextQuestion() {
  TV.status = 'question';
  TV.selectedOpt = null;
  TV.timer = 30;
  TV.currentQ = getNextNonRepeatingQuestion();
  sfx.thump();

  const speech = document.getElementById('tv-speech');
  if(speech) speech.innerText = `السؤال لـ ${TV.activeContestantName}! ركز في الخيارات الأربعة وأجب من جوالك.`;

  renderTvStage();
  updateTvLadder();
  broadcastTvState();

  clearInterval(tvTimer);
  tvTimer = setInterval(() => {
    if(TV.timer > 0) {
      TV.timer--;
      const tEl = document.getElementById('tv-timer-display');
      if(tEl) tEl.innerText = TV.timer;
      broadcastTvState();
    } else {
      clearInterval(tvTimer);
      handleTimeout();
    }
  }, 1000);
}

function handleAnswerChosen(optIndex) {
  if(TV.status !== 'question') return;
  TV.status = 'locked';
  TV.selectedOpt = optIndex;
  clearInterval(tvTimer);

  sfx.thump();
  const speech = document.getElementById('tv-speech');
  if(speech) speech.innerText = `ثبتنا إجابة ${TV.activeContestantName}.. النتيجة بعد ثوانٍ!`;
  renderTvStage();
  broadcastTvState();

  setTimeout(() => {
    const isCorrect = (optIndex === TV.currentQ.correct);
    if(isCorrect) {
      sfx.correct();
      TV.status = 'decision';
      TV.currentPrize = PRIZES.find(p => p.level === TV.level)?.amount || 1000;
      TV.nextPrize = PRIZES.find(p => p.level === TV.level + 1)?.amount || TV.currentPrize * 2;
      if(speech) speech.innerText = `إجابة صحيحة يا ${TV.activeContestantName}! رصيدك ${TV.currentPrize.toLocaleString()} ر.س. هل تكمل وتضاعف أو تسحب الفلوس؟`;
      renderTvStage();
      broadcastTvState();
    } else {
      sfx.wrong();
      TV.status = 'wrong';
      if(speech) speech.innerText = `للأسف إجابة خاطئة! ضاعت أرباح الجولة.. الإجابة الصحيحة كانت: ${TV.currentQ.options[TV.currentQ.correct]}`;
      renderTvStage();
      broadcastTvState();

      setTimeout(() => {
        startRoundWithRandomPlayer();
      }, 4500);
    }
  }, 2200);
}

function handleTimeout() {
  sfx.wrong();
  TV.status = 'wrong';
  const speech = document.getElementById('tv-speech');
  if(speech) speech.innerText = `انتهى الوقت المحدد يا ${TV.activeContestantName}!`;
  renderTvStage();
  broadcastTvState();
  setTimeout(() => {
    startRoundWithRandomPlayer();
  }, 4000);
}

function handlePlayerDecision(decision) {
  if(TV.status !== 'decision') return;
  if(decision === 'take') {
    sfx.cash();
    const p = TV.players.find(x => x.id === TV.activeContestantId);
    if(p) {
      p.score += TV.currentPrize;
      p.streak += 1;
    }
    const speech = document.getElementById('tv-speech');
    if(speech) speech.innerText = `أحسنت! سحب ${TV.activeContestantName} مبلغ ${TV.currentPrize.toLocaleString()} ر.س وثبّت صدارته!`;
    updateTvPlayerList();
    broadcastTvState();
    setTimeout(() => {
      startRoundWithRandomPlayer();
    }, 3800);
  } else if(decision === 'continue') {
    TV.level = Math.min(10, TV.level + 1);
    const speech = document.getElementById('tv-speech');
    if(speech) speech.innerText = `شجاعة ومجازفة! ضاعف ${TV.activeContestantName} المبلغ إلى ${TV.nextPrize.toLocaleString()} ر.س!`;
    updateTvLadder();
    setTimeout(() => {
      loadNextQuestion();
    }, 2500);
  }
}

function onHostMsg(c, data) {
  if(!data) return;
  if(data.t === 'join') {
    const isFirst = TV.players.length === 0;
    const name = data.name || (EMB && EMB.name) || 'لاعب';
    let p = TV.players.find(x => x.id === c.id);
    if(!p) {
      p = {
        id: c.id,
        name: name,
        score: 0,
        streak: 0,
        isAdmin: isFirst,
        color: ['#ffd166', '#38bdf8', '#f43f5e', '#a855f7', '#34d399'][TV.players.length % 5]
      };
      TV.players.push(p);
    }
    updateTvPlayerList();
    renderTvStage();
    broadcastTvState();
  } else if(data.t === 'answer') {
    if(c.id === TV.activeContestantId) {
      handleAnswerChosen(data.optionIndex);
    }
  } else if(data.t === 'decision') {
    if(c.id === TV.activeContestantId) {
      handlePlayerDecision(data.decision);
    }
  } else if(data.t === 'admin_start') {
    const p = TV.players.find(x => x.id === c.id);
    if(p && p.isAdmin) {
      startRoundWithRandomPlayer();
    }
  }
}

function onPlayerLeave(id) {
  TV.players = TV.players.filter(p => p.id !== id);
  if(TV.players.length > 0 && !TV.players.some(p => p.isAdmin)) {
    TV.players[0].isAdmin = true;
  }
  if(TV.activeContestantId === id) {
    startRoundWithRandomPlayer();
  }
  updateTvPlayerList();
  renderTvStage();
  broadcastTvState();
}

            <button class="btn btn-opt ${data.selectedOpt===i?'selected':''}" onclick="ctlSend({t:'answer', optionIndex:${i}})" style="padding:18px 12px; font-size:1.1rem; border-radius:14px; justify-content:center;">
              <span style="font-weight:900; font-size:1.4rem;">${letters[i]}</span>
            </button>
          `).join('')}
        </div>
      `;
    } else {
      body.innerHTML = `
        <div class="card" style="text-align:center; padding:24px;">
          <h4 style="font-size:1rem; color:#ffd166; margin-bottom:6px;">المتسابق الحالي على الكرسي:</h4>
          <div style="font-size:1.3rem; font-weight:900; color:#ffffff; margin-bottom:12px;">${data.activeContestantName || 'في انتظار البدء'}</div>
          <div style="font-size:0.85rem; color:#a380c9;">تابع شاشة التلفزيون وشوف إجابته!</div>
        </div>
      `;
    }
  }
}

function ctlSend(obj){
  try{parent.postMessage({__emb:1,data:obj},'*')}catch(e){}
}
</script>
</body>
</html>
