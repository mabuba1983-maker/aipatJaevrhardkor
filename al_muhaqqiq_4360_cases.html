<script>
/* ===================== EMB BRIDGE (لا تغيّر هذا الجزء) ===================== */
let EMB=null; const embHostConns={};
window.addEventListener('message', e=>{
  const m=e&&e.data; if(!m||!m.__emb) return;
  if(m.init){ EMB={role:m.role,code:m.code,name:m.name}; return embStart(); }
  if(!EMB) return;
  if(EMB.role==='tv'){
    if(m.event==='data'){
      let c=embHostConns[m.id];
      if(!c)c=embHostConns[m.id]={id:m.id,send:obj=>{try{parent.postMessage({__emb:1,to:m.id,data:obj},'*')}catch(e){}}};
      try{onHostMsg(c,m.data)}catch(e){}
    } else if(m.event==='disconnect'){
      try{onPlayerLeave(m.id)}catch(e){}
      delete embHostConns[m.id];
    }
  } else if(EMB.role==='ph'){
    if(m.data!==undefined){try{onCtlMsg(m.data)}catch(e){}}
  }
});
function embReveal(){try{document.documentElement.classList.remove('emb-pending')}catch(e){}}
function embStart(){
  embReveal();
  if(EMB.role==='tv'){ startTv(); } else { startPhone(); }
}
setTimeout(()=>{ if(!EMB) embReveal(); }, 2500);

/* ===================== أصوات خفيفة (WebAudio، بدون ملفات) ===================== */
let AC=null;
function sfx(freq,dur,type,gain){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.value=gain!==undefined?gain:.05;
    o.connect(g); g.connect(AC.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
    o.stop(AC.currentTime+dur+.02);
  }catch(e){}
}
function sndTick(){sfx(880,.06,'sine',.04)}
function sndClue(){sfx(560,.12,'triangle',.05)}
function sndVoteCast(){sfx(720,.08,'square',.03)}
function sndWin(){sfx(660,.15,'sine',.06);setTimeout(()=>sfx(880,.2,'sine',.06),120);setTimeout(()=>sfx(1100,.25,'sine',.07),260)}
function sndLose(){sfx(300,.3,'sawtooth',.05);setTimeout(()=>sfx(220,.4,'sawtooth',.05),180)}

/* ===================== كونفيتي بسيط على canvas ===================== */
function confettiBurst(){
  const layer=document.getElementById('fxLayer');
  const canvas=document.createElement('canvas');
  canvas.style.position='absolute'; canvas.style.inset='0';
  canvas.width=innerWidth; canvas.height=innerHeight;
  layer.appendChild(canvas);
  const ctx=canvas.getContext('2d');
  const colors=['#ffd166','#ff9a3d','#ff5e78','#5ede99','#8aa6ff'];
  const parts=Array.from({length:90},()=>({
    x:Math.random()*canvas.width, y:-20-Math.random()*200,
    vx:(Math.random()-.5)*3, vy:2+Math.random()*3,
    size:4+Math.random()*5, color:colors[Math.floor(Math.random()*colors.length)],
    rot:Math.random()*360, vr:(Math.random()-.5)*10
  }));
  let frame=0;
  function tick(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);
      ctx.restore();
    });
    if(frame<140) requestAnimationFrame(tick); else layer.removeChild(canvas);
  }
  tick();
}

/* ===================== مؤقت دائري SVG ===================== */
function ringSvg(seconds,id){
  return `<svg class="timer-ring" viewBox="0 0 80 80">
    <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="7"/>
    <circle id="${id}" cx="40" cy="40" r="34" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="213.6" stroke-dashoffset="0" transform="rotate(-90 40 40)"/>
    <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffd166"/><stop offset="100%" stop-color="#ff5e78"/></linearGradient></defs>
    <text x="40" y="46" text-anchor="middle" font-size="22" font-weight="900" fill="#ffd166" font-family="Tajawal">${seconds}</text>
  </svg>`;
}
function runTimer(seconds,ringId,textUpdater,onDone){
  let t=seconds; const total=seconds; const circ=213.6;
  const iv=setInterval(()=>{
    t--;
    const ring=document.getElementById(ringId);
    if(ring){
      ring.setAttribute('stroke-dashoffset', String(circ*(1-t/total)));
      const txt=ring.parentElement.querySelector('text');
      if(txt) txt.textContent=Math.max(t,0);
    }
    if(t<=3 && t>0) sndTick();
    if(t<=0){ clearInterval(iv); onDone&&onDone(); }
  },1000);
  return iv;
}

function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const DIFFICULTIES={
  easy:{label:"سهل",clueTime:0,voteTime:0},
  normal:{label:"عادي",clueTime:20,voteTime:15},
  hard:{label:"صعب (وقت ضاغط)",clueTime:12,voteTime:8}
};

/* ===================== منطق الجولة المشترك ===================== */
function newRound(playerIds,diffKey){
  const c=pick(CASE_BANK);
  const order=shuffle(playerIds);
  const intruderId=order[Math.floor(Math.random()*order.length)];
  return {category:c.category,word:c.word,hint:c.hint,order,intruderId,clueIndex:0,clues:[],phase:'reveal',votes:{},diff:diffKey||'normal'};
}

/* ===================== جهة التلفزيون ===================== */
let TV=null;
function startTv(){
  TV={players:{},order:[],scores:{},round:null,phase:'lobby',diff:'normal'};
  renderTvLobby();
}
function tvPlayerList(){return Object.values(TV.players)}
function broadcastAll(obj){ tvPlayerList().forEach(p=>{ if(p.conn) p.conn.send(obj); }); }

function onHostMsg(c,data){
  if(!TV) return;
  if(data.t==='join'){
    if(!TV.players[c.id]) TV.players[c.id]={id:c.id,name:data.name||'لاعب',conn:c};
    else TV.players[c.id].conn=c;
    if(TV.scores[c.id]===undefined) TV.scores[c.id]=0;
    c.send({t:'joined'});
    if(TV.phase==='lobby') renderTvLobby();
    return;
  }
  if(data.t==='clue' && TV.phase==='clue'){
    const r=TV.round;
    const activeId=r.order[r.clueIndex];
    if(c.id!==activeId) return;
    const name=TV.players[c.id]?TV.players[c.id].name:'لاعب';
    r.clues.push({id:c.id,name,text:String(data.text||'').slice(0,34)});
    r.clueIndex++;
    broadcastAll({t:'clueUpdate',clues:r.clues});
    if(r.clueIndex>=r.order.length){ startVotePhase(); } else { pushTurn(); }
    renderTvClue();
    return;
  }
  if(data.t==='vote' && TV.phase==='vote'){
    const r=TV.round;
    if(r.votes[c.id]) return;
    r.votes[c.id]=data.targetId;
    sndVoteCast();
    const total=tvPlayerList().length;
    if(Object.keys(r.votes).length>=total){ resolveVotes(); }
    renderTvVote();
    return;
  }
  if(data.t==='steal' && TV.phase==='steal'){
    const r=TV.round;
    if(c.id!==r.intruderId) return;
    const correct=String(data.guess||'').trim()===r.word;
    if(correct) TV.scores[r.intruderId]=(TV.scores[r.intruderId]||0)+3;
    finishRound(correct?'المحقق المزيف كشف القضية وسرق الجولة!':'المحقق المزيف فشل بمعرفة القضية');
    return;
  }
}
function onPlayerLeave(id){
  if(!TV) return;
  if(TV.players[id]) TV.players[id].conn=null;
  if(TV.phase==='lobby') renderTvLobby();
}

function setDiff(key){ TV.diff=key; renderTvLobby(); }
function startGame(){
  const ids=Object.keys(TV.players);
  if(ids.length<3){ alert('لازم ٣ لاعبين على الأقل'); return; }
  TV.round=newRound(ids,TV.diff);
  TV.phase='reveal';
  const r=TV.round;
  tvPlayerList().forEach(p=>{
    if(p.id===r.intruderId) p.conn && p.conn.send({t:'role',role:'intruder',category:r.category,hint:r.hint});
    else p.conn && p.conn.send({t:'role',role:'agent',category:r.category,word:r.word});
  });
  renderTvReveal();
  setTimeout(()=>{ TV.phase='clue'; pushTurn(); renderTvClue(); },5000);
}
function pushTurn(){
  const r=TV.round;
  const activeId=r.order[r.clueIndex];
  const name=TV.players[activeId]?TV.players[activeId].name:'لاعب';
  broadcastAll({t:'turn',activeId,name,clues:r.clues,clueTime:DIFFICULTIES[r.diff].clueTime});
}
function startVotePhase(){
  TV.phase='vote';
  const list=tvPlayerList().map(p=>({id:p.id,name:p.name}));
  broadcastAll({t:'vote',players:list,clues:TV.round.clues,voteTime:DIFFICULTIES[TV.round.diff].voteTime});
  renderTvVote();
}
function resolveVotes(){
  const r=TV.round;
  const tally={};
  Object.values(r.votes).forEach(id=>{tally[id]=(tally[id]||0)+1});
  let top=null,topN=-1;
  Object.entries(tally).forEach(([id,n])=>{ if(n>topN){topN=n;top=id} });
  const caught=top===r.intruderId;
  if(caught){
    Object.entries(r.votes).forEach(([voterId,targetId])=>{
      if(targetId===r.intruderId) TV.scores[voterId]=(TV.scores[voterId]||0)+1;
    });
    const name=TV.players[r.intruderId]?TV.players[r.intruderId].name:'المحقق المزيف';
    finishRound(`تم كشف القضية! (${name} كان المزيف) — الفريق فاز`);
  } else {
    TV.scores[r.intruderId]=(TV.scores[r.intruderId]||0)+2;
    TV.phase='steal';
    const conn=TV.players[r.intruderId] && TV.players[r.intruderId].conn;
    if(conn) conn.send({t:'steal'});
    broadcastAll({t:'waitingSteal'});
    renderTvSteal();
  }
}
function finishRound(msg){
  TV.phase='result';
  const caughtMsg=msg.includes('تم كشف');
  if(caughtMsg) sndWin(); else sndLose();
  if(caughtMsg) confettiBurst();
  broadcastAll({t:'result',msg,word:TV.round.word,
    scores:TV.scores,players:tvPlayerList().map(p=>({id:p.id,name:p.name}))});
  renderTvResult(msg);
}
function newGameRound(){ TV.phase='lobby'; TV.round=null; renderTvLobby(); broadcastAll({t:'lobby'}); }

  renderPhLobby();
}
function onCtlMsg(data){
  if(data.t==='lobby'){ renderPhLobby(); }
  else if(data.t==='role'){ PH.myRole=data; renderPhRole(data); }
  else if(data.t==='turn'){ PH.turn=data; renderPhTurn(data); }
  else if(data.t==='clueUpdate'){ if(PH.turn) PH.turn.clues=data.clues; }
  else if(data.t==='vote'){ renderPhVote(data); }

function startDemo(){
  const demoCode=String(Math.floor(1000+Math.random()*9000));
  const me={id:'me',name:'أنت'};
  const bots=[{id:'b1',name:'المحقق سلطان'},{id:'b2',name:'المحققة نورة'},{id:'b3',name:'المحقق فهد'}];
  const D={players:[me,...bots],scores:{},round:null,diff:'normal'};
  D.players.forEach(p=>D.scores[p.id]=0);
  function demoBadge(){return `<div class="demo-badge">وضع التجربة · رمز وهمي ${demoCode}</div>`;}
  function botClue(){ const fillers=['يرتبط بمكان معروف','شعرت فيه شي غريب','فيه تفصيل ما أقدر أقوله أكثر','لاحظت شي بسيط هناك','مرتبط بشخص مهم بالقضية']; return pick(fillers); }

  function round(){ D.round=newRound(D.players.map(p=>p.id),D.diff); reveal(); }
  function reveal(){
    const r=D.round;
    const isMeIntruder=r.intruderId==='me';
    setScreen(`
      ${demoBadge()}
      <span class="role-tag ${isMeIntruder?'role-intruder':'role-agent'}">${isMeIntruder?'😈 أنت المحقق المزيف':'🕵️ أنت محقق حقيقي'}</span>
      <h2>ملف القضية: ${r.category}</h2>
      ${isMeIntruder?`<p>ما تعرف التفاصيل! دليلك الوحيد: <b style="color:#ffd166">${r.hint}</b></p>`:`<h1 style="margin-top:10px;font-size:clamp(20px,4.5vw,28px)">${r.word}</h1>`}
      <button class="btn" style="margin-top:14px" onclick="demoNext()">تمام، يلا نبدأ</button>
    `);
    window.demoNext=()=>clueTurn();
  }
  function clueTurn(){
    const r=D.round;
    const activeId=r.order[r.clueIndex];
    const activeP=D.players.find(p=>p.id===activeId);
    if(activeId==='me'){
      setScreen(`
        ${demoBadge()}
        <span class="turn-badge">دورك يا محقق</span>
        <div class="feed">${r.clues.map(c=>`<div class="feed-item"><b>${c.name}</b><span>${c.text}</span></div>`).join('')||'<div class="muted small">يلا ابدأ أنت</div>'}</div>
        <input type="text" id="clueInput" maxlength="34" placeholder="اكتب دليلك">
        <button class="btn" style="margin-top:10px" onclick="demoSendClue()">إرسال</button>
      `);
      window.demoSendClue=()=>{
        const el=document.getElementById('clueInput');
        const text=(el&&el.value.trim())||'دليل';
        sndClue();
        r.clues.push({id:'me',name:'أنت',text});
        r.clueIndex++;
        advanceClue();
      };
    } else {
      setScreen(`
        ${demoBadge()}
        <span class="turn-badge">دور: ${activeP.name}</span>
        <div class="feed">${r.clues.map(c=>`<div class="feed-item"><b>${c.name}</b><span>${c.text}</span></div>`).join('')}</div>
        <p class="muted">...يفكر</p>
      `);
      setTimeout(()=>{
        sndClue();
        r.clues.push({id:activeId,name:activeP.name,text:botClue()});
        r.clueIndex++;
        advanceClue();
      },900);
    }
  }
  function advanceClue(){ const r=D.round; if(r.clueIndex>=r.order.length) return voteTurn(); clueTurn(); }
  function voteTurn(){
    const r=D.round;
    setScreen(`
      ${demoBadge()}
      <h2>من المحقق المزيف برأيك؟</h2>
      <div class="feed">${r.clues.map(c=>`<div class="feed-item"><b>${c.name}</b><span>${c.text}</span></div>`).join('')}</div>
      <div class="players">${D.players.map(p=>`<button class="chip btn-vote" onclick="demoVote('${p.id}')">👤 ${p.name}</button>`).join('')}</div>
    `);
    window.demoVote=(targetId)=>{
      sndVoteCast();
      r.votes.me=targetId;
      D.players.forEach(p=>{ if(p.id==='me') return; const pool=D.players.map(x=>x.id); r.votes[p.id]=pool[Math.floor(Math.random()*pool.length)]; });
      resolveDemoVotes();
    };
  }
  function resolveDemoVotes(){
    const r=D.round;
    const tally={};
    Object.values(r.votes).forEach(id=>tally[id]=(tally[id]||0)+1);
    let top=null,topN=-1;
    Object.entries(tally).forEach(([id,n])=>{if(n>topN){topN=n;top=id}});
    const caught=top===r.intruderId;
    if(caught){
      Object.entries(r.votes).forEach(([voterId,targetId])=>{ if(targetId===r.intruderId) D.scores[voterId]+=1; });
      const name=D.players.find(p=>p.id===r.intruderId).name;
      finishDemo(`تم كشف القضية! (${name} كان المزيف) — الفريق فاز`,true);
    } else {
      D.scores[r.intruderId]+=2;
      if(r.intruderId==='me'){
        setScreen(`
          ${demoBadge()}
          <h2>😈 ما انكشفت! فرصة أخيرة</h2>
          <p class="muted">خمّن تفاصيل القضية بالضبط</p>
          <input type="text" id="stealInput" placeholder="اكتب تخمينك">
          <button class="btn" style="margin-top:10px" onclick="demoSteal()">إرسال</button>
        `);
        window.demoSteal=()=>{
          const el=document.getElementById('stealInput');
          const correct=(el&&el.value.trim())===r.word;
          if(correct) D.scores['me']+=3;
          finishDemo(correct?'حللت القضية وسرقت الجولة! 🔥':'ما قدرت تحل القضية... بس نجوت من الكشف',correct);
        };
      } else {
        const correct=Math.random()<0.4;
        if(correct) D.scores[r.intruderId]+=3;
        const name=D.players.find(p=>p.id===r.intruderId).name;
        finishDemo(correct?`${name} ما انكشف وحل القضية! خسرتوا 😅`:`${name} ما انكشف بس ما عرف التفاصيل`,false);
      }
    }
  }
  function finishDemo(msg,win){
    if(win) sndWin(); else sndLose();
    if(win) confettiBurst();
    const sc=Object.entries(D.scores).sort((a,b)=>b[1]-a[1]);
    const max=Math.max(1,...sc.map(s=>s[1]));
    setScreen(`
      ${demoBadge()}
      <h2>${msg}</h2>
      <p class="muted">تفاصيل القضية: <b style="color:#ffd166">${D.round.word}</b></p>
      <div class="flex-col" style="margin-top:10px">
        ${sc.map(([id,s])=>`<div class="score-row"><span>${D.players.find(p=>p.id===id).name}</span><div class="bar-wrap"><div class="bar" style="width:${(s/max*100)||0}%"></div></div><b>${s}</b></div>`).join('')}
      </div>
      <div class="flex-col" style="margin-top:14px">
        <button class="btn" onclick="demoRound()">قضية تجربة ثانية</button>
        <button class="btn secondary" onclick="location.reload()">رجوع</button>
      </div>
    `);
    window.demoRound=()=>round();
  }
  function setScreen(html){ document.getElementById('root').innerHTML=`<div class="card">${html}</div>`; }
  round();
}
</script>
