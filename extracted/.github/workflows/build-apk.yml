name: Build APK
on:
  push:
  workflow_dispatch:
    inputs:
      train:
        description: "Train the stage from scratch (CPU) and run all stage checks"
        type: boolean
        default: false
      stage:
        description: "Stage to train (s2m, s5m, s10m, s20m, s30m). Must be the next allowed stage."
        default: "s2m"
      steps:
        description: "Training steps"
        default: "3000"
      approve:
        description: "I approve this stage (accept only if all checks pass AND it beats the previous stage)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install PyTorch (CPU) and numpy
        run: pip install torch numpy --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Run all tests (includes PyTorch/phone-format parity)
        run: python -m unittest discover -s tests -v
      - name: Show stage plan
        run: python -m nuwaa.core.stage_cli plan
      - name: Train stage from scratch + run every check
        if: ${{ inputs.train }}
        run: |
          python -m nuwaa.core.stage_cli set ${{ inputs.stage }}
          python -m nuwaa.core.run_stage --stage ${{ inputs.stage }} --steps ${{ inputs.steps }}
      - name: Accept stage (human approved)
        if: ${{ inputs.train && inputs.approve }}
        run: |
          python -m nuwaa.core.stage_cli accept ${{ inputs.stage }} --human
          git config user.name nuwaa-bot && git config user.email nuwaa-bot@users.noreply.github.com
          git add stage.json stage_state.json stage_reports && git commit -m "stage ${{ inputs.stage }} decision" || true
          git push || true
      - name: Put the model in the app (only if all checks passed)
        if: ${{ inputs.train }}
        run: |
          python - <<'PY'
          import json, shutil, sys
          s = "${{ inputs.stage }}"; r = json.load(open(f"stage_reports/{s}.json"))
          good = r["all_ok"] and r["metrics"]["benchmark"]["total"] >= 0.5   # a model that scores below 50% on the real benchmark must not replace the honest knowledge base
          if good: shutil.copy(f"stage_artifacts/{s}/model.bin", "android/app/src/main/assets/model.bin"); print("model added")
          else: print("model NOT added (checks failed or benchmark < 0.5):", [k for k, v in r["checks"].items() if not v], r["metrics"]["benchmark"]["total"])
          PY
      - name: Use the accepted model if one exists
        run: if [ -f model_accepted/model.bin ]; then cp model_accepted/model.bin android/app/src/main/assets/model.bin; fi
      - name: Rebuild the programming knowledge (every code sample is executed; build stops on a failure)
        run: python tools/gen_knowledge.py
      - name: Copy knowledge into app
        run: |
          cp data/kb/kb.jsonl android/app/src/main/assets/kb.jsonl
          cp data/kb/syn.json android/app/src/main/assets/syn.json
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Record real APK size
        if: ${{ inputs.train }}
        run: python -m nuwaa.core.stage_cli apk ${{ inputs.stage }} android/app/build/outputs/apk/debug/app-debug.apk || true
      - uses: actions/upload-artifact@v4
        with:
          name: Nuwaa-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.train }}
        with:
          name: stage-report-and-checkpoint
          path: |
            stage_reports
            stage_artifacts
