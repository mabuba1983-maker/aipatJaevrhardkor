<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نواة</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--fg:#12222d;--muted:#5b6b78;--pri:#0e7c86;--bar:#0b1f2a;--code:#14202b}
@media (prefers-color-scheme:dark){:root{--bg:#0e161c;--card:#18232b;--fg:#e6eef3;--muted:#8da1ae;--pri:#17a2ad;--bar:#08131a;--code:#0a1217}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column}
header{background:var(--bar);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header b{font-size:20px}header small{color:#9fb3c0;font-size:12px}header button{margin-inline-start:auto}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:88%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word}
.u{background:var(--pri);color:#fff;align-self:flex-start}.b{background:var(--card);align-self:flex-end}
pre{direction:ltr;text-align:left;background:var(--code);color:#d7e3ea;padding:10px;border-radius:10px;overflow-x:auto;margin:6px 0;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
pre+button,.cp{background:none;border:0;color:var(--pri);font-size:12px;cursor:pointer;padding:0}
form{display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--card)}
textarea{flex:1;resize:none;border:0;border-radius:20px;background:var(--bg);color:var(--fg);padding:10px 16px;font:inherit;max-height:120px}
button{border:0;border-radius:20px;background:var(--pri);color:#fff;padding:10px 18px;font:inherit;cursor:pointer}
button.ghost{background:transparent;border:1px solid #ffffff55;padding:4px 12px;font-size:13px}
#mind{display:none;background:var(--card);padding:10px 14px;font-size:14px;border-bottom:1px solid #0002}
#mind input[type=password]{border:1px solid #0003;border-radius:10px;background:var(--bg);color:var(--fg);padding:6px 10px;font:inherit;width:100%;margin:6px 0}
#mind .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}#mind pre{white-space:pre-wrap;direction:rtl;text-align:right;font-size:12px}
button:disabled{opacity:.5}
#dev{position:sticky;top:0;z-index:5;background:var(--card);padding:8px 14px;border-bottom:1px solid #0002;display:flex;gap:10px;align-items:center}
#bd{font-size:17px;padding:12px 18px;font-weight:700;flex:0 0 auto}#ms{font-size:12px;opacity:.85;flex:1}
</style>
</head>
<body>
<header><b>نواة</b><small id="st">...</small><button class="ghost" id="mb">أدوات</button><button class="ghost" id="clr">جديد</button></header>
<div id="dev"><button id="bd">⚡ تطوير النفس</button><div id="ms">...</div></div>
<div id="mind"><input type="password" id="tok" placeholder="رمز المشرف (NUWAA_ADMIN_TOKEN)"><label class="row"><input type="checkbox" id="rem"> تذكّر الرمز على هذا الجوال</label>
<div class="row"><label>الجولات <select id="rd"><option>1</option><option selected>3</option><option>5</option><option>10</option></select></label><label><input type="checkbox" id="ap" checked> اعتمد تلقائيا إذا صار أقوى فعلا</label></div>
<div class="row"><input type="file" id="fl" multiple accept=".py,.js,.ts,.kt,.java,.c,.cpp,.json,.md,.txt,.html,.css,.yml,.yaml,.sh,.sql,.zip"></div>
<div class="row"><button id="br">راجع الملفات</button><button id="bu">علّمه من كود الملفات</button></div><pre id="mr"></pre></div>
<div id="log"></div>
<form id="f"><textarea id="q" rows="1" placeholder="اكتب سؤالك هنا..."></textarea><button>إرسال</button></form>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),st=document.getElementById('st');
let hist=[];try{hist=JSON.parse(localStorage.getItem('nuwaa_chat')||'[]')}catch(e){}
function save(){try{localStorage.setItem('nuwaa_chat',JSON.stringify(hist.slice(-100)))}catch(e){}}
function render(text,mine){
  const d=document.createElement('div');d.className='m '+(mine?'u':'b');
  text.split('```').forEach((p,i)=>{
    if(i%2===0){if(p.trim())d.appendChild(document.createTextNode(p.replace(/^\n+|\n+$/g,'')))}
    else{const code=p.replace(/^[^\n]*\n/,'').replace(/\n+$/,'');const pre=document.createElement('pre');pre.textContent=code;
      const b=document.createElement('button');b.className='cp';b.type='button';b.textContent='نسخ';
      b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(code);b.textContent='تم'};d.appendChild(pre);d.appendChild(b)}
  });
  log.appendChild(d);log.scrollTop=log.scrollHeight;return d;
}
function add(t,mine){render(t,mine);hist.push({t,mine});save()}
hist.forEach(m=>render(m.t,m.mine));
if(!hist.length)add('هلا! أنا نواة 👋 اسألني بالعربي عن البرمجة، أو اطلب حسابا.',false);
fetch('/api/health').then(r=>r.json()).then(h=>{st.textContent=(h.model_loaded?'نموذج مدرَّب':'معرفة مبرمجة')+' · '+h.knowledge_items+' عنصر'}).catch(()=>st.textContent='غير متصل');
document.getElementById('clr').onclick=()=>{hist=[];save();log.innerHTML='';add('محادثة جديدة. كيف أساعدك؟',false)};
async function send(){
  const t=q.value.trim();if(!t)return;q.value='';add(t,true);const w=render('...',false);
  try{const hd={'Content-Type':'application/json'};const tk=(typeof T==='function'?T():'');if(tk)hd.Authorization='Bearer '+tk;const r=await fetch('/api/chat',{method:'POST',headers:hd,body:JSON.stringify({message:t,debug:true})});
    const j=await r.json();w.remove();add(j.reply||j.error||'حصل خطأ',false)}
  catch(e){w.remove();add('تعذر الاتصال بالسيرفر.',false)}
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();send()};
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});

const $=id=>document.getElementById(id);
const T=()=>$('tok').value||sessionStorage.getItem('nt')||localStorage.getItem('nt')||'';
if(localStorage.getItem('nt')){$('tok').value=localStorage.getItem('nt');$('rem').checked=true}
async function mstat(){try{const m=await (await fetch('/api/mind')).json(),c=m.competence,l=m.lm;
  $('ms').textContent=(m.busy?'⏳ شغّال الحين (يطوّل لأن الهدف الدقة)... ':'')+`مهارات: ${m.skills} · عمليات: ${m.ops||0} · مستوى: ${m.level}`+(l?` · أوزان: ${(l.params/1e6).toFixed(2)}M (طبقة ${l.hidden})`:'')+(c?` · اختبار البرمجة ${c.exam}`:'')+` · ${m.size_kb}KB`;
  $('bd').disabled=!!m.busy;
  if(m.last)$('mr').textContent=(m.last.decision||'')+' — '+(m.last.message||(m.last.reasons||[]).join(' | ')||'')+(m.last.after?`\nقبل: ${JSON.stringify(m.last.before)}\nبعد: ${JSON.stringify(m.last.after)}`:'');
  if(m.busy)setTimeout(mstat,5000)}catch(e){$('ms').textContent='غير متصل'}}
async function post(path,body,auth){const h={'Content-Type':'application/json'};if(auth)h.Authorization='Bearer '+T();
  const r=await fetch(path,{method:'POST',headers:h,body:JSON.stringify(body)});return r.json()}
$('rem').onchange=()=>{if($('rem').checked)localStorage.setItem('nt',$('tok').value);else localStorage.removeItem('nt')};
$('tok').onchange=()=>{if($('rem').checked)localStorage.setItem('nt',$('tok').value)};
$('bd').onclick=async()=>{if(!T()){$('mind').style.display='block';$('mr').textContent='اكتب رمز المشرف أول مرة (من «أدوات»).';return}
  const j=await post('/api/mind/develop',{approve:$('ap').checked,rounds:+$('rd').value},true);$('mr').textContent=j.message||j.error||'';setTimeout(mstat,1500)};
$('mb').onclick=()=>{$('mind').style.display=$('mind').style.display==='block'?'none':'block'};
async function files(){const out={files:[]};for(const f of $('fl').files){
  if(f.name.toLowerCase().endsWith('.zip')){const b=new Uint8Array(await f.arrayBuffer());let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));out.zip_b64=btoa(s)}
  else out.files.push({name:f.name,text:await f.text()})}return out}
$('br').onclick=async()=>{const b=await files();const j=await post('/api/mind/review',b,false);$('mr').textContent=j.text||j.error||''};
$('bu').onclick=async()=>{const b=await files();const j=await post('/api/mind/upload',b,true);$('mr').textContent=j.message||j.error||''};
mstat();
</script>
</body>
</html>
