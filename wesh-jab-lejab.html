<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>وش جاب لجاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>html.emb-pending body{visibility:hidden}</style>
<style>

:root{
  --bg0:#0c0514;
  --bg1:#190d26;
  --bg2:#25143a;
  --surface:rgba(36,20,58,0.78);
  --surface-solid:#201133;
  --border:rgba(255,255,255,0.11);
  --border-gold:rgba(255,209,102,0.42);
  --text:#f9f5ff;
  --muted:#baa8d6;
  --gold1:#ffd166;
  --gold2:#ff9a3d;
  --emerald:#34d399;
  --coral:#ff7a59;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;padding:0;min-height:100%;
  background:radial-gradient(1200px 700px at 50% -10%, #31174d 0%, var(--bg1) 48%, var(--bg0) 100%);
  color:var(--text);
  font-family:'Tajawal',system-ui,-apple-system,sans-serif;
  overflow-x:hidden;
}
button,input,textarea{font-family:inherit}
button{cursor:pointer;border:0;outline:none}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold1);outline-offset:2px}
#root{min-height:100dvh;display:flex;flex-direction:column}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:24px;
  padding:28px;
  box-shadow:0 24px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
}
#role{
  max-width:460px;margin:auto;text-align:center;line-height:1.8;font-size:18px;
}
.gold-text{
  background:linear-gradient(135deg,var(--gold1),var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.btn-primary{
  background:linear-gradient(135deg,var(--gold1),var(--gold2));
  color:#1c0e2b;font-weight:800;font-size:18px;
  padding:14px 28px;border-radius:16px;
  box-shadow:0 10px 26px rgba(255,154,61,0.32), inset 0 1px 0 rgba(255,255,255,0.55);
  transition:transform .16s cubic-bezier(.16,1,.3,1),filter .16s;
  white-space:nowrap;
}
.btn-primary:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-secondary{
  background:rgba(255,255,255,0.08);
  color:var(--text);font-weight:700;font-size:15px;
  padding:11px 20px;border-radius:14px;
  border:1px solid var(--border);
  transition:background .16s,transform .16s;
  white-space:nowrap;
}
.btn-secondary:hover{background:rgba(255,255,255,0.14)}
.btn-secondary.active{
  background:rgba(255,209,102,0.18);
  border-color:var(--border-gold);
  color:var(--gold1);
}

/* ===== TV STUDIO SHELL & REFLECTIONS ===== */
.tv-shell{
  min-height:100dvh;display:flex;flex-direction:column;
  padding:22px 34px 26px;position:relative;overflow:hidden;
}
.tv-floor-glow{
  position:fixed;inset:auto 0 0 0;height:38vh;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 75% 65% at 50% 100%, rgba(255,209,102,0.10), transparent 70%),
    linear-gradient(to top, rgba(6,2,12,0.92), transparent 85%);
}
.tv-topbar{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:14px 22px;border-radius:22px;
  background:rgba(24,12,40,0.82);
  border:1px solid var(--border);
  box-shadow:0 16px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.12);
}
.tv-brand{display:flex;align-items:center;gap:14px}
.tv-logo{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(255,209,102,0.22),rgba(255,154,61,0.14));
  border:1px solid var(--border-gold);font-size:24px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.3);
}
.tv-title{font-family:'Cairo','Tajawal',sans-serif;font-weight:900;font-size:26px;line-height:1.1;margin:0}
.tv-sub{font-size:14px;color:var(--muted);margin-top:2px}
.tv-status-banner{
  flex:1;text-align:center;padding:0 16px;
}
.tv-action-now{
  font-size:20px;font-weight:800;color:var(--text);
}
.tv-action-detail{
  font-size:14px;color:var(--gold1);margin-top:3px;font-weight:600;
}
.tv-room-box{
  display:flex;align-items:center;gap:14px;
}
.room-code-wrap{
  text-align:center;padding:8px 18px;border-radius:16px;
  background:rgba(255,209,102,0.08);border:1px solid var(--border-gold);
}
.room-code-lbl{font-size:11px;color:var(--muted);display:block}
.room-code-val{
  font-family:'Cairo',sans-serif;font-weight:900;font-size:28px;letter-spacing:4px;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--gold1),var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

.tv-main{
  position:relative;z-index:2;flex:1;display:flex;flex-direction:column;
  justify-content:center;padding-top:22px;gap:22px;
}

/* ===== REFLECTIVE PHONE STAGE ===== */
.phones-stage{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;
  gap:22px;padding:12px 10px 6px;perspective:1000px;
}
.phone-unit{
  position:relative;width:168px;display:flex;flex-direction:column;align-items:center;
  animation:popUp .42s cubic-bezier(.16,1,.3,1) both;
}
.phone-device{
  position:relative;width:100%;height:244px;border-radius:28px;
  padding:11px 10px 14px;
  background:linear-gradient(165deg,#2d1846 0%,#150a22 100%);
  border:2px solid rgba(255,255,255,0.16);
  box-shadow:0 22px 44px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.28);
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .3s cubic-bezier(.16,1,.3,1), border-color .3s;
}
.phone-unit.done .phone-device{
  transform:translateY(-10px);
  border-color:rgba(52,211,153,0.75);
  box-shadow:0 28px 50px rgba(52,211,153,0.18), inset 0 1px 0 rgba(255,255,255,0.35);
}
/* Glass sheen reflection across phone screen */
.phone-device::after{
  content:"";position:absolute;inset:-40% -60% auto -60%;height:70%;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,0.11) 49%,rgba(255,255,255,0.03) 56%,transparent 70%);
  transform:rotate(-12deg);pointer-events:none;
}
.phone-notch{
  width:52px;height:6px;border-radius:99px;background:rgba(255,255,255,0.18);
  margin:0 auto 10px;
}
.phone-screen{
  flex:1;border-radius:18px;
  background:rgba(11,5,19,0.72);
  border:1px solid rgba(255,255,255,0.08);
  padding:12px 10px;display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;text-align:center;
}
.player-avatar{
  width:50px;height:50px;border-radius:16px;
  display:grid;place-items:center;font-weight:900;font-size:21px;color:#140920;
  box-shadow:0 8px 20px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.55);
}
.player-name{
  font-weight:800;font-size:17px;line-height:1.25;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.player-score-line{
  font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;
}
.phone-status-box{
  width:100%;padding:7px 8px;border-radius:12px;font-size:13px;font-weight:700;
  background:rgba(255,255,255,0.06);color:var(--muted);
}
.phone-unit.done .phone-status-box{
  background:rgba(52,211,153,0.16);color:#6ee7b7;
  border:1px solid rgba(52,211,153,0.35);
}
.typing-dots{display:inline-flex;gap:4px;align-items:center}
.typing-dots i{
  width:5px;height:5px;border-radius:50%;background:var(--gold1);
  display:inline-block;animation:bounceDot 1.1s infinite ease-in-out;
}
.typing-dots i:nth-child(2){animation-delay:.18s}
.typing-dots i:nth-child(3){animation-delay:.36s}

/* Real glossy mirror reflection beneath every phone card */
.phone-reflection{
  width:100%;height:78px;margin-top:6px;overflow:hidden;pointer-events:none;
  border-radius:26px;opacity:.48;
  transform:scaleY(-1);
  -webkit-mask-image:linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 82%);
  mask-image:linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 82%);
  filter:blur(0.4px);
}
.phone-reflection-inner{
  height:148px;border-radius:26px;padding:14px;
  background:linear-gradient(165deg,#351c52 0%,#150a22 100%);
  border:2px solid rgba(255,255,255,0.2);
  display:flex;align-items:flex-end;justify-content:center;
}
.phone-reflection-glow{
  width:76%;height:42px;border-radius:14px;opacity:.75;
  box-shadow:0 0 24px rgba(255,255,255,0.25);
}

/* ===== TV LOBBY CONTROLS ===== */
.lobby-panel{
  max-width:860px;width:100%;margin:0 auto;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px;
  padding:18px 24px;border-radius:22px;
  background:rgba(28,14,46,0.82);border:1px solid var(--border);
  box-shadow:0 18px 42px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.1);
}
.lobby-opts{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.opt-group{display:flex;align-items:center;gap:8px}
.opt-label{font-size:14px;color:var(--muted);font-weight:700}

/* ===== RANDOM CHAT ARENA (REVEAL PHASE) ===== */
.chat-arena-wrap{
  position:relative;max-width:1020px;width:100%;margin:0 auto;
}
.chat-arena{
  position:relative;border-radius:26px;
  background:linear-gradient(180deg, rgba(28,14,46,0.9), rgba(16,8,28,0.94));
  border:1px solid rgba(255,255,255,0.14);
  padding:20px 24px;
  box-shadow:0 28px 70px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.18);
  max-height:62dvh;overflow-y:auto;
  display:flex;flex-direction:column;gap:13px;
}
.chat-arena::before{
  content:"";position:absolute;top:0;left:8%;right:8%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,209,102,0.55),transparent);
}
.chat-stage-reflection{
  height:48px;margin:0 28px;pointer-events:none;
  background:radial-gradient(ellipse 84% 92% at 50% 0%, rgba(255,209,102,0.2), transparent 76%);
  filter:blur(5px);
}
.chat-msg{
  position:relative;display:flex;gap:12px;align-items:flex-start;
  animation:msgSlide .44s cubic-bezier(.16,1,.3,1) both;
}
.chat-avatar{
  width:42px;height:42px;border-radius:14px;flex-shrink:0;
  display:grid;place-items:center;font-weight:900;font-size:18px;color:#140920;
  box-shadow:0 8px 18px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
}
.chat-bubble{
  position:relative;flex:1;border-radius:18px;padding:12px 16px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.11);
  box-shadow:0 12px 30px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.12);
  overflow:hidden;
}
.chat-bubble::after{
  content:"";position:absolute;inset:0 auto auto 0;width:100%;height:42%;
  background:linear-gradient(180deg,rgba(255,255,255,0.05),transparent);
  pointer-events:none;
}
.chat-reply-link{
  display:flex;align-items:center;gap:8px;
  padding:6px 11px;margin-bottom:7px;border-radius:10px;
  background:rgba(255,209,102,0.09);
  border:1px dashed rgba(255,209,102,0.38);
  font-size:13px;color:#fde68a;
}
.reply-arrow-svg{
  width:20px;height:20px;flex-shrink:0;color:var(--gold1);
}
.chat-meta{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:4px;
}
.chat-sender{font-weight:800;font-size:16px}
.chat-prompt-reveal{font-size:13px;color:var(--muted)}
.chat-answer{
  font-size:21px;font-weight:700;line-height:1.4;color:#ffffff;
}
.chat-controls-bar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  max-width:1020px;width:100%;margin:0 auto;
}

/* Floating reactions on TV */
.reaction-layer{
  position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20;
}
.floating-emoji{
  position:absolute;bottom:40px;font-size:40px;
  animation:floatUp 2.6s cubic-bezier(.16,1,.3,1) forwards;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,0.45));
}

/* ===== VOTING & PODIUM ===== */
.vote-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;max-width:1080px;width:100%;margin:0 auto;
}
.vote-card{
  position:relative;border-radius:20px;padding:18px 20px;
  background:rgba(255,255,255,0.06);border:1px solid var(--border);
  box-shadow:0 16px 36px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
}
.vote-card.winner{
  border-color:var(--gold1);
  background:linear-gradient(155deg, rgba(255,209,102,0.16), rgba(255,154,61,0.07));
}
.podium-row{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:18px;
}
.podium-card{
  width:210px;text-align:center;border-radius:22px;padding:20px 16px;
  background:rgba(34,17,54,0.85);border:1px solid var(--border);
  box-shadow:0 20px 44px rgba(0,0,0,0.45);
}
.podium-card.first{
  border-color:var(--gold1);
  background:linear-gradient(180deg, rgba(255,209,102,0.18), rgba(28,14,46,0.92));
  transform:translateY(-10px);
}

/* ===== PHONE CONTROLLER UI ===== */
.ph-shell{
  min-height:100dvh;display:flex;flex-direction:column;
  padding:18px 16px 26px;max-width:500px;width:100%;margin:0 auto;gap:18px;
}
.ph-header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;border-radius:18px;
  background:rgba(28,14,46,0.88);border:1px solid var(--border);
  box-shadow:0 10px 28px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
}
.ph-player-badge{display:flex;align-items:center;gap:10px}
.ph-dot-avatar{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  font-weight:900;font-size:16px;color:#140920;
}
.ph-card{
  margin:auto 0;display:flex;flex-direction:column;justify-content:center;gap:18px;
  border-radius:24px;padding:26px 20px;
  background:linear-gradient(170deg, rgba(38,20,62,0.92), rgba(20,9,34,0.96));
  border:1px solid rgba(255,255,255,0.13);
  box-shadow:0 24px 54px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.16);
}
.ph-prompt-box{
  padding:18px;border-radius:18px;text-align:center;
  background:rgba(255,209,102,0.09);
  border:1px solid var(--border-gold);
}
.ph-prompt-world{font-size:13px;color:var(--gold1);font-weight:700;margin-bottom:6px}
.ph-prompt-text{font-family:'Cairo','Tajawal',sans-serif;font-size:23px;font-weight:800;line-height:1.45}
.ph-textarea{
  width:100%;min-height:126px;resize:none;border-radius:16px;padding:14px 16px;
  background:rgba(10,4,18,0.75);color:var(--text);
  border:1px solid rgba(255,255,255,0.16);font-size:18px;line-height:1.5;
}
.ph-textarea:focus{border-color:var(--gold1);outline:none}
.ph-vote-btn{
  width:100%;text-align:right;padding:15px 16px;border-radius:16px;
  background:rgba(255,255,255,0.06);border:1px solid var(--border);
  color:var(--text);transition:transform .14s, border-color .14s, background .14s;
}
.ph-vote-btn:hover{background:rgba(255,209,102,0.12);border-color:var(--border-gold)}
.ph-vote-btn:active{transform:scale(.98)}
.ph-react-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ph-react-btn{
  height:58px;border-radius:16px;font-size:28px;
  background:rgba(255,255,255,0.08);border:1px solid var(--border);
  transition:transform .12s, background .12s;
}
.ph-react-btn:active{transform:scale(.9);background:rgba(255,209,102,0.2)}

@keyframes popUp{
  from{opacity:0;transform:translateY(18px) scale(.94)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes msgSlide{
  from{opacity:0;transform:translateY(16px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes bounceDot{
  0%,80%,100%{transform:translateY(0);opacity:.45}
  40%{transform:translateY(-4px);opacity:1}
}
@keyframes floatUp{
  0%{opacity:0;transform:translateY(0) scale(.6)}
  15%{opacity:1;transform:translateY(-40px) scale(1.1)}
  100%{opacity:0;transform:translateY(-460px) scale(.9)}
}
@media (max-width:768px){
  .tv-shell{padding:14px}
  .tv-topbar{flex-direction:column;align-items:stretch;text-align:center}
  .phone-unit{width:136px}
  .phone-device{height:202px}
  .chat-answer{font-size:19px}
}

</style>

<body>
<div id="root">
<div id="role" class="card"><p>هذي اللعبة جزء من لوبي «ليالي الرياض» — افتحها من هناك حتى تتوصل تلقائيًا.</p></div>
</div>
<script>
/* ===================== EMB BRIDGE (لا تغيّر هذا الجزء) ===================== */
let EMB=null; const embHostConns={};
window.addEventListener('message', e=>{
  const m=e&&e.data; if(!m||!m.__emb) return;
  if(m.init){ EMB={role:m.role,code:m.code,name:m.name}; return embStart(); }
  if(!EMB) return;
  if(EMB.role==='tv'){
    if(m.event==='data'){
      let c=embHostConns[m.id];
      if(!c)c=embHostConns[m.id]={id:m.id,send:obj=>{try{parent.postMessage({__emb:1,to:m.id,data:obj},'*')}catch(e){}}};
      try{onHostMsg(c,m.data)}catch(e){}
    } else if(m.event==='disconnect'){
      try{onPlayerLeave(m.id)}catch(e){}
      delete embHostConns[m.id];
    }
  } else if(EMB.role==='ph'){
    if(m.data!==undefined){try{onCtlMsg(m.data)}catch(e){}}
  }
});
function embReveal(){try{document.documentElement.classList.remove('emb-pending')}catch(e){}}
function embStart(){
  embReveal();
  if(EMB.role==='tv'){ startTv(); } else { startPhone(); }
}
setTimeout(()=>{ if(!EMB) embReveal(); }, 2500);

/* محرك الصوت الإجرائي (Web Audio) */
let audioCtx=null, muted=false;
function playTone(type){
  if(muted) return;
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const now=audioCtx.currentTime;
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if(type==='join'){
      osc.type='sine'; osc.frequency.setValueAtTime(520,now);
      osc.frequency.exponentialRampToValueAtTime(780,now+0.14);
      gain.gain.setValueAtTime(0.08,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.2);
      osc.start(now); osc.stop(now+0.21);
    } else if(type==='submit'){
      osc.type='triangle'; osc.frequency.setValueAtTime(660,now);
      osc.frequency.exponentialRampToValueAtTime(990,now+0.12);
      gain.gain.setValueAtTime(0.09,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.18);
      osc.start(now); osc.stop(now+0.19);
    } else if(type==='msg'){
      osc.type='sine'; osc.frequency.setValueAtTime(420,now);
      osc.frequency.exponentialRampToValueAtTime(690,now+0.09);
      gain.gain.setValueAtTime(0.11,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.16);
      osc.start(now); osc.stop(now+0.17);
    } else if(type==='win'){
      [523,659,784,1046].forEach((freq,i)=>{
        const o=audioCtx.createOscillator(), g=audioCtx.createGain();
        o.type='triangle'; o.frequency.setValueAtTime(freq,now+i*0.08);
        g.gain.setValueAtTime(0.08,now+i*0.08); g.gain.exponentialRampToValueAtTime(0.001,now+i*0.08+0.35);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now+i*0.08); o.stop(now+i*0.08+0.36);
      });
    }
  }catch(e){}
}

/* محرك المعاني المتناسقة (آلاف الجمل البسيطة المترابطة في 74 عالم) */
function applyGrammar(frame,ent){
  const m=ent.g==='m';
  return frame
    .replaceAll('{n}',ent.n)
    .replaceAll('{obj}',m?'ه':'ها')
    .replaceAll('{hu}',m?'هو':'هي')
    .replaceAll('{ann}',m?'إنه':'إنها')
    .replaceAll('{disappeared}',m?'اختفى':'اختفت')
    .replaceAll('{could_talk}',m?'قدر يتكلم':'قدرت تتكلم')
    .replaceAll('{will_say}',m?'بيقوله':'بتقوله')
    .replaceAll('{became}',m?'صار':'صارت')
    .replaceAll('{present_y}',m?'ي':'ت')
    .replaceAll('{adj_important}',m?'مهم':'مهمة')
    .replaceAll('{adj_weird}',m?'غريب':'غريبة')
    .replaceAll('{adj_annoying}',m?'مزعج':'مزعجة')
    .replaceAll('{adj_funny}',m?'يضحك':'تضحك');
}

function buildWorldPrompts(w){
  const list=[], seen=new Set();
  w.entities.forEach((ent,ei)=>{
    const d='تكلم عن '+ent.n;
    if(!seen.has(d)){ seen.add(d); list.push({id:w.id+'_d_'+ei,text:d,ent:ent.n}); }
    w.frames.forEach((fr,fi)=>{
      const txt=applyGrammar(fr,ent);
      if(!seen.has(txt)){ seen.add(txt); list.push({id:w.id+'_f_'+ei+'_'+fi,text:txt,ent:ent.n}); }
    });
  });
  w.custom.forEach((txt,ci)=>{
    if(!seen.has(txt)){ seen.add(txt); list.push({id:w.id+'_c_'+ci,text:txt,ent:null}); }
  });
  return list;
}

function shuffleArr(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function pickCoherentPrompts(count, usedWorlds, usedPrompts, forcedWorldId){
  let candidates=WORLDS_DATA;
  if(forcedWorldId){
    const found=WORLDS_DATA.find(w=>w.id===forcedWorldId);
    if(found) candidates=[found];
  } else {
    const unused=WORLDS_DATA.filter(w=>!usedWorlds.has(w.id));
    if(unused.length>0) candidates=unused;
  }
  const world=candidates[Math.floor(Math.random()*candidates.length)]||WORLDS_DATA[0];
  const pool=shuffleArr(buildWorldPrompts(world));
  const chosen=[], usedEnts=new Set();

  for(const p of pool){
    if(chosen.length>=count) break;
    if(usedPrompts.has(p.id)) continue;
    if(p.ent && usedEnts.has(p.ent)) continue;
    chosen.push(p);
    if(p.ent) usedEnts.add(p.ent);
  }
  if(chosen.length<count){
    const chosenIds=new Set(chosen.map(x=>x.id));
    for(const p of pool){
      if(chosen.length>=count) break;
      if(!chosenIds.has(p.id)){ chosen.push(p); chosenIds.add(p.id); }
    }
  }
  return {world, prompts:chosen};
}

let G=null, tvTimer=null, lastRenderedVer=-1, lastRenderedReveal=0;

function tvActionLabel(){
  if(!G) return ['جاري التحميل...',''];
  const n=G.players.length;
  const done=Object.keys(G.submissions).length;
  if(G.phase==='lobby'){
    return [
      n===0 ? 'بانتظار دخول الجوالات للغرفة...' : 'الجوالات جاهزة — بانتظار بدء الجولة!',
      'كل لاعب يدخل باسمه من جواله يظهر هنا فوراً'
    ];
  }
  if(G.phase==='writing'){
    return [
      'كل لاعب يكتب سالفته في جواله الآن',
      'الموضوع المتناسق: '+G.worldTitle+' · خلصوا: '+done+' من '+n
    ];
  }
  if(G.phase==='reveal'){
    return [
      'الدردشة العشوائية على الهواء!',
      'ترتيب عشوائي بحت مع سهام ردود غير متوقعة ('+G.revealedCount+' / '+G.chatChain.length+')'
    ];
  }
  if(G.phase==='voting'){
    const v=Object.keys(G.votes).length;
    return [
      'صوّتوا لأضحك شطحة بالسالفة!',
      'تم التصويت: '+v+' من '+n
    ];
  }
  if(G.phase==='round_end'){
    return ['نتائج الجولة '+G.round,'تحديث النقاط قبل الجولة القادمة'];
  }
  return ['انتهت اللعبة — الترتيب النهائي!','ملك الشطحات على منصة التتويج'];
}

  const votedIds=Object.keys(G.votes);

  Object.values(embHostConns).forEach(conn=>{
    const p=G.players.find(x=>x.id===conn.id);
    const payload={
      t:'state',
      ver:G.ver,
      code:G.code,
      phase:G.phase,
      round:G.round,
      totalRounds:G.totalRounds,
      writeSeconds:G.writeSeconds,
      remSec:remSec,
      worldTitle:G.worldTitle,
      playerCount:G.players.length,
      doneCount:doneIds.length,
      votedCount:votedIds.length,
      me:p||null,
      myPrompt:G.prompts[conn.id]||null,
      mySubmitted:Boolean(G.submissions[conn.id]),
      myVote:G.votes[conn.id]||null,
      revealedMsg:G.phase==='reveal' && G.revealedCount>0 ? G.chatChain[G.revealedCount-1] : null,
      revealedCount:G.revealedCount,
      totalMsgs:G.chatChain.length,
      autoPlay:G.autoPlay,
      voteOptions:G.phase==='voting' ? G.chatChain.map(m=>({
        playerId:m.playerId,
        playerName:m.playerName,
        playerColor:m.playerColor,
        answer:m.answer
      })) : [],
      leaderboard:G.players.slice().sort((a,b)=>b.score-a.score)
    };
    conn.send(payload);
  });
}

function startRoundNow(){
  if(!G || G.players.length<1) return;
  const {world,prompts}=pickCoherentPrompts(G.players.length, G.usedWorlds, G.usedPrompts);
  G.phase='writing';
  G.round+=1;
  G.worldId=world.id;
  G.worldTitle=world.title;
  G.usedWorlds.add(world.id);
  G.prompts={};
  G.submissions={};
  G.chatChain=[];
  G.revealedCount=0;
  G.votes={};
  G.lastWinnerIds=[];
  G.players.forEach((p,idx)=>{
    const pr=prompts[idx%prompts.length];
    G.prompts[p.id]=pr;
    G.usedPrompts.add(pr.id);
  });
  G.phaseEndsAt=G.writeSeconds>0 ? Date.now()+G.writeSeconds*1000 : null;
  G.ver+=1;
  playTone('join');
  renderTv();
  broadcastState();
}

function buildRandomChat(){
  const subs=shuffleArr(Object.values(G.submissions));
  G.chatChain=subs.map((sub,idx)=>{
    if(idx===0){
      return {
        index:0,playerId:sub.playerId,playerName:sub.playerName,playerColor:sub.playerColor,
        promptText:sub.promptText,answer:sub.answer,
        replyToIndex:null,replyToName:null,replyToSnippet:null
      };
    }
    const targetIdx=Math.floor(Math.random()*idx);
    const target=subs[targetIdx];
    const snip=target.answer.length>56 ? target.answer.slice(0,54)+'...' : target.answer;
    return {
      index:idx,playerId:sub.playerId,playerName:sub.playerName,playerColor:sub.playerColor,
      promptText:sub.promptText,answer:sub.answer,
      replyToIndex:targetIdx,replyToName:target.playerName,replyToSnippet:snip
    };
  });
  G.phase='reveal';
  G.revealedCount=G.chatChain.length>0 ? 1 : 0;
  G.phaseEndsAt=null;
  G.autoPlay=true;
  G.nextRevealAt=Date.now()+4200;
  G.ver+=1;
  playTone('msg');
  renderTv();
  broadcastState();
}

function nextRevealStep(){
  if(!G || G.phase!=='reveal') return;
  if(G.revealedCount<G.chatChain.length){
    G.revealedCount+=1;
    G.nextRevealAt=Date.now()+4200;
    G.ver+=1;
    playTone('msg');
    renderTv();
    broadcastState();
    return;
  }
  if(G.chatChain.length>=2){
    G.phase='voting';
    G.votes={};
    G.phaseEndsAt=Date.now()+35000;
    G.ver+=1;
    renderTv();
    broadcastState();
  } else {
    finalizeRound();
  }
}

function finalizeRound(){
  const tally={};
  Object.values(G.votes).forEach(tid=>{ tally[tid]=(tally[tid]||0)+1; });
  let maxV=0;
  Object.values(tally).forEach(c=>{ if(c>maxV) maxV=c; });
  const winners=maxV>0 ? Object.keys(tally).filter(k=>tally[k]===maxV) : [];
  G.lastWinnerIds=winners;
  G.players.forEach(p=>{
    const v=tally[p.id]||0;
    p.score += v*100 + (winners.includes(p.id)&&maxV>0 ? 50 : 0);
  });
  G.phase = G.round>=G.totalRounds ? 'game_over' : 'round_end';
  G.phaseEndsAt=null;
  G.ver+=1;
  playTone('win');
  renderTv();
  broadcastState();
}

function spawnReactionOnTv(emoji, senderName){

  const el=document.createElement('div');
  el.className='floating-emoji';
  el.style.left=(8+Math.random()*82)+'%';
  el.textContent=emoji;
  layer.appendChild(el);
  setTimeout(()=>{ try{el.remove();}catch(e){} }, 2700);
}

function startTv(){
  G={
    code:EMB.code||'0000',
    ver:1,
    phase:'lobby',
    round:0,
    totalRounds:5,
    writeSeconds:90,
    players:[],
    worldId:null,
    worldTitle:'',
    prompts:{},
    submissions:{},
    chatChain:[],
    revealedCount:0,
    votes:{},
    lastWinnerIds:[],
    usedWorlds:new Set(),
    usedPrompts:new Set(),
    phaseEndsAt:null,
    autoPlay:true,
    nextRevealAt:0
  };
  renderTv();
  broadcastState();

  if(tvTimer) clearInterval(tvTimer);
  tvTimer=setInterval(()=>{
    if(!G) return;
    const now=Date.now();
    const timerEl=document.getElementById('tv-timer-val');
    if(G.phaseEndsAt && timerEl){
      const s=Math.max(0,Math.ceil((G.phaseEndsAt-now)/1000));
      timerEl.textContent=s+' ث';
      if(s<=0){
        if(G.phase==='writing'){
          if(Object.keys(G.submissions).length>0) buildRandomChat();
          else { G.phase='lobby'; G.round=Math.max(0,G.round-1); G.ver+=1; renderTv(); broadcastState(); }
        } else if(G.phase==='voting'){
          finalizeRound();
        }
      }
    }
    if(G.phase==='reveal' && G.autoPlay && G.revealedCount<G.chatChain.length && now>=G.nextRevealAt){
      nextRevealStep();
    }
    broadcastState();
  }, 350);
}

function onHostMsg(c, data){
  if(!G || !data) return;
  if(data.t==='join'){
    const rawName=(data.name||'').trim().slice(0,22) || ('لاعب '+(G.players.length+1));
    let p=G.players.find(x=>x.id===c.id);
    if(!p){
      p={id:c.id, name:rawName, color:COLORS[G.players.length%COLORS.length], score:0, isHost:G.players.length===0};
      G.players.push(p);
      playTone('join');
      if(G.phase==='writing' && G.worldId){
        const {prompts}=pickCoherentPrompts(1, new Set(), G.usedPrompts, G.worldId);
        if(prompts[0]){ G.prompts[c.id]=prompts[0]; G.usedPrompts.add(prompts[0].id); }
      }
    } else {
      p.name=rawName;
    }
    G.ver+=1;
    renderTv();
    broadcastState();
    return;
  }

  const player=G.players.find(x=>x.id===c.id);
  if(!player) return;

  if(data.t==='cfg' && player.isHost && G.phase==='lobby'){
    if([3,5,7].includes(data.totalRounds)) G.totalRounds=data.totalRounds;
    if([0,60,90].includes(data.writeSeconds)) G.writeSeconds=data.writeSeconds;
    G.ver+=1; renderTv(); broadcastState();
  } else if(data.t==='start' && player.isHost && G.phase==='lobby'){
    startRoundNow();
  } else if(data.t==='submit' && G.phase==='writing'){
    const ans=String(data.answer||'').trim().slice(0,180);
    const pr=G.prompts[c.id];
    if(!ans || !pr || G.submissions[c.id]) return;
    G.submissions[c.id]={
      playerId:c.id, playerName:player.name, playerColor:player.color,
      promptId:pr.id, promptText:pr.text, answer:ans
    };
    playTone('submit');
    G.ver+=1;
    if(G.players.every(pl=>Boolean(G.submissions[pl.id]))){
      buildRandomChat();
    } else {
      renderTv();
      broadcastState();
    }
  } else if(data.t==='force_reveal' && player.isHost && G.phase==='writing'){
    if(Object.keys(G.submissions).length>0) buildRandomChat();
  } else if(data.t==='next_msg' && player.isHost && G.phase==='reveal'){
    nextRevealStep();
  } else if(data.t==='react' && G.phase==='reveal'){
    const allowed=['😂','💀','🔥','🤯'];
    if(allowed.includes(data.emoji)) spawnReactionOnTv(data.emoji, player.name);
  } else if(data.t==='vote' && G.phase==='voting'){
    const tid=String(data.targetId||'');
    if(tid===c.id) return;
    if(!G.chatChain.some(m=>m.playerId===tid)) return;
    G.votes[c.id]=tid;
    G.ver+=1;
    if(G.players.every(pl=>Boolean(G.votes[pl.id]))){
      finalizeRound();
    } else {
      renderTv();
      broadcastState();
    }
  } else if(data.t==='next_round' && player.isHost && G.phase==='round_end'){
    startRoundNow();
  } else if(data.t==='new_match' && player.isHost && G.phase==='game_over'){
    G.phase='lobby'; G.round=0; G.players.forEach(pl=>{pl.score=0;});
    G.ver+=1; renderTv(); broadcastState();
  }
}

function onPlayerLeave(id){
  if(!G) return;
  G.players=G.players.filter(p=>p.id!==id);
  G.players.forEach((p,idx)=>{ p.isHost=idx===0; });
  if(G.phase==='writing'){
    delete G.prompts[id];
    if(G.players.length>0 && G.players.every(pl=>Boolean(G.submissions[pl.id])) && Object.keys(G.submissions).length>0){
      buildRandomChat();
      return;
    }
  }
  if(G.phase==='voting' && G.players.length>0 && G.players.every(pl=>Boolean(G.votes[pl.id]))){
    finalizeRound();
    return;
  }
  G.ver+=1;
  renderTv();
  broadcastState();
}

function onCtlMsg(data){
  if(!data || data.t!=='state') return;
  PSTATE=data;
  const key=[
    data.phase, data.round, data.mySubmitted?1:0, data.myVote||'',
    data.me?.isHost?1:0, data.totalRounds, data.writeSeconds,
    data.revealedCount, data.playerCount
  ].join('|');

  if(key!==pLastKey){
    pLastKey=key;
    renderPhone();
  } else {
    const cnt=document.getElementById('ph-done-cnt');
    if(cnt) cnt.textContent=data.doneCount+' من '+data.playerCount+' خلصوا';
    const tm=document.getElementById('ph-rem-sec');
    if(tm && data.remSec!==null) tm.textContent=data.remSec+' ث';
  }
}

function renderPhone(){
  const s=PSTATE;
  if(!s) return;
  const me=s.me||{name:EMB.name||'لاعب', color:'#FFD166', score:0, isHost:false};
  let cardHtml='';

  if(s.phase==='lobby'){
    cardHtml='<div style="text-align:center">'+
      '<div style="font-size:44px;margin-bottom:8px">📱</div>'+
      '<h2 style="margin:0 0 6px">أنت داخل اللعبة!</h2>'+
      '<p style="color:var(--muted);margin:0">طالع شاشة التلفزيون — جوالك ظاهر هناك ('+s.playerCount+' لاعبين)</p>'+
    '</div>'+
    (me.isHost
      ? '<div style="display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--border);padding-top:16px">'+
          '<div style="font-size:14px;color:var(--gold1);font-weight:700">أنت قائد الغرفة 👑</div>'+
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="color:var(--muted);font-size:14px">الجولات:</span><div style="display:flex;gap:6px">'+
            [3,5,7].map(r=>'<button class="btn-secondary '+(s.totalRounds===r?'active':'')+'" onclick="ctlSend({t:\'cfg\',totalRounds:'+r+'})">'+r+'</button>').join('')+
          '</div></div>'+
          '<button class="btn-primary" onclick="ctlSend({t:\'start\'})">ابدأ اللعبة الآن</button>'+
        '</div>'
      : '<div style="text-align:center;color:var(--muted);font-size:14px">بانتظار القائد يبدأ الجولة...</div>');
  } else if(s.phase==='writing'){
    if(s.mySubmitted){
      cardHtml='<div style="text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center">'+
        '<div style="width:72px;height:72px;border-radius:22px;background:rgba(52,211,153,0.18);border:1px solid rgba(52,211,153,0.45);display:grid;place-items:center;font-size:36px">✓</div>'+
        '<h2 style="margin:0;color:#6ee7b7">تم الإرسال</h2>'+
        '<p style="margin:0;color:var(--muted);line-height:1.7">انتظر باقي اللاعبين — طالع في التلفزيون أي واحد يخلص!</p>'+
        '<div id="ph-done-cnt" style="font-weight:800;color:var(--gold1);font-size:18px">'+s.doneCount+' من '+s.playerCount+' خلصوا</div>'+
        (me.isHost && s.doneCount>=1 ? '<button class="btn-secondary" style="margin-top:8px" onclick="ctlSend({t:\'force_reveal\'})">كشف الدردشة الآن</button>' : '')+
      '</div>';
    } else {
      const pr=s.myPrompt||{text:'اكتب سالفة حلوة'};
      cardHtml='<div class="ph-prompt-box">'+
        '<div class="ph-prompt-world">موضوع الجولة: '+ESC(s.worldTitle)+'</div>'+
        '<div class="ph-prompt-text">'+ESC(pr.text)+'</div>'+
      '</div>'+
      '<textarea id="ph-ans-input" class="ph-textarea" maxlength="180" oninput="phUpdateChar(this)" placeholder="اكتب كلامك ببساطة وعفوية هنا..."></textarea>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)">'+
        '<span id="ph-char-cnt" style="font-variant-numeric:tabular-nums">0 / 180 حرف</span>'+
        (s.remSec!==null ? '<span id="ph-rem-sec" style="color:var(--gold1);font-weight:700">'+s.remSec+' ث</span>' : '')+
      '</div>'+
      '<button class="btn-primary" onclick="phSubmitAnswer()">تم — إرسال الإجابة</button>';
    }
  } else if(s.phase==='reveal'){
    const m=s.revealedMsg;
    cardHtml='<div style="text-align:center">'+
      '<div style="font-size:14px;color:var(--gold1);font-weight:700;margin-bottom:6px">طالع التلفزيون! الدردشة العشوائية شغالة</div>'+
      (m ? '<div class="ph-prompt-box" style="text-align:right"><div style="font-size:13px;color:'+m.playerColor+';font-weight:800;margin-bottom:4px">'+ESC(m.playerName)+'</div><div style="font-size:18px;font-weight:700">'+ESC(m.answer)+'</div></div>' : '')+
    '</div>'+
    '<div><div style="font-size:13px;color:var(--muted);margin-bottom:8px;text-align:center">أرسل ردة فعل على التلفزيون</div>'+
      '<div class="ph-react-row">'+
        ['😂','💀','🔥','🤯'].map(e=>'<button class="ph-react-btn" onclick="ctlSend({t:\'react\',emoji:\''+e+'\'})">'+e+'</button>').join('')+
      '</div>'+
    '</div>'+
    (me.isHost ? '<button class="btn-primary" onclick="ctlSend({t:\'next_msg\'})">'+(s.revealedCount>=s.totalMsgs?'انتقل للتصويت ←':'الرسالة التالية')+'</button>' : '');
  } else if(s.phase==='voting'){
    if(s.myVote){
      cardHtml='<div style="text-align:center">'+
        '<div style="font-size:40px;margin-bottom:8px">🗳️</div>'+
        '<h2 style="margin:0 0 6px;color:#6ee7b7">تم تسجيل صوتك!</h2>'+
        '<p style="color:var(--muted);margin:0">طالع الشاشة الكبيرة لمعرفة الفائز ('+s.votedCount+' من '+s.playerCount+')</p>'+
      '</div>';
    } else {
      const others=(s.voteOptions||[]).filter(o=>o.playerId!==me.id);
      cardHtml='<h3 style="margin:0;text-align:center;color:var(--gold1)">اختر أضحك شطحة بالسالفة</h3>'+
        '<div style="display:flex;flex-direction:column;gap:10px;max-height:52dvh;overflow-y:auto">'+
          others.map(o=>'<button class="ph-vote-btn" onclick="ctlSend({t:\'vote\',targetId:\''+ESC(o.playerId)+'\'})">'+
            '<div style="font-size:13px;color:'+o.playerColor+';font-weight:800;margin-bottom:4px">'+ESC(o.playerName)+'</div>'+
            '<div style="font-size:16px;font-weight:700">'+ESC(o.answer)+'</div>'+
          '</button>').join('')+
        '</div>';
    }
  } else {
    const rank=(s.leaderboard||[]).findIndex(x=>x.id===me.id)+1;
    cardHtml='<div style="text-align:center;display:flex;flex-direction:column;gap:10px">'+
      '<div style="font-size:42px">'+(rank===1?'🏆':'🎉')+'</div>'+
      '<h2 style="margin:0">'+(s.phase==='game_over'?'انتهت المباراة!':'انتهت الجولة '+s.round)+'</h2>'+
      '<div class="gold-text" style="font-size:28px;font-weight:900">'+me.score+' نقطة</div>'+
      '<div style="color:var(--muted)">مركزك الحالي: #'+rank+'</div>'+
      (me.isHost ? '<button class="btn-primary" style="margin-top:8px" onclick="ctlSend({t:\''+(s.phase==='game_over'?'new_match':'next_round')+'\'})">'+(s.phase==='game_over'?'العب جولة جديدة':'الجولة التالية')+'</button>' : '<p style="color:var(--muted);font-size:14px">بانتظار القائد يكمل...</p>')+
    '</div>';
  }

  document.getElementById('root').innerHTML=
    '<div class="ph-shell">'+
      '<header class="ph-header">'+
        '<div class="ph-player-badge">'+
          '<div class="ph-dot-avatar" style="background:'+me.color+'">'+ESC((me.name||'ل').charAt(0))+'</div>'+
          '<div><div style="font-weight:800;font-size:16px">'+ESC(me.name)+'</div><div style="font-size:12px;color:var(--muted)">'+me.score+' نقطة</div></div>'+
        '</div>'+
        '<div class="gold-text" style="font-weight:900;font-size:18px;letter-spacing:2px">'+ESC(s.code)+'</div>'+
      '</header>'+
      '<section class="ph-card">'+cardHtml+'</section>'+
    '</div>';
}

window.phUpdateChar=el=>{
  const c=document.getElementById('ph-char-cnt');
  if(c) c.textContent=el.value.length+' / 180 حرف';
};

window.phSubmitAnswer=()=>{
  const el=document.getElementById('ph-ans-input');
  if(!el) return;
  const val=el.value.trim();
  if(!val){ el.focus(); return; }
  ctlSend({t:'submit', answer:val});
};

</script>
</body>
</html>
