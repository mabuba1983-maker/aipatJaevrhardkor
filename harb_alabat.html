<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#190d26;touch-action:none}
body{font-family:'Tajawal',system-ui,sans-serif;color:#f3e9ff}

#mini{position:fixed;top:78px;right:10px;width:132px;height:132px;border-radius:14px;border:1px solid rgba(255,209,102,.35);background:rgba(10,5,18,.55);display:none;z-index:5}
body.demo.play #mini{display:block}
#root{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;pointer-events:none;padding:12px}

.card{pointer-events:all;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,209,102,.24);border-radius:26px;padding:24px 22px;width:100%;max-width:620px;max-height:100%;overflow:auto;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(10px);animation:cardIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
h1,h2{font-weight:900}
h1{font-size:clamp(26px,5.5vw,42px);background:linear-gradient(90deg,#ffd166,#ff9a3d,#ff5e78);-webkit-background-clip:text;background-clip:text;color:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#ffd166,#ff9a3d);color:#1a0f2a;font-family:inherit;font-weight:900;font-size:17px;border:none;border-radius:18px;padding:14px 24px;cursor:pointer;width:100%;box-shadow:0 10px 26px rgba(255,154,61,.3);transition:transform .12s}
.btn:active{transform:scale(.96)}

/* واجهة اللعب */
#hud,#feed,#count,#vig,#ctl{display:none}
body.play #feed,body.play #count,body.play #vig{display:flex}
#hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
body.play.phone #hud{display:block}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900;font-size:14px;direction:rtl}
.pill{background:rgba(20,10,30,.58);border:1px solid rgba(255,209,102,.28);border-radius:999px;padding:4px 12px;backdrop-filter:blur(6px);white-space:nowrap}
.bars{display:flex;gap:8px;margin-top:6px;max-width:520px;direction:ltr}
.bar{position:relative;flex:1;height:15px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;border:1px solid rgba(255,255,255,.18)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transition:width .12s,background .2s}
.bar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;text-shadow:0 1px 2px #000}
.bar.gas i{background:linear-gradient(90deg,#4dd0e1,#c792ff)}
#feed{position:fixed;top:52px;left:0;right:0;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:7}
.toast{background:rgba(20,10,30,.72);border:1px solid rgba(255,209,102,.3);border-radius:999px;padding:6px 16px;font-size:14px;font-weight:700;animation:toastIn .25s ease,toastOut .4s ease 2.6s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-6px)}}
#count{position:fixed;inset:0;align-items:center;justify-content:center;font-size:min(36vw,36vh);font-weight:900;color:#ffd166;text-shadow:0 0 50px rgba(255,154,61,.7);pointer-events:none;z-index:8;opacity:0}
#count.pop{animation:cpop .9s ease forwards}
@keyframes cpop{0%{opacity:0;transform:scale(1.6)}25%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.8)}}

body.play #spec.on{display:block}
#ctl{position:fixed;inset:0;pointer-events:none;z-index:6}

#joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);pointer-events:all;touch-action:none}
#knob{position:absolute;left:41px;top:41px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#ffd166,#ff9a3d);box-shadow:0 4px 14px rgba(255,154,61,.45);pointer-events:none}
#spb{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:116px;height:116px;border-radius:50%;background:linear-gradient(135deg,#4dd0e1,#c792ff);color:#1a0f2a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;box-shadow:0 10px 28px rgba(143,211,255,.4);pointer-events:all;touch-action:none}
#spb .em{font-size:38px;line-height:1}
#spb small{font-size:14px}
#spb.on{transform:scale(.92);filter:brightness(1.15)}
@media (max-height:440px){#joy{width:116px;height:116px}#knob{left:29px;top:29px}#spb{width:98px;height:98px}#spb .em{font-size:30px}}
#tvp{position:fixed;top:12px;left:12px;width:min(290px,34vw);z-index:5;pointer-events:none;display:none;background:rgba(20,10,30,.6);border:1px solid rgba(255,209,102,.28);border-radius:18px;padding:10px 12px;backdrop-filter:blur(6px)}
body.play.tv #tvp{display:block}
#tvp .hd{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin-bottom:6px}
#tvp .cd{color:#ffd166;letter-spacing:4px;font-size:18px}
.tr{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;margin:5px 0}
.tr .n{width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .hb{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;direction:ltr}
.tr .hb i{display:block;height:100%}
.tr .gb{width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;direction:ltr}
.tr .gb i{display:block;height:100%;background:linear-gradient(90deg,#4dd0e1,#c792ff)}
.tr.dead{opacity:.4}
#wm{position:fixed;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.35);pointer-events:none;z-index:4;display:none}
body.play #wm{display:block}
.demo-badge{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ff5f6d,#c0392b);color:#fff;font-size:11px;font-weight:900;padding:4px 12px;border-radius:999px;z-index:9;display:none}
body.demo.play .demo-badge{display:block}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
</style>

<body>
<canvas id="cv"></canvas>
<canvas id="mini" width="264" height="264"></canvas>
<div id="hud"></div>
<div id="tvp"></div>
<div id="feed"></div>
<div id="count"></div>
<div id="vig"></div>
<div id="spec"></div>
<div id="wm">© ليالي الرياض</div>
<div class="demo-badge" id="demoBadge">وضع التجربة · بدون تلفزيون</div>
<div id="ctl"><div id="joy"><div id="knob"></div></div><div id="spb"><span class="em">💨</span><small>رش</small></div></div>
<canvas id="fx"></canvas>
<div id="root">
<div id="role" class="card">
  <h1>🫘 حرب الآباط</h1>
  <p>هذي اللعبة جزء من لوبي «ليالي الرياض» — افتحها من هناك حتى تتوصل تلقائيًا.</p>
  <div class="col" style="margin-top:14px"><button class="btn sec" onclick="startDemo()">🧪 جرّب اللعبة بدون تلفزيون</button></div>
  <div class="credit">© ليالي الرياض</div>
</div>
</div>
<script>
/* ===================== EMB BRIDGE (لا تغيّر هذا الجزء) ===================== */
let EMB=null; const embHostConns={};
window.addEventListener('message', e=>{
  const m=e&&e.data; if(!m||!m.__emb) return;
  if(m.init){ EMB={role:m.role,code:m.code,name:m.name}; return embStart(); }
  if(!EMB) return;
  if(EMB.role==='tv'){
    if(m.event==='data'){
      let c=embHostConns[m.id];
      if(!c)c=embHostConns[m.id]={id:m.id,send:obj=>{try{parent.postMessage({__emb:1,to:m.id,data:obj},'*')}catch(e){}}};
      try{onHostMsg(c,m.data)}catch(e){}
    } else if(m.event==='disconnect'){
      try{onPlayerLeave(m.id)}catch(e){}
      delete embHostConns[m.id];
    }
  } else if(EMB.role==='ph'){
    if(m.data!==undefined){try{onCtlMsg(m.data)}catch(e){}}
  }
});
function embReveal(){try{document.documentElement.classList.remove('emb-pending')}catch(e){}}
function embStart(){
  embReveal();
  if(EMB.role==='tv'){ startTv(); } else { startPhone(); }
}
setTimeout(()=>{ if(!EMB) embReveal(); }, 2500);

/* ===================== من هنا تبدأ لعبتك ===================== */
function ctlSend(obj){ try{parent.postMessage({__emb:1,data:obj},'*')}catch(e){} } // يرسل من الجوال للتلفزيون

/* ---------- أدوات عامة ---------- */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const na=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;if(amt>=0){r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt}else{r*=1+amt;g*=1+amt;b*=1+amt}return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')'}

/* ---------- الثوابت ---------- */
const A=24, R=0.7;                       // نصف الحلبة، نصف قطر الفاصوليا
const CFG={SPEED:7,TURN:3.0,RANGE:6.8,CONE:0.5,DPS:26,DRAIN:28,REGEN:18,TIME:100,COUNT:3.2,GASP:60,HPP:35};
const PAL=['#ffd166','#5ede99','#8aa6ff','#ff5e78','#c792ff','#4dd0e1','#ff9a3d','#a3e635'];
const PALC=PAL.map(h=>({base:h,dark:shade(h,-.4),light:shade(h,.4),mid:shade(h,-.12)}));
const BOT_NAMES=['سلطان','نورة','فهد','ريم','ماجد','هند','بدر','لولو'];
const OBST=[
 {x:0,z:0,hx:2,hz:2,h:2.6,k:'c'},
 {x:11,z:11,hx:1.2,hz:1.2,h:2.2,k:'c'},{x:-11,z:11,hx:1.2,hz:1.2,h:2.2,k:'c'},
 {x:11,z:-11,hx:1.2,hz:1.2,h:2.2,k:'c'},{x:-11,z:-11,hx:1.2,hz:1.2,h:2.2,k:'c'},
 {x:15,z:0,hx:.6,hz:3.4,h:1.6,k:'b'},{x:-15,z:0,hx:.6,hz:3.4,h:1.6,k:'b'},
 {x:0,z:15,hx:3.4,hz:.6,h:1.6,k:'b'},{x:0,z:-15,hx:3.4,hz:.6,h:1.6,k:'b'}
];

/* ---------- الصوت (WebAudio بدون ملفات) ---------- */
const Aud={ctx:null,gain:null};
function audioInit(){
  try{
    if(!Aud.ctx){
      const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
      const ctx=new C(); Aud.ctx=ctx;
      const len=ctx.sampleRate, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
      const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=4200; bp.Q.value=.6;
      const g=ctx.createGain(); g.gain.value=0;
      src.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start(); Aud.gain=g;
    }
    if(Aud.ctx.state==='suspended') Aud.ctx.resume();
  }catch(e){}
}
function hiss(l){try{if(Aud.gain)Aud.gain.gain.setTargetAtTime(l*.09,Aud.ctx.currentTime,.05)}catch(e){}}
function tone(f,d,type,v,delay){try{if(!Aud.ctx)return;const c=Aud.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sBeep=()=>tone(720,.12,'sine',.06);
const sGo=()=>{tone(520,.1,'sine',.07);tone(980,.22,'sine',.07,.09)};
const sHit=()=>tone(150,.14,'sawtooth',.06);
const sKill=()=>{tone(300,.2,'square',.04);tone(200,.3,'square',.04,.1)};
const sPick=()=>{tone(700,.08,'sine',.05);tone(1050,.12,'sine',.05,.07)};
const sWin=()=>{tone(660,.15,'sine',.06);tone(880,.2,'sine',.06,.12);tone(1100,.3,'sine',.07,.26)};

/* ---------- كونفيتي ---------- */
function confetti(){
  const c=$('fx'); c.width=innerWidth; c.height=innerHeight; const x=c.getContext('2d');
  const cols=['#ffd166','#ff9a3d','#ff5e78','#5ede99','#8aa6ff'];
  const ps=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*240,vx:(Math.random()-.5)*3,vy:2+Math.random()*3.5,s:4+Math.random()*5,c:cols[(Math.random()*5)|0],r:Math.random()*6,vr:(Math.random()-.5)*.3}));
  let f=0;(function t(){f++;x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(f<170)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)})();
}

/* =====================================================================
   المحاكاة (تشتغل على التلفزيون، أو محليًا في وضع التجربة)
   ===================================================================== */
function newSim(roster){
  const n=roster.length,S={phase:'count',count:CFG.COUNT,time:CFG.TIME,players:[],pickups:[],evq:[],deaths:[],nextPick:3,ended:false,ranking:null};
  roster.forEach((r,i)=>{
    const a=i/n*Math.PI*2+.5,x=Math.cos(a)*19,z=Math.sin(a)*19;
    S.players.push({i,name:r.name,ci:r.ci,bot:!!r.bot,x,z,f:Math.atan2(-x,-z),hp:100,gas:100,alive:true,sp:false,arm:0,walk:0,spd:0,hit:0,kills:0,
      in:{mv:0,tn:0,sp:false},ai:{burst:0,on:false,chk:.7,lx:x,lz:z,un:0,ud:1,st:0,sd:1},lastTs:0});
  });
  return S;
}
function segHitsBox(ax,az,bx,bz,o){
  let t0=0,t1=1;const d=[bx-ax,bz-az],p=[ax,az],lo=[o.x-o.hx,o.z-o.hz],hi=[o.x+o.hx,o.z+o.hz];
  for(let k=0;k<2;k++){
    if(Math.abs(d[k])<1e-9){if(p[k]<lo[k]||p[k]>hi[k])return false}
    else{let a=(lo[k]-p[k])/d[k],b=(hi[k]-p[k])/d[k];if(a>b){const s=a;a=b;b=s}t0=Math.max(t0,a);t1=Math.min(t1,b);if(t0>t1)return false}
  }
  return true;
}
function losBlocked(a,b){for(const o of OBST)if(segHitsBox(a.x,a.z,b.x,b.z,o))return true;return false}
function pushOut(p){
  for(const o of OBST){
    const cx=clamp(p.x,o.x-o.hx,o.x+o.hx),cz=clamp(p.z,o.z-o.hz,o.z+o.hz),dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;
    if(d2<R*R){
      if(d2>1e-6){const d=Math.sqrt(d2);p.x+=dx/d*(R-d);p.z+=dz/d*(R-d)}
      else{const px=o.hx-Math.abs(p.x-o.x),pz=o.hz-Math.abs(p.z-o.z);if(px<pz)p.x+=(p.x>=o.x?1:-1)*(px+R);else p.z+=(p.z>=o.z?1:-1)*(pz+R)}
    }
  }
}
function spawnPickup(S){
  for(let t=0;t<30;t++){
    const x=(Math.random()*2-1)*(A-3),z=(Math.random()*2-1)*(A-3);let ok=true;
    for(const o of OBST){if(Math.abs(x-o.x)<o.hx+1.6&&Math.abs(z-o.z)<o.hz+1.6){ok=false;break}}
    if(ok){const has=S.pickups.filter(u=>u.k==='g').length;S.pickups.push({k:has>=2||Math.random()<.4?'h':'g',x,z});return}
  }
}
function botInput(S,p,dt){
  const ai=p.ai,out={mv:0,tn:0,sp:false};
  let tgt=null,td=1e9;
  for(const q of S.players){if(q===p||!q.alive)continue;const d=Math.hypot(q.x-p.x,q.z-p.z);if(d<td){td=d;tgt=q}}
  let goal=null;const need=p.gas<28?'g':(p.hp<45?'h':null);
  if(need){let gd=26;for(const u of S.pickups){if(u.k!==need)continue;const d=Math.hypot(u.x-p.x,u.z-p.z);if(d<gd){gd=d;goal=u}}}
  const aim=goal||tgt;if(!aim)return out;
  const dx=aim.x-p.x,dz=aim.z-p.z,d=Math.hypot(dx,dz),diff=na(Math.atan2(dx,dz)-p.f);
  out.tn=-clamp(diff*3,-1,1);
  if(goal){out.mv=Math.abs(diff)<1.2?1:.2}
  else{
    if(d>CFG.RANGE*.8)out.mv=Math.abs(diff)<1.2?1:.2;else if(d<2.8)out.mv=-.7;else out.mv=.25;
    ai.burst-=dt;if(ai.burst<=0){ai.on=!ai.on;ai.burst=ai.on?(.9+Math.random()*1.4):(.3+Math.random()*.6)}
    const blocked=losBlocked(p,tgt);

function simStep(S,dt){
  const P=S.players;
  if(S.phase==='count'){S.count-=dt;if(S.count<=0){S.phase='play';S.count=0;S.evq.push({k:'go'})}return}
  if(S.phase!=='play')return;
  S.time-=dt;S.nextPick-=dt;
  if(S.nextPick<=0){S.nextPick=4+Math.random()*3;if(S.pickups.length<3)spawnPickup(S)}
  for(const p of P){
    p._ox=p.x;p._oz=p.z;
    if(p.hit>0)p.hit-=dt;
    if(!p.alive)continue;
    const inp=p.bot?botInput(S,p,dt):p.in;
    if(!p.bot&&inp.sp&&p.gas>1){  // مساعدة تصويب خفيفة للاعبين
      let best=null,bd=1e9;
      for(const q of P){if(q===p||!q.alive)continue;const dx=q.x-p.x,dz=q.z-p.z,d=Math.hypot(dx,dz);if(d>CFG.RANGE*1.35)continue;const df=na(Math.atan2(dx,dz)-p.f);if(Math.abs(df)>.85)continue;if(d<bd){bd=d;best=df}}
      if(best!==null)p.f+=clamp(best,-1,1)*1.9*dt;
    }
    p.f-=clamp(inp.tn,-1,1)*CFG.TURN*dt;
    const mv=clamp(inp.mv,-1,1),want=!!inp.sp&&p.gas>.5,spd=CFG.SPEED*(want?.8:1)*(mv<0?.6:1);
    p.x+=Math.sin(p.f)*mv*spd*dt;p.z+=Math.cos(p.f)*mv*spd*dt;
    p.sp=want;
    if(want)p.gas=Math.max(0,p.gas-CFG.DRAIN*dt);else if(!inp.sp)p.gas=Math.min(100,p.gas+CFG.REGEN*dt);
    p.arm+=((want?1:0)-p.arm)*Math.min(1,dt*9);
  }
  for(const p of P){if(!p.alive)continue;p.x=clamp(p.x,-A+R,A-R);p.z=clamp(p.z,-A+R,A-R);pushOut(p)}
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
    const a=P[i],b=P[j];if(!a.alive||!b.alive)continue;
    const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
    if(d<R*2&&d>1e-4){const o=(R*2-d)/2;a.x-=dx/d*o;a.z-=dz/d*o;b.x+=dx/d*o;b.z+=dz/d*o}
  }
  for(const a of P){
    if(!a.alive||!a.sp)continue;
    const fx=Math.sin(a.f),fz=Math.cos(a.f);
    for(const t of P){
      if(t===a||!t.alive)continue;
      const dx=t.x-a.x,dz=t.z-a.z,d=Math.hypot(dx,dz);
      if(d>CFG.RANGE+R||d<.01)continue;
      if(Math.abs(na(Math.atan2(dx,dz)-a.f))>CFG.CONE+Math.asin(Math.min(1,R/d)))continue;
      if(losBlocked(a,t))continue;
      t.hp-=CFG.DPS*dt*(1-.35*d/CFG.RANGE);t.hit=.22;
      t.x+=fx*2.2*dt;t.z+=fz*2.2*dt;
      if(t.hp<=0){t.hp=0;t.alive=false;t.sp=false;t.arm=0;a.kills++;S.deaths.push(t.i);S.evq.push({k:'kill',a:a.i,t:t.i})}
    }
  }
  for(const p of P){
    if(!p.alive)continue;
    pushOut(p);
    p.spd+=(Math.min(1,Math.hypot(p.x-p._ox,p.z-p._oz)/Math.max(dt,1e-3)/CFG.SPEED)-p.spd)*Math.min(1,dt*10);
    p.walk+=Math.hypot(p.x-p._ox,p.z-p._oz)*1.5;
    for(let k=S.pickups.length-1;k>=0;k--){
      const u=S.pickups[k];
      if(Math.hypot(u.x-p.x,u.z-p.z)<1.4){
        if(u.k==='g')p.gas=Math.min(100,p.gas+CFG.GASP);else p.hp=Math.min(100,p.hp+CFG.HPP);
        S.pickups.splice(k,1);S.evq.push({k:'pick',p:p.i,u:u.k});

  const alive=P.filter(p=>p.alive);

    S.phase='end';S.ended=true;
    const al=alive.slice().sort((a,b)=>b.hp-a.hp),dd=S.deaths.slice().reverse().map(i=>P[i]);
    S.ranking=al.concat(dd).map((p,k)=>({i:p.i,place:k+1,kills:p.kills,hp:Math.round(p.hp)}));
    S.evq.push({k:'end'});
  }
}

  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const u of v.pickups){ctx.font=Math.max(10,1.6*sc)+'px sans-serif';ctx.fillText(u.k==='g'?'💨':'❤️',X(u.x),Z(u.z))}
  const t=o.time||0;
  for(const p of v.players){
    if(!p.alive||!p.sp)continue;
    const th=Math.PI/2-p.f,cx=X(p.x),cy=Z(p.z),r=CFG.RANGE*sc,col=PAL[p.ci%PAL.length];
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'rgba(235,240,255,.5)');g.addColorStop(1,'rgba(235,240,255,.02)');

    if(!mini)for(let k=0;k<16;k++){const rr=CFG.RANGE*((k*.37+t*1.7)%1),a=p.f+(((k*.61)%1)-.5)*2*CFG.CONE*.9;ctx.globalAlpha=(1-rr/CFG.RANGE)*.55;ctx.fillStyle=k%3?'#e8ecff':col;ctx.beginPath();ctx.arc(X(p.x+Math.sin(a)*rr),Z(p.z+Math.cos(a)*rr),(.15+.4*rr/CFG.RANGE)*sc,0,7);ctx.fill();ctx.globalAlpha=1}
  }
  for(const p of v.players){
    const cx=X(p.x),cy=Z(p.z),r=R*sc*1.2,col=PALC[p.ci%PALC.length],fx=Math.sin(p.f),fz=Math.cos(p.f);
    if(!p.alive){ctx.fillStyle='#5a5268';ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();ctx.strokeStyle='#1a1226';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-r*.5,cy-r*.5);ctx.lineTo(cx+r*.5,cy+r*.5);ctx.moveTo(cx+r*.5,cy-r*.5);ctx.lineTo(cx-r*.5,cy+r*.5);ctx.stroke();continue}
    const a=p.arm||0;
    for(const sd of[-1,1]){ctx.fillStyle=col.mid;ctx.strokeStyle=col.dark;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx+(-fz*sd)*r*(1.05+.2*a)+fx*r*.25*a,cy+(fx*sd)*r*(1.05+.2*a)+fz*r*.25*a,r*.34,0,7);ctx.fill();ctx.stroke()}
    const g=ctx.createRadialGradient(cx-r*.3,cy-r*.3,r*.1,cx,cy,r);g.addColorStop(0,col.light);g.addColorStop(.6,col.base);g.addColorStop(1,col.dark);
    ctx.fillStyle=g;ctx.strokeStyle=col.dark;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();ctx.stroke();
    if(p.hit>0){ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill()}
    for(const sd of[-1,1]){const ex=cx+fx*r*.45+(-fz*sd)*r*.32,ey=cy+fz*r*.45+(fx*sd)*r*.32;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,r*.2,0,7);ctx.fill();ctx.fillStyle='#14101c';ctx.beginPath();ctx.arc(ex+fx*r*.06,ey+fz*r*.06,r*.1,0,7);ctx.fill()}

      ctx.font='900 '+Math.max(11,1.1*sc)+'px Tajawal,sans-serif';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.strokeText(p.name,cx,cy+r*1.9);ctx.fillStyle='#fff';ctx.fillText(p.name,cx,cy+r*1.9);

    }

}

/* ---------- كاميرا المتابعة (منظور شخصي من خلف الشخصية) ---------- */
function camFollow(cam,t,dt,shake){
  if(!cam._i){cam.yaw=t.f;cam._i=1}
  cam.yaw+=na(t.f-cam.yaw)*Math.min(1,dt*9);
  let x=t.x-Math.sin(cam.yaw)*6.5,z=t.z-Math.cos(cam.yaw)*6.5;
  cam.x=clamp(x,-A-2.5,A+2.5);cam.z=clamp(z,-A-2.5,A+2.5);cam.y=4.4+(shake?Math.sin(performance.now()/22)*.06*shake:0);
}

const Ctl={mv:0,tn:0,sp:false,K:{}};
let ctlBuilt=false;
function ctlGet(){
  const K=Ctl.K;let tn=Ctl.tn,mv=Ctl.mv,sp=Ctl.sp;
  if(K.ArrowLeft||K.a||K.A)tn=-1;if(K.ArrowRight||K.d||K.D)tn=1;
  if(K.ArrowUp||K.w||K.W)mv=1;if(K.ArrowDown||K.s||K.S)mv=-1;
  if(K[' ']||K.Shift||K.Enter)sp=true;
  return{mv,tn,sp};
}
function buildControls(){
  if(ctlBuilt)return;ctlBuilt=true;
  const joy=$('joy'),knob=$('knob'),spb=$('spb');let jid=null;
  const jm=e=>{const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy),mx=r.width/2*.8;if(m>mx){dx=dx/m*mx;dy=dy/m*mx}knob.style.transform='translate('+dx+'px,'+dy+'px)';const nx=dx/mx,ny=dy/mx;Ctl.tn=Math.abs(nx)<.12?0:nx;Ctl.mv=Math.abs(ny)<.12?0:-ny};
  joy.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;try{joy.setPointerCapture(jid)}catch(_){}jm(e);audioInit()});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
  const je=e=>{if(e.pointerId===jid){jid=null;Ctl.tn=0;Ctl.mv=0;knob.style.transform=''}};
  joy.addEventListener('pointerup',je);joy.addEventListener('pointercancel',je);
  let sid=null;
  spb.addEventListener('pointerdown',e=>{e.preventDefault();sid=e.pointerId;try{spb.setPointerCapture(sid)}catch(_){}Ctl.sp=true;spb.classList.add('on');audioInit()});
  const se=e=>{if(e.pointerId===sid){sid=null;Ctl.sp=false;spb.classList.remove('on')}};
  spb.addEventListener('pointerup',se);spb.addEventListener('pointercancel',se);
  window.addEventListener('keydown',e=>{Ctl.K[e.key]=true;audioInit();if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});
  window.addEventListener('keyup',e=>{Ctl.K[e.key]=false});
  window.addEventListener('blur',()=>{Ctl.K={}});
}

}
function tvResult(n){
  $('root').innerHTML='<div class="card"><h1>🏆 نتيجة المعركة</h1><div class="lb">'+TV.rank.map(r=>'<div class="lbr '+(r.place===1?'first':'')+'"><span class="rk">'+r.place+'</span><span class="sw" style="background:'+PAL[r.ci%8]+'"></span><span class="nm">'+esc(r.name)+'</span><span class="sc">💨 '+r.kills+' · ❤ '+r.hp+'</span><span class="pt">+'+r.pts+' ('+r.total+')</span></div>').join('')+'</div>'
   +'<p class="muted" style="margin-top:10px">الجولة الجاية بعد '+n+' ثانية</p><div class="row"><button class="btn sm" onclick="tvStart()">ابدأ الآن</button><button class="btn sm sec" onclick="tvBack()">العودة للوبي</button></div><div class="credit">© ليالي الرياض</div></div>';
}
function tvBack(){
  clearInterval(TV.nextT);TV.phase='lobby';TV.S=null;Object.values(TV.players).forEach(p=>{p.idx=-1;p.sent=false});
  for(const pl of tvHumans())try{pl.conn.send({t:'lobby'})}catch(e){}
  tvLobby();
}

/* =====================================================================
   جهة الجوال
   ===================================================================== */
let M=null,PHT={hb:null,send:null};
function startPhone(){
  bodyMode('phone',true);
  const hb=()=>ctlSend({t:'hb',ts:Date.now(),name:EMB.name});
  ctlSend({t:'join',name:EMB.name});hb();
  clearInterval(PHT.hb);PHT.hb=setInterval(()=>{hb();if(!M||!M.running)phLobby()},1000);
  phLobby();
}
function phLobby(msg){
  if(M&&M.running)return;
  const L=phLobby;const age=performance.now()-(L.ack||-1e9),ok=age<3500;
  bodyMode('play',false);bodyMode('ctl-on',false);
  $('root').innerHTML='<div class="card"><h2>أهلاً مقاتل '+esc(EMB.name||'')+' 🫘</h2><p style="margin-top:8px"><i class="dot '+(ok?'on':'')+'"></i> '+(ok?'متصل بالتلفزيون ✓ (ping '+(L.ping||0)+'ms)':'ما فيه اتصال بالتلفزيون بعد...')+'</p><p class="muted" style="margin-top:6px">'+(msg||L.msg||'بانتظار بدء المعركة من التلفزيون...')+'</p><div class="credit">© ليالي الرياض</div></div>';
}
function onCtlMsg(d){
  if(!d)return;
  if(d.t==='joined'){phLobby.ack=performance.now()}
  else if(d.t==='hbAck'){phLobby.ack=performance.now();phLobby.ping=Math.max(0,Date.now()-d.ts);
    phLobby.msg=(d.ph==='play'&&!d.in)?'المعركة جارية الحين — تنضم للجولة الجاية':'';
    if(d.ph==='lobby'&&M&&M.running){M.running=false;M=null}}
  else if(d.t==='ms')phStart(d);
  else if(d.t==='st'&&M&&M.running)phState(d);
  else if(d.t==='end')phEnd(d);
  else if(d.t==='lobby'){if(M)M.running=false;M=null;phLobby()}
}
function phStart(d){
  if(M&&M.running)M.running=false;
  M={running:true,you:d.you,P:d.roster.map(r=>({i:r.i,name:r.name,ci:r.ci,bot:r.bot,alive:true,sp:false,hp:100,gas:100,arm:0,walk:0,spd:0,hit:0,kills:0,me:r.i===d.you,x:0,z:0,f:0,tx:0,tz:0,tf:0,init:false})),
    ph:'count',c:3,tm:100,pk:[],lastAt:performance.now(),ping:0,cam:mkCam(),last:performance.now(),lastC:-1,vig:0,time:0,al:d.roster.length};
  bodyMode('play',true);bodyMode('ctl-on',true);bodyMode('demo',false);
  buildControls();hudBuild();$('spec').className='';$('feed').innerHTML='';FX.parts.length=0;
  clearInterval(PHT.send);
  PHT.send=setInterval(()=>{if(!M||!M.running){clearInterval(PHT.send);return}const i=ctlGet();ctlSend({t:'in',mv:+i.mv.toFixed(2),tn:+i.tn.toFixed(2),sp:i.sp,ts:Date.now()})},40);
  requestAnimationFrame(phFrame);
}
function phState(d){
  M.lastAt=performance.now();M.ph=d.ph;M.c=d.c;M.tm=d.tm;if(d.a)M.ping=Math.max(0,Date.now()-d.a);
  for(const a of d.p){
    const q=M.P[a[0]];if(!q)continue;
    q.tx=a[1];q.tz=a[2];q.tf=a[3];
    if(q.me&&a[4]<q.hp&&q.alive){M.vig=1;sHit()}
    q.hp=a[4];q.gas=a[5];const fl=a[6];q.alive=!!(fl&1);q.sp=!!(fl&2);if(fl&4)q.hit=.22;q.kills=a[7];
    if(!q.init){q.x=q.tx;q.z=q.tz;q.f=q.tf;q.init=true}
  }
  M.pk=d.u.map(u=>({k:u[0]?'h':'g',x:u[1],z:u[2]}));
  M.al=M.P.filter(p=>p.alive).length;
  for(const e of d.e){
    if(e.k==='kill'){
      const A_=M.P[e.a],T_=M.P[e.t];if(!A_||!T_)continue;
      toast('🫘 <b>'+esc(A_.name)+'</b> رشّ <b>'+esc(T_.name)+'</b> وأقصاه 💨');
      if(e.a===M.you)sKill();
    } else if(e.k==='pick'&&e.p===M.you)sPick();
    else if(e.k==='go'){popCount('انطلق!');sGo()}
  }
  if(d.ph==='count'&&d.c!==M.lastC&&d.c>0){M.lastC=d.c;popCount(String(d.c));sBeep()}
}
function phFrame(now){
  if(!M||!M.running)return;
  const dt=Math.min(.05,(now-M.last)/1000);M.last=now;M.time+=dt;
  const a=1-Math.exp(-dt*16);
  for(const q of M.P){
    if(!q.init)continue;
    const ox=q.x,oz=q.z;q.x+=(q.tx-q.x)*a;q.z+=(q.tz-q.z)*a;q.f+=na(q.tf-q.f)*a;
    const mv=Math.hypot(q.x-ox,q.z-oz);q.walk+=mv*1.5;q.spd+=(Math.min(1,mv/Math.max(dt,1e-3)/CFG.SPEED)-q.spd)*Math.min(1,dt*10);
    q.arm+=((q.sp&&q.alive?1:0)-q.arm)*Math.min(1,dt*9);if(q.hit>0)q.hit-=dt;
  }
  const me=M.P[M.you],cam=M.cam;
  if(me&&me.init){
    let tgt=me;
    if(!me.alive){tgt=M.P.filter(p=>p.alive&&p.init).sort((x,y)=>y.kills-x.kills)[0]||me;$('spec').className='on';$('spec').textContent='أُقصيت 💀 — تشاهد '+tgt.name}
    else $('spec').className='';
    camFollow(cam,tgt,dt,M.vig);
    const[W,H]=fit(cv,cx2),vis=M.P.filter(p=>p.init);
    fxUpdate(dt,vis);
    render3D(cx2,W,H,cam,{players:vis,pickups:M.pk},M.time);
    let lv=me.alive&&me.sp?1:0;for(const p of vis){if(p===me||!p.alive||!p.sp)continue;const d=Math.hypot(p.x-me.x,p.z-me.z);lv=Math.max(lv,.5*clamp(1-d/16,0,1))}hiss(lv);
    M.vig=Math.max(0,M.vig-dt*2.2);$('vig').style.opacity=M.vig;
    const live=performance.now()-M.lastAt<800;
    hudSet({tm:M.tm,al:M.al,kills:me.kills,hp:me.hp,gas:me.gas,conn:live,ping:M.ping});
  }
  requestAnimationFrame(phFrame);
}
function phEnd(d){
  if(M)M.running=false;hiss(0);clearInterval(PHT.send);
  bodyMode('play',false);bodyMode('ctl-on',false);sWin();confetti();
  const you=M?M.you:-1;
  $('root').innerHTML='<div class="card"><h1>🏆 نتيجة المعركة</h1><div class="lb">'+d.rank.map(r=>'<div class="lbr '+(r.place===1?'first ':'')+(r.i===you?'me':'')+'"><span class="rk">'+r.place+'</span><span class="sw" style="background:'+PAL[r.ci%8]+'"></span><span class="nm">'+esc(r.name)+'</span><span class="sc">💨 '+r.kills+'</span><span class="pt">+'+r.pts+' ('+r.total+')</span></div>').join('')+'</div><p class="muted" style="margin-top:10px">الجولة الجاية تبدأ تلقائيًا من التلفزيون...</p><div class="credit">© ليالي الرياض</div></div>';
}

/* =====================================================================
   وضع التجربة (بدون تلفزيون: أنت + 3 بوتات، منظور الجوال + خريطة مصغرة)
   ===================================================================== */
let DM=null;
function startDemo(){
  const roster=[{i:0,name:'أنت',ci:0,bot:false},{i:1,name:'سلطان',ci:1,bot:true},{i:2,name:'نورة',ci:2,bot:true},{i:3,name:'فهد',ci:3,bot:true}];
  DM={S:newSim(roster),cam:mkCam(),last:performance.now(),time:0,vig:0,lastC:-1,running:true,mini:$('mini').getContext('2d'),prevHp:100,pt:0};
  FX.parts.length=0;
  bodyMode('demo',true);bodyMode('phone',true);bodyMode('play',true);bodyMode('ctl-on',true);
  buildControls();hudBuild();$('feed').innerHTML='';$('spec').className='';
  requestAnimationFrame(demoFrame);
}
function demoFrame(now){
  if(!DM||!DM.running)return;
  const dt=Math.min(.05,(now-DM.last)/1000);DM.last=now;DM.time+=dt;const S=DM.S,me=S.players[0];
  me.in=ctlGet();
  simStep(S,dt);
  for(const e of S.evq.splice(0)){
    if(e.k==='kill'){toast('🫘 <b>'+esc(S.players[e.a].name)+'</b> رشّ <b>'+esc(S.players[e.t].name)+'</b> وأقصاه 💨');if(e.a===0)sKill()}
    else if(e.k==='pick'&&e.p===0)sPick();else if(e.k==='go'){popCount('انطلق!');sGo()}
  }
  const cn=Math.ceil(Math.min(3,S.count));if(S.phase==='count'&&cn!==DM.lastC&&cn>0){DM.lastC=cn;popCount(String(cn));sBeep()}
  if(me.hp<DM.prevHp&&me.alive){DM.vig=1;sHit()}DM.prevHp=me.hp;
  let tgt=me;if(!me.alive){tgt=S.players.filter(p=>p.alive).sort((x,y)=>y.kills-x.kills)[0]||me;$('spec').className='on';$('spec').textContent='أُقصيت 💀 — تشاهد '+tgt.name}else $('spec').className='';
  camFollow(DM.cam,tgt,dt,DM.vig);
  const[W,H]=fit(cv,cx2);fxUpdate(dt,S.players);
  render3D(cx2,W,H,DM.cam,{players:S.players.map(p=>Object.assign(p,{me:p===me})),pickups:S.pickups},DM.time);
  render2D(DM.mini,0,0,264,264,{players:S.players,pickups:S.pickups},{pad:6,mini:true});
  let lv=me.alive&&me.sp?1:0;for(const p of S.players){if(p===me||!p.alive||!p.sp)continue;lv=Math.max(lv,.5*clamp(1-Math.hypot(p.x-me.x,p.z-me.z)/16,0,1))}hiss(lv);
  DM.vig=Math.max(0,DM.vig-dt*2.2);$('vig').style.opacity=DM.vig;
  hudSet({tm:Math.max(0,Math.ceil(S.time)),al:S.players.filter(p=>p.alive).length,kills:me.kills,hp:me.hp,gas:me.gas,conn:null,ping:0});
  if(S.ended){demoEnd();return}
  requestAnimationFrame(demoFrame);
}
function demoEnd(){
  DM.running=false;hiss(0);bodyMode('play',false);bodyMode('ctl-on',false);sWin();confetti();
  const S=DM.S;
  $('root').innerHTML='<div class="card"><h1>🏆 نتيجة المعركة</h1><div class="lb">'+S.ranking.map(r=>{const p=S.players[r.i];return '<div class="lbr '+(r.place===1?'first ':'')+(r.i===0?'me':'')+'"><span class="rk">'+r.place+'</span><span class="sw" style="background:'+PAL[p.ci%8]+'"></span><span class="nm">'+esc(p.name)+'</span><span class="sc">💨 '+r.kills+' · ❤ '+r.hp+'</span></div>'}).join('')+'</div>'
   +'<div class="col" style="margin-top:14px"><button class="btn" onclick="startDemo()">جولة تجربة ثانية</button><button class="btn sec" onclick="demoExit()">رجوع</button></div><div class="credit">© ليالي الرياض</div></div>';
}
function demoExit(){
  DM=null;['demo','phone','play','ctl-on'].forEach(m=>bodyMode(m,false));
  $('root').innerHTML='<div id="role" class="card"><h1>🫘 حرب الآباط</h1><p>هذي اللعبة جزء من لوبي «ليالي الرياض» — افتحها من هناك حتى تتوصل تلقائيًا.</p><div class="col" style="margin-top:14px"><button class="btn sec" onclick="startDemo()">🧪 جرّب اللعبة بدون تلفزيون</button></div><div class="credit">© ليالي الرياض</div></div>';
}
</script>
