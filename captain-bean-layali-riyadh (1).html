<title>كابتن فاصوليا: رحلة الفوضى</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<script>try{if(window.self!==window.top)document.documentElement.classList.add('emb-pending')}catch(e){}</script>
<style>html.emb-pending body{visibility:hidden}body{margin:0;background:#12091d;color:#f1f5f9;font-family:Tajawal,sans-serif}</style>
<script>
/* ===================== EMB BRIDGE (لا تغيّر هذا الجزء) ===================== */
let EMB=null; const embHostConns={};
const __embQueue=[];
window.addEventListener('message', e=>{
  const m=e&&e.data; if(!m||!m.__emb) return;
  if(m.init){ EMB={role:m.role,code:m.code,name:m.name}; return embStart(); }
  if(!EMB) return;
  if(EMB.role==='tv'){
    if(m.event==='data'){
      let c=embHostConns[m.id];
      if(!c)c=embHostConns[m.id]={id:m.id,send:obj=>{try{parent.postMessage({__emb:1,to:m.id,data:obj},'*')}catch(e){}}};
      try{onHostMsg(c,m.data)}catch(e){}
    } else if(m.event==='disconnect'){
      try{onPlayerLeave(m.id)}catch(e){}
      delete embHostConns[m.id];
    }
  } else if(EMB.role==='ph'){
    if(m.data!==undefined){try{onCtlMsg(m.data)}catch(e){}}
  }
});
function embReveal(){try{document.documentElement.classList.remove('emb-pending')}catch(e){}}
function embStart(){
  embReveal();
  if(EMB.role==='tv'){ startTv(); } else { startPhone(); }
}
setTimeout(()=>{ if(!EMB) embReveal(); }, 2500);
function ctlSend(obj){ try{parent.postMessage({__emb:1,data:obj},'*')}catch(e){} }
function isFsActive(){ return Boolean(document.fullscreenElement||document.webkitFullscreenElement||(window.matchMedia&&window.matchMedia('(display-mode: fullscreen)').matches)); }

function __runWhenReady(fn){
  if(window.__LAYALI_HOOKS__){ fn(window.__LAYALI_HOOKS__); }
  else {
    __embQueue.push(fn);
    window.__LAYALI_READY__=()=>{
      while(__embQueue.length){
        const next=__embQueue.shift();
        if(next) next(window.__LAYALI_HOOKS__);
      }
    };
  }
}
function startTv(){ __runWhenReady(h=>h.startTv(EMB,embHostConns)); }
function startPhone(){ __runWhenReady(h=>h.startPhone(EMB,ctlSend)); }
function onHostMsg(c,data){ __runWhenReady(h=>h.onHostMsg(c,data)); }
function onPlayerLeave(id){ __runWhenReady(h=>h.onPlayerLeave(id)); }
function onCtlMsg(data){ __runWhenReady(h=>h.onCtlMsg(data)); }
</script>
</head>
